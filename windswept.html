<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Windswept — WebGPU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}

    position:fixed;bottom:20px;right:20px;

    background:rgba(10,10,12,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:12px;
    padding:18px 16px;width:220px;max-height:calc(100vh - 40px);overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;transition:transform 0.3s ease;z-index:10;

  .panel.hidden{transform:translateX(calc(100% + 40px))}

  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Bushes after Chris's canvases: a near-black core with stippled highlights
// that thicken toward the lit edge. lit runs 0 (deep shadow) to 1 (sunlit
// rim); cell sets the stipple size. Two offset layers of jittered dots.
fn stippleBush(p: vec2f, lit: f32, cell: f32, px: f32, dark: vec3f, mid: vec3f, hiA: vec3f, hiB: vec3f, warm: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mix(dark, mid, 0.55), smoothstep(0.35, 0.9, l));
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / cell + vec2f(fl * 0.5, fl * 0.37);
    let id = floor(g);
    let h = hash21(id + seed + fl * 7.1);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.3 + fl), hash21(id + 2.7 + fl)) - 0.5) * 0.55;
    let dens = smoothstep(0.05, 0.85, l + (hash21(id + 5.9) - 0.5) * 0.45);
    if (h < 0.4 + 0.6 * dens) {
      let k = hash21(id + 9.1 + fl);
      var dc = select(select(hiA, hiB, k > 0.55), warm, k > 0.95);
      dc = mix(mix(dark, mid, 0.8), dc, smoothstep(0.15, 0.75, l + (h - 0.5) * 0.3));
      let r = (0.24 + 0.2 * hash21(id + 3.3)) * mix(0.8, 1.0, l);
      c = mix(c, dc, fillA((length(f) - r) * cell, px));
    }
  }
  // Fine grain: small clusters of tiny points scattered over the big dots,
  // light on the lit side, dark flecks breaking up the highlights.
  let fcell = max(cell * 0.38, px * 2.2);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / fcell + vec2f(fl * 0.31, fl * 0.57);
    let id = floor(g);
    let clump = vnoise(p / (cell * 2.3) + seed + fl * 4.0);
    let h = hash21(id + seed * 1.7 + fl * 3.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 4.1 + fl), hash21(id + 6.3 + fl)) - 0.5) * 0.6;
    let r = 0.16 + 0.14 * hash21(id + 8.8);
    let a = fillA((length(f) - r) * fcell, px);
    if (L == 0) {
      let on = step(h, smoothstep(0.1, 0.9, l) * smoothstep(0.3, 0.7, clump) * 0.9);
      let k = hash21(id + 2.2);
      let dc = select(select(hiB, hiA, k > 0.5), warm, k > 0.9);
      c = mix(c, mix(c, dc, 0.9), a * on);
    } else {
      let on = step(h, (0.25 + 0.35 * l) * smoothstep(0.45, 0.8, clump));
      c = mix(c, dark, a * on * 0.85);
    }
  }
  return c;
}
// Painted layers over any surface: three scales of points in drifting
// clusters, each a lighter or darker note of the colour beneath, so flat
// fills read as built up from many small marks. amt 0..1 sets how much.
fn layerTex(p: vec2f, col: vec3f, px: f32, amt: f32, scale: f32, seed: f32) -> vec3f {
  var c = col;
  let lum = dot(col, vec3f(0.3, 0.59, 0.11));
  // Contrast grows with amt: soft tonal flecks at low amounts, crisp marks at full.
  let ct = smoothstep(0.1, 0.9, amt);
  let lightC = mix(col, min(col * 1.2 + vec3f(0.035, 0.03, 0.01), vec3f(1.0)), 0.45 + 0.55 * ct);
  let darkC = mix(col, col * 0.7, 0.3 + 0.7 * ct);
  var sc = array<f32, 3>(1.0, 0.55, 0.3);
  for (var L = 0; L < 3; L++) {
    let fl = f32(L);
    let cell = max(scale * sc[L], px * 2.2);
    let g = p / cell + vec2f(fl * 0.37, fl * 0.61);
    let id = floor(g);
    let h = hash21(id + seed + fl * 5.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.7 + fl), hash21(id + 4.9 + fl)) - 0.5) * 0.6;
    let clump = vnoise(p / (cell * 3.1) + seed * 0.37 + fl * 7.0);
    let r = 0.17 + 0.15 * hash21(id + 8.3);
    let a = fillA((length(f) - r) * cell, px);
    let on = step(h, amt * (0.12 + 0.55 * smoothstep(0.3, 0.8, clump)));
    let k = hash21(id + 2.9 + fl);
    // Dark ground takes more light marks, light ground more dark ones.
    let dc = select(darkC, lightC, k < 0.35 + 0.35 * (1.0 - lum) + (1.0 - ct) * 0.3);
    c = mix(c, dc, a * on * (0.75 - fl * 0.12));
  }
  return c;
}
// Bark: stippled light and shade plus fine strokes along the trunk.
// u runs along the trunk, v across it (-1..1), lit is 0..1.
fn barkTex(u: f32, v: f32, w: f32, lit: f32, px: f32, dark: vec3f, mid: vec3f, hi: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mid, smoothstep(-0.6, 0.4, v * 0.0 + l * 2.0 - 1.0));
  let g = vec2f(u / (w * 0.55), v * 2.2);
  let id = floor(g);
  let f = fract(g) - 0.5;
  let h = hash21(id + seed);
  let stroke = strokeA(f.x * 0.4 + 0.15 * sin(u / w * 3.0 + id.y), 0.08, 0.1);
  c = mix(c, select(dark * 0.85, hi, h > 0.5 - 0.3 * l), stroke * step(0.35, h) * 0.8);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let cs = w * (0.42 - fl * 0.18);
    let g2 = vec2f(u, v * w) / max(cs, px * 2.2) + fl * 0.5;
    let id2 = floor(g2);
    let f2 = fract(g2) - 0.5 - (vec2f(hash21(id2 + 3.1), hash21(id2 + 5.7)) - 0.5) * 0.5;
    let h2 = hash21(id2 + seed + fl * 9.0);
    let dc = select(dark * 0.8, mix(mid, hi, 0.7), h2 < l * 0.8);
    c = mix(c, dc, fillA((length(f2) - 0.22) * max(cs, px * 2.2), px) * step(0.45, hash21(id2 + 7.7)));
  }
  return c;
}
// Drape: an offset that bends a shadow's outline over small bumps in the
// ground, so it reads as lying on uneven land rather than cut from paper.
fn drape(p: vec2f, scale: f32, seed: f32) -> vec2f {
  let q = p / max(scale, 1e-4);
  return (vec2f(vnoise(q + seed), vnoise(q + seed + 7.3)) - 0.5) * scale * 0.5
       + (vec2f(vnoise(q * 2.7 + seed * 1.3), vnoise(q * 2.7 + seed + 3.1)) - 0.5) * scale * 0.18;
}
// Soft coverage from a signed distance, with a penumbra of width w.
fn softA(d: f32, w: f32) -> f32 { return 1.0 - smoothstep(-w * 0.6, w, d); }
// Shadow pooled on the ground under a clump: a flat ellipse pushed away
// from the sun, longer when the sun is low. Returns coverage.
fn groundShadow(p: vec2f, foot: vec2f, r: f32, side: f32, low: f32, px: f32) -> f32 {
  let len = r * (1.1 + 2.2 * low);
  let q = p + drape(p, r * 0.9, foot.x * 17.0);
  let c = foot + vec2f(-side * len * 0.55, r * 0.12);
  let along = clamp((q.x - foot.x) * -side / (len * 1.1), 0.0, 1.0);
  let d = (length((q - c) / vec2f(len, r * 0.34)) - 1.0) * r * 0.34;
  let pen = max(px, r * (0.06 + 0.3 * along));
  // Deepest right at the foot, fading and blurring toward the tip.
  let cq = (p - foot) / vec2f(r * 0.9, r * 0.22);
  return clamp(softA(d, pen) * (1.0 - 0.5 * along) + exp(-dot(cq, cq)) * 0.5, 0.0, 1.0);
}
// A long cast shadow from a thin upright (a trunk or stem): widening and
// blurring away from its foot, and draped over the ground.
fn softShadowSeg(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let ba = b - a;
  let h = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35, a.x * 11.0) * (0.2 + h);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.5 * hq);
  return softA(d, max(px, w * (0.5 + 4.0 * hq))) * (1.0 - 0.55 * hq);
}
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Windswept: a Monterey cypress bent by the wind on a Big Sur bluff, drawn
// crisp in the manner of Eyvind Earle. Shelves of foliage with lit rims and
// patterned undersides, a striated cliff dropping to surf and sea stacks,
// headlands fading into haze with a lighthouse on the point, a combed grass
// bank with a fence and flowers in front. The day turns slowly: the sun
// crosses and sets into the sea, then the moon, stars and the lighthouse.
// One light, the sun or the moon, shades every surface from its own form
// and throws every shadow the same way; lines are laid down as dots.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // wind, gust, grain, zoom
  c: vec4f,   // sun x, sun y, sun height, dark
  d: vec4f,   // moon x, moon y, moon height, tilt x
  e: vec4f,   // fog, _, _, _
  cols: array<vec4f, 26>,
}
@group(0) @binding(0) var<uniform> u: U;

// 0 sky top, 1 sky mid, 2 horizon, 3 sun, 4 glow, 5 cloud lit, 6 cloud shade,
// 7 sea far, 8 sea near, 9 sea line, 10 headland far, 11 headland near,
// 12 cliff lit, 13 cliff shade, 14 grass lit, 15 grass mid, 16 grass shade,
// 17 cypress dark, 18 cypress mid, 19 cypress lit, 20 trunk, 21 poppy,
// 22 ice plant, 23 foam, 24 ink, 25 lamp
@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn post(v: f32, n: f32) -> f32 { return floor(clamp(v, 0.0, 1.0) * n + 0.5) / n; }

const HZ = -0.02;
const CLIFF = 0.24;
const SEA_BASE = 0.3;
const DOT = 0.0011;

@diagnostic(off, derivative_uniformity) fn light() -> f32 { return smoothstep(-0.04, 0.2, u.c.z); }
@diagnostic(off, derivative_uniformity) fn lowSun() -> f32 { return 1.0 - smoothstep(0.1, 0.5, u.c.z); }

@diagnostic(off, derivative_uniformity) fn bluffTop(x: f32) -> f32 { return 0.1 - 0.035 * smoothstep(-0.9, 0.2, x) + 0.01 * sin(x * 7.0 + u.a.w) + 0.003 * sin(x * 37.0); }
@diagnostic(off, derivative_uniformity) fn cliffX(y: f32) -> f32 {
  let k = max(y - bluffTop(CLIFF), 0.0);
  return CLIFF + k * 0.6 + 0.012 * sin(y * 70.0 + u.a.w) + 0.007 * sin(y * 23.0 + 1.0);
}
@diagnostic(off, derivative_uniformity) fn headFar(x: f32) -> f32 { return HZ + 0.004 - 0.07 * smoothstep(0.2, 0.52, x) + 0.008 * sin(x * 11.0 + u.a.w) - 0.02 * smoothstep(0.7, 1.1, x); }
@diagnostic(off, derivative_uniformity) fn headNear(x: f32) -> f32 { return HZ + 0.03 - 0.15 * smoothstep(0.5, 0.9, x) + 0.012 * sin(x * 9.0 + u.a.w * 2.0) + 0.004 * sin(x * 41.0); }
@diagnostic(off, derivative_uniformity) fn fgTop(x: f32) -> f32 { return 0.3 + 0.1 * smoothstep(-0.3, 0.9, x) + 0.012 * sin(x * 5.0 + u.a.w); }

// Wind made visible: a stream function whose contours run mostly level,
// rippled by slow noise, so streaks flow leftward off the sea.
@diagnostic(off, derivative_uniformity) fn windField(q: vec2f, t: f32) -> f32 {
  let w = 1.0 + u.b.x + u.b.y;
  return q.y * 5.0 + 0.55 * fbm(vec2f(q.x * 1.3 + t * 0.05 * w, q.y * 3.0) + u.a.w) + 0.12 * sin(q.x * 3.0 + t * 0.25 * w);
}
// Streaks along the wind's contours, each a run of dots travelling with it.
@diagnostic(off, derivative_uniformity) fn windStreaks(q: vec2f, t: f32, px: f32) -> f32 {
  let e = 0.003;
  let f0 = windField(q, t);
  let gx = (windField(q + vec2f(e, 0.0), t) - f0) / e;
  let gy = (windField(q + vec2f(0.0, e), t) - f0) / e;
  let gl = max(length(vec2f(gx, gy)), 1e-3);
  let N = 9.0;
  let lines = f0 * N;
  let lid = floor(lines + 0.5);
  let dist = (lines - lid) / (N * gl);
  let tng = vec2f(-gy, gx) / gl;
  let along = dot(q, tng);
  let L = 0.08 + 0.1 * hash1(lid * 1.7);
  let ph = along / L - t * (0.35 + 0.5 * (u.b.x + u.b.y)) * (0.7 + 0.6 * hash1(lid * 2.9));
  let fr = fract(ph);
  let on = step(0.62, hash1(lid * 3.7 + floor(ph) * 1.31));
  let head = smoothstep(0.0, 0.8, fr) * smoothstep(1.0, 0.88, fr);
  let w = 0.0006 + 0.0007 * head;
  return dotLine(dist, ph * L, w, px, lid * 3.1) * head * on * smoothstep(1.5, 4.0, 1.0 / (N * gl * px));
}
// Light running over grass as gusts pass: bands that roll across and fade.
@diagnostic(off, derivative_uniformity) fn gustWave(q: vec2f, t: f32) -> f32 {
  let w = 0.4 + u.b.x + u.b.y;
  let v = q.x * 7.0 + q.y * 3.0 + t * 0.9 * w + 1.5 * fbm(q * vec2f(2.0, 4.0) + vec2f(t * 0.05, 0.0) + u.a.w);
  return pow(0.5 + 0.5 * sin(v), 6.0) * smoothstep(0.2, 0.6, fbm(q * 1.5 - vec2f(t * 0.03, 0.0)));
}

// A cypress shelf: a flattened lens with a scalloped top and flat underside.
@diagnostic(off, derivative_uniformity) fn pad(q: vec2f, w: f32) -> f32 {
  let h = w * 0.3;
  var d = (length(q / vec2f(w, h)) - 1.0) * h;
  d = max(d, q.y - h * 0.4);
  d -= h * 0.22 * pow(abs(sin(q.x / w * 5.5)), 0.6) * step(q.y, 0.0);
  return d;
}

// Tree: base b, scale s. Returns colour and coverage.
@diagnostic(off, derivative_uniformity) fn cypress(p: vec2f, b: vec2f, s: f32, sd: f32) -> vec4f {
  let q = (p - b) / s;
  let wind = u.b.x + u.b.y;
  let t = u.a.x;
  let px = u.a.z * u.b.w / s;
  // Trunk and limbs as tubes; the nearest one gives the surface normal.
  let j0 = vec2f(0.0, 0.0);
  let j1 = vec2f(-0.035, -0.07);
  let j2 = vec2f(-0.06, -0.13);
  let j3 = vec2f(-0.13, -0.19);
  var tb = tube(q, j0, j1, 0.013); var tr = 0.013;
  var tn = tube(q, j1, j2, 0.01); if (tn.x < tb.x) { tb = tn; tr = 0.01; }
  tn = tube(q, j2, j3, 0.007); if (tn.x < tb.x) { tb = tn; tr = 0.007; }
  tn = tube(q, j2, vec2f(0.05, -0.19), 0.005); if (tn.x < tb.x) { tb = tn; tr = 0.005; }
  tn = tube(q, j1, vec2f(0.07, -0.11), 0.004); if (tn.x < tb.x) { tb = tn; tr = 0.004; }
  // Shelves, back to front.
  var pc = array<vec3f, 7>(
    vec3f(-0.3, -0.25, 0.14), vec3f(-0.1, -0.29, 0.12), vec3f(0.06, -0.21, 0.09),
    vec3f(-0.4, -0.17, 0.1), vec3f(-0.19, -0.17, 0.13), vec3f(0.02, -0.13, 0.08), vec3f(-0.3, -0.1, 0.07));
  // Branches to each shelf.
  for (var i = 0; i < 7; i++) {
    let c = pc[i].xy + vec2f(0.0, pc[i].z * 0.08);
    let src = select(j2, j3, c.x < -0.15);
    tn = tube(q, src, c, 0.0035); if (tn.x < tb.x) { tb = tn; tr = 0.0035; }
  }
  // Bark: lit round the limb from the one light, whichever side it's on.
  let bn = roundN(tb.yz, vec2f(tr));
  let bl = lambert(bn, 0.35);
  var bark = barkTex(q.y + q.x * 0.4, clamp(tb.y / tr, -1.0, 1.0), 0.012, bl, px, C(20) * 0.6, C(20), mix(C(20), C(12), 0.6), sd * 5.0);
  bark = moonCast(bark, bl);
  let fa = fillA(tb.x, px);
  var acc = over(vec4f(0.0), bark, fa);
  let hv = (q.y * 1.3 + q.x) / 0.012;
  acc = over(acc, C(24), dotLine((fract(hv) - 0.5) * 0.012, dot(q, vec2f(0.61, -0.79)), DOT * 0.6 / s, px, floor(hv) + sd) * fa * 0.4);
  acc = over(acc, C(24), dotLine(tb.x, q.y * 0.8 + q.x * 0.6, DOT / s, px, sd + 2.0) * 0.55);
  for (var i = 0; i < 7; i++) {
    let fi = f32(i);
    let sw = wind * 0.006 * sin(t * 1.1 + fi * 1.7 + sd) * (0.5 - pc[i].y * 2.0);
    let c = pc[i].xy + vec2f(sw, 0.0);
    let w = pc[i].z;
    let h = w * 0.3;
    let v = q - c;
    let d = pad(v, w);
    if (d < DOT / s * 3.0 + px * 2.0) {
      // A shelf is a flattened dome over a flat, shadowed underside: lit
      // from its own curve, so the bright rim swings round with the light.
      let yy = clamp((v.y + h) / (h * 1.4), 0.0, 1.0);
      let n = roundN(v - vec2f(0.0, h * 0.25), vec2f(w, h * 1.1));
      let lit = lambert(n, 0.3) * (1.0 - smoothstep(0.55, 0.95, yy) * 0.85);
      var fc = stippleBush(v, 0.08 + 0.92 * lit, 0.0062, px, mix(C(17), C(24), 0.4), C(18), C(19), mix(C(19), C(14), 0.45), C(21), fi * 3.1 + sd);
      fc = mix(fc, mix(C(17), C(24), 0.5), smoothstep(0.6, 1.0, yy) * 0.7);
      fc = moonCast(fc, lit);
      acc = over(acc, fc, fillA(d, px));
      acc = over(acc, C(24), dotLine(d, v.x + select(0.0, 40.0, v.y > 0.0), DOT / s, px, fi + sd * 3.0) * 0.8);
    }
  }
  return unpremul(acc);
}

// Height of the bluff: terraced contour bands over a gentle roll.
@diagnostic(off, derivative_uniformity) fn bluffZ(p: vec2f) -> f32 {
  let dy = p.y - bluffTop(p.x);
  let rowV = dy / 0.026 + 0.35 * sin(p.x * 9.0 + u.a.w) + 0.15 * sin(p.x * 23.0);
  return 0.026 * 0.8 * terrace(fract(rowV)) + 0.03 * (fbm(vec2f(p.x * 3.0, dy * 5.0) + u.a.w) - 0.5);
}
// The footpath's line down the bluff at depth dy below the crest.
@diagnostic(off, derivative_uniformity) fn pathX(dy: f32) -> f32 { return -0.2 + 0.1 * sin(dy * 16.0 + u.a.w) + dy * 0.4; }
// Everything the cypresses throw across the bluff: trunks and canopies.
@diagnostic(off, derivative_uniformity) fn treeShade(ps: vec2f, pq: vec2f, px: f32) -> f32 {
  var bs = array<vec3f, 3>(vec3f(-0.56, 0.006, 0.55), vec3f(0.14, 0.006, 0.42), vec3f(-0.08, 0.008, 1.0));
  var sh = 0.0;
  for (var i = 0; i < 3; i++) {
    let s = bs[i].z;
    let b = vec2f(bs[i].x, bluffTop(bs[i].x) + bs[i].y);
    sh = max(sh, stemShadow(ps, b, b + vec2f(-0.07, -0.15) * s, 0.009 * s, px));
    sh = max(sh, blobShadowQ(pq, ps, b + vec2f(-0.29, -0.19) * s, 0.12 * s, b.y, px));
    sh = max(sh, blobShadowQ(pq, ps, b + vec2f(-0.03, -0.21) * s, 0.11 * s, b.y, px));
  }
  return sh;
}
@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let k = u.b.w;
  let p0 = vec2f((uv.x - 0.5) * asp, uv.y - 0.5) * k;
  let px = u.a.z * k;
  let tilt = u.d.w;
  let dark = u.c.w;
  let sun = u.c.xy;
  let moon = u.d.xy;
  let wind = u.b.x + u.b.y;
  dayLight();
  let lt = LI;
  // Layers slide a little with tilt for depth.
  let pFar = p0 + vec2f(tilt * 0.006, 0.0);
  let pMid = p0 + vec2f(tilt * 0.014, 0.0);
  let p = p0 + vec2f(tilt * 0.024, 0.0);
  var col: vec3f;
  // The light's reflection on the water sits under the sun, or the moon.
  let src = select(sun, moon, u.c.z < 0.0);
  let srcUp = select(smoothstep(0.0, 0.1, u.c.z), smoothstep(0.0, 0.1, u.d.z) * 0.8, u.c.z < 0.0);

  // ---- Sky: stepped bands, a wandering halo, sun or moon, stars and
  // clouds dabbed on in long horizontal strokes.
  if (p0.y < HZ) {
    col = paintSky(p0, HZ, px, t, C(25), HZ - 0.07, 0);
    // The wind's streaks, fainter at night.
    col = mix(col, mix(C(5), C(9), 0.3), windStreaks(p0, t, px) * (0.3 + 0.35 * min(wind, 1.0)) * (1.0 - 0.6 * dark));
    // Gulls by day.
    for (var i = 0; i < 4; i++) {
      let fi = f32(i);
      let bx = fract(0.2 + fi * 0.27 - t * (0.006 + 0.003 * hash1(fi)) * (1.0 + wind)) * 2.0 - 1.0;
      let by = -0.28 - 0.14 * hash1(fi * 3.0 + u.a.w) + 0.01 * sin(t * 0.7 + fi);
      col = mix(col, C(24), bird(p0, vec2f(bx, by), 0.014 + 0.006 * hash1(fi * 5.0), sin(t * 3.0 + fi * 2.0), px) * (1.0 - dark) * 0.85);
    }
  } else {
    // ---- Sea: perspective rows of dotted wave dashes; a sheen and a
    // glitter path under the light, wherever it is.
    let d = p0.y - HZ;
    col = mix(C(7), C(8), post(smoothstep(0.0, 0.35, d), 4.0));
    let rowF = log(d + 0.004) * 30.0;
    let row = floor(rowF);
    let rowH = (d + 0.004) / 30.0;
    let dashL = 0.012 + d * 0.3;
    let xx = pMid.x / dashL + hash1(row) * 17.0 + t * 0.04 * (0.5 + hash1(row * 3.0));
    let on = step(0.5, hash21(vec2f(floor(xx), row)));
    let dashA = on * smoothstep(0.05, 0.25, fract(xx)) * smoothstep(0.95, 0.75, fract(xx));
    let line = dotLine((fract(rowF) - 0.5) * rowH, pMid.x + t * 0.04 * dashL * (0.5 + hash1(row * 3.0)), max(px * 0.8, rowH * 0.12), px, row) * dashA;
    col = mix(col, C(9), line * 0.55);
    let path = exp(-pow((p0.x - src.x) / (0.01 + d * 0.3), 2.0)) * srcUp;
    col = mix(col, select(C(3), C(25), u.c.z < 0.0), line * path);
  }
  col = mix(col, C(9), dotLine(p0.y - HZ, p0.x, DOT * 0.8, px, 2.0) * 0.7);

  // ---- Far headland with the lighthouse, and the nearer one. Their folds
  // are ridges with two faces, each lit or shaded by its own slope.
  {
    let ht = headFar(pFar.x);
    if (pFar.y > ht - px * 2.0 && pFar.y < HZ + 0.006) {
      let s = (headFar(pFar.x + 0.01) - headFar(pFar.x - 0.01)) / 0.02;
      let fold = fract(pFar.x * 14.0 + (pFar.y - ht) * 20.0);
      let face = select(-1.1, 1.1, fold > 0.55);
      let fl = lambert(groundN(s * 1.8 + face, 0.3), 0.3);
      var hc = mix(mix(C(10), C(11), 0.45), mix(C(10), C(12), 0.35), post(fl, 3.0));
      hc = hazeStep(hc, 0.5, mix(C(2), C(8), 0.3));
      col = mix(col, hc, fillA(ht - pFar.y, px) * fillA(pFar.y - HZ - 0.006, px));
    }
    let lx = 0.3;
    let ly = headFar(lx);
    let lv = pFar - vec2f(lx, ly);
    let tw = 0.0028 - lv.y * -0.04;
    let tower = sdBox(lv - vec2f(0.0, -0.011), vec2f(tw, 0.011));
    let cap = sdBox(lv - vec2f(0.0, -0.025), vec2f(0.0035, 0.003));
    let tl = lambert(roundN(vec2f(lv.x, 0.0), vec2f(tw, 1.0)), 0.4);
    col = mix(col, mix(vec3f(0.96, 0.95, 0.9), C(2), 0.25) * mix(0.45, 1.05, tl), fillA(tower, px));
    col = mix(col, C(24), fillA(cap, px));
    // The lamp turns; its beam sweeps out across the water after dark.
    let ang = t * 0.9;
    let lamp = vec2f(lx, ly - 0.022) - pFar + p0;
    let rel = p0 - lamp;
    let side = sign(sin(ang));
    let along = rel.x * side;
    let bw = 0.003 + max(along, 0.0) * 0.07;
    let beam = exp(-pow(rel.y / bw, 2.0)) * exp(-max(along, 0.0) * 2.2) * step(0.0, along) * pow(abs(sin(ang)), 3.0);
    let flash = pow(max(cos(ang), 0.0), 24.0);
    col += C(25) * (beam * 0.5 + fillA(length(rel) - 0.004 - flash * 0.006, px) * (0.4 + flash)) * dark;
    let pn = pFar * 0.5 + pMid * 0.5;
    let hn = headNear(pn.x);
    if (pn.y > hn - px * 2.0 && pn.y < HZ + 0.036) {
      let s = (headNear(pn.x + 0.01) - headNear(pn.x - 0.01)) / 0.02;
      let fold = fract(pn.x * 22.0 + (pn.y - hn) * 14.0 + 0.3 * sin(pn.x * 60.0));
      let face = select(-1.0, 1.0, fold > 0.7);
      let fl = lambert(groundN(s * 1.8 + face, (pn.y - hn) * 6.0 + 0.15), 0.4);
      var hc = mix(mix(C(11), C(10), 0.3), mix(C(11), C(12), 0.4), post(fl, 3.0));
      hc = mix(hc, hc * 0.82, cloudShade(vec2f(pn.x, 5.0), t) * 0.6);
      hc = hazeStep(hc, 0.35, mix(C(2), C(8), 0.3));
      col = mix(col, hc, fillA(hn - pn.y, px) * fillA(pn.y - HZ - 0.03, px));
      col = mix(col, C(23), dotLine(pn.y - HZ - 0.03, pn.x, DOT, px, 9.0) * step(hn, pn.y) * (0.5 + 0.5 * sin(pn.x * 90.0 + t * 1.5)));
    }
  }

  // ---- Sea stacks: rounded rock lit from its own form, with dotted foam
  // rings round their feet.
  {
    var st = array<vec3f, 3>(vec3f(0.4, 0.27, 0.035), vec3f(0.52, 0.2, 0.022), vec3f(0.6, 0.235, 0.028));
    for (var i = 0; i < 3; i++) {
      let fi = f32(i);
      let v = pMid - st[i].xy;
      let r = st[i].z;
      if (length(v) > r * 3.0) { continue; }
      let sd = max(length(v / vec2f(0.85, 1.4)) - r * (1.0 + 0.15 * sin(atan2(v.y, v.x) * 5.0 + fi)), v.y);
      let rl = lambert(roundN(v + vec2f(0.0, r * 0.4), vec2f(r * 0.9, r * 1.5)), 0.35);
      var sc = mix(C(13) * 0.62, mix(C(13), C(12), 0.95), post(rl, 3.0));
      sc = mix(sc, C(13) * 0.7, smoothstep(-r * 0.35, 0.0, v.y) * 0.6);
      sc = moonCast(sc, rl);
      col = mix(col, sc, fillA(sd, px));
      col = mix(col, C(24), dotRing(sd, v, r * 1.05, DOT, px, fi * 7.0 + 1.0) * 0.6);
      let surge = 0.5 + 0.5 * sin(t * 1.2 + fi * 2.0);
      let R = r * (1.1 + 0.25 * surge);
      let fe = ellD(v, vec2f(R, R * 0.3));
      col = mix(col, C(23), dotLine(fe, v.x, DOT * (1.0 + 0.4 * surge), px, fi * 3.0 + 11.0) * step(0.0, v.y) * 0.85);
    }
  }

  // ---- Marine layer: flat banks with scalloped tops, pooling along the
  // horizon and round the feet of the headlands, their tops lit.
  let fog = u.e.x;
  if (fog > 0.02) {
    for (var m = 0; m < 4; m++) {
      let fm = f32(m);
      let base = HZ + 0.004 + fm * 0.022;
      let sx = pMid.x + t * 0.006 * (1.0 + fm * 0.4) + fm * 2.3;
      let amp = (0.012 + 0.03 * fog);
      let top = base - amp * (0.5 + 0.5 * abs(sin(sx * (7.0 + fm) + fm))) - 0.01 * sin(sx * 2.3);
      let depth = clamp((pMid.y - top) / (0.03 + 0.05 * fog), 0.0, 1.0);
      let ts = -amp * 0.5 * (7.0 + fm) * cos(sx * (7.0 + fm) + fm) * sign(sin(sx * (7.0 + fm) + fm)) - 0.023 * cos(sx * 2.3);
      let fl = lambert(groundN(ts * 1.5, depth * 2.0 + 0.2), 0.5);
      var fc = mix(mix(C(6), C(8), 0.4), mix(C(5), C(2), 0.35), post(fl * (1.0 - depth * 0.6) + 0.15, 3.0));
      fc = mix(fc, mix(C(5), C(4), 0.5), lowSun() * fl * (1.0 - depth) * 0.4);
      let a = fillA(top - pMid.y, px) * (1.0 - post(depth, 3.0) * 0.8) * smoothstep(0.02, 0.5, fog) * (0.9 - fm * 0.12);
      col = mix(col, fc, a);
      col = mix(col, mix(C(5), C(4), 0.3), dotLine(pMid.y - top, pMid.x, DOT * 0.8, px, fm * 5.0) * a * 0.6 * (1.0 - dark * 0.7));
    }
  }

  // ---- Bluff and cliff.
  let bt = bluffTop(p.x);
  let cxAt = cliffX(min(p.y, SEA_BASE));
  let inBluff = p.y > bt && p.x < cxAt && p.y < SEA_BASE + 0.08;
  // Surf working along the foot of the cliff.
  {
    let dx = p.x - cliffX(min(p.y, SEA_BASE));
    let surge = 0.5 + 0.5 * sin(t * 1.1 - p.y * 30.0);
    let foam = smoothstep(0.03 + 0.02 * surge, 0.0, dx) * step(0.0, dx) * smoothstep(0.12, 0.2, p.y);
    let lace = step(0.5, fract(dx / 0.006 - t * 0.3 + 0.3 * sin(p.y * 80.0)));
    col = mix(col, C(23), foam * mix(0.35, 0.9, lace) * step(HZ, p.y));
  }
  if (inBluff) {
    let rockAt = bt + 0.016 + 1.3 * max(0.0, CLIFF - 0.05 - p.x);
    if (p.y > rockAt) {
      // Cliff face: a steep wall turned toward us and the sea, ribbed with
      // buttresses and banded with strata that jut out as ledges. Each bit
      // is lit from its own normal, so light slides across the whole face
      // as the sun moves instead of switching at a line.
      let v = (p.y - p.x * 0.3) / 0.011 + 0.4 * sin(p.x * 30.0 + u.a.w);
      let band = floor(v);
      let sf = fract(v);
      let bx = p.x * 15.0 + 1.3 * fbm(vec2f(p.y * 3.0, u.a.w)) + 4.0 * p.y;
      let rib = cos(bx * 3.14159) + 0.5 * (fbm(vec2f(bx * 1.3, p.y * 2.0 + u.a.w)) - 0.5);
      let ledge = smoothstep(0.0, 0.14, sf) * smoothstep(0.34, 0.14, sf);
      let under = smoothstep(0.72, 1.0, sf);
      let turn = smoothstep(0.08, 0.0, cxAt - p.x);
      let nrm = normalize(vec3f(0.25 + rib * 1.5 + turn * 1.2, -0.1 + ledge * 1.2 - under * 0.5, 0.8));
      let rl = lambert(nrm, 0.45) * (1.0 - smoothstep(-0.5, -0.9, sin(bx * 3.14159)) * 0.4);
      let bh = hash1(band);
      var rc = mix(C(13) * 0.72, mix(C(13), C(12), 0.95), post(rl * (0.95 + 0.15 * bh), 3.0));
      rc = stippleBush(p, rl, 0.0036, px, C(13) * 0.7, C(13), mix(C(13), C(12), 0.8), C(12), mix(C(12), C(4), 0.3), band) * 0.35 + rc * 0.65;
      rc = mix(rc, rc * 0.88, step(0.5, hash1(band * 1.7)));
      rc = mix(rc, mix(rc, vec3f(1.0, 0.92, 0.8), 0.25), post(ledge * rl, 2.0) * 0.6);
      rc = mix(rc, rc * 0.78, under * 0.6 * LI);
      rc = mix(rc, C(13) * 0.7, dotLine((fract(v + 0.5) - 0.5) * 0.011, p.x, DOT * 0.85, px, floor(v + 0.5)) * 0.85);
      let cv = p.x / 0.018 + bh * 3.0;
      rc = mix(rc, C(13) * 0.72, dotLine((fract(cv) - 0.5) * 0.018, p.y, DOT * 0.7, px, floor(cv) * 3.0 + band) * 0.5 * step(0.6, hash1(band * 2.3 + floor(cv))));
      rc = moonCast(rc, rl);
      col = mix(col, rc, fillA(bt - p.y, px));
    } else {
      // Grass in contour bands that step down the bluff, combed along each
      // band: every tread and drop lit from its own slope.
      let dy = p.y - bt;
      let rowV = dy / 0.026 + 0.35 * sin(p.x * 9.0 + u.a.w) + 0.15 * sin(p.x * 23.0);
      let band = floor(rowV);
      let fv = fract(rowV);
      let bs = (bluffTop(p.x + 0.01) - bluffTop(p.x - 0.01)) / 0.02 - 0.35 * 9.0 * cos(p.x * 9.0 + u.a.w) * 0.026;
      let gn = groundN(bs * 2.2, 0.15 + terraceFace(fv) * 1.3 + dy * 1.5);
      let gl = lambert(gn, 0.45);
      let base = select(C(15), mix(C(15), C(14), 0.6), (i32(band) % 2) == 0);
      var gc = mix(base * 0.68, mix(base, C(14), 0.55), post(gl * 1.1, 4.0));
      gc = mix(gc, C(14), smoothstep(0.012, 0.0, dy) * gl * 0.8);
      gc = mix(gc, gc * 0.72, cloudShade(vec2f(p.x, 1.5 + dy * 3.0), t) * 0.7);
      gc = mix(gc, mix(C(14), C(5), 0.3), gustWave(p, t) * 0.35 * (0.3 + 0.7 * lt));
      let comb = fract(p.x / (0.0035 + dy * 0.01) + fv * 0.6 + hash1(band) * 3.0);
      gc = mix(gc, C(16), step(0.78, comb) * 0.4 * smoothstep(0.15, 0.5, fv));
      gc = mix(gc, C(16), dotLine((fract(rowV + 0.5) - 0.5) * 0.026, p.x, DOT * 0.8, px, floor(rowV + 0.5) + 3.0) * 0.5);
      // A footpath winding back toward the trees.
      let pw = 0.003 + dy * 0.09;
      let pxp = pathX(dy);
      let pd = abs(p.x - pxp) - pw;
      let sand = mix(mix(C(12), C(23), 0.45), C(13), (1.0 - gl) * 0.6);
      gc = mix(gc, sand, fillA(pd, px));
      gc = mix(gc, C(16), dotLine(pd, p.y, DOT * 0.7, px, sign(p.x - pxp) + 4.0) * 0.6);
      // Shadows bend over the bluff's steps: look them up on raised ground.
      let ps = liftS(p, bluffZ(p));
      let pq = groundQ(ps, 0.014);
      // Coyote brush: round clumps sitting on the band edges. Each throws a
      // shadow along the light, so gather those from the clumps up the slope
      // and to either side, then draw the clumps over them, back to front.
      var bsh = 0.0;
      for (var bo = 0; bo <= 2; bo++) {
        let bb = band - f32(bo);
        let bdy = (bb + 1.0) * 0.026;
        let cwb = 0.045 + max(bdy, 0.0) * 0.2;
        let cib = floor(p.x / cwb);
        for (var co = -1; co <= 1; co++) {
          let id = vec2f(cib + f32(co), bb);
          let h = hash21(id + u.a.w + 4.0);
          let cx = (id.x + 0.5 + (hash21(id + 2.0) - 0.5) * 0.5) * cwb;
          if (h <= 0.55 || abs(cx - pathX(bdy)) < 0.03) { continue; }
          let r = 0.008 + max(bdy, 0.0) * 0.05 + 0.006 * h;
          let cyv = bluffTop(cx) + (bb + 1.0 - 0.35 * sin(cx * 9.0 + u.a.w)) * 0.026;
          bsh = max(bsh, blobShadowQ(pq, ps, vec2f(cx, cyv), r * 1.15, cyv + r * 0.45, px));
        }
      }
      gc = mix(gc, mix(C(16), C(24), 0.55), bsh * 0.75);
      for (var bo = 1; bo >= 0; bo--) {
        let bb = band - f32(bo);
        let bdy = (bb + 1.0) * 0.026;
        let cwb = 0.045 + max(bdy, 0.0) * 0.2;
        let cib = floor(p.x / cwb);
        for (var co = -1; co <= 1; co++) {
          let id = vec2f(cib + f32(co), bb);
          let h = hash21(id + u.a.w + 4.0);
          let cx = (id.x + 0.5 + (hash21(id + 2.0) - 0.5) * 0.5) * cwb;
          if (h <= 0.55 || abs(cx - pathX(bdy)) < 0.03) { continue; }
          let r = 0.008 + max(bdy, 0.0) * 0.05 + 0.006 * h;
          let cyv = bluffTop(cx) + (bb + 1.0 - 0.35 * sin(cx * 9.0 + u.a.w)) * 0.026;
          let v = p - vec2f(cx, cyv);
          if (abs(v.x) > r * 1.7 || abs(v.y) > r * 1.5) { continue; }
          let sd = max(length(v / vec2f(1.3, 1.0)) - r * (1.0 + 0.12 * sin(atan2(v.y, v.x) * 7.0 + h * 9.0)), v.y - r * 0.45);
          // Rounded clump lit from its own curve: a bright rim on the side the
          // light comes from, near-black underneath.
          let bn = roundN(v, vec2f(r * 1.3, r));
          let blit = smoothstep(0.0, 0.58, lambert(bn, 0.45)) * (1.0 - smoothstep(0.0, r * 0.45, v.y) * 0.6);
          var bc = stippleBush(p, 0.05 + 0.95 * blit, 0.0032 + r * 0.12, px, mix(C(17), C(24), 0.35), C(18), mix(C(19), C(14), 0.5), C(14), C(21), h * 13.0);
          bc = moonCast(bc, blit);
          gc = mix(gc, bc, fillA(sd, px));
          gc = mix(gc, C(24), dotRing(sd, v, r * 1.1, DOT * 0.8, px, h * 31.0) * 0.55);
        }
      }
      // Everything the trees throw across the bluff, bushes and all.
      gc = mix(gc, mix(C(16), C(24), 0.6), treeShade(ps, pq, px) * 0.7);
      gc = moonCast(gc, gl);
      col = mix(col, gc, fillA(bt - p.y, px));
    }
  }
  col = mix(col, C(24), dotLine(p.y - bt, p.x, DOT, px, 7.0) * step(p.x, cxAt) * 0.75);
  col = mix(col, C(24), dotLine(p.x - cxAt, p.y, DOT, px, 8.0) * step(bt, p.y) * step(p.y, SEA_BASE + 0.08) * 0.65);

  // ---- Cypresses: two behind, the big one in front.
  let c1 = cypress(p, vec2f(-0.56, bluffTop(-0.56) + 0.004), 0.55, 2.0);
  col = mix(col, c1.rgb, c1.a);
  let c2 = cypress(p, vec2f(0.14, bluffTop(0.14) + 0.004), 0.42, 5.0);
  col = mix(col, c2.rgb, c2.a);
  let c0 = cypress(p, vec2f(-0.08, bluffTop(-0.08) + 0.006), 1.0, 0.0);
  col = mix(col, c0.rgb, c0.a);

  // ---- Foreground bank: combed grass, ice plant, poppies and a fence.
  let pf = p0 + vec2f(tilt * 0.04, 0.0);
  let ft = fgTop(pf.x);
  if (pf.y > ft - px * 2.0) {
    let dd = pf.y - ft;
    let sway = wind * 0.006 * sin(t * 1.5 + pf.x * 8.0) * smoothstep(0.0, 0.1, dd);
    let fs = (fgTop(pf.x + 0.01) - fgTop(pf.x - 0.01)) / 0.02;
    let cband = fract((dd + 0.01 * sin(pf.x * 9.0 + u.a.w)) / 0.045);
    let fl = lambert(groundN(fs * 2.0, 0.3 + dd * 2.5 + terraceFace(cband) * 0.6), 0.45);
    var gc = mix(C(16), mix(C(15), C(14), 0.6), post(fl * 1.15 - smoothstep(0.0, 0.3, dd) * 0.25, 3.0));
    let comb = fract((pf.x + sway) / (0.0035 + dd * 0.012) + 0.25 * sin(pf.y * 60.0));
    gc = mix(gc, C(16), step(0.72, comb) * 0.55);
    gc = mix(gc, mix(C(14), C(5), 0.3), gustWave(pf, t) * 0.3 * (0.3 + 0.7 * lt));
    gc = mix(gc, gc * 0.72, cloudShade(vec2f(pf.x, 0.6 + dd * 3.0), t) * 0.7);
    // Contour steps across the bank.
    gc = mix(gc, C(16), dotLine((cband - 0.5) * 0.045, pf.x, DOT * 0.8, px, floor((dd + 0.01 * sin(pf.x * 9.0 + u.a.w)) / 0.045) + 20.0) * 0.35);
    // Ice plant mats along the lip: magenta with fine radial lines.
    let ice = fbm(vec2f(pf.x * 7.0, dd * 18.0) + u.a.w) - 0.6 + dd * 3.0;
    if (ice < 0.0 && dd < 0.08) {
      var ic = mix(C(22), mix(C(22), C(16), 0.4), step(0.5, fract(pf.x / 0.004)));
      ic = mix(ic * 0.72, ic, 0.4 + 0.6 * fl);
      gc = mix(gc, ic, fillA(ice * 0.03, px));
    }
    // Fence posts throw their shadows down the bank.
    let spacing = 0.075;
    let fx = pf.x / spacing;
    let fi = round(fx);
    let postX = fi * spacing;
    let py0 = fgTop(postX) + 0.018;
    let lean = 0.1 * (hash1(fi + u.a.w) - 0.5);
    let inRun = step(-1.2, pf.x) * step(pf.x, 0.55);
    var psh = 0.0;
    for (var o = -1; o <= 1; o++) {
      let fo = fi + f32(o);
      let bx = fo * spacing;
      let b0 = vec2f(bx, fgTop(bx) + 0.018);
      psh = max(psh, stemShadow(pf, b0, b0 + vec2f(0.1 * (hash1(fo + u.a.w) - 0.5) * 0.05, -0.05), 0.0026, px) * step(-1.2, bx) * step(bx, 0.55));
    }
    gc = mix(gc, mix(C(16), C(24), 0.5), psh * 0.6);
    gc = moonCast(gc, fl);
    col = mix(col, gc, fillA(ft - pf.y, px));
    col = mix(col, C(24), dotLine(pf.y - ft, pf.x, DOT * 1.1, px, 13.0) * 0.85);
    // Poppies: open cups, bigger lower down, lit round their bowls.
    let row = floor(log(dd + 0.02) * 12.0);
    let rh = (dd + 0.02) / 12.0;
    let id = vec2f(floor(pf.x / (rh * 1.6)), row);
    let h = hash21(id + u.a.w);
    if (h > 0.3 && dd > 0.02) {
      let c = vec2f((id.x + 0.5 + (hash21(id + 1.3) - 0.5) * 0.5) * rh * 1.6, ft + (exp((row + 0.5) / 12.0) - 0.02));
      let r = rh * 0.42;
      // Bend from the foot of the stem, with gusts rippling across the bank.
      let ang = ((0.15 + 0.1 * h) * sin(t * 1.4 + c.x * 5.0 + h * 4.0) + 0.15 * sin(t * 0.6 - c.x * 3.0)) * wind;
      let foot = c + vec2f(0.0, r * 2.5);
      let v = rot2(pf - foot, ang) + (foot - c);
      let cup = max(length(v / vec2f(1.0, 0.85)) - r, -r * 0.25 + r * 0.14 * abs(sin(v.x / r * 4.7 + h * 3.0)) - v.y);
      let stem = sdSeg(v, vec2f(0.0, r * 0.4), vec2f(0.0, r * 2.5)) - r * 0.08;
      let cl = clamp(lambert(roundN(v, vec2f(r, r * 0.85)), 0.35) + 0.55 * LI * max(-LD.z, 0.0) * (1.0 - LMOON), 0.0, 1.0);
      col = mix(col, C(16) * mix(0.6, 1.0, lambert(roundN(vec2f(v.x, 0.0), vec2f(r * 0.08, 1.0)), 0.4)), fillA(stem, px));
      var pcl = mix(C(21), C(4), select(0.0, 0.3, h > 0.85));
      pcl = mix(pcl * 0.62, pcl * 1.05, post(cl, 3.0));
      col = mix(col, moonCast(pcl, cl), fillA(cup, px));
      col = mix(col, C(21) * 0.6, fillA(length((v + vec2f(0.0, r * 0.25)) / vec2f(1.0, 0.35)) - r * 0.5, px) * fillA(cup, px));
      col = mix(col, C(24), dotRing(cup, v, r, DOT * 0.7, px, h * 17.0) * 0.8);
    }
    // Fence: weathered posts and two sagging wires, all drawn in dots.
    let pv = pf - vec2f(postX, py0);
    let pt = tube(pv, vec2f(0.0), vec2f(lean * 0.05, -0.05), 0.0028);
    let pl = lambert(roundN(pt.yz, vec2f(0.0028)), 0.35);
    col = mix(col, mix(C(20) * 0.7, mix(C(20), C(12), 0.4), pl), fillA(pt.x, px) * inRun);
    col = mix(col, C(24), dotLine(pt.x, pv.y, DOT * 0.7, px, fi) * inRun * 0.8);
    let fr = fract(fx + 0.5) - 0.5;
    let sag = 0.006 * (1.0 - 4.0 * fr * fr);
    let wy = fgTop(pf.x) + 0.018;
    let wires = max(dotLine(pf.y - (wy - 0.038 + sag), pf.x, DOT * 0.75, px, 31.0), dotLine(pf.y - (wy - 0.022 + sag), pf.x, DOT * 0.75, px, 37.0));
    col = mix(col, C(24), wires * inRun * 0.75);
  }
  // Dark grass silhouettes along the bottom edge, bending in the wind.
  {
    let bottom = 0.5 * k;
    let gcW = 0.012;
    let gi = floor(p0.x / gcW);
    for (var j = -1; j <= 1; j++) {
      let id = gi + f32(j);
      let h = hash1(id * 1.3 + u.a.w);
      let base = vec2f((id + 0.5) * gcW, bottom + 0.01);
      let ht = 0.05 + 0.1 * h;
      let bend = (0.02 + 0.02 * h + wind * 0.01 * sin(t * 1.6 + id * 0.7)) ;
      let v = p0 - base;
      let s = clamp(-v.y / ht, 0.0, 1.0);
      let cx = -bend * s * s;
      let w = 0.0025 * (1.0 - s);
      let d = abs(v.x - cx) - w;
      // A rim of light along the side of each blade that faces the light.
      let rim = smoothstep(0.0, w, (v.x - cx) * sign(LD.x + 1e-4)) * s * LI * 0.35;
      col = mix(col, mix(mix(C(16), C(24), 0.6), C(14), rim), fillA(d, px) * step(-ht, v.y) * step(v.y, 0.0));
    }
  }
  // Painted layers over everything, finer in the distance, faint in the sky.
  let land = smoothstep(HZ - 0.1, HZ + 0.03, p0.y);
  col = layerTex(p0, col, px, mix(0.12, 1.0, land), mix(0.006, 0.013, clamp((p0.y + 0.05) * 1.6, 0.0, 1.0)), 5.0);
  return vec4f(paperize(col, pos.xy, u.b.z), 1.0);
}

// ---- One light for the whole painting ----
// The sun by day or the moon by night, far off in the sky. setLight() fixes
// it once per pixel; after that every surface is shaded from its own 3D
// normal and every shadow is thrown the same way, so light slides over the
// whole scene together as the source moves. Axes: x right, y up, z toward
// the viewer (screen y runs down). A source ahead in the sky lights from
// behind, so crests and rims catch it and faces turned to us go into shade.
var<private> LD: vec3f;     // unit vector toward the light
var<private> LI: f32;       // strength: 1 full sun, about 0.5 moon, 0 in twilight
var<private> LMOON: f32;    // 0 sunlight .. 1 moonlight
var<private> LSRC: vec2f;   // where the source sits on screen

// bearing: heading of the source in radians, 0 dead ahead, + to the right;
// height: its angle above the horizon.
@diagnostic(off, derivative_uniformity) fn setLight(src: vec2f, bearing: f32, height: f32, strength: f32, moon: f32) {
  let az = clamp(bearing, -1.35, 1.35);
  let el = clamp(height, 0.2, 1.25);
  LD = normalize(vec3f(sin(az) * cos(el), sin(el), -cos(az) * cos(el) * 0.8));
  LI = strength; LMOON = moon; LSRC = src;
}
// Or give the direction straight, for a piece that sets its own.
@diagnostic(off, derivative_uniformity) fn setLightDir(src: vec2f, dir: vec3f, strength: f32, moon: f32) {
  LD = normalize(dir); LI = strength; LMOON = moon; LSRC = src;
}
// Wrapped Lambert: the share of light a surface with unit normal n gets,
// easing round the terminator, scaled by the light's strength.
@diagnostic(off, derivative_uniformity) fn lambert(n: vec3f, wrap: f32) -> f32 { return clamp((dot(n, LD) + wrap) / (1.0 + wrap), 0.0, 1.0) * LI; }
// Ground: s is the slope of the surface line on screen (dy/dx, y down), so
// land falling away to the right (s > 0) turns right; face tips it toward
// the viewer (0 level .. 1 a bank facing us).
@diagnostic(off, derivative_uniformity) fn groundN(s: f32, face: f32) -> vec3f { return normalize(vec3f(s, 1.0, face)); }
// Round forms and tubes: v is the offset from the centre (or from the axis
// of a trunk or stem) on screen, r the radius on each axis.
@diagnostic(off, derivative_uniformity) fn roundN(v: vec2f, r: vec2f) -> vec3f {
  let q = v / r;
  let z = sqrt(max(1.0 - dot(q, q), 0.0));
  return normalize(vec3f(q.x, -q.y, z + 0.2));
}
// Ground from a height field: hx, hy are its slopes across and toward the
// viewer (screen units), k how strongly they tip the surface.
@diagnostic(off, derivative_uniformity) fn heightN(hx: f32, hy: f32, k: f32) -> vec3f { return normalize(vec3f(-hx * k, 1.0, -hy * k)); }
// Moonlit faces take a cool silver cast.
@diagnostic(off, derivative_uniformity) fn moonCast(col: vec3f, lit: f32) -> vec3f {
  return mix(col, col * vec3f(0.85, 1.0, 1.3) + vec3f(0.05, 0.075, 0.13), clamp(LMOON * lit * 1.7, 0.0, 1.0));
}

// ---- Shadows. FORE squashes ground depth onto the screen.
const FORE = 0.45;
// Where a shadow lands on level ground per unit of height (x across, y
// toward the viewer): long when the light is low, capped to stay in frame.
@diagnostic(off, derivative_uniformity) fn castG() -> vec2f {
  let c = vec2f(-LD.x, -LD.z) / max(LD.y, 0.05);
  return c * min(1.0, 3.2 / max(length(c), 1e-4));
}
// Screen offset of the shadow of a point h above the ground.
@diagnostic(off, derivative_uniformity) fn castS(h: f32) -> vec2f { let c = castG(); return vec2f(c.x, c.y * FORE) * h; }
// Where the shadow of screen point q falls, with level ground at gy below it.
@diagnostic(off, derivative_uniformity) fn shadowAt(q: vec2f, gy: f32) -> vec2f { return vec2f(q.x, gy) + castS(max(gy - q.y, 0.0)); }
// A point on raised ground (z above the reference level, on screen) catches
// the shadow that would fall further from its caster on level ground; look
// the shadow up there and it bends over terraces, mounds and domes.
@diagnostic(off, derivative_uniformity) fn liftS(p: vec2f, z: f32) -> vec2f { return p + vec2f(0.0, z) + castS(z); }
// Shadow of a round mass (bush, canopy, boulder) of radius r centred at c,
// ground at gy beneath it: an ellipse thrown along the light, paler and
// softer toward its tip, plus the dark pool of contact where it sits on the
// ground. q is the lookup point already draped over the ground's small
// bumps (groundQ), p the pixel itself. Coverage 0..1.
@diagnostic(off, derivative_uniformity) fn groundQ(p: vec2f, scale: f32) -> vec2f { return p + drape(p, scale, 3.7); }
@diagnostic(off, derivative_uniformity) fn blobShadowQ(q: vec2f, p: vec2f, c: vec2f, r: f32, gy: f32, px: f32) -> f32 {
  let h = max(gy - c.y, 0.0);
  let cg = castG();
  let L = length(cg);
  let dir = select(vec2f(0.0, 1.0), cg / max(L, 1e-4), L > 1e-3);
  let g = vec2f(q.x - c.x, (q.y - gy) / FORE) - cg * h;
  let a = vec2f(dot(g, dir), dot(g, vec2f(-dir.y, dir.x)));
  let st = sqrt(1.0 + L * L);
  let d = (length(a / vec2f(r * st, r)) - 1.0) * r;
  let tipF = clamp(a.x / (r * st), -1.0, 1.0) * 0.5 + 0.5;
  let pen = max(px, r * (0.1 + 0.04 * L * h / r + 0.25 * tipF));
  let thrown = softA(d, pen) * (1.0 - 0.4 * tipF) * LI;
  let cq = vec2f(p.x - c.x, p.y - gy) / vec2f(r, r * 0.3);
  let contact = exp(-dot(cq, cq)) * (1.0 - smoothstep(r * 1.2, r * 3.0, h)) * (0.45 + 0.35 * LI);
  return clamp(max(thrown, contact), 0.0, 1.0);
}
@diagnostic(off, derivative_uniformity) fn blobShadow(p: vec2f, c: vec2f, r: f32, gy: f32, px: f32) -> f32 {
  return blobShadowQ(p + drape(p, r * 0.9, c.x * 17.0 + gy * 5.0), p, c, r, gy, px);
}
// The point up in a canopy whose shadow lands on ground point q, where the
// canopy stands on ground at gy: test that point against the canopy's shape
// to throw a whole grove's shadow along the light.
@diagnostic(off, derivative_uniformity) fn canopyAt(q: vec2f, gy: f32) -> vec2f {
  let cg = castG();
  let hh = max((q.y - gy) / max(cg.y * FORE, 0.03), 0.0);
  return vec2f(q.x - cg.x * hh, gy - hh);
}
// Shadow of an upright from its foot a (on the ground) to its top b: a
// strip thrown along the light, widening and blurring toward its tip.
@diagnostic(off, derivative_uniformity) fn stemShadow(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let e = shadowAt(b, a.y);
  let ba = e - a + vec2f(1e-5, 1e-5);
  let h0 = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35 + w, a.x * 11.0) * (0.2 + h0);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.2 * hq);
  return softA(d, max(px, w * (0.5 + 3.0 * hq))) * (1.0 - 0.5 * hq) * LI;
}

// Lay colour c at coverage a over a premultiplied layer (rgb * alpha, alpha),
// so a figure built from fills and dotted outlines composites cleanly.
@diagnostic(off, derivative_uniformity) fn over(acc: vec4f, c: vec3f, a: f32) -> vec4f { return vec4f(acc.rgb * (1.0 - a) + c * a, acc.a * (1.0 - a) + a); }
@diagnostic(off, derivative_uniformity) fn unpremul(acc: vec4f) -> vec4f { return vec4f(acc.rgb / max(acc.a, 1e-4), acc.a); }
// Signed distance to an ellipse of radii r (a close approximation).
@diagnostic(off, derivative_uniformity) fn ellD(v: vec2f, r: vec2f) -> f32 {
  let k0 = length(v / r);
  let k1 = length(v / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-6);
}
// Offset from segment a-b to q, and the distance to a tube of radius r
// round it: (distance, offset x, offset y).
@diagnostic(off, derivative_uniformity) fn tube(q: vec2f, a: vec2f, b: vec2f, r: f32) -> vec3f {
  let ba = b - a;
  let h = clamp(dot(q - a, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  let off = q - a - ba * h;
  return vec3f(length(off) - r, off);
}

// ---- Lines as the paintings make them: chains of small dots.
// d: signed distance across the line; g: position along it in dot spacings;
// sp: that spacing; w: dot radius; per: dots round a closed loop (0 if open).
// Dots sit a little over a diameter apart with slight scatter; in some
// stretches they swell and double up so the line gains punch, and now and
// then one strays just off it.
@diagnostic(off, derivative_uniformity) fn dotChain(d: f32, g: f32, sp: f32, w: f32, px: f32, seed: f32, per: f32) -> f32 {
  if (abs(d) > w * 5.0 + px * 2.0) { return 0.0; }
  let heavy = smoothstep(0.5, 0.8, vnoise(vec2f(g * 0.11 + seed * 3.7, seed * 1.3)));
  let i0 = floor(g);
  var a = 0.0;
  for (var j = -1; j <= 1; j++) {
    let fid = i0 + f32(j);
    var id = fid;
    if (per > 0.0) { id = fid - per * floor(fid / per); }
    let h1 = hash1(id * 1.731 + seed);
    let h2 = hash1(id * 2.917 + seed * 1.37 + 5.1);
    let r = w * (0.72 + 0.36 * h2 + 0.45 * heavy);
    let off = (h1 - 0.5) * w * (0.45 + 1.1 * heavy);
    let c = vec2f((fid + 0.5 + (h2 - 0.5) * 0.3 - g) * sp, off - d);
    a = max(a, fillA(length(c) - r, px));
    // The heavier stretches take a second dot beside the first.
    if (heavy > 0.2 && h1 > 0.3) {
      let c2 = vec2f((fid + (h1 - 0.5) * 0.5 - g) * sp, -off * 0.6 + select(-1.0, 1.0, h2 > 0.5) * w * 1.35 - d);
      a = max(a, fillA(length(c2) - r * 0.78, px) * smoothstep(0.2, 0.55, heavy));
    }
    if (hash1(id * 4.13 + seed) > 0.92) {
      let c3 = vec2f((fid + h2 - g) * sp, (h1 - 0.5) * w * 7.0 - d);
      a = max(a, fillA(length(c3) - w * 0.55, px));
    }
  }
  return a;
}
// An open line: d across it, s the distance along it.
@diagnostic(off, derivative_uniformity) fn dotLine(d: f32, s: f32, w0: f32, px: f32, seed: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let sp = w * 2.3;
  return dotChain(d, s / sp, sp, w, px, seed, 0.0);
}
// A closed outline round a centre: v is the offset from it, R its mean radius.
@diagnostic(off, derivative_uniformity) fn dotRing(d: f32, v: vec2f, R: f32, w0: f32, px: f32, seed: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let N = max(round(6.2832 * R / (w * 2.3)), 5.0);
  let g = (atan2(v.y, v.x) / 6.2832 + 0.5) * N;
  return dotChain(d, g, 6.2832 * R / N, w, px, seed, N);
}

// ---- Halos: stepped bands whose edges wander, differ band to band and
// drift, so the rings round a sun or moon breathe instead of sitting round.
@diagnostic(off, derivative_uniformity) fn haloR(v: vec2f, t: f32, seed: f32) -> f32 {
  let r = length(v);
  let dir = v / max(r, 1e-4);
  let n1 = vnoise(dir * 1.4 + vec2f(r * 7.0 + t * 0.05, seed));
  let n2 = vnoise(dir * 2.9 + vec2f(seed * 1.7 - t * 0.07, r * 15.0));
  return r * (1.0 + 0.3 * (n1 - 0.5) + 0.12 * (n2 - 0.5));
}

// ---- Painted clouds, three ways. Each composites over base and returns
// the new colour. sun: the light's place on screen; low: 1 when it's near
// the horizon; y0..y1 the band the clouds sit in; amt 0..1 how much cloud.
// Stipple: small dots of a lighter or darker note, clustered.
@diagnostic(off, derivative_uniformity) fn cloudDots(p: vec2f, cell: f32, px: f32, dens: f32, seed: f32) -> f32 {
  let g = p / cell;
  let id = floor(g);
  let f = fract(g) - 0.5 - (vec2f(hash21(id + seed), hash21(id + seed + 3.1)) - 0.5) * 0.6;
  let on = step(hash21(id + seed + 7.7), dens);
  return fillA((length(f) - 0.2 - 0.12 * hash21(id + 1.3)) * cell, px) * on;
}
// Dabbed streaks: long horizontal brush dabs laid in two to four rows,
// each shorter than the one below so the cloud domes; tapered ends, three
// flat tones lit toward the light and along each dab's top edge, warm
// undersides when it is low, and flecks of stipple through each dab.
// xr: half the visible width, so every cloud drifts through the frame.
@diagnostic(off, derivative_uniformity) fn streakClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.0032, px * 2.4);
  for (var k = 0; k < 10; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.25 + 0.5 * hash1(fk * 7.13 + seed)) / f32(n));
    let L = (0.16 + 0.22 * hash1(fk + seed * 1.7)) * (0.6 + 0.5 * amt);
    let span = 2.0 * (xr + L);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.004 * (1.0 + fk * 0.25) / span) * span - (xr + L);
    let rows = 2.0 + floor(hash1(fk * 2.3 + seed) * 2.99);
    let rowH = (0.01 + 0.008 * hash1(fk * 5.0 + seed)) * (0.7 + 0.5 * amt);
    if (abs(p.x - cx) > L * 1.2 || p.y > cy + rowH || p.y < cy - rowH * (rows + 1.0)) { continue; }
    let rf = (cy - p.y) / (rowH * 0.85) - 0.5;
    let r0 = floor(rf);
    for (var j = 0; j <= 1; j++) {
      let row = r0 + f32(j);
      if (row < 0.0 || row >= rows) { continue; }
      let rowW = L * sqrt(max(1.0 - pow((row + 0.3) / rows, 2.0), 0.0)) * (0.8 + 0.35 * hash1(row + fk * 9.0 + seed));
      let rowX = cx + (hash1(row * 4.7 + fk + seed) - 0.5) * L * 0.3;
      let dl = L * (0.3 + 0.15 * hash1(row * 3.0 + fk + seed));
      let sh = hash1(row * 1.9 + fk * 2.3 + seed) * dl;
      let gi = floor((p.x - rowX + sh) / dl);
      for (var m = -1; m <= 1; m++) {
        let di = gi + f32(m);
        let h = hash21(vec2f(di, row + fk * 17.0) + seed);
        let dcx = rowX - sh + (di + 0.5 + (h - 0.5) * 0.3) * dl;
        if (abs(dcx - rowX) > rowW) { continue; }
        let hl = dl * (0.85 + 0.5 * h) * (1.0 - 0.3 * row / rows);
        let hh = rowH * (0.55 + 0.3 * hash1(di * 1.3 + row + fk));
        let dcy = cy - (row + 0.5) * rowH * 0.85 + (hash1(di * 2.1 + row * 5.0 + fk) - 0.5) * rowH * 0.3;
        let q = vec2f(p.x - dcx, p.y - dcy);
        let tx = clamp(abs(q.x) / hl, 0.0, 1.0);
        // A brush dab: full in the middle, drawn out to a point at each end.
        let hy = hh * (1.0 - 0.85 * pow(tx, 1.5)) * select(1.0, 0.8, q.y > 0.0);
        let dd = (length(vec2f(q.x / hl, q.y / max(hy, 1e-5))) - 1.0) * hy;
        // Solid body; the edge breaks up into a fringe of dots.
        let solid = fillA(dd + hh * 0.2, px);
        let fringe = cloudDots(p + vec2f(0.21, 0.47) * cell, cell * 0.72, px, smoothstep(hh * 0.25, -hh * 0.2, dd) * 0.6, fk * 5.0 + row) * step(dd, hh * 0.3);
        let cov = max(solid, fringe);
        if (cov <= 0.0) { continue; }
        let toSun = sun - vec2f(dcx, dcy);
        let facing = clamp((dcx - cx) / L * sign(toSun.x) * 0.5 + 0.5, 0.0, 1.0);
        let up = (row + 0.5) / rows;
        let topEdge = smoothstep(0.1, -0.7, q.y / hh);
        var lit = mix(0.2 + 0.5 * up, 0.3 + 0.45 * (1.0 - up), low * 0.7) + 0.35 * (facing - 0.5) + 0.12 * topEdge * (1.0 - low * 0.5);
        lit = post(clamp(lit + (h - 0.5) * 0.06, 0.0, 1.0), 3.0);
        var cc = mix(cShade, cLit, lit);
        cc = mix(cc, cGlow, low * (1.0 - up) * 0.65 * exp(-length(toSun) * 1.4) * (1.0 - topEdge * 0.6));
        cc *= 0.985 + 0.03 * hash1(di * 7.7 + row);
        cc = mix(cc, mix(cc, cLit * 1.06, 0.8), cloudDots(p, cell * 1.3, px, smoothstep(0.3, 1.0, lit) * 0.22, fk + row));
        cc = mix(cc, mix(cc, cShade * 0.9, 0.6), cloudDots(p + 0.37 * cell, cell * 1.1, px, (1.0 - lit) * 0.12, fk * 3.0 + row));
        col = mix(col, cc, cov);
      }
    }
  }
  return col;
}
// Stippled soft masses: heaps of rounded puffs on a soft base, shaded as one
// continuous form (no facets) by the light's direction, the tone carried by
// the density of light and dark dots, and edges that dissolve into dots.
@diagnostic(off, derivative_uniformity) fn massD(q: vec2f, W: f32, fk: f32, seed: f32, t: f32) -> f32 {
  var d = 1e3;
  for (var i = 0; i < 6; i++) {
    let fi = f32(i);
    let x0 = (fi / 5.0 - 0.5) * W * 1.5 + (hash1(fi + fk * 5.0 + seed) - 0.5) * W * 0.22;
    let pr = W * (0.2 + 0.2 * (1.0 - abs(fi - 2.5) / 2.5)) * (0.8 + 0.4 * hash1(fi * 3.0 + fk + seed));
    let pc = vec2f(x0, -pr * (0.45 + 0.3 * hash1(fi * 7.0 + fk)));
    let di = length(q - pc) - pr;
    let hs = clamp(0.5 + 0.5 * (d - di) / (W * 0.12), 0.0, 1.0);
    d = mix(d, di, hs) - W * 0.12 * hs * (1.0 - hs);
  }
  d = max(d, q.y + W * 0.02 * sin(q.x / W * 9.0 + fk));
  return d + W * 0.06 * (vnoise(q / W * 6.0 + fk * 3.1 + vec2f(t * 0.02, 0.0)) - 0.5);
}
@diagnostic(off, derivative_uniformity) fn massClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.0028, px * 2.2);
  for (var k = 0; k < 8; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.3 + 0.4 * hash1(fk * 7.13 + seed)) / f32(n));
    let W = (0.08 + 0.1 * hash1(fk + seed * 1.7)) * (0.6 + 0.6 * amt);
    let span = 2.0 * (xr + W * 1.3);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.003 * (1.0 + fk * 0.2) / span) * span - (xr + W * 1.3);
    let q = p - vec2f(cx, cy);
    if (abs(q.x) > W * 1.35 || q.y > W * 0.12 || q.y < -W * 1.0) { continue; }
    let d = massD(q, W, fk, seed, t);
    let edge = W * 0.09;
    if (d > edge) { continue; }
    // One continuous rounded surface: lateral at the rim, facing us inside.
    let e = W * 0.04;
    let g2 = normalize(vec2f(massD(q + vec2f(e, 0.0), W, fk, seed, t) - d, massD(q + vec2f(0.0, e), W, fk, seed, t) - d) + vec2f(1e-6));
    let depth = clamp(-d / (W * 0.35), 0.0, 1.0);
    let nv = normalize(vec3f(g2.x * (1.0 - depth * 0.6), -g2.y * (1.0 - depth * 0.6), 0.35 + depth));
    let ts = normalize(sun - vec2f(cx, cy - W * 0.3));
    let Lc = normalize(vec3f(ts.x, -ts.y, 0.3));
    let lit = clamp(dot(nv, Lc) * 0.6 + 0.45 - smoothstep(-W * 0.3, 0.0, q.y) * 0.25, 0.0, 1.0);
    var cc = mix(cShade, cLit, post(lit, 5.0));
    cc = mix(cc, cGlow, low * smoothstep(-0.1, 0.7, -nv.y) * 0.55 * exp(-length(sun - vec2f(cx, cy)) * 1.3));
    cc = mix(cc, mix(cLit, vec3f(1.0), 0.3), cloudDots(p, cell, px, smoothstep(0.35, 0.95, lit) * 0.7, fk));
    cc = mix(cc, cShade * 0.86, cloudDots(p + 0.41 * cell, cell * 0.85, px, smoothstep(0.55, 0.1, lit) * 0.55, fk + 5.0));
    let solid = fillA(d + edge * 0.6, px);
    let rimDots = cloudDots(p + vec2f(0.13, 0.29) * cell, cell * 0.85, px, smoothstep(edge, -edge * 0.6, d) * 0.9, fk + 9.0);
    col = mix(col, cc, max(solid, rimDots));
  }
  return col;
}
// Mottled patches with drips: flat blotches of two or three tones in an
// irregular mottle, with runs of paint hanging from the undersides, each
// a dotted trickle ending in a bead.
@diagnostic(off, derivative_uniformity) fn dripClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.003, px * 2.3);
  for (var k = 0; k < 8; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.3 + 0.4 * hash1(fk * 7.13 + seed)) / f32(n));
    let W = (0.08 + 0.1 * hash1(fk + seed * 1.7)) * (0.6 + 0.6 * amt);
    let H = W * (0.22 + 0.1 * hash1(fk * 4.1 + seed));
    let span = 2.0 * (xr + W * 1.3);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.003 * (1.0 + fk * 0.2) / span) * span - (xr + W * 1.3);
    let q = p - vec2f(cx, cy);
    if (abs(q.x) > W * 1.2 || q.y < -H * 1.6 || q.y > H * 2.6) { continue; }
    // Blotch: a wide lens, rounded on top, nearly flat below, ragged edge.
    var d = (length(q / vec2f(W, select(H * 0.45, H, q.y < 0.0))) - 1.0) * H;
    d += H * 0.35 * (fbm(q / W * vec2f(3.0, 6.0) + fk * 2.7 + seed) - 0.5);
    let toSun = sun - vec2f(cx, cy);
    let side = clamp(q.x / W * sign(toSun.x) * 0.5 + 0.5, 0.0, 1.0);
    let up = clamp(-q.y / H * 0.5 + 0.5, 0.0, 1.0);
    let lit = clamp(mix(up, 1.0 - up, low * 0.6) * 0.6 + side * 0.4, 0.0, 1.0);
    // Mottle: the tone steps follow a slow noise, shifted toward the light.
    let m = vnoise(q / W * vec2f(5.0, 9.0) + fk * 1.9 + seed + vec2f(t * 0.01, 0.0));
    let tone = post(clamp(m * 0.55 + lit * 0.6 - 0.05, 0.0, 1.0), 3.0);
    var cc = mix(cShade, cLit, tone);
    cc = mix(cc, cGlow, low * (1.0 - up) * 0.5 * exp(-length(toSun) * 1.5));
    cc = mix(cc, mix(cc, cLit * 1.05, 0.7), cloudDots(p, cell, px, lit * 0.4, fk));
    cc = mix(cc, cShade * 0.88, cloudDots(p + 0.43 * cell, cell * 0.85, px, (1.0 - lit) * 0.35, fk + 4.0));
    col = mix(col, cc, fillA(d, px));
    // Drips: dotted trickles from the underside, each ending in a bead.
    let dw = W * 0.09;
    let di = floor(q.x / dw);
    let hd = hash1(di * 1.37 + fk * 11.0 + seed);
    if (hd > 0.45 && q.y > 0.0) {
      let dx = (di + 0.5 + (hash1(di * 2.9 + fk) - 0.5) * 0.4) * dw;
      let yb = H * 0.45 * sqrt(max(1.0 - pow(dx / W, 2.0), 0.0)) * 0.85;
      if (abs(dx) < W * 0.85) {
        let len = H * (0.5 + 1.8 * hash1(di * 5.3 + fk) * hash1(di * 1.1 + fk * 3.0)) * (0.7 + 0.3 * sin(t * 0.3 + di));
        let wdt = max(0.0011, px * 0.8) * (1.0 + hash1(di * 3.3) * 0.5);
        let along = q.y - yb;
        let trick = dotLine(q.x - dx, along, wdt, px, di + fk * 7.0) * step(0.0, along) * step(along, len);
        let bead = fillA(length(vec2f(q.x - dx, along - len)) - wdt * 1.9, px);
        let dc = mix(cShade, cc, 0.3);
        col = mix(col, dc, max(trick, bead));
      }
    }
  }
  return col;
}

// Light from the sun by day and the moon by night.
@diagnostic(off, derivative_uniformity) fn dayLight() {
  let sunA = smoothstep(-0.04, 0.2, u.c.z);
  let moonA = smoothstep(-0.02, 0.22, u.d.z) * 0.5;
  if (sunA >= moonA) { setLight(u.c.xy, u.c.x * 2.3, u.c.z * 1.15, sunA, 0.0); }
  else { setLight(u.d.xy, u.d.x * 2.3, u.d.z * 1.15, moonA, 1.0); }
}
// Stepped sky: a halo whose rings wander, stars, the sun and moon, and
// painted clouds in the scene's own style (0 dabbed streaks, 1 stippled
// masses, 2 mottled drips) above cloudMax. Colours: C(0) top, C(1) mid,
// C(2) horizon, C(3) sun, C(4) glow, C(5) cloud lit, C(6) cloud shade.
@diagnostic(off, derivative_uniformity) fn paintSky(p0: vec2f, hz: f32, px: f32, t: f32, lampC: vec3f, cloudMax: f32, style: i32) -> vec3f {
  let sun = u.c.xy; let moon = u.d.xy; let dark = u.c.w;
  let g = clamp((p0.y - hz) / -1.0, 0.0, 1.0);
  var col = mix(C(2), C(1), post(smoothstep(0.0, 0.3, g), 5.0));
  col = mix(col, C(0), post(smoothstep(0.28, 0.9, g), 5.0));
  let sv = p0 - sun;
  let hr = haloR(sv, t, 1.3);
  let sunUp = step(-0.2, u.c.z);
  let gb = post(exp(-hr * 10.0) * 0.9 * sunUp, 5.0);
  col = mix(col, C(4), gb * (0.35 + 0.65 * gb));
  let sg = p0 / 0.035;
  let sid = floor(sg);
  let sh = hash21(sid + 5.3);
  if (sh > 0.72) {
    let sw = p0 - (sid + 0.5 + (vec2f(hash21(sid + 1.7), hash21(sid + 8.1)) - 0.5) * 0.7) * 0.035;
    let tw = 0.55 + 0.45 * sin(t * 1.6 + sh * 60.0);
    let sa = atan2(sw.y, sw.x);
    let sdd = length(sw) - 0.0035 * (0.5 + sh) * tw * (0.2 + 0.8 * pow(abs(cos(sa * 2.0)), 12.0));
    col = mix(col, lampC, fillA(sdd, px) * dark);
  }
  col = mix(col, C(3), fillA(length(sv) - 0.045, px));
  col = mix(col, C(4), dotRing(hr - 0.064, sv, 0.064, 0.0011, px, 3.0) * 0.75 * sunUp);
  let mv = p0 - moon;
  let mr = haloR(mv, t, 7.9);
  let mc = mix(lampC, vec3f(0.95, 0.94, 0.88), 0.6);
  // Moonglow: a cool light added to the sky in wandering steps.
  col += vec3f(0.05, 0.07, 0.12) * post(exp(-mr * 12.0) * dark, 3.0);

}
// Cloud shadows sliding over the land: q is a ground position (x across,
// y into the distance). 0 in sun, up to 1 under a cloud; none after dusk.
@diagnostic(off, derivative_uniformity) fn cloudShade(q: vec2f, t: f32) -> f32 {
  let n = fbm(vec2f(q.x * 1.1 - t * 0.012, q.y * 2.6 + u.a.w * 1.3));

// f is the position within the band 0..1; returns height about zero.
@diagnostic(off, derivative_uniformity) fn terrace(f: f32) -> f32 { return smoothstep(0.55, 0.97, f) - f + 0.5; }
// How much a terrace band faces the viewer at f: the drop between treads.
@diagnostic(off, derivative_uniformity) fn terraceFace(f: f32) -> f32 { return smoothstep(0.5, 0.75, f) * smoothstep(1.0, 0.9, f); }

@diagnostic(off, derivative_uniformity) fn slopeLight(s: f32, x: f32, depth: f32) -> f32 {
  return post(lambert(groundN(s * 1.8, depth * 7.0 + 0.15), 0.4), 3.0);
}
`;
const PIXEL_BUDGET = 4500000;

const NAME = 'windswept';

// Time of day. tau runs 0..1 round the clock: afternoon at 0, sunset near
// 0.3, night through the middle, dawn at 0.8. Each piece gives sky colours
// per key and a land palette that is graded by the light of the moment.
const DAY_KEYS = [
  [0.00, 'afternoon', [1, 1, 1], 1.0],
  [0.18, 'golden hour', [1.08, 0.94, 0.76], 1.12],
  [0.28, 'sunset', [0.98, 0.7, 0.6], 1.05],
  [0.35, 'blue hour', [0.46, 0.5, 0.76], 0.72],
  [0.43, 'night', [0.2, 0.25, 0.42], 0.5],
  [0.73, 'night', [0.2, 0.25, 0.42], 0.5],
  [0.81, 'dawn', [0.86, 0.72, 0.8], 0.85],
  [0.9, 'morning', [1.02, 0.98, 0.94], 0.95],
  [1.0, 'afternoon', [1, 1, 1], 1.0],
];
const SKY_ORDER = ['afternoon', 'golden hour', 'sunset', 'blue hour', 'night', 'night', 'dawn', 'morning', 'afternoon'];
function dayKey(tau) {
  let i = 0;
  while (i < DAY_KEYS.length - 2 && tau >= DAY_KEYS[i + 1][0]) i++;
  const a = DAY_KEYS[i], b = DAY_KEYS[i + 1];
  let f = (tau - a[0]) / (b[0] - a[0]);
  f = f * f * (3 - 2 * f);
  return { i, f, name: f < 0.5 ? a[1] : b[1] };
}
const lerp3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
// SKIES: name -> list of hex; LAND: list of hex; KEEP: land indexes left ungraded.
function dayCols(tau, SKIES, LAND, KEEP) {
  const k = dayKey(tau);
  const A = DAY_KEYS[k.i], B = DAY_KEYS[k.i + 1];
  const sa = SKIES[SKY_ORDER[k.i]], sb = SKIES[SKY_ORDER[k.i + 1]];
  const out = sa.map((h, j) => [...lerp3(hex(h), hex(sb[j]), k.f), 1]);
  const m = lerp3(A[2], B[2], k.f), sat = A[3] + (B[3] - A[3]) * k.f;
  LAND.forEach((h, j) => {
    const c = hex(h);
    if (KEEP.includes(j)) { out.push([...c, 1]); return; }
    const l = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
    out.push([...c.map((v, q) => Math.max(0, Math.min(1, (l + (v - l) * sat) * m[q]))), 1]);
  });
  return out;
}
// Sun and moon: position on screen, height above the horizon (-1..1).
function celestial(tau, hz) {
  const df = ((tau - 0.8) % 1 + 1) % 1;
  let elev, sx, sy, mx = 0, my = 2, mElev = -1;
  if (df < 0.51) { const f = df / 0.51; elev = Math.sin(Math.PI * f); sx = -0.55 + 0.9 * f; }
  else { const f = (df - 0.51) / 0.49; elev = -Math.sin(Math.PI * f); sx = 0.35; mElev = Math.sin(Math.PI * f); mx = 0.5 - 0.95 * f; my = hz - mElev * 0.46 + 0.04; }
  sy = hz - elev * 0.55 + 0.02;
  return { sx, sy, elev, mx, my, mElev };
}
// Sky drag: a press in the sky takes hold of the sun, or the moon by night,
// and the day follows the finger along their arcs; let go and the day turns
// on by itself from there. q is in scene units.
function bodyAt(tau, hz) {
  const s = celestial(tau, hz);
  return s.elev > -0.03 ? [s.sx, s.sy] : [s.mx, s.my];
}
function skyTau(q, hz, tau0) {
  let best = tau0, bestD = Infinity;
  for (let i = -160; i <= 160; i++) {
    const tt = ((tau0 + i * 0.002) % 1 + 1) % 1;
    const b = bodyAt(tt, hz);
    const d = (b[0] - q[0]) ** 2 + (b[1] - q[1]) ** 2 + (i * 0.002) ** 2 * 0.04;
    if (d < bestD) { bestD = d; best = tt; }
  }
  return best;
}
function inSky(q, hz, tau) {
  const b = bodyAt(tau, hz);
  return q[1] < hz - 0.01 || Math.hypot(q[0] - b[0], q[1] - b[1]) < 0.12;
}

// Sky and sea for each time of day:
// sky top, sky mid, horizon, sun, glow, cloud lit, cloud shade, sea far, sea near, sea line
const SKIES = {
  'afternoon':   ['#2f9fcf', '#6cc6e2', '#c2eaf0', '#fff6d8', '#fff2c0', '#f6f8f4', '#a9cbd6', '#2a86a8', '#1f6f8e', '#d8f2f4'],
  'golden hour': ['#3b8fc4', '#9cc8d8', '#f4dca4', '#fff0b0', '#ffd070', '#fff0d0', '#c7a6a0', '#2f7a96', '#22607a', '#ffe0a0'],
  'sunset':      ['#3a5d9c', '#d9869a', '#ffb070', '#ffe2a0', '#ff9a50', '#ffc49a', '#8a5a7a', '#3a5a82', '#2a4668', '#ffc080'],
  'blue hour':   ['#1c2b5a', '#4a4f8a', '#c48aa0', '#f0c0a0', '#b07aa0', '#9a86b0', '#4a4870', '#26365e', '#1c2a4c', '#9a8ab8'],
  'night':       ['#060a1c', '#0d1734', '#1b2c52', '#f4f0dc', '#34446e', '#35415f', '#131a30', '#0d1830', '#091326', '#8fa2cc'],
  'dawn':        ['#4a6aa8', '#c49ac0', '#ffd0b0', '#fff0d0', '#ffb8a0', '#ffe4d8', '#a08aa8', '#4a6a96', '#36507a', '#ffd8c8'],
  'morning':     ['#3aa0d4', '#86cfe6', '#dcf0f0', '#fff8e0', '#fff4d0', '#f8faf6', '#b4ccd8', '#2c88aa', '#206e8c', '#e0f4f4'],
};
// headland far, headland near, cliff lit, cliff shade, grass lit, grass mid, grass shade,
// cypress dark, cypress mid, cypress lit, trunk, poppy, ice plant, foam, ink, lamp
const LAND = ['#8fb2bc', '#5f8e88', '#e6b88c', '#9a6a58', '#bcd86c', '#6aa84a', '#2f7a5a',
  '#14303c', '#2a4f5a', '#79a06e', '#4a3a34', '#f07a2a', '#e46aa4', '#f6fbfb', '#121820', '#ffd98a'];
const KEEP = [14, 15];
const HZ = -0.02;

const p = {};
let tau = 0.1 + Math.random() * 0.12;
function readControls() {
  p.wind = +$('wind').value / 100 * 1.5;
  p.speed = +$('speed').value / 100;
  p.grain = +$('grain').value / 100 * 0.1;
  p.fog = +$('fog').value / 100 * 1.25;
  for (const id of ['wind', 'speed', 'fog', 'grain']) $(id + 'Val').textContent = $(id).value;
  if (!timeHooked) { timeHooked = true; $('time').addEventListener('input', () => { tau = +$('time').value / 100; }); }
}
let timeHooked = false;
let gust = 0, gustGoal = 0, shown = -1, zoomNow = 1, skyHeld = false;
function generate() {}
// Marine layer: rolls in at blue hour, lies thick through the night and
// burns off a while after dawn.
function fogAt(tau) {
  const bump = (x, a, b, c, d) => x < a || x > d ? 0 : x < b ? (x - a) / (b - a) : x < c ? 1 : 1 - (x - c) / (d - c);
  return 0.18 + 0.82 * bump(tau, 0.3, 0.42, 0.8, 0.95);
}
function uniforms() {
  const zoom = Math.max(1, 1.2 / aspect);
  zoomNow = zoom;
  const s = celestial(tau, HZ);
  const dark = 1 - Math.min(1, Math.max(0, (s.elev + 0.25) / 0.3));
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.wind, gust, p.grain, zoom],
    c: [s.sx, s.sy, s.elev, dark],
    d: [s.mx, s.my, s.mElev, tl.active ? tl.x : 0],
    e: [fogAt(tau) * p.fog, 0, 0, 0],
    cols: dayCols(tau, SKIES, LAND, KEEP),
  };
}
function step(dt) {
  // A full day in about three minutes at the default speed.
  if (!skyHeld) tau = (tau + dt * p.speed * p.speed * 0.022) % 1;
  gustGoal *= Math.exp(-dt * 1.2);
  gust += (gustGoal - gust) * (1 - Math.exp(-dt * 5));
  const v = Math.round(tau * 100);
  if (v !== shown) { shown = v; $('time').value = v; $('timeVal').textContent = dayKey(tau).name; }
}
// Drag in the sky to move the sun (or the moon) and the time of day with
// it; swipe across the land for a gust.
let lastX = 0;
function onDown(q) {
  const s = [q[0] * zoomNow, q[1] * zoomNow];
  skyHeld = inSky(s, HZ, tau);
  if (skyHeld) { tau = skyTau(s, HZ, tau); return; }
  lastX = q[0];
}
function onMove(q) {
  if (skyHeld) { tau = skyTau([q[0] * zoomNow, q[1] * zoomNow], HZ, tau); return; }
  gustGoal = Math.max(-1, Math.min(1.5, gustGoal + (lastX - q[0]) * 6)); lastX = q[0];
}
function onUp() { skyHeld = false; }

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

// Desktop renders above screen resolution within a pixel budget and lets the
// browser scale down, for crisper edges and finer marks; phones stay light.
const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 2e6 ? 1.25 : b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(PIXEL_BUDGET) });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
