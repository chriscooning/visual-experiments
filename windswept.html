<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .panel{
    position:fixed;bottom:20px;right:20px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(10,10,12,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:12px;
    padding:18px 16px;width:220px;max-height:calc(100vh - 40px);overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;transition:transform 0.3s ease;z-index:10;
  }
  .panel.hidden{transform:translateX(calc(100% + 40px))}
  .panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-track{background:transparent}.panel::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  .control-group{display:flex;flex-direction:column;gap:3px}

  .control-group .val{font-family:'Space Mono',monospace;font-size:9px;color:#777;float:right;letter-spacing:0}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#222;border-radius:2px;outline:none;touch-action:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  select{background:#151518;color:#ccc;border:1px solid #2a2a2f;padding:8px 10px;border-radius:6px;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;outline:none;width:100%}
  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
  .btn:hover{background:#fff;color:#000;border-color:#fff}.btn:active{transform:scale(.97)}

<div class="panel" id="panel">
  <div class="control-group"><label>Palette</label>

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Windswept: wind-bent cypresses on a dune over the sea, painted in brush
// dabs. Trunks rise from the right and lean left into flat, jagged canopies;
// grass streaks up the left slope in the wind; a pale dune, two orange rocks
// and a turquoise, mottled sky.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // wind, brush, grain, gust
  c: vec4f,   // tilt x, y, zoom, _
  cols: array<vec4f, 20>,
}
@group(0) @binding(0) var<uniform> u: U;

const HZ = 0.03;
const SUN = vec2f(-0.34, -0.33);
@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn pick(r: f32, a: i32, n: i32) -> vec3f { return C(a + min(i32(floor(r * f32(n))), n - 1)); }

@diagnostic(off, derivative_uniformity) fn groundTop(x: f32) -> f32 { return 0.058 + 0.01 * sin(x * 6.0 + u.a.w) - 0.07 * smoothstep(0.42, 0.8, x); }

// Tree i: base, top of trunk, canopy half-size.
@diagnostic(off, derivative_uniformity) fn treeBase(i: i32) -> vec2f {
  var b = array<vec2f, 4>(vec2f(0.52, 0.055), vec2f(0.34, 0.075), vec2f(0.03, 0.085), vec2f(-0.2, 0.07));
  return b[i];
}
@diagnostic(off, derivative_uniformity) fn sway(i: i32) -> f32 { return -u.b.x * 0.012 * (1.0 + sin(u.a.x * 1.3 + f32(i) * 1.7)) - u.b.w * 0.03; }
@diagnostic(off, derivative_uniformity) fn treeTop(i: i32) -> vec2f {
  var tp = array<vec2f, 4>(vec2f(0.3, -0.17), vec2f(0.1, -0.18), vec2f(-0.14, -0.07), vec2f(-0.29, -0.055));
  return tp[i] + vec2f(sway(i), 0.0);
}
@diagnostic(off, derivative_uniformity) fn canopySize(i: i32) -> vec2f {
  var s = array<vec2f, 4>(vec2f(0.17, 0.055), vec2f(0.2, 0.065), vec2f(0.13, 0.05), vec2f(0.1, 0.042));
  return s[i];
}
@diagnostic(off, derivative_uniformity) fn canopy(i: i32, q0: vec2f) -> f32 {
  let s = canopySize(i);
  let q = q0 - treeTop(i) - vec2f(-s.x * 0.15, -s.y * 0.35);
  // Longer trailing edge downwind, a spiky upper edge, lumpy everywhere.
  let w = select(s.x, s.x * 1.25, q.x < 0.0);
  var d = (length(q / vec2f(w, s.y)) - 1.0) * s.y;
  d -= s.y * 0.7 * pow(max(0.0, sin(q.x / s.x * 8.0 + f32(i) * 2.3 + u.a.w)), 4.0) * step(q.y, 0.0);
  d += s.y * 0.45 * (vnoise(q * 30.0 + f32(i) * 7.0) - 0.5);
  return d;
}

// Banding fields: whole numbers are band edges, like Awazu's stepped skies.
@diagnostic(off, derivative_uniformity) fn bx0(q: vec2f) -> f32 { return -0.12 + 0.03 * sin(q.y * 20.0); }
@diagnostic(off, derivative_uniformity) fn skyField(q: vec2f) -> f32 { return (q.y + 0.6) * 10.0 + 2.2 * vnoise(q * vec2f(2.5, 5.0) + u.a.w + vec2f(u.a.x * 0.01, 0.0)); }
@diagnostic(off, derivative_uniformity) fn duneField(q: vec2f) -> f32 { return (q.y - groundTop(q.x)) * 26.0 + 1.4 * vnoise(q * vec2f(4.0, 9.0) + u.a.w); }
@diagnostic(off, derivative_uniformity) fn bandCol(v: f32, r: f32, a: i32, n: i32) -> vec3f {
  let b = i32(floor(v)) + select(0, 1, r > 0.93);
  return C(a + ((b % n) + n) % n);
}

@diagnostic(off, derivative_uniformity) fn scene(q: vec2f, r: f32) -> Paint {
  var P: Paint;
  for (var i = 0; i < 4; i++) {
    if (canopy(i, q) < 0.0) {
      P.col = select(pick(r * 1.1, 8, 3), C(11), r > 0.91);
      P.ang = -0.3 + (r - 0.5) * 1.4;
      P.fine = 1.0;
      return P;
    }
  }
  if (q.y < HZ) {
    // A low sun, printed flat and ringed.
    if (length(q - SUN) < 0.052) {
      P.col = mix(C(11), vec3f(1.0, 0.97, 0.9), select(0.3, 0.55, r > 0.5));
      P.ang = r * 6.28;
      P.fine = 0.0;
      return P;
    }
    let n = vnoise(q * vec2f(5.0, 8.0) + u.a.w + vec2f(u.a.x * 0.01, 0.0));
    P.col = bandCol(skyField(q), r, 0, 4);
    P.ang = -0.35 + (n - 0.5) * 1.2;
    P.fine = 0.0;
    return P;
  }
  let gt = groundTop(q.x);
  if (q.y < gt) {
    P.col = select(C(4), mix(C(4), C(1), 0.4), r > 0.6);
    P.ang = 0.0;
    P.fine = 0.0;
    return P;
  }
  // Rocks.
  var rp = array<vec2f, 2>(vec2f(0.1, 0.34), vec2f(0.26, 0.4));
  for (var k = 0; k < 2; k++) {
    let d = length((q - rp[k]) / vec2f(1.0, 0.55)) - 0.045 - 0.012 * vnoise(q * 40.0);
    if (d < 0.0) {
      P.col = select(pick(r, 13, 2), C(15), q.y > rp[k].y + 0.008);
      P.ang = -0.5;
      P.fine = 1.0;
      return P;
    }
  }
  // Grass on the left slope and along the bottom; dune elsewhere.
  let bx = -0.12 + (q.y - gt) * 1.2 + 0.03 * sin(q.y * 20.0);
  let bottom = 0.43 + 0.03 * sin(q.x * 6.0 + u.a.w);
  let bush = q.x > 0.58 && q.y < gt + 0.06;
  if (q.x < bx || q.y > bottom || bush) {
    P.col = select(pick(r * 1.1, 16, 4), C(13), r > 0.93);
    if (bush) { P.col = select(pick(r, 8, 3), C(13), r > 0.7); }
    P.ang = -1.25 + 0.25 * sin(u.a.x * 1.4 + q.x * 5.0) * u.b.x - u.b.w * 0.3;
    P.fine = 1.0;
    return P;
  }
  P.col = bandCol(duneField(q), r, 5, 3);
  P.ang = -0.15 + (r - 0.5) * 0.6;
  P.fine = 0.0;
  return P;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let asp = u.a.y; let px = u.a.z; let k = u.c.z;
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let s = p * k + u.c.xy * 0.01;
  let pxs = px * k;
  let br = u.b.y;
  var col = scene(s, 0.5).col;
  col = paintLayer(s, 0.022 * br, 0.95, 0.3, 1.0, pxs, col, false);
  // Trunks: thin, kinked lines from base to canopy.
  for (var i = 0; i < 4; i++) {
    let b0 = treeBase(i);
    let t0 = treeTop(i);
    let mid = mix(b0, t0, 0.55) + vec2f(0.03, 0.01) + vec2f(sway(i) * 0.4, 0.0);
    let d = min(sdSeg(s, b0, mid), sdSeg(s, mid, t0));
    let w = 0.0028 + 0.0018 * clamp((s.y - t0.y) / (b0.y - t0.y), 0.0, 1.0);
    col = mix(col, C(12), fillA(d - w, pxs));
    // A branch or two splitting off near the top.
    let br1 = sdSeg(s, mix(mid, t0, 0.5), mix(mid, t0, 0.5) + vec2f(-0.05, -0.025));
    col = mix(col, C(12), fillA(br1 - 0.0016, pxs));
  }
  col = paintLayer(s, 0.0088 * br, 0.95, 0.3, 2.0, pxs, col, true);
  let t = u.a.x;
  let gt0 = groundTop(s.x);
  let bx1 = -0.12 + (s.y - gt0) * 1.2 + 0.03 * sin(s.y * 20.0);
  let bot1 = 0.43 + 0.03 * sin(s.x * 6.0 + u.a.w);
  let inGrass = s.y > gt0 && (s.x < bx1 || s.y > bot1);
  // Limbs: dark branches spreading through each canopy from the trunk top.
  for (var i = 0; i < 4; i++) {
    let cd = canopy(i, s);
    if (cd < 0.0) {
      let t0 = treeTop(i);
      let sz = canopySize(i);
      var lm = 1e3;
      for (var j = 0; j < 5; j++) {
        let fj = f32(j);
        let e = t0 + vec2f(sz.x * (-1.35 + fj * 0.55), -sz.y * (0.35 + 0.45 * hash1(fj + f32(i) * 3.0)));
        let m = mix(t0, e, 0.5) + vec2f(0.0, -sz.y * 0.25);
        lm = min(lm, min(sdSeg(s, t0, m), sdSeg(s, m, e)));
      }
      col = mix(col, mix(C(12), C(2), 0.35), fillA(lm - 0.0012, pxs) * smoothstep(0.0, -0.01, cd) * 0.85);
    }
  }
  // Grass blades and a scatter of wildflowers on the slope.
  if (inGrass) {
    let lean = -1.25 + 0.25 * sin(t * 1.4 + s.x * 5.0) * u.b.x - u.b.w * 0.3;
    let gc = 0.011;
    let gid0 = floor(s / gc);
    var blade = 0.0;
    var bc = C(18);
    for (var j = -1; j <= 1; j++) {
      for (var i = -1; i <= 1; i++) {
        let id = gid0 + vec2f(f32(i), f32(j));
        let h = hash21(id + 4.2);
        let b0 = (id + vec2f(h, hash21(id + 8.1))) * gc;
        let L = gc * (1.4 + 1.2 * hash21(id + 2.7));
        let a = lean + (h - 0.5) * 0.5;
        let tip = b0 + vec2f(cos(a), sin(a)) * L;
        let d = sdSeg(s, b0, tip) - 0.0009 * (1.0 - clamp(dot(s - b0, tip - b0) / (L * L), 0.0, 1.0));
        let cov = fillA(d, pxs);
        if (cov > blade) { blade = cov; bc = select(select(C(18), C(17), h > 0.4), C(19), h > 0.8); }
      }
    }
    col = mix(col, bc, blade * 0.85);
    let fcell = 0.034;
    let fid = floor(s / fcell);
    let fh = hash21(fid + u.a.w + 11.0);
    if (fh > 0.62) {
      let fc = (fid + 0.5 + (vec2f(hash21(fid + 1.3), hash21(fid + 2.9)) - 0.5) * 0.5) * fcell;
      let v = s - fc;
      let rad = 0.0065 + 0.003 * fh;
      let pa = atan2(v.y, v.x) + fh * 6.0;
      let petal = length(v) - rad * (0.75 + 0.35 * cos(pa * 5.0));
      col = mix(col, select(C(11), C(13), fh > 0.8), fillA(petal, pxs));
      col = mix(col, INK, strokeA(petal, pxs * 0.45, pxs) * 0.6);
      col = mix(col, C(18), fillA(length(v) - rad * 0.3, pxs));
    }
  }
  // Rocks: an ink edge and hatched shadow.
  var rp = array<vec2f, 2>(vec2f(0.1, 0.34), vec2f(0.26, 0.4));
  for (var k2 = 0; k2 < 2; k2++) {
    let d = length((s - rp[k2]) / vec2f(1.0, 0.55)) - 0.045 - 0.012 * vnoise(s * 40.0);
    let hatch = strokeA((fract((s.x - s.y) / 0.0055) - 0.5) * 0.0055, pxs * 0.35, pxs);
    col = mix(col, C(12), hatch * fillA(d, pxs) * smoothstep(rp[k2].y - 0.005, rp[k2].y + 0.02, s.y) * 0.6);
    col = mix(col, INK, strokeA(d, pxs * 0.7, pxs));
  }
  // Gulls riding the wind.
  for (var i = 0; i < 4; i++) {
    let fi = f32(i);
    let bx = fract(0.2 + fi * 0.27 - t * (0.008 + 0.004 * hash1(fi)) * (1.0 + u.b.x)) * 1.4 - 0.7;
    let by = -0.3 - 0.12 * hash1(fi * 3.0 + u.a.w) + 0.01 * sin(t * 0.7 + fi);
    col = mix(col, INK, bird(s, vec2f(bx, by), 0.016 + 0.007 * hash1(fi * 5.0), sin(t * 3.0 + fi * 2.0), pxs) * 0.85);
  }
  // Ink plate: outlines and band hairlines, a hair off register.
  let so = s + MISREG;
  var ink = 0.0;
  let gt = groundTop(so.x);
  ink = max(ink, bandLines(skyField(so), pxs) * 0.45 * step(so.y, HZ));
  let duneL = bandLines(duneField(so), pxs);
  if (so.y > gt) {
    let bx = -0.12 + (so.y - gt) * 1.2 + 0.03 * sin(so.y * 20.0);
    let bottom = 0.43 + 0.03 * sin(so.x * 6.0 + u.a.w);
    let dune = max(bx - so.x, so.y - bottom);
    ink = max(ink, duneL * 0.35 * step(dune, 0.0));
    ink = max(ink, strokeA(so.x - bx, pxs * 0.8, pxs));
    ink = max(ink, strokeA(so.y - bottom, pxs * 0.8, pxs) * step(bx, so.x));
  }
  ink = max(ink, strokeA(so.y - HZ, pxs * 0.7, pxs));
  // Sun rings, the sea's wave crests and a halftone screen over the dune.
  ink = max(ink, rings(so, SUN, 0.052, 0.012, 3.0, pxs) * 0.6 * step(so.y, HZ));
  ink = max(ink, strokeA(length(so - SUN) - 0.052, pxs * 0.7, pxs));
  let row = floor((so.y - HZ) / 0.009);
  ink = max(ink, scallop(so + vec2f(row * 0.005 + u.a.x * 0.004, 0.0), HZ + row * 0.009, 0.009, pxs) * 0.45 * step(HZ, so.y) * step(so.y, gt - 0.002));
  {
    let bxs = -0.12 + (s.y - groundTop(s.x)) * 1.2 + 0.03 * sin(s.y * 20.0);
    let bts = 0.43 + 0.03 * sin(s.x * 6.0 + u.a.w);
    let inDune = step(groundTop(s.x), s.y) * step(bxs, s.x) * step(s.y, bts) * step(s.x, 0.58);
    let db = floor(duneField(s));
    let amt = select(0.08, 0.28, (i32(db) % 2) == 1) * smoothstep(0.0, 0.2, s.y - groundTop(s.x));
    col = mix(col, C(7) * 0.9, halftone(s, 0.0065, amt, pxs) * inDune);
  }
  ink = max(ink, strokeA(so.y - gt, pxs * 0.8, pxs) * step(bx0(so), so.x));
  for (var i = 0; i < 4; i++) { ink = max(ink, strokeA(canopy(i, so), pxs * 0.9, pxs)); }
  col = mix(col, INK, ink);
  return vec4f(posterFrame(canvasize(col, pos.xy, u.b.z), uv, asp, px), 1.0);
}

// Brush painter. Each page defines scene(q, r) -> Paint: the colour a dab
// at q should carry (r picks among the region's colours), the direction the
// stroke runs, and whether the region gets a second, finer pass (1 strokes,
// 2 round dots). paintLayer lays one dab per grid cell, each sampling the
// scene at its own centre, so the image is rebuilt from marks.
struct Paint { col: vec3f, ang: f32, fine: f32 }

@diagnostic(off, derivative_uniformity) fn paintLayer(p: vec2f, cell: f32, len: f32, wid: f32, sl: f32, px: f32, base: vec3f, fineOnly: bool) -> vec3f {
  let g = p / cell;
  let id0 = floor(g);
  var col = base;
  var best = -1.0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let id = id0 + vec2f(f32(i), f32(j));
      let h = hash21(id + sl);
      let c = (id + 0.5 + (vec2f(h, hash21(id + sl + 3.7)) - 0.5) * 0.8) * cell;
      let s = scene(c, hash21(id + sl + 7.3));
      if (fineOnly && s.fine < 0.5) { continue; }
      var L = len * cell * (0.7 + 0.5 * hash21(id + sl + 5.3));
      var Wd = wid * cell * (0.75 + 0.5 * h);
      if (s.fine > 1.5) { L = select(0.55, 0.42, fineOnly) * cell * (0.8 + 0.4 * h); Wd = L * 0.85; }
      let a = s.ang + (hash21(id + sl + 9.1) - 0.5) * 0.6;
      let q = rot2(p - c, -a);
      // Tapered stroke: narrows toward both ends, and paint lies a little thin.
      let tx = clamp(abs(q.x) / L, 0.0, 1.0);
      let We = Wd * (1.0 - 0.55 * tx * tx);
      let d = (length(q / vec2f(L, We)) - 1.0) * We;
      let cov = fillA(d, px * 1.1);
      if (cov > 0.0 && h > best) {
        // Flat, silkscreen-like dabs: little tonal jitter, a faint darker rim.
        let dc = s.col * (0.96 + 0.08 * hash21(id + sl + 1.1));
        col = mix(col, dc, cov);
        col = mix(col, dc * 0.78, strokeA(d, px * 0.45, px) * cov * 0.5);
        best = h;
      }
    }
  }
  return col;
}
// Print finish, after Kiyoshi Awazu's silkscreens.
// Canvas: a faint weave on top of the paper grain.
@diagnostic(off, derivative_uniformity) fn canvasize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let w = 0.975 + 0.025 * sin(pos.x * 1.7) * sin(pos.y * 1.7);
  return paperize(col * w, pos, grain);
}
`;

const NAME = 'windswept';
// sky x4, sea, dune x3, canopy x4 (navy, teal, slate, olive), coral, trunk, rock orange, rock light, rock shade, grass x4
const PALETTES = {
  original: ['#3fb3d6', '#79d0e3', '#bfe9ef', '#2a9cc4', '#2b8e9e', '#d9ecdf', '#eef6ef', '#bcd8cf', '#1f3d58', '#2f5a6a', '#4b6a7c', '#e8a08a', '#58564f', '#e0874f', '#f2b48a', '#6f7f6a', '#4f9a5a', '#8ec46a', '#c9d88a', '#2f8a7a'],
  dusk:     ['#e88a7a', '#f2b09a', '#f7d2b8', '#c96a78', '#6a5a8a', '#f2d8c8', '#fbeadd', '#d8b8b0', '#1f2a48', '#3a3a62', '#5a4a70', '#ffb28a', '#3a2e38', '#e0704f', '#f5a67a', '#6a4a5a', '#6a8a5a', '#a8b86a', '#e0c88a', '#4a6a5a'],
  winter:   ['#9fb8c8', '#c8d8e0', '#e8eef0', '#7f9eb4', '#5a7a8a', '#e8ecea', '#f6f8f6', '#c8d0cc', '#1e2a36', '#34485a', '#56687a', '#e0b0a0', '#3c3c3a', '#c8805a', '#e8b89a', '#6a6e68', '#6a8a70', '#98b08a', '#c8c8a0', '#4a6a64'],
};

const p = {};
function readControls() {
  p.pal = colsOf($('palette').value);
  p.wind = +$('wind').value / 100 * 1.5;
  p.brush = 0.6 + +$('brush').value / 100 * 0.9;
  p.grain = +$('grain').value / 100 * 0.1;
  for (const id of ['wind', 'brush', 'grain']) $(id + 'Val').textContent = $(id).value;
}
let gust = 0, gustGoal = 0;
function generate() {}
function uniforms() {
  // Keep the whole composition on narrow screens.
  const zoom = Math.max(1, 1.05 / aspect);
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.wind, p.brush, p.grain, gust],
    c: [tl.active ? tl.x : 0, tl.active ? tl.y - 0.5 : 0, zoom, 0],
    cols: p.pal,
  };
}
function step(dt) {
  gustGoal *= Math.exp(-dt * 1.2);
  gust += (gustGoal - gust) * (1 - Math.exp(-dt * 5));
}
let lastX = 0;
function onDown(q) { lastX = q[0]; }
function onMove(q) { gustGoal = Math.max(-1, Math.min(1.5, gustGoal + (lastX - q[0]) * 6)); lastX = q[0]; }
function onUp() {}

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: [1, 2] });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
</body>
</html>
