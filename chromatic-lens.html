<script type="module">
import { init, effect, surface, texture, sampler, frameLoop, clock, frame } from './lib/vgpu.js';

// ═══════════════════════════════════════
// Rain on a windshield at night.
//
// The street beyond the glass is painted once, at three focuses: sharp, soft,
// and very soft, where every light has swollen into a bokeh disc. Car lights
// moving down the street are added live on top.
//
// On the glass the water is one continuous surface: small drops scattered
// all over, and columns of bigger drops that stick, then slip down in bursts,
// leaving a wet trail with beads in it. They're summed into one field, so
// drops that touch merge, and their outline is where the field crosses a
// level. The slope of that field is the slope of the water: each pixel looks
// through it, bent by that slope, at the street, sharp through a drop or a
// trail, blurred through the misted glass around them, and split a little by
// colour at the edges. A finger clears water and mist, and both build back.
// Nothing is kept between frames: each spot of glass knows when a finger last
// passed over it.
// ═══════════════════════════════════════
const NT = 24;   // finger-trail points kept
const SHADER = /* wgsl */ `
struct U {
  a: vec4f,    // time, aspect, px, seed
  b: vec4f,    // rain 0..1, drop size 0..1, _, chroma
  c: vec4f,    // traffic, 1 once a finger has touched the glass, fog 0..1, far end of the street (x 0..1)
  lights: array<vec4f, 4>,        // car colours: tail, head, and two signs
  trail: array<vec4f, ${NT}>,     // finger: x, y, time, radius
}
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var sharpT: texture_2d<f32>;
@group(0) @binding(2) var softT: texture_2d<f32>;
@group(0) @binding(3) var blurT: texture_2d<f32>;
@group(0) @binding(4) var samp: sampler;

fn S(a: f32, b: f32, x: f32) -> f32 { return smoothstep(a, b, x); }
fn N(t: f32) -> f32 { return fract(sin(t * 12345.564) * 7658.76); }
fn N3(p: f32) -> vec3f {
  var p3 = fract(vec3f(p) * vec3f(0.1031, 0.11369, 0.13787));
  p3 += dot(p3, p3.yzx + 19.19);
  return fract(vec3f((p3.x + p3.y) * p3.z, (p3.x + p3.z) * p3.y, (p3.y + p3.z) * p3.x));
}
fn saw(b: f32, t: f32) -> f32 { return S(0.0, b, t) * S(1.0, b, t); }

// ---- When this spot of glass was last cleared by a finger.
fn lastCleared(q: vec2f) -> f32 {
  var last = -1e4;
  if (u.c.y < 0.5) { return last; }
  for (var i = 0; i < ${NT}; i++) {
    let f = u.trail[i];
    if (f.w > 0.0 && length(q - f.xy) < f.w) { last = max(last, f.z); }
  }
  return last;
}

// ---- Columns of drops that stick and slip down the glass. uv in screen
// height units, y down. Returns (water, trail).
fn slideLayer(uv0: vec2f, t: f32) -> vec2f {
  let A = vec2f(6.0, 1.0);
  let grid = A * 2.0;
  var uv = uv0;
  uv.y -= t * 0.75;
  var id = floor(uv * grid);
  uv.y += N(id.x);
  id = floor(uv * grid);
  let n = N3(id.x * 35.2 + id.y * 2376.1);
  let st = fract(uv * grid) - vec2f(0.5, 0.0);
  // Across the column the drop wanders as it runs.
  var x = n.x - 0.5;
  let yy = uv0.y * 20.0;
  x += sin(yy + sin(yy)) * (0.5 - abs(x)) * (n.z - 0.5);
  x *= 0.7;
  // Down the cell it sticks, then slips: the saw is the stick-slip.
  let ti = fract(t + n.z);
  let y = 1.0 - ((saw(0.85, ti) - 0.5) * 0.9 + 0.5);
  let d = length((st - vec2f(x, y)) * A.yx);
  let mainDrop = S(0.4, 0.0, d);
  // The trail above it narrows and dries back toward the top of the cell.
  let r = sqrt(S(0.0, y, st.y));
  let cd = abs(st.x - x);
  var trail = S(0.23 * r, 0.15 * r * r, cd);
  let trailFront = S(0.02, -0.02, st.y - y);
  trail *= trailFront * r * r;
  // Beads left in the trail.
  let by = fract(uv0.y * 10.0) + (0.5 - st.y);
  let dd = length(st - vec2f(x, 1.0 - by));
  let beads = S(0.3, 0.0, dd);
  return vec2f(mainDrop + beads * r * trailFront, trail);
}

// ---- Small drops all over, each forming then slowly drying, and coming
// back only some while after the glass there was last cleared.
fn staticDrops(uv0: vec2f, t: f32, cells: f32, keep: f32) -> f32 {
  let uv = uv0 * cells;
  let id = floor(uv);
  let f = fract(uv) - 0.5;
  let n = N3(id.x * 107.45 + id.y * 3543.654 + cells);
  if (fract(n.x * 37.0) > keep) { return 0.0; }
  // Some round, some a little long where they have begun to run.
  let r = 0.12 + 0.24 * fract(n.y * 53.0);
  let p = (n.xy - 0.5) * (0.9 - 2.0 * r);
  let v = (f - p) * vec2f(1.0, 0.8 + 0.2 * fract(n.z * 7.0));
  let d = length(v);
  let fade = saw(0.025, fract(t + n.z));
  return S(r, 0.0, d) * (0.5 + 0.5 * fract(n.z * 10.0)) * fade;
}

// The water at screen point q: (field 0..1, trail), the drops' sizes set by
// how much the coordinates are scaled.
// The glass leans toward us: a point on screen to where it lies on the glass,
// in glass units (the top edge near and at the screen's scale, the bottom
// tilted away, so drops there are smaller and squashed).
const LEAN_S = 0.5;
const LEAN_C = 0.866;
fn toGlass(q: vec2f) -> vec2f {
  let yt = q.y;
  let s = yt / (LEAN_C - yt * LEAN_S);
  let z = 1.0 + s * LEAN_S;
  return vec2f((q.x - u.a.y * 0.5) * z, s);
}

fn water(q: vec2f) -> vec3f { return waterSince(q, u.a.x - lastCleared(q)); }
// (since: how long since this glass was cleared; water comes back over seconds.)
fn waterSince(q: vec2f, since: f32) -> vec3f {
  let t = u.a.x * 0.2;
  let rain = u.b.x;
  let back = S(0.3, 5.0 / (0.3 + rain), since);
  let sc = 1.0 / (0.55 + u.b.y * 0.9);
  let uv = (toGlass(q) - vec2f(0.0, 0.5)) * sc;
  let l0 = S(-0.5, 1.0, rain) * 2.0 * back;
  let l1 = S(0.25, 0.75, rain) * S(0.6, 3.5, since);
  let l2 = S(0.0, 0.5, rain) * S(0.6, 3.5, since);
  let s = (staticDrops(uv, t, 26.0, 0.45) + staticDrops(uv, t * 0.7, 12.0, 0.4) + staticDrops(uv, t * 0.5, 5.5, 0.3)) * l0;
  let m1 = slideLayer(uv, t) * l1;
  let m2 = slideLayer(uv * 1.85, t) * l2;
  let sum = s + m1.x + m2.x;
  // (Coverage, trail, and a height that keeps rising to each drop's middle,
  // so the whole drop bends light, not just its rim.)
  return vec3f(S(0.3, 1.0, sum), max(m1.y * l0, m2.y * l1), S(0.12, 1.0, sum));
}

// ---- The street, at a focus from 0 (sharp) to 1 (very soft), with the cars.
// (Speed: each pixel looks at the street up to five times, so what doesn't
// change between looks is worked out once, and nothing is fetched or added
// whose share would come to exactly nothing.)
fn streetTex(q: vec2f, focus: f32) -> vec3f {
  let uv = vec2f(q.x / u.a.y, q.y);
  let wb = S(0.0, 0.5, focus);
  let wc = S(0.5, 1.0, focus);
  var col: vec3f;
  if (wb >= 1.0) {
    col = textureSampleLevel(softT, samp, uv, 0.0).rgb;
  } else {
    col = mix(textureSampleLevel(sharpT, samp, uv, 0.0).rgb, textureSampleLevel(softT, samp, uv, 0.0).rgb, wb);
  }
  if (wc > 0.0) { col = mix(col, textureSampleLevel(blurT, samp, uv, 0.0).rgb, wc); }
  return col;
}

// Traffic up and down the street: headlights coming on the left, tail lights
// going away on the right, each laying a streak on the wet road. Where the
// lights are doesn't depend on the pixel, so it is found once per pixel and
// the cars out of sight are left out.
var<private> carN: i32;
var<private> carP: array<vec2f, 12>;
var<private> carC: array<vec3f, 12>;
var<private> carZF: array<vec2f, 12>;    // distance, fade
fn prepCars() {
  let t = u.a.x * u.c.x;
  let Sx = 0.45 * u.a.y;
  carN = 0;
  for (var i = 0; i < 6; i++) {
    let fi = f32(i);
    let h = N(fi * 7.31 + u.a.w);
    let coming = i % 2 == 0;
    var ph = fract(t * (0.03 + 0.03 * h) + h);
    if (!coming) { ph = 1.0 - ph; }
    let z = mix(32.0, 1.6, ph * ph);
    let X = select(0.45 + 0.2 * h, -0.45 - 0.2 * h, coming);
    let lc = select(u.lights[0].rgb, u.lights[1].rgb, coming);
    let fade = S(32.0, 24.0, z) * S(1.6, 2.6, z);
    if (fade == 0.0) { continue; }
    for (var k = 0; k < 2; k++) {
      carP[carN] = vec2f(u.a.y * u.c.w + (X + (f32(k) - 0.5) * 0.4) * Sx / z, 0.45 + (0.6 - 0.3) * Sx / z);
      carC[carN] = lc;
      carZF[carN] = vec2f(z, fade);
      carN++;
    }
  }
}

fn street(q: vec2f, focus: f32) -> vec3f {
  var col = streetTex(q, focus);
  for (var j = 0; j < carN; j++) {
    let lp = carP[j]; let lc = carC[j]; let z = carZF[j].x; let fade = carZF[j].y;
    let R = mix(0.012, 0.16, focus) / z + 0.0015;
    let d = length(q - lp) / R;
    let disc = (1.0 - S(0.8, 1.0, d)) * (0.75 + 0.25 * S(0.5, 0.95, d));
    let glow = exp(-d * d * 2.0) * (1.0 - focus);
    col += lc * (disc * mix(1.6, 0.4, focus) + glow) * fade;
    let below = q.y - lp.y;
    let rx = (q.x - lp.x) / (R * 1.5);
    col += lc * exp(-rx * rx) * S(0.0, 0.02, below) * S(0.6, 0.0, below) * 0.18 * fade;
  }
  return col;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let px = u.a.z;
  let p = vec2f(uv.x * asp, uv.y);

  prepCars();
  // The water and its slope.
  let since = t - lastCleared(p);
  let w = waterSince(p, since);
  let e = vec2f(0.0012, 0.0);
  let wx = water(p + e).z;
  let wy = water(p + e.yx).z;
  let n = vec2f(wx - w.z, wy - w.z);

  // Misted glass blurs the street most; a trail clears the mist, a drop
  // brings it sharp; mist thickens again after a clearing.
  let fog = u.c.z * S(0.5, 8.0, since);
  let focus = mix(clamp(0.72 + 0.28 * fog - w.y * 0.15, 0.6, 1.0), 0.28, S(0.1, 0.2, w.x));

  // Looking through the water: bent by its slope (n over e), so each drop
  // holds a small flipped picture of the lights just around it, sharper than
  // the glass sees them; the colours bent a little differently.
  var bend = -n / e.x * 0.0012;
  bend = bend / (1.0 + length(bend) / 0.07);
  let look = p;
  let ch = u.b.w * 0.1;
  var col = vec3f(
      street(look + bend * (1.0 - ch), focus).r,
      street(look + bend, focus).g,
      street(look + bend * (1.0 + ch), focus).b);

  // Mist scatters a little light back; drops and trails are clear of it.
  let mist = fog * (1.0 - S(0.1, 0.2, w.x)) * (1.0 - 0.35 * w.y);
  if (mist > 0.0) { col = mix(col, col * 0.88 + street(p, 1.0) * 0.25 + vec3f(0.012), mist * 0.6); }
  // A dark edge where light turns back inside each drop; each catches the
  // glow above it on its upper edge and gathers light at its foot.
  let inDrop = S(0.1, 0.25, w.x);
  if (inDrop > 0.0) {
    let g = n / e.x * 0.006;
    col *= 1.0 - S(0.7, 1.2, length(g)) * 0.3 * inDrop;
    let glow = street(p - vec2f(0.0, 0.08), 1.0);
    let gl = length(g);
    let gn = g / max(gl, 1e-4);
    col += glow * (S(0.4, 1.0, gn.y) * S(0.3, 0.9, gl) * 0.35 + S(0.4, 1.0, -gn.y) * S(0.5, 1.0, gl) * 0.15) * inDrop;
    col *= 1.0 + 0.5 * inDrop;
    // A glint of the brightest light, high on each drop.
    let spec = pow(max(dot(gn, vec2f(0.45, 0.89)), 0.0), 10.0) * S(0.35, 0.75, gl) * (1.0 - S(0.9, 1.3, gl));
    col += (glow * 1.5 + vec3f(0.25)) * spec * inDrop * S(0.3, 0.6, w.x);
  }

  // The faint sheen of the leaning glass.
  col += vec3f(0.03, 0.04, 0.05) * S(0.5, 0.0, uv.y) * (1.0 - u.c.z * 0.3);
  // Corners fall dark; a little grain; a gentle curve so lights bloom.
  let vg = length((uv - 0.5) * vec2f(1.15, 1.0));
  col *= 1.0 - S(0.4, 0.9, vg) * 0.5;
  let gr = fract(sin(dot(floor(uv * vec2f(1400.0, 900.0)) + fract(t * 7.0), vec2f(12.9898, 78.233))) * 43758.5453) - 0.5;
  col += gr * 0.015;
  // Exposed up a little, the darks cooled toward teal.
  col *= 1.3;
  col += vec3f(0.0, 0.008, 0.014) * (1.0 - S(0.0, 0.25, dot(col, vec3f(0.33))));
  col = col / (1.0 + col * 0.3);
  return vec4f(col, 1.0);
}
`;

// ═══════════════════════════════════════
// The street, painted on a 2D canvas once per scene and size, sharp and at
// two softer focuses.
// ═══════════════════════════════════════
const SCENES = {
  monsoon: { sky: ['#03050a', '#0a1322', '#1b2a40'], wall: '#05080d', win: ['#ffd9a0', '#bfe8ff', '#fff3dc', '#9ff0e6'], signs: ['#2fe3ff', '#ff3b5c', '#3d8bff', '#3dffa0', '#ffb347'], lamp: '#cfe4ff', tail: '#ff2a3a', head: '#fff0cf' },
  neon:   { sky: ['#05040c', '#1a0c2e', '#3a1446'], wall: '#0b0a12', win: ['#ffcf8a', '#9fe7ff', '#ff9ad5', '#fff1d6'], signs: ['#ff3fa4', '#31e5ff', '#8a5cff', '#ffd166', '#3dffb0'], lamp: '#ffc98a', tail: '#ff2a3a', head: '#f4f6ff' },
  sodium: { sky: ['#030406', '#14100a', '#3a2410'], wall: '#0b0906', win: ['#ffcf8a', '#ffe7b8', '#ffb35c', '#fff4dd'], signs: ['#ff8c1a', '#ff3b2f', '#ffd27a', '#3cff7a', '#ffb347'], lamp: '#ffa640', tail: '#ff2a1a', head: '#fff2d8' },
  blue:   { sky: ['#0a1a3a', '#2a4878', '#7a7fa8'], wall: '#101830', win: ['#ffd28a', '#ffe9b8', '#fff1c9', '#ffc070'], signs: ['#ff4d4d', '#8fd3ff', '#ffd28a', '#ff9d5c', '#c8a2ff'], lamp: '#ffd28a', tail: '#ff3a3a', head: '#f6f8ff' },
  silver: { sky: ['#030304', '#121316', '#2c2e33'], wall: '#0a0a0b', win: ['#e8e8e8', '#cfd2d6', '#ffffff', '#b8bcc2'], signs: ['#ffffff', '#d6d9de', '#a8adb5', '#eeeeee', '#c4c7cc'], lamp: '#f0f0f0', tail: '#d8d8d8', head: '#ffffff', mono: true },
};
function rng(seed) { let s = (seed * 9301 + 49297) % 233280 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// What the camera sees past the glass: a street running away under the
// rain. Shopfronts down both sides, poles carrying lamps and a tangle of
// wires, a lit hoarding at the far end, traffic, someone walking under an
// umbrella, and the wet road giving every light back as a long broken streak.
// Bright things are also kept as lights, [x, y, size 0..1, colour, strength],
// so the soft paintings can draw each as a bokeh disc.
let vanishX = 0.5;
const VY = 0.45, CAM = 0.6;       // horizon (of the height) and eye height, in street half-widths
function paintStreet(w, h, sc, seed) {
  const R = rng(Math.floor(seed * 1000) + 7);
  const pick = (a) => a[Math.floor(R() * a.length)];
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const lights = [];
  const k = h / 600, vx = w * 0.5, vy = h * VY, Sx = w * 0.45;
  vanishX = 0.5;
  // A point on the street: X across (kerbs at -1, 1), Y up, z away (1 near).
  const P = (X, Y, z) => [vx + X * Sx / z, vy + (CAM - Y) * Sx / z];
  const glow = (x, y, r, c, a) => {
    const gl = g.createRadialGradient(x, y, 0, x, y, r);
    gl.addColorStop(0, '#ffffff'); gl.addColorStop(0.07, c); gl.addColorStop(0.3, c + '55'); gl.addColorStop(1, c + '00');
    g.globalAlpha = a; g.fillStyle = gl; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.globalAlpha = 1;
  };
  const quad = (pts, fill) => { g.fillStyle = fill; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); };

  // Sky, a low haze of light over the far end.
  const sky = g.createLinearGradient(0, 0, 0, vy);
  sky.addColorStop(0, sc.sky[0]); sky.addColorStop(0.7, sc.sky[1]); sky.addColorStop(1, sc.sky[2]);
  g.fillStyle = sky; g.fillRect(0, 0, w, vy + 2);
  // The road: dark, wet, a little lighter far off where it holds the haze.
  const road = g.createLinearGradient(0, vy, 0, h);
  road.addColorStop(0, sc.sky[2]); road.addColorStop(0.12, sc.wall); road.addColorStop(1, '#020305');
  g.fillStyle = road; g.fillRect(0, vy, w, h - vy);

  // Buildings down both sides: blocks of differing height, dark above,
  // shopfronts lit at street level, a few windows.
  const far = 40;
  for (const side of [-1, 1]) {
    for (let z = 1.2; z < far;) {
      const dz = 1.5 + R() * 3 * (z / 6), z1 = Math.min(far, z + dz), H = 2.5 + R() * 4;
      const X = side * (1.6 + R() * 0.1);
      quad([P(X, 0, z), P(X, H, z), P(X, H, z1), P(X, 0, z1)], sc.wall);
      // Windows above.
      const cols = Math.max(1, Math.round(dz * 1.2)), rows = Math.floor(H / 0.5);
      for (let i = 0; i < cols; i++) for (let j = 2; j < rows; j++) {
        if (R() > 0.28) continue;
        const za = z + (i + 0.25) / cols * dz, zb = za + 0.4 / cols * dz, ya = j * 0.5, yb = ya + 0.28;
        g.globalAlpha = 0.3 + R() * 0.5;
        quad([P(X, ya, za), P(X, yb, za), P(X, yb, zb), P(X, ya, zb)], pick(sc.win));
      }
      g.globalAlpha = 1;
      // The shopfront: a lit panel, sometimes a bright sign over it.
      if (z > 2.4 && R() < (side > 0 ? 0.95 : 0.8)) {
        const c = R() < 0.55 ? pick(sc.win) : pick(sc.signs), za = z + dz * 0.1, zb = z1 - dz * 0.1;
        g.globalAlpha = 0.55 + R() * 0.4;
        quad([P(X * 0.99, 0.05, za), P(X * 0.99, 0.55, za), P(X * 0.99, 0.55, zb), P(X * 0.99, 0.05, zb)], c);
        g.globalAlpha = 1;
        const [lx, ly] = P(X * 0.99, 0.3, (za + zb) / 2);
        lights.push([lx, ly, Math.min(1, 1.6 / z), c, 0.7]);
        if (za > 3.5 && R() < 0.6) {
          const s = pick(sc.signs), [sx, sy] = P(X * 0.97, 0.75 + R() * 0.4, za + (zb - za) * R());
          const sw = 0.35 * Sx / za, sh = 0.13 * Sx / za;
          g.shadowColor = s; g.shadowBlur = 14 * k; g.fillStyle = s; g.fillRect(sx - sw / 2, sy - sh / 2, sw, sh); g.shadowBlur = 0;
          lights.push([sx, sy, Math.min(1, 1.4 / za), s, 0.9]);
        }
      }
      z = z1 + 0.05;
    }
  }
  // The far end: a hoarding lit up over the street, a tall twin lamp, a
  // signal, and a spatter of small lights.
  {
    const z = 26, [x0, y0] = P(-0.15, 4.2, z), [x1, y1] = P(0.45, 3.0, z);
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, pick(sc.signs)); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, pick(sc.signs));
    g.shadowColor = '#ffffff'; g.shadowBlur = 20 * k; g.fillStyle = gr; g.fillRect(x0, y0, x1 - x0, y1 - y0); g.shadowBlur = 0;
    lights.push([(x0 + x1) / 2, (y0 + y1) / 2, 0.45, '#ffffff', 0.9], [x0, (y0 + y1) / 2, 0.35, pick(sc.signs), 0.8]);
    const [tx, ty] = P(0.7, 4.2, 22), [bx, by] = P(0.7, 0, 22);
    g.strokeStyle = '#000'; g.lineWidth = 2 * k; g.beginPath(); g.moveTo(tx, ty); g.lineTo(bx, by); g.stroke();
    for (const d of [-1, 1]) { glow(tx + d * 6 * k, ty, 22 * k, sc.lamp, 1); lights.push([tx + d * 6 * k, ty, 0.3, sc.lamp, 1]); }
    const sg = sc.mono ? '#e8e8e8' : '#30ff8a', [gx, gy] = P(-0.55, 1.5, 18);
    glow(gx, gy, 12 * k, sg, 1); lights.push([gx, gy, 0.25, sg, 1]);
    for (let i = 0; i < 90; i++) {
      const z = 10 + R() * 26, X = (R() < 0.5 ? -1 : 1) * (0.6 + R() * 0.6), [x, y] = P(X, R() * 1.4, z), c = pick(R() < 0.5 ? sc.win : sc.signs);
      glow(x, y, (4 + R() * 9) * k, c, 0.9); lights.push([x, y, 0.12 + R() * 0.2, c, 0.55]);
    }
  }
  // Poles down the left kerb with cold lamps, and the wires slung between
  // them and across the street.
  const poles = [];
  for (let z = 1.6; z < 30; z *= 1.55 + R() * 0.2) {
    const X = -1.3, [x0, y0] = P(X, 0, z), [x1, y1] = P(X, 3.1, z);
    g.strokeStyle = '#000'; g.lineWidth = Math.max(1, 0.06 * Sx / z); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    poles.push([X, z]);
    const [lx, ly] = P(X + 0.25, 2.9, z);
    glow(lx, ly, 0.9 * Sx / z, sc.lamp, 1);
    lights.push([lx, ly, Math.min(1, 1.5 / z), sc.lamp, 1]);
  }
  g.lineWidth = Math.max(0.8, 1 * k);
  const wire = (a, b, sag) => {
    g.beginPath();
    for (let i = 0; i <= 24; i++) {
      const f = i / 24, X = a[0] + (b[0] - a[0]) * f, Y = a[1] + (b[1] - a[1]) * f - sag * 4 * f * (1 - f), z = a[2] + (b[2] - a[2]) * f;
      const [x, y] = P(X, Y, z); i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  };
  for (let i = 0; i < poles.length; i++) {
    const [X, z] = poles[i];
    for (let j = 0; j < 5; j++) {
      g.strokeStyle = j < 2 ? sc.lamp + '66' : '#0a0e16';
      const ya = 2.4 + j * 0.15;
      if (i + 1 < poles.length) wire([X, ya, z], [poles[i + 1][0], ya + (R() - 0.5) * 0.2, poles[i + 1][1]], 0.25 + R() * 0.3);
      if (R() < 0.35) wire([X, ya, z], [1.5, 2.0 + R() * 0.6, z * (1.2 + R() * 0.8)], 0.3 + R() * 0.3);
    }
  }
  // Traffic, coming and going, and someone walking under an umbrella.
  const vehicle = (X, z, body, lit) => {
    const hw = 0.28;
    quad([P(X - hw, 0.08, z), P(X - hw, 0.62, z), P(X + hw, 0.62, z), P(X + hw, 0.08, z)], body);
    quad([P(X - hw * 0.8, 0.62, z), P(X - hw * 0.65, 0.9, z), P(X + hw * 0.65, 0.9, z), P(X + hw * 0.8, 0.62, z)], body);
    for (const d of [-1, 1]) {
      const [x, y] = P(X + d * hw * 0.7, 0.3, z), c = lit === 'head' ? sc.head : sc.tail;
      glow(x, y, 0.5 * Sx / z, c, 0.8); lights.push([x, y, Math.min(1, 1.6 / z), c, 0.65]);
    }
  };
  vehicle(0.4, 14, '#15181e', 'tail');
  vehicle(-0.3, 11, '#101318', 'head');
  vehicle(0.0, 6.5, sc.mono ? '#2a2a2a' : '#4a3a10', 'head');
  vehicle(-0.5, 5, '#20242c', 'head');
  {
    const z = 3.2, X = 0.3;
    quad([P(X - 0.09, 0, z), P(X - 0.11, 0.95, z), P(X + 0.11, 0.95, z), P(X + 0.09, 0, z)], '#05070b');
    const [ux, uy] = P(X, 1.25, z), ur = 0.38 * Sx / z;
    g.fillStyle = '#04060a'; g.beginPath(); g.ellipse(ux, uy, ur, ur * 0.35, 0, Math.PI, 0); g.fill();
    const [hx, hy] = P(X, 1.02, z); g.beginPath(); g.arc(hx, hy, 0.07 * Sx / z, 0, 7); g.fill();
  }
  // The right kerb catching the light.
  { const [a, b] = [P(1.15, 0, 1.1), P(1.15, 0, 30)];
    const gr = g.createLinearGradient(a[0], a[1], b[0], b[1]); gr.addColorStop(0, sc.lamp + '00'); gr.addColorStop(0.3, sc.lamp + '88'); gr.addColorStop(1, sc.lamp + '22');
    g.strokeStyle = gr; g.lineWidth = 2 * k; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }

  // The wet road holds a dim, stretched, upside-down copy of it all ...
  {
    const up = document.createElement('canvas'); up.width = w; up.height = Math.ceil(vy);
    const ug = up.getContext('2d'); if ('filter' in ug) ug.filter = 'blur(' + (2 * k) + 'px)';
    ug.drawImage(cv, 0, 0, w, vy, 0, 0, w, vy);
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.3;
    g.setTransform(1, 0, 0, -2.4, 0, vy * 3.4);
    g.drawImage(up, 0, 0);
    g.restore();
  }
  // ... and every bright light back as a long streak, broken
  // across by the ripples.
  g.globalCompositeOperation = 'lighter';
  const n0 = lights.length;
  for (let i = 0; i < n0; i++) {
    const [x, y, s, c, st] = lights[i];
    if (st < 0.6) continue;
    // (From about where the light stands on the road.)
    const top = y < vy ? vy + (vy - y) * 0.12 + 2 : y + 2 * k;
    const len = (h - top) * (0.55 + 0.4 * R()), sw = (3 + 26 * s) * k;
    for (let yy = top; yy < top + len; yy += 2 * k) {
      const f = (yy - top) / len;
      const a = st * (1 - f) * (0.25 + 0.75 * R()) * 0.22 * (R() < 0.15 ? 0.2 : 1);
      g.globalAlpha = a; g.fillStyle = c;
      const ww = sw * (0.4 + 0.9 * R()) * (0.7 + f);
      g.fillRect(x - ww / 2 + (R() - 0.5) * sw * 0.3, yy, ww, 2 * k);
    }
    g.globalAlpha = 1;
    lights.push([x, top + len * 0.15, s * 0.9, c, st * 0.35], [x, top + len * 0.4, s * 0.8, c, st * 0.2]);
  }
  g.globalCompositeOperation = 'source-over';
  return { canvas: cv, lights };
}

// A soft version: the painting blurred, then each light a bokeh disc, its
// size by how far it is, its rim a little brighter, its body faintly uneven.
function soften(src, lights, w, h, blurPx, discPx) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  if ('filter' in g) { g.filter = 'blur(' + blurPx + 'px)'; g.drawImage(src, 0, 0); g.filter = 'none'; }
  else {
    // (Without canvas filters: shrink and grow back.)
    const f = Math.max(2, Math.round(blurPx / 2));
    const sm = document.createElement('canvas'); sm.width = Math.max(1, w / f | 0); sm.height = Math.max(1, h / f | 0);
    const sg = sm.getContext('2d'); sg.imageSmoothingQuality = 'high';
    sg.drawImage(src, 0, 0, sm.width, sm.height); g.imageSmoothingQuality = 'high'; g.drawImage(sm, 0, 0, w, h);
  }
  g.globalAlpha = 0.55; g.drawImage(cv, 0, 0); g.globalAlpha = 1;
  g.globalCompositeOperation = 'lighter';
  const R = rng(lights.length + discPx);
  for (const [x, y, s, c, st] of lights) {
    const r = discPx * (0.35 + 1.1 * s) * (0.85 + 0.3 * R());
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, c + '2a'); gr.addColorStop(0.7, c + '38'); gr.addColorStop(0.9, c + '52'); gr.addColorStop(0.97, c + '40'); gr.addColorStop(1, c + '00');
    g.globalAlpha = Math.min(1, 0.15 + st);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  return cv;
}

const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const IDS = ['rain', 'size', 'fog', 'chroma', 'traffic'];
const p = {};
function readControls() {
  p.scene = $('palette').value;
  p.rain = +$('rain').value / 100;
  p.size = +$('size').value / 100;
  p.fog = +$('fog').value / 100;
  p.chroma = +$('chroma').value / 100 * 1.2;
  p.traffic = +$('traffic').value / 100 * 2;
  for (const id of IDS) $(id + 'Val').textContent = $(id).value;
}
readControls();

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(4.5e6) });
const clampLinear = sampler(gpu, { minFilter: 'linear', magFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
let W = 1, H = 1, aspect = 1, t = 0, seed = Math.random() * 100;
const AT = new URLSearchParams(location.search).get('at');
if (AT !== null) seed = 7;

// The finger's trail: the last NT points, each wiping a patch at its time.
const trail = Array.from({ length: NT }, () => [0, 0, 0, 0]);
let ti = 0, dragging = false, lastPt = null, touched = 0;
function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.height, (e.clientY - r.top) / r.height];
}
function addPt(q) {
  if (lastPt && Math.hypot(q[0] - lastPt[0], q[1] - lastPt[1]) < 0.025) return;
  lastPt = q;
  trail[ti] = [q[0], q[1], t, 0.05];
  touched = 1;
  ti = (ti + 1) % NT;
}
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastPt = null; addPt(toP(e)); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (dragging) addPt(toP(e)); });
const release = () => { dragging = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

// (The scene's light colours are worked out once per scene, not per frame.)
const lightsOf = {};
function uniforms() {
  const sc = SCENES[p.scene];
  const lights = lightsOf[p.scene] || (lightsOf[p.scene] = [[...hex(sc.tail), 1], [...hex(sc.head), 1], [...hex(sc.signs[0]), 1], [...hex(sc.signs[1]), 1]]);
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.rain, p.size, 0, p.chroma],
    c: [p.traffic, touched, p.fog, vanishX],
    lights,
    trail,
  };
}

// The three focuses of the street, painted at a little under screen size.
let texs = null;
function makeTex(cv) {
  const tx = texture(gpu, { kind: '2d', size: [cv.width, cv.height], format: 'rgba8unorm', usage: ['texture_binding', 'copy_dst', 'render_attachment'] });
  gpu.gpu.queue.copyExternalImageToTexture({ source: cv }, { texture: tx.gpu }, [cv.width, cv.height]);
  return tx;
}
// Painting the street is the slow part, so the last few paintings are kept
// (by scene, size and seed): going back to one is instant.
const painted = new Map();
function buildStreet() {
  const h = Math.min(1200, Math.max(400, Math.round(H * 0.7)));
  const w = Math.min(4096, Math.round(h * aspect));
  const key = p.scene + '|' + w + '|' + h + '|' + seed;
  let got = painted.get(key);
  if (got) {
    painted.delete(key);
  } else {
    const { canvas: sharp, lights } = paintStreet(w, h, SCENES[p.scene], seed);
    const k = h / 600;
    const soft = soften(sharp, lights, w, h, 6 * k, 16 * k);
    const blur = soften(sharp, lights, w, h, 18 * k, 40 * k);
    got = { texs: [makeTex(sharp), makeTex(soft), makeTex(blur)], vanish: vanishX };
  }
  painted.set(key, got);
  texs = got.texs; vanishX = got.vanish;
  fx.set({ sharpT: texs[0], softT: texs[1], blurT: texs[2] });
  while (painted.size > 4) {
    const [oldKey, old] = painted.entries().next().value;
    painted.delete(oldKey);
    old.texs.forEach((x) => x.destroy());
  }
}

const blank = document.createElement('canvas'); blank.width = blank.height = 2; blank.getContext('2d').fillRect(0, 0, 2, 2);
const t0 = makeTex(blank);
const fx = effect(gpu, SHADER, { set: { u: uniforms(), sharpT: t0, softT: t0, blurT: t0, samp: clampLinear } });
let needStreet = true;
// While a window is being resized the street is painted again only once it
// settles, not on every step of the drag.
let settle = 0;
surf.onResize(({ width, height }) => {
  W = width; H = height; aspect = width / height;
  if (!texs) { needStreet = true; return; }
  clearTimeout(settle);
  settle = setTimeout(() => { needStreet = true; if (!loop) frame(gpu, render); }, 150);
});
function render(f) {
  if (needStreet) { needStreet = false; buildStreet(); }
  fx.set({ u: uniforms() });
  f.pass(surf, fx);
}

const clk = clock(gpu);
let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
// The rain has been falling a while before we look. (?at=seconds holds time
// at that moment, for stills and checks.)
t = AT !== null ? +AT : 30 + Math.random() * 30;
function tick(f) {
  if (AT === null) t += Math.min(clk.deltaTime, 0.1);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
// Frames are drawn only while playing and while the piece can be seen: not
// when it is scrolled away, in a tab behind others, or in a hidden frame.
let onScreen = true;
function runLoop() {
  const want = playing && onScreen && !document.hidden;
  if (want && !loop) loop = frameLoop(gpu, tick);
  else if (!want && loop) { loop.stop(); loop = null; }
}
document.addEventListener('visibilitychange', runLoop);
if ('IntersectionObserver' in window) {
  new IntersectionObserver((es) => { onScreen = es[es.length - 1].isIntersecting; runLoop(); }).observe(canvas);
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    $('fps').textContent = '';
  }
  runLoop();
}

for (const id of IDS) $(id).addEventListener('input', () => { readControls(); if (!playing) frame(gpu, render); });
$('palette').addEventListener('change', () => { readControls(); needStreet = true; if (!playing) frame(gpu, render); });
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => {
  seed = Math.random() * 100;
  needStreet = true;
  if (!playing) frame(gpu, render);
});
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'night-rain-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

togglePlay();
</script>
</body>
</html>
