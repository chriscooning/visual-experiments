<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';

// ═══════════════════════════════════════
// Rain on a windshield at night. Beyond the glass a city lies out of focus,
// its lights swollen into soft discs drifting with the traffic. On the glass
// sit drops of three sizes; each is a little lens holding a sharp, upside-down
// picture of the street, split at its rim into a thin rainbow. Now and then a
// heavy drop runs down, clearing a track and leaving beads behind it. A pair
// of wipers sweeps the glass on a timer and the rain builds back; a finger
// drawn across the glass wipes a trail that fills in again.
//
// Nothing is stored between frames: each drop knows when it fell and each
// spot of glass knows when a blade or a finger last passed over it, so a drop
// shows only if it fell since then.
// ═══════════════════════════════════════
const NT = 24;   // finger-trail points kept
const SHADER = /* wgsl */ `
struct U {
  a: vec4f,    // time, aspect, px, seed
  b: vec4f,    // rain 0..1, drop size 0..1, wiper period (0 off), chroma
  c: vec4f,    // traffic, wiper time offset, _, _
  cols: array<vec4f, 8>,          // sky top, haze, six lights
  trail: array<vec4f, ${NT}>,     // finger: x, y, time, radius
}
@group(0) @binding(0) var<uniform> u: U;

fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }

// ---- The city beyond the glass. q is a point on the screen (height units,
// y down); blur runs from 0 (the sharp picture inside a drop) to 1 (out of
// focus on the glass).
fn city(q: vec2f, blur: f32) -> vec3f {
  let t = u.a.x; let sd = u.a.w;
  // Sky to street: dark above, a coloured glow low down where the lights are.
  let g = smoothstep(0.05, 1.0, q.y);
  var col = mix(C(0), C(1), g * g);
  col += C(1) * 0.35 * exp(-pow((q.y - 0.72) / 0.18, 2.0));
  // Three depths of lights in loose rows: far ones small and many, near ones
  // big and few. Each drifts with the traffic at its own pace; out of focus
  // each is a soft disc with a brighter rim, in focus a point of light.
  for (var L = 0; L < 3; L++) {
    let fl = f32(L);
    let cell = 0.055 + fl * 0.05;
    let drift = vec2f(t * u.c.x * (0.02 + fl * 0.035) * select(1.0, -1.0, L == 1), 0.0);
    let gq = (q + drift) / cell;
    let gi = floor(gq);
    for (var j = -1; j <= 1; j++) {
      for (var i = -1; i <= 1; i++) {
        let id = gi + vec2f(f32(i), f32(j));
        let h = hash21(id + sd + fl * 17.0);
        // Lights gather along the street, a few higher up, the sky dark.
        let cy = (id.y + 0.5) * cell;
        if (h > 0.04 + 0.42 * smoothstep(0.3, 0.8, cy)) { continue; }
        let c = (id + 0.5 + (vec2f(hash21(id + 3.1 + fl), hash21(id + 7.7 + fl)) - 0.5) * 0.8) * cell;
        let k = i32(floor(hash21(id + 11.3 + fl) * 6.0));
        let lc = u.cols[2 + k].rgb;
        let bright = 0.35 + 0.65 * hash21(id + 5.9) * (0.6 + 0.4 * sin(t * (0.3 + h) + h * 40.0));
        let R = mix(0.0025 + fl * 0.0015, cell * (0.38 + 0.25 * hash21(id + 2.2)), blur);
        let d = length(gq * cell - c) / R;
        let disc = 1.0 - smoothstep(0.82, 1.0, d);
        let rim = smoothstep(0.55, 0.95, d) * disc;
        // Small sharp points glow; big soft discs are dimmer for their size.
        let a = (disc * (0.55 + 0.45 * rim)) * mix(1.6, 0.42 + 0.12 * fl, blur) + exp(-d * d * 3.0) * (1.0 - blur) * 0.8;
        col += lc * a * bright * (0.55 + 0.25 * fl);
      }
    }
  }
  return col;
}

// ---- When this spot of glass was last cleared: by a wiper blade or by a
// finger. -1e4 if never.
const WMAX = 2.65;   // how far the blades swing, radians from lying flat
fn pivotOf(k: i32) -> vec2f { return vec2f(u.a.y * select(0.2, 0.6, k == 1), 1.04); }
fn wiperAngle(tau: f32, D: f32) -> f32 { return WMAX * (0.5 - 0.5 * cos(6.2831853 * clamp(tau / D, 0.0, 1.0))); }
fn lastCleared(q: vec2f) -> f32 {
  let t = u.a.x;
  var last = -1e4;
  let P = u.b.z;
  if (P > 0.0) {
    let D = 1.3;
    let tt = t + u.c.y;
    let cyc = floor(tt / P) * P;
    let tau = tt - cyc;
    for (var k = 0; k < 2; k++) {
      let v = q - pivotOf(k);
      let r = length(v);
      if (r > 0.98 * u.a.y * 0.62 + 0.25 || r < 0.06) { continue; }
      let phi = atan2(-v.y, v.x);
      if (phi < 0.0 || phi > WMAX) { continue; }
      // The blade passes this angle once going up and once coming back.
      let t1 = D / 6.2831853 * acos(clamp(1.0 - 2.0 * phi / WMAX, -1.0, 1.0));
      let t2 = D - t1;
      var passed = cyc - P + t2;
      if (tau >= t2) { passed = cyc + t2; } else if (tau >= t1) { passed = cyc + t1; }
      last = max(last, passed - u.c.y);
    }
  }
  for (var i = 0; i < ${NT}; i++) {
    let f = u.trail[i];
    if (f.w > 0.0 && length(q - f.xy) < f.w) { last = max(last, f.z); }
  }
  return last;
}

// ---- Drops. A layer is a grid of cells, one possible drop in each; a drop
// falls at its own pace after the glass there was last cleared and stays
// until the next clearing. Returns (offset from its centre, radius, age) in
// x, y, z, w, or radius 0 for none.
fn dropIn(q: vec2f, cell: f32, size: f32, layer: f32) -> vec4f {
  let t = u.a.x;
  let gi = floor(q / cell);
  let h = hash21(gi + layer * 31.7 + u.a.w);
  // Fewer cells hold drops in light rain.
  if (h > 0.1 + 0.5 * u.b.x) { return vec4f(0.0); }
  let c0 = (gi + 0.5) * cell;
  let lc = lastCleared(c0);
  // Its moments of falling come round every Tp seconds; the first one after
  // the last clearing is when this drop landed.
  let Tp = (1.2 + 5.0 * hash21(gi + 4.4 + layer)) / (0.25 + u.b.x * 1.6) * (0.6 + layer * 0.5);
  let off = hash21(gi + 9.1 + layer) * Tp;
  let k0 = floor((lc + off) / Tp) + 1.0;
  let born = k0 * Tp - off;
  if (born > t) { return vec4f(0.0); }
  // A fresh place in the cell each time it is cleared.
  let j = vec2f(hash21(gi + k0 * 1.37 + 2.0), hash21(gi + k0 * 2.71 + 5.0)) - 0.5;
  let r = cell * size * (0.55 + 0.45 * hash21(gi + k0 + 8.0));
  let c = c0 + j * (cell - 2.2 * r) * 0.9;
  // A runner that has passed through here took this drop with it.
  if (trackAt(c) > 0.0) { return vec4f(0.0); }
  let age = t - born;
  // Lands with a little swell.
  let rr = r * (0.75 + 0.25 * smoothstep(0.0, 0.35, age));
  // Slightly flattened on top, heavier below.
  var v = q - c;
  v.y *= select(1.08, 0.92, v.y > 0.0);
  return vec4f(v, rr, age);
}

// ---- Runners: now and then a heavy drop runs down a column, wobbling,
// clearing a track behind it and leaving beads in it. runX is its path:
// where across the column it is at height y on run n.
fn runX(ci: f32, n: f32, y: f32) -> f32 {
  let colW = 0.09;
  return (ci + 0.5) * colW + 0.014 * sin(y * 23.0 + n * 3.1) + 0.008 * sin(y * 61.0 + ci) + 0.02 * (hash1(ci + n) - 0.5);
}
// (its x, y, the height it started from, and its column and run packed as
// column * 1000 + run; w < 0 when this column has none)
fn runner(q: vec2f) -> vec4f {
  let t = u.a.x;
  let colW = 0.09;
  let ci = floor(q.x / colW);
  let h = hash1(ci * 3.17 + u.a.w);
  if (h > 0.25 + 0.5 * u.b.x) { return vec4f(0.0, 0.0, 0.0, -1.0); }
  // Each column's runs come round every so often, offset from the others.
  let period = 7.0 + 9.0 * hash1(ci + 1.3);
  let ph = t + h * period;
  let n = floor(ph / period);
  let tau = ph - n * period;
  let speed = 0.12 + 0.1 * hash1(ci + n * 1.7);
  let y0 = -0.05 + 0.4 * hash1(ci + n * 2.3);
  // Runs in fits and starts.
  let y = y0 + speed * (tau + 0.25 * sin(tau * 3.0 + h * 9.0));
  return vec4f(runX(ci, n, y), y, y0, ci * 1000.0 + n + 0.5);
}

// How far down a runner's clear track q lies (0 outside one).
fn trackAt(q: vec2f) -> f32 {
  let rn = runner(q);
  if (rn.w < 0.0) { return 0.0; }
  let ci = floor(rn.w / 1000.0);
  let rnum = rn.w - ci * 1000.0 - 0.5;
  let along = rn.y - q.y;
  let rr = 0.012 * (0.6 + u.b.y * 0.8);
  if (along > 0.0 && along < rn.y - rn.z && abs(q.x - runX(ci, rnum, q.y)) < rr * 0.85) {
    return 1.0 - smoothstep(0.0, 0.35, along / max(rn.y - rn.z, 0.01)) * 0.4;
  }
  return 0.0;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let px = u.a.z;
  let p = vec2f(uv.x * asp, uv.y);
  let sizeK = 0.6 + u.b.y * 0.8;

  // The out-of-focus city, softened a touch more by the wet glass.
  var col = city(p, 1.0);

  // Which drop, if any, covers this point: the runner first, then big beads,
  // then small ones; the finest mist only shades the glass.
  var dv = vec4f(0.0);
  let rn = runner(p);
  var inTrack = 0.0;
  if (rn.w >= 0.0) {
    let rr = 0.012 * sizeK;
    let v = (p - rn.xy) * vec2f(1.0, 0.85);
    if (length(v) < rr) { dv = vec4f(v, rr, 1.0); }
    // Its track, wandering with it: clear glass, with a few beads left
    // behind at uneven spacing.
    let ci = floor(rn.w / 1000.0);
    let rnum = rn.w - ci * 1000.0 - 0.5;
    let along = rn.y - p.y;
    let tx = runX(ci, rnum, p.y);
    if (along > 0.0 && along < rn.y - rn.z && abs(p.x - tx) < rr * 0.85) {
      inTrack = 1.0 - smoothstep(0.0, 0.35, along / max(rn.y - rn.z, 0.01)) * 0.4;
      let seg = floor(along / 0.045);
      let hb = hash1(seg * 7.3 + ci * 1.9 + rnum);
      let by = (seg + 0.2 + 0.6 * hb) * 0.045;
      let bv = vec2f(p.x - runX(ci, rnum, rn.y - by) - (hb - 0.5) * rr * 0.6, along - by);
      let br = (0.002 + 0.003 * hash1(seg + 3.3 + rnum)) * sizeK * step(0.45, hb);
      if (dv.z == 0.0 && br > 0.0 && length(bv) < br) { dv = vec4f(bv, br, 1.0); }
    }
  }
  if (dv.z == 0.0) {
    let d1 = dropIn(p, 0.1, 0.4 * sizeK, 0.0);
    if (d1.z > 0.0 && length(d1.xy) < d1.z) { dv = d1; }
  }
  if (dv.z == 0.0) {
    let d2 = dropIn(p + vec2f(0.017, 0.023), 0.034, 0.36 * sizeK, 1.0);
    if (d2.z > 0.0 && length(d2.xy) < d2.z) { dv = d2; }
  }

  if (dv.z > 0.0) {
    // A drop: a lens holding a sharp, upside-down, shrunken city, its colours
    // pulled apart a little at the rim.
    let n = dv.xy / dv.z;
    let e = length(n);
    // Each drop takes in a wide view of the street around it, turned upside
    // down and squeezed toward the rim.
    let span = 0.22 * (1.0 + 0.35 * e * e);
    let ch = u.b.w * 0.12 * e * e;
    let base = p - dv.xy + vec2f(0.0, 0.08);
    let r = city(base - n * span * (1.0 - ch), 0.3).r;
    let g = city(base - n * span, 0.3).g;
    let b = city(base - n * span * (1.0 + ch), 0.3).b;
    var dc = vec3f(r, g, b) * 1.15 + C(1) * 0.06;
    // It gathers the glow behind it, brightest in a crescent low in the drop
    // where the light comes to a focus.
    let behind = city(p - dv.xy, 1.0);
    let foc = exp(-dot(n - vec2f(0.0, 0.42), n - vec2f(0.0, 0.42)) * 4.0);
    dc += behind * (0.35 + 1.3 * foc);
    // Darker at the rim where light turns back inside the water.
    dc *= 1.0 - smoothstep(0.7, 1.0, e) * 0.5;
    // A glint from a light up and to the left, and a faint one below.
    let gl = exp(-dot(n - vec2f(-0.35, -0.45), n - vec2f(-0.35, -0.45)) * 30.0);
    dc += vec3f(1.0, 0.97, 0.92) * gl * 0.85;
    dc += C(1) * 0.25 * exp(-dot(n - vec2f(0.15, 0.6), n - vec2f(0.15, 0.6)) * 18.0);
    let a = 1.0 - smoothstep(dv.z - px * 1.2, dv.z, length(dv.xy));
    col = mix(col, dc, a);
  } else {
    // Bare glass: wet streaks of mist; cleared glass is darker and clearer.
    let lc = lastCleared(p);
    let mistAge = clamp((t - lc) / (6.0 / (0.3 + u.b.x)), 0.0, 1.0);
    let m = vnoise(p * vec2f(260.0, 220.0) + u.a.w) * vnoise(p * vec2f(70.0, 90.0));
    col = mix(col, col * 0.86 + C(1) * 0.05, mistAge * 0.6);
    col += vec3f(0.9, 0.92, 1.0) * smoothstep(0.55, 0.9, m) * mistAge * (0.05 + 0.15 * u.b.x);
    col *= 1.0 - inTrack * 0.12;
  }

  // The wiper blades, while they sweep: black rubber on a thin arm.
  if (u.b.z > 0.0) {
    let D = 1.3;
    let tt = t + u.c.y;
    let tau = tt - floor(tt / u.b.z) * u.b.z;
    if (tau < D) {
      let ang = wiperAngle(tau, D);
      let dir = vec2f(cos(ang), -sin(ang));
      for (var k = 0; k < 2; k++) {
        let pv = pivotOf(k);
        let L = asp * 0.62 * 0.98 + 0.2;
        let v = p - pv;
        let s = clamp(dot(v, dir), 0.0, L);
        let dist = length(v - dir * s);
        let blade = (1.0 - smoothstep(0.009, 0.009 + px * 1.5, dist)) * step(0.22, s / L);
        let arm = 1.0 - smoothstep(0.004, 0.004 + px * 1.5, dist);
        col = mix(col, vec3f(0.015), max(blade, arm));
        col += vec3f(0.5, 0.55, 0.6) * (1.0 - smoothstep(0.0, px * 1.5, abs(dist - 0.008))) * step(0.22, s / L) * 0.18;
      }
    }
  }

  // Dark at the corners, the glass's own faint reflection, a little grain.
  let vg = length((uv - 0.5) * vec2f(1.2, 1.0));
  col *= 1.0 - smoothstep(0.35, 0.85, vg) * 0.55;
  col += C(1) * 0.04 * smoothstep(0.4, 0.0, abs(uv.x - uv.y * 0.6 - 0.25));
  let gr = hash21(floor(uv * vec2f(1400.0, 900.0)) + fract(t * 7.0)) - 0.5;
  col += gr * 0.02;
  // Gentle tone curve so the lights bloom without clipping flat.
  col = col / (1.0 + col * 0.35);
  return vec4f(col, 1.0);
}
`;

const SCENES = {
  //        sky top    haze       six lights
  neon:   ['#06050d', '#2a0f3a', '#ff3fa4', '#31e5ff', '#8a5cff', '#ffd166', '#ff5a3c', '#3dffb0'],
  sodium: ['#040608', '#2e1b08', '#ffb347', '#ff8c1a', '#ff3b2f', '#ffe0a3', '#3cff7a', '#ffd27a'],
  blue:   ['#0a1733', '#34497a', '#ffd28a', '#ff9d5c', '#fff1c9', '#ff4d4d', '#8fd3ff', '#ffe6a8'],
  silver: ['#050506', '#24262b', '#f2f2f2', '#c9ccd2', '#ffffff', '#9aa0a8', '#e6e6e6', '#b8bcc4'],
};
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const IDS = ['rain', 'size', 'wipe', 'chroma', 'traffic'];
const p = {};
function readControls() {
  p.cols = SCENES[$('palette').value].map((h) => [...hex(h), 1]);
  p.rain = +$('rain').value / 100;
  p.size = +$('size').value / 100;
  const w = +$('wipe').value;
  // 0 is off; otherwise a sweep every 14 s down to every 3 s.
  p.wipe = w === 0 ? 0 : 14 - w / 100 * 11;
  p.chroma = +$('chroma').value / 100 * 1.4;
  p.traffic = +$('traffic').value / 100 * 2;
  for (const id of IDS) $(id + 'Val').textContent = $(id).value;
}
readControls();

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(4.5e6) });
let W = 1, H = 1, aspect = 1, t = 0, seed = Math.random() * 100, wipeOff = Math.random() * 10;
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

// The finger's trail: the last NT points, each wiping a patch at its time.
const trail = Array.from({ length: NT }, () => [0, 0, 0, 0]);
let ti = 0, dragging = false, lastPt = null;
function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.height, (e.clientY - r.top) / r.height];
}
function addPt(q) {
  if (lastPt && Math.hypot(q[0] - lastPt[0], q[1] - lastPt[1]) < 0.025) return;
  lastPt = q;
  trail[ti] = [q[0], q[1], t, 0.045];
  ti = (ti + 1) % NT;
}
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastPt = null; addPt(toP(e)); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (dragging) addPt(toP(e)); });
const release = () => { dragging = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

function uniforms() {
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.rain, p.size, p.wipe, p.chroma],
    c: [p.traffic, wipeOff, 0, 0],
    cols: p.cols,
    trail,
  };
}
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

const clk = clock(gpu);
let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
// The rain has been falling a while before we look. (?at=seconds holds time
// at that moment, the wipers' timing with it, for stills and checks.)
const AT = new URLSearchParams(location.search).get('at');
t = AT !== null ? +AT : 30 + Math.random() * 30;
if (AT !== null) { wipeOff = 0; seed = 7; }
function tick(f) {
  if (AT === null) t += Math.min(clk.deltaTime, 0.1);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const id of IDS) $(id).addEventListener('input', () => { readControls(); if (!playing) frame(gpu, render); });
$('palette').addEventListener('change', () => { readControls(); if (!playing) frame(gpu, render); });
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => {
  seed = Math.random() * 100;
  wipeOff = Math.random() * 10;
  if (!playing) frame(gpu, render);
});
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'night-rain-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

togglePlay();
</script>
</body>
</html>
