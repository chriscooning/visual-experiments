<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cove — WebGPU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}

    position:fixed;bottom:20px;right:20px;

  .panel.hidden{transform:translateX(calc(100% + 40px))}

  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Bushes after Chris's canvases: a near-black core with stippled highlights
// that thicken toward the lit edge. lit runs 0 (deep shadow) to 1 (sunlit
// rim); cell sets the stipple size. Two offset layers of jittered dots.
fn stippleBush(p: vec2f, lit: f32, cell: f32, px: f32, dark: vec3f, mid: vec3f, hiA: vec3f, hiB: vec3f, warm: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mix(dark, mid, 0.55), smoothstep(0.35, 0.9, l));
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / cell + vec2f(fl * 0.5, fl * 0.37);
    let id = floor(g);
    let h = hash21(id + seed + fl * 7.1);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.3 + fl), hash21(id + 2.7 + fl)) - 0.5) * 0.55;
    let dens = smoothstep(0.05, 0.85, l + (hash21(id + 5.9) - 0.5) * 0.45);
    if (h < 0.4 + 0.6 * dens) {
      let k = hash21(id + 9.1 + fl);
      var dc = select(select(hiA, hiB, k > 0.55), warm, k > 0.95);
      dc = mix(mix(dark, mid, 0.8), dc, smoothstep(0.15, 0.75, l + (h - 0.5) * 0.3));
      let r = (0.24 + 0.2 * hash21(id + 3.3)) * mix(0.8, 1.0, l);
      c = mix(c, dc, fillA((length(f) - r) * cell, px));
    }
  }
  // Fine grain: small clusters of tiny points scattered over the big dots,
  // light on the lit side, dark flecks breaking up the highlights.
  let fcell = max(cell * 0.38, px * 2.2);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / fcell + vec2f(fl * 0.31, fl * 0.57);
    let id = floor(g);
    let clump = vnoise(p / (cell * 2.3) + seed + fl * 4.0);
    let h = hash21(id + seed * 1.7 + fl * 3.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 4.1 + fl), hash21(id + 6.3 + fl)) - 0.5) * 0.6;
    let r = 0.16 + 0.14 * hash21(id + 8.8);
    let a = fillA((length(f) - r) * fcell, px);
    if (L == 0) {
      let on = step(h, smoothstep(0.1, 0.9, l) * smoothstep(0.3, 0.7, clump) * 0.9);
      let k = hash21(id + 2.2);
      let dc = select(select(hiB, hiA, k > 0.5), warm, k > 0.9);
      c = mix(c, mix(c, dc, 0.9), a * on);
    } else {
      let on = step(h, (0.25 + 0.35 * l) * smoothstep(0.45, 0.8, clump));
      c = mix(c, dark, a * on * 0.85);
    }
  }
  return c;
}
// Painted layers over any surface: three scales of points in drifting
// clusters, each a lighter or darker note of the colour beneath, so flat
// fills read as built up from many small marks. amt 0..1 sets how much.
fn layerTex(p: vec2f, col: vec3f, px: f32, amt: f32, scale: f32, seed: f32) -> vec3f {
  var c = col;
  let lum = dot(col, vec3f(0.3, 0.59, 0.11));
  // Contrast grows with amt: soft tonal flecks at low amounts, crisp marks at full.
  let ct = smoothstep(0.1, 0.9, amt);
  let lightC = mix(col, min(col * 1.2 + vec3f(0.035, 0.03, 0.01), vec3f(1.0)), 0.45 + 0.55 * ct);
  let darkC = mix(col, col * 0.7, 0.3 + 0.7 * ct);
  var sc = array<f32, 3>(1.0, 0.55, 0.3);
  for (var L = 0; L < 3; L++) {
    let fl = f32(L);
    let cell = max(scale * sc[L], px * 2.2);
    let g = p / cell + vec2f(fl * 0.37, fl * 0.61);
    let id = floor(g);
    let h = hash21(id + seed + fl * 5.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.7 + fl), hash21(id + 4.9 + fl)) - 0.5) * 0.6;
    let clump = vnoise(p / (cell * 3.1) + seed * 0.37 + fl * 7.0);
    let r = 0.17 + 0.15 * hash21(id + 8.3);
    let a = fillA((length(f) - r) * cell, px);
    let on = step(h, amt * (0.12 + 0.55 * smoothstep(0.3, 0.8, clump)));
    let k = hash21(id + 2.9 + fl);
    // Dark ground takes more light marks, light ground more dark ones.
    let dc = select(darkC, lightC, k < 0.35 + 0.35 * (1.0 - lum) + (1.0 - ct) * 0.3);
    c = mix(c, dc, a * on * (0.75 - fl * 0.12));
  }
  return c;
}
// Bark: stippled light and shade plus fine strokes along the trunk.
// u runs along the trunk, v across it (-1..1), lit is 0..1.
fn barkTex(u: f32, v: f32, w: f32, lit: f32, px: f32, dark: vec3f, mid: vec3f, hi: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mid, smoothstep(-0.6, 0.4, v * 0.0 + l * 2.0 - 1.0));
  let g = vec2f(u / (w * 0.55), v * 2.2);
  let id = floor(g);
  let f = fract(g) - 0.5;
  let h = hash21(id + seed);
  let stroke = strokeA(f.x * 0.4 + 0.15 * sin(u / w * 3.0 + id.y), 0.08, 0.1);
  c = mix(c, select(dark * 0.85, hi, h > 0.5 - 0.3 * l), stroke * step(0.35, h) * 0.8);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let cs = w * (0.42 - fl * 0.18);
    let g2 = vec2f(u, v * w) / max(cs, px * 2.2) + fl * 0.5;
    let id2 = floor(g2);
    let f2 = fract(g2) - 0.5 - (vec2f(hash21(id2 + 3.1), hash21(id2 + 5.7)) - 0.5) * 0.5;
    let h2 = hash21(id2 + seed + fl * 9.0);
    let dc = select(dark * 0.8, mix(mid, hi, 0.7), h2 < l * 0.8);
    c = mix(c, dc, fillA((length(f2) - 0.22) * max(cs, px * 2.2), px) * step(0.45, hash21(id2 + 7.7)));
  }
  return c;
}
// Drape: an offset that bends a shadow's outline over small bumps in the
// ground, so it reads as lying on uneven land rather than cut from paper.
fn drape(p: vec2f, scale: f32, seed: f32) -> vec2f {
  let q = p / max(scale, 1e-4);
  return (vec2f(vnoise(q + seed), vnoise(q + seed + 7.3)) - 0.5) * scale * 0.5
       + (vec2f(vnoise(q * 2.7 + seed * 1.3), vnoise(q * 2.7 + seed + 3.1)) - 0.5) * scale * 0.18;
}
// Soft coverage from a signed distance, with a penumbra of width w.
fn softA(d: f32, w: f32) -> f32 { return 1.0 - smoothstep(-w * 0.6, w, d); }
// Shadow pooled on the ground under a clump: a flat ellipse pushed away
// from the sun, longer when the sun is low. Returns coverage.
fn groundShadow(p: vec2f, foot: vec2f, r: f32, side: f32, low: f32, px: f32) -> f32 {
  let len = r * (1.1 + 2.2 * low);
  let q = p + drape(p, r * 0.9, foot.x * 17.0);
  let c = foot + vec2f(-side * len * 0.55, r * 0.12);
  let along = clamp((q.x - foot.x) * -side / (len * 1.1), 0.0, 1.0);
  let d = (length((q - c) / vec2f(len, r * 0.34)) - 1.0) * r * 0.34;
  let pen = max(px, r * (0.06 + 0.3 * along));
  // Deepest right at the foot, fading and blurring toward the tip.
  let cq = (p - foot) / vec2f(r * 0.9, r * 0.22);
  return clamp(softA(d, pen) * (1.0 - 0.5 * along) + exp(-dot(cq, cq)) * 0.5, 0.0, 1.0);
}
// A long cast shadow from a thin upright (a trunk or stem): widening and
// blurring away from its foot, and draped over the ground.
fn softShadowSeg(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let ba = b - a;
  let h = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35, a.x * 11.0) * (0.2 + h);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.5 * hq);
  return softA(d, max(px, w * (0.5 + 4.0 * hq))) * (1.0 - 0.55 * hq);
}
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Cove: looking along a Big Sur cliff at a low sun, after Eyvind Earle. The
// cliff face is built from stacked, faceted strata with ledges of ice plant;
// boulders crowd the water's edge, each wrapped in rings of foam; sets of
// swell roll in and break white; a glitter path runs to the sun. Harakeke
// (flax) blades and dune grass sway in the foreground, a lighthouse and
// fence line top the far headland, and a couple of gulls hang in the wind.
// One light, the sun, shades every surface from its own normal and throws
// every shadow the same way; it drifts slowly on its own and can be dragged.
// Lines are laid down in dots.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // swell, foam, glitter, rocks
  c: vec4f,   // wind, _, flow time, grain
  d: vec4f,   // tilt x, y, sun x, sun y
  cols: array<vec4f, 18>,
}
@group(0) @binding(0) var<uniform> u: U;

const HY = -0.12;
const DOT = 0.0011;

@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn post(v: f32, n: f32) -> f32 { return floor(clamp(v, 0.0, 1.0) * n + 0.5) / n; }

// Cliff edge: x of the cliff's right edge at height y, running from the far
// point down toward the bottom-left.
@diagnostic(off, derivative_uniformity) fn cliffEdge(y: f32) -> f32 {
  if (y < HY) { return -0.02 - (HY - y) * 0.4 + 0.01 * sin(y * 60.0 + u.a.w); }
  let s = clamp((y - HY) / (0.5 - HY), 0.0, 1.0);
  let base = mix(-0.02, 0.28, pow(s, 0.8));
  return base + 0.035 * sin(y * 30.0 + u.a.w) * s + 0.05 * (fbm(vec2f(y * 9.0, u.a.w)) - 0.5) * s;
}
// Cliff top profile above the horizon: the far headland.
@diagnostic(off, derivative_uniformity) fn headTop(x: f32) -> f32 { return HY - 0.075 + 0.06 * smoothstep(-0.9, 0.0, x) - 0.035 * smoothstep(-0.2, -0.9, x) + 0.006 * sin(x * 30.0 + u.a.w) + 0.006 * (fbm(vec2f(x * 20.0, u.a.w)) - 0.5); }

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let px = u.a.z; let ft = u.c.z;
  let p0 = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let tilt = u.d.xy;
  let p = vec2f(p0.x / min(asp, 1.0) * 0.62, p0.y);     // keep the scene's width on phones
  let sun = u.d.zw;
  // One light for everything: from the side the sun is on, from behind the
  // headland toward us, higher as the sun climbs.
  setLight(sun, sun.x * 2.6, (HY - sun.y) * 2.2 + 0.12, 1.0, 0.0);
  let wind = u.c.x;
  var col: vec3f;

  if (p.y < HY) {
    let g = clamp((p.y + 0.5) / (HY + 0.5), 0.0, 1.0);
    col = mix(C(0), C(1), post(pow(g, 1.5), 9.0));
    let ds = length(p - sun);
    let hr = haloR(p - sun, t, 5.3);
    let gb = post(exp(-hr * 12.0), 6.0);
    col = mix(col, C(2), gb * (0.35 + 0.65 * gb));
    // Sun: a disc with a few long radiating rays drawn as flat wedges.
    let ang = atan2(p.y - sun.y, p.x - sun.x);
    let rays = step(0.82, fract(ang / 6.2831 * 18.0 + t * 0.005)) * exp(-ds * 4.0) * 0.35;
    col = mix(col, C(2), rays);
    col = mix(col, C(2), fillA(ds - 0.04, px));
    col = mix(col, C(2), dotRing(hr - 0.055, p - sun, 0.055, DOT, px, 2.0) * 0.5);
    // Thin streaks of marine cloud, dabbed on, lit toward the sun.
    col = streakClouds(col, p, sun, 1.0 - smoothstep(0.05, 0.3, HY - sun.y), ft * 0.8, px, -0.47, HY - 0.07, 0.62, 4, 0.55, mix(C(5), C(2), 0.3), mix(C(1), C(3), 0.45), C(2), u.a.w);
    // A contrail across the sky.
    let ctA = vec2f(-0.6, -0.36); let ctB = vec2f(-0.2, -0.22);
    let ctv = normalize(ctB - ctA);
    let ct = dot(p - ctA, vec2f(-ctv.y, ctv.x));
    let cta = dot(p - ctA, ctv);
    col = mix(col, C(2), dotLine(ct, cta, DOT * 0.9, px, 5.0) * step(0.0, cta) * step(cta, length(ctB - ctA)) * 0.4);
    // Gulls.
    for (var k = 0; k < 3; k++) {
      let fk = f32(k);
      let gp = vec2f(0.12 + fk * 0.08 + 0.03 * sin(t * 0.2 + fk * 2.0), -0.32 + fk * 0.03 + 0.01 * sin(t * 0.5 + fk));
      let flap = sin(t * 3.0 + fk * 2.0) * 0.004;
      let q = p - gp;
      let gull = min(sdSeg(q, vec2f(0.0), vec2f(-0.012, -0.004 - flap)), sdSeg(q, vec2f(0.0), vec2f(0.012, -0.004 - flap)));
      col = mix(col, C(12), strokeA(gull, px * 0.8, px) * 0.9);
    }
  } else {
    // Sea: flat bands deepening toward the viewer.
    let yS = p.y - HY;
    col = mix(C(3), C(4), post(smoothstep(0.0, 0.5, yS), 6.0));
    // Swell lines: long crests marching toward the rocks.
    let sw = yS * 26.0 - ft * 0.35 + 0.6 * sin(p.x * 5.0 + yS * 8.0);
    let crest = smoothstep(0.86, 0.96, fract(sw)) * u.b.x * smoothstep(0.02, 0.2, yS);
    col = mix(col, C(5), crest * 0.7);
    // Glitter path.
    let w = 0.015 + yS * 0.35;
    let inPath = exp(-pow((p.x - sun.x) / w, 2.0)) * step(sun.y, HY);
    col = mix(col, mix(col, C(2), 0.35), inPath * 0.5);
    let row = floor(log(yS + 0.002) * 60.0);
    let cc = (p.x - sun.x) / (0.003 + yS * 0.03);
    let gl = step(1.0 - u.b.z * (0.05 + 0.85 * inPath), hash21(vec2f(floor(cc), row) + floor(t * 3.0 + hash1(floor(cc)) * 2.0)));
    col = mix(col, C(2), gl * step(abs(fract(cc) - 0.5), 0.3));
    // A small boat near the horizon.
    let bq = p - vec2f(sun.x + 0.1, HY + 0.012);
    col = mix(col, C(12), fillA(sdBox(bq, vec2f(0.006, 0.0015)), px));
  }

  col = mix(col, C(2), dotLine(p.y - HY, p.x, DOT * 0.8, px, 3.0) * 0.6);
  // Rocks at the waterline, each ringed with foam that pulses with the swell.
  let nr = i32(u.b.w);
  for (var k = 0; k < 14; k++) {
    if (k >= nr) { break; }
    let fk = f32(k);
    let ry = HY + 0.03 + pow(fk / 14.0, 1.3) * 0.46;
    let rx = cliffEdge(ry) + 0.01 + (0.02 + 0.2 * (ry - HY)) * pow(hash1(fk * 3.1 + u.a.w), 1.5) * 3.0;
    let rs = (0.006 + (ry - HY) * 0.1) * (0.4 + 1.1 * hash1(fk + u.a.w));
    let q = p - vec2f(rx, ry);
    // Foam rings.
    let surge = 0.5 + 0.5 * sin(ft * 0.35 * 6.2831 / 1.0 + ry * 26.0 * 6.2831 * 0.0 - fk);
    if (length(q) > rs * 5.0 + 0.02) { continue; }
    for (var j = 0; j < 3; j++) {
      let rr = rs * (1.3 + 0.35 * f32(j) + 0.25 * surge);
      let ring = ellD(q, vec2f(rr, rr * 0.45));
      col = mix(col, C(5), dotLine(ring, q.x, DOT * (1.0 - 0.2 * f32(j)), px, fk * 7.0 + f32(j)) * step(-rs * 0.2, q.y) * u.b.y * (1.0 - 0.3 * f32(j)));
    }
    col = mix(col, col * 0.78, blobShadow(p, vec2f(rx, ry - rs * 0.3), rs * 0.9, ry + rs * 0.3, px) * 0.6);
    // Faceted rock: two tones split by a ridge, algae at the waterline.
    let rd = (length(q / vec2f(1.0, 0.72)) - rs) * 0.8 + rs * 0.25 * (fbm(q / rs * 1.2 + fk) - 0.5);
    // A rounded boulder: normal from its outline, lit from the sun's side
    // in three flat steps, darker and weedy toward the waterline.
    let rl = clamp(lambert(roundN(q, vec2f(rs, rs * 0.72)), 0.45) * 1.25, 0.0, 1.0);
    var rc = mix(C(10), C(9), post(rl, 3.0));
    rc = stippleBush(q, rl * 0.8, max(rs * 0.12, px * 2.2), px, C(10), mix(C(10), C(9), 0.5), C(9), mix(C(9), C(6), 0.35), C(8), fk * 3.0) * 0.35 + rc * 0.65;
    rc = mix(rc, C(11), smoothstep(-rs * 0.05, rs * 0.45, q.y) * 0.75);
    col = mix(col, rc, fillA(rd, px));
    col = mix(col, C(12), dotRing(rd, q, rs, DOT * 0.8, px, fk * 3.0 + 1.0) * 0.5);
  }

  // Cliff: a sandstone wall carved into buttresses and gullies, banded with
  // strata that jut out as ledges. Every surface is lit from one sun
  // direction by its own 3D normal, in a few flat steps, Earle-style.
  let ce = cliffEdge(p.y);
  let top = headTop(p.x);
  if (p.x < ce + px * 2.0 + DOT * 2.0 && p.y > top - px * 2.0 - DOT * 2.0) {
    let dEdge = ce - p.x;
    // Buttresses: a ridged field across the face; its slope turns each
    // column's sides toward or away from the light.
    // Rounded columns: a sine ridge warped by noise, so each buttress has a
    // lit flank, a crest, and a flank turned away into shade.
    let bx = p.x * 11.0 + 1.4 * fbm(vec2f(p.y * 2.2, u.a.w)) + 1.2 * (p.y - HY);
    let bw = sin(bx * 3.14159) * 0.6 + 0.4 * (fbm(vec2f(bx * 1.3, p.y * 1.5 + u.a.w * 2.0)) - 0.5) * 2.0;
    let bSlope = cos(bx * 3.14159) * 1.9 + (fbm(vec2f(bx * 1.3 + 0.05, p.y * 1.5 + u.a.w * 2.0)) - fbm(vec2f(bx * 1.3, p.y * 1.5 + u.a.w * 2.0))) / 0.05 * 0.8;
    let gully = smoothstep(-0.35, -0.75, bw);
    // Strata: bands dipping gently toward the sea. Each band's top edge
    // juts out as a lit ledge with a shadowed undercut beneath.
    let strat = (p.y - p.x * 0.18) * 22.0 + 0.9 * fbm(vec2f(p.x * 4.0, p.y * 3.0 + u.a.w));
    let sid = floor(strat);
    let sf = fract(strat);
    let ledgeTop = smoothstep(0.0, 0.12, sf) * smoothstep(0.3, 0.12, sf);
    let undercut = smoothstep(0.7, 1.0, sf);
    // The face turns toward the sea near its edge.
    let turn = smoothstep(0.12, 0.0, dEdge);
    let nrm = normalize(vec3f(clamp(bSlope * 0.75, -1.6, 1.6) + turn * 1.1, 0.15 + ledgeTop * 1.2 - undercut * 0.6, 1.0));
    var lit = clamp(lambert(nrm, 0.55) * 1.35 + 0.06, 0.0, 1.0);
    lit *= 1.0 - gully * 0.55;
    // Base rock colour varies band by band.
    let bh = hash1(sid * 1.37 + u.a.w);
    var base = mix(C(6), C(8), step(0.55, bh) * 0.7);
    base = mix(base, mix(C(6), vec3f(0.95, 0.85, 0.7), 0.35), step(0.85, bh) * 0.6);
    var cc = mix(C(7), base, post(lit, 4.0));
    cc = mix(cc, mix(base, vec3f(1.0, 0.95, 0.85), 0.35), post(ledgeTop * lit, 2.0) * 0.6);
    // Fine bedding lines and a few joints, drawn thin.
    cc = mix(cc, C(7) * 0.9, dotLine((fract(strat + 0.5) - 0.5) / 22.0, p.x, DOT * 0.7, px, floor(strat + 0.5)) * 0.5);
    let jn = p.x * 26.0 + hash1(sid) * 7.0 + 0.5 * fbm(vec2f(p.y * 20.0, sid));
    cc = mix(cc, C(7), dotLine((fract(jn + 0.5) - 0.5) / 26.0, p.y, DOT * 0.6, px, floor(jn + 0.5) + sid * 3.0) * step(0.72, hash21(vec2f(floor(jn + 0.5), sid))) * 0.45);
    // Stippled rock texture: darker in shade, sandy in light.
    cc = stippleBush(p, lit, 0.0034, px, C(7), mix(C(7), base, 0.6), base, mix(base, vec3f(1.0, 0.94, 0.82), 0.3), C(8), sid) * 0.4 + cc * 0.6;
    // Plants: clumps on some ledges and down the gullies, dark cored.
    // Clumps perched on the ledges and tumbling down the gullies: rounded
    // mounds sitting on each band's lip, dark underneath.
    {
      let cw = 0.028;
      let ci = floor(p.x / cw);
      var pd = 1e3; var pv = vec2f(0.0); var pr = 1.0;
      for (var o = -1; o <= 1; o++) {
        for (var b2 = 0; b2 <= 1; b2++) {
          let bi = sid + f32(b2);
          let id = vec2f(ci + f32(o), bi);
          let h = hash21(id + 3.0);
          let cx = (ci + f32(o) + 0.5 + (hash21(id + 1.0) - 0.5) * 0.5) * cw;
          let inG = smoothstep(-0.35, -0.75, sin((cx * 11.0 + 1.2 * (p.y - HY)) * 3.14159) * 0.6);
          if (h < 0.78 - inG * 0.45) { continue; }
          let cy = (bi / 22.0) + cx * 0.18 + 0.004;
          let r = 0.007 + 0.007 * h;
          let v = p - vec2f(cx, cy);
          let d = max(length(v / vec2f(1.35, 1.0)) - r * (1.0 + 0.15 * sin(atan2(v.y, v.x) * 6.0 + h * 9.0)), v.y - r * 0.35);
          if (d < pd) { pd = d; pv = v; pr = r; }
        }
      }
      if (pd < px * 2.0) {
        let plit = smoothstep(0.0, 0.6, lambert(roundN(pv, vec2f(pr * 1.35, pr)), 0.4)) * (1.0 - smoothstep(0.0, pr * 0.35, pv.y) * 0.6);
        let pl = stippleBush(p, 0.05 + 0.95 * plit, 0.0024, px, mix(C(17), C(12), 0.45), C(17), C(14), C(13), C(8), sid * 2.0);
        cc = mix(cc, mix(C(7), C(12), 0.4), blobShadow(p, p - pv, pr, p.y - pv.y + pr * 0.35, px) * 0.55);
        cc = mix(cc, pl, fillA(pd, px));
        cc = mix(cc, C(12), dotRing(pd, pv, pr * 1.1, DOT * 0.7, px, sid + pr * 99.0) * 0.5);
      }
    }
    // Cast shadow from the ledge above falling on the band below: deeper
    // when the light is high and strong.
    cc = mix(cc, cc * 0.72, undercut * (1.0 - gully) * (0.4 + 0.5 * LD.y) * LI);
    // Grassy crown, and damp dark rock near the waterline.
    cc = mix(cc, mix(C(13), C(14), 0.4), smoothstep(0.025, 0.0, p.y - top));
    cc = mix(cc, mix(C(7), C(12), 0.4), smoothstep(0.36, 0.48, p.y) * 0.5);
    let a = fillA(p.x - ce, px) * fillA(top - p.y, px);
    col = mix(col, cc, a);
    col = mix(col, C(12), dotLine(p.y - top, p.x, DOT * 0.8, px, 4.0) * step(p.x, ce) * 0.5);
    col = mix(col, C(12), dotLine(p.x - ce, p.y, DOT * 0.9, px, 6.0) * step(top, p.y) * 0.5);
    col = mix(col, C(5), dotLine(p.x - ce - 0.004, p.y - ft * 0.004, DOT * 1.1, px, 8.0) * step(HY + 0.01, p.y) * u.b.y * 0.8 * step(0.5, fbm(vec2f(p.y * 60.0 - ft * 0.3, 1.0))));
  }

  // Coastal scrub along the cliff crown: stippled clumps with dark cores.
  {
    let cw = 0.03;
    let ci = floor(p.x / cw);
    for (var o = -1; o <= 1; o++) {
      let id = ci + f32(o);
      let h = hash1(id * 1.9 + u.a.w);
      if (h < 0.35) { continue; }
      let cx = (id + 0.5 + (hash1(id * 4.1) - 0.5) * 0.4) * cw;
      if (cx > cliffEdge(headTop(cx)) - 0.02 || abs(cx + 0.1) < 0.02) { continue; }
      let r = 0.008 + 0.007 * h;
      let cy = headTop(cx) + r * 0.25;
      let v = p - vec2f(cx, cy);
      let sd = max(length(v / vec2f(1.35, 1.0)) - r * (1.0 + 0.14 * sin(atan2(v.y, v.x) * 7.0 + h * 9.0)), v.y - r * 0.3);
      let blit = smoothstep(0.0, 0.6, lambert(roundN(v, vec2f(r * 1.35, r)), 0.4)) * (1.0 - smoothstep(0.0, r * 0.3, v.y) * 0.6);
      let bc = stippleBush(p, 0.05 + 0.95 * blit, 0.0024, px, mix(C(17), C(12), 0.4), C(17), C(13), C(14), C(8), h * 17.0);
      col = mix(col, bc, fillA(sd, px));
      col = mix(col, C(12), dotRing(sd, v, r * 1.1, DOT * 0.7, px, h * 23.0) * 0.4);
    }
  }
  // Lighthouse near the point, fence posts along the cliff top.
  {
    let lx = -0.1;
    let ly = headTop(lx);
    let lq = p - vec2f(lx, ly);
    let tower = sdBox(lq - vec2f(0.0, -0.02), vec2f(0.004 + lq.y * 0.03, 0.02));
    let tl = lambert(roundN(vec2f(lq.x, 0.0), vec2f(0.004 + max(-lq.y, 0.0) * 0.03, 1.0)), 0.45);
    col = mix(col, C(5) * mix(0.62, 1.02, tl), fillA(tower, px));
    col = mix(col, C(12), fillA(sdBox(lq - vec2f(0.0, -0.043), vec2f(0.006, 0.003)), px));
    col = mix(col, C(12), fillA(sdBox(lq - vec2f(0.0, -0.012), vec2f(0.0045, 0.0015)), px));
    let beam = 0.5 + 0.5 * sin(t * 1.5);
    col = mix(col, C(2), fillA(length(lq - vec2f(0.0, -0.037)) - 0.003, px));
    col = mix(col, C(2), fillA(sdTri(lq - vec2f(0.0, -0.037), vec2f(0.0), vec2f(0.12, -0.012 - 0.01 * beam), vec2f(0.12, 0.012 + 0.01 * beam)), px) * 0.18 * beam);
    let fx = fract(p.x / 0.02);
    let fh = headTop(p.x);
    let fence = step(abs(fx - 0.5), 0.07) * step(fh - 0.009, p.y) * step(p.y, fh) * step(p.x, -0.16);
    col = mix(col, C(12), fence * 0.85);
    col = mix(col, C(12), dotLine(p.y - (fh - 0.006), p.x, DOT * 0.6, px, 12.0) * step(p.x, -0.16) * 0.7);
  }

  // Foreground: dune grass and flax, swaying.
  let fg = 0.34 + 0.03 * sin(p0.x * 4.0 + u.a.w) + tilt.y * 0.01;
  if (p0.y > fg - 0.12) {
    // Grass tussock band.
    let gd = p0.y - fg;
    if (gd > 0.0) {
      var gc = mix(C(15), C(16), post(smoothstep(0.0, 0.18, gd), 3.0));
      let bx = p0.x / 0.006;
      let bid = floor(bx);
      let hsh = hash1(bid + u.a.w);
      let bend = sin(t * 1.4 + bid * 0.3) * 0.3 * wind;
      let up = clamp(1.0 - gd / (0.05 + 0.05 * hsh), 0.0, 1.0);
      let blade = abs(fract(bx) - 0.5 - bend * up) - 0.2 * (1.0 - up * 0.7);
      gc = mix(gc, select(C(16), C(15), hsh > 0.5), fillA(blade * 0.006, px) * 0.8);
      col = mix(col, gc, fillA(-gd, px));
    }
    // Tussock tips above the band.
    let bx2 = p0.x / 0.005;
    let bid2 = floor(bx2);
    let hh = hash1(bid2 * 1.3 + u.a.w);
    let len = (0.02 + 0.04 * hh) * step(0.35, hh);
    let bend2 = sin(t * 1.4 + bid2 * 0.3) * 0.5 * wind + (hh - 0.5) * 0.8;
    let up2 = clamp((fg - p0.y) / len, 0.0, 1.0);
    let tip = abs(fract(bx2) - 0.5 - bend2 * up2 * up2) - 0.25 * (1.0 - up2);
    col = mix(col, select(C(16), C(15), hh > 0.4), fillA(tip * 0.005, px) * step(p0.y, fg) * step(fg - len, p0.y));
  }
  // Flax: long sword leaves fanning from clumps, with a flower stalk.
  for (var k = 0; k < 2; k++) {
    let fk = f32(k);
    let base = vec2f(select(-0.36, 0.32, k == 1) * min(asp, 1.2) * 0.9 + tilt.x * 0.02, 0.5);
    for (var j = 0; j < 7; j++) {
      let fj = f32(j);
      let ang = -1.57 + (fj - 3.0) * 0.16 + sin(t * 1.1 + fj + fk * 3.0) * 0.04 * wind;
      let L = 0.18 + 0.08 * hash1(fj + fk * 7.0);
      let tipP = base + vec2f(cos(ang), sin(ang)) * L + vec2f((fj - 3.0) * 0.012 * wind * sin(t * 0.9 + fj), 0.0);
      let q = p0 - base;
      let dirV = tipP - base;
      let h = clamp(dot(q, dirV) / dot(dirV, dirV), 0.0, 1.0);
      let wdt = 0.012 * (1.0 - h) + 0.0015;
      let d = length(q - dirV * h) - wdt;
      var lc = select(C(17), C(16), (j + k) % 2 == 0);
      let ll = lambert(roundN(q - dirV * h, vec2f(wdt)), 0.4);
      lc = mix(lc * 0.65, mix(lc, C(15), 0.35), post(ll * 1.2, 3.0));
      // Midrib.
      let rib = q - dirV * h;
      lc = mix(lc, C(15), dotLine(dot(rib, normalize(vec2f(-dirV.y, dirV.x))), h * length(dirV), DOT * 0.55, px, fj + fk * 7.0) * 0.6);
      col = mix(col, lc, fillA(d, px));
    }
    // Flower stalk with dark seed pods.
    let sb = base + vec2f(0.03 * (1.0 - 2.0 * fk), 0.0);
    let st = sb + vec2f(0.03 * sin(t * 0.8 + fk) * wind, -0.34);
    let sq = p0 - sb;
    let stt = tube(p0, sb, st, 0.0022);
    col = mix(col, mix(C(12), C(16), lambert(roundN(stt.yz, vec2f(0.0022)), 0.4) * 0.7), fillA(stt.x, px));
    for (var j = 0; j < 6; j++) {
      let fj = f32(j);
      let hp = mix(sb, st, 0.45 + fj * 0.1);
      let side = select(-1.0, 1.0, j % 2 == 0);
      let pod = rot2(p0 - hp - vec2f(side * 0.012, 0.0), side * 0.6);
      col = mix(col, C(12), fillA(sdBox(pod, vec2f(0.009, 0.0035)) - 0.001, px));
    }
  }
  let land = smoothstep(HY - 0.1, HY + 0.02, p0.y);
  col = layerTex(p0, col, px, mix(0.12, 0.9, land), mix(0.006, 0.013, clamp((p0.y + 0.05) * 1.6, 0.0, 1.0)), 15.0);
  return vec4f(paperize(col, pos.xy, u.c.w), 1.0);
}

// ---- One light for the whole painting ----
// The sun by day or the moon by night, far off in the sky. setLight() fixes
// it once per pixel; after that every surface is shaded from its own 3D
// normal and every shadow is thrown the same way, so light slides over the
// whole scene together as the source moves. Axes: x right, y up, z toward
// the viewer (screen y runs down). A source ahead in the sky lights from
// behind, so crests and rims catch it and faces turned to us go into shade.
var<private> LD: vec3f;     // unit vector toward the light
var<private> LI: f32;       // strength: 1 full sun, about 0.5 moon, 0 in twilight
var<private> LMOON: f32;    // 0 sunlight .. 1 moonlight
var<private> LSRC: vec2f;   // where the source sits on screen

// bearing: heading of the source in radians, 0 dead ahead, + to the right;
// height: its angle above the horizon.
@diagnostic(off, derivative_uniformity) fn setLight(src: vec2f, bearing: f32, height: f32, strength: f32, moon: f32) {
  let az = clamp(bearing, -1.35, 1.35);
  let el = clamp(height, 0.2, 1.25);
  LD = normalize(vec3f(sin(az) * cos(el), sin(el), -cos(az) * cos(el) * 0.8));
  LI = strength; LMOON = moon; LSRC = src;
}
// Or give the direction straight, for a piece that sets its own.
@diagnostic(off, derivative_uniformity) fn setLightDir(src: vec2f, dir: vec3f, strength: f32, moon: f32) {
  LD = normalize(dir); LI = strength; LMOON = moon; LSRC = src;
}
// Wrapped Lambert: the share of light a surface with unit normal n gets,
// easing round the terminator, scaled by the light's strength.
@diagnostic(off, derivative_uniformity) fn lambert(n: vec3f, wrap: f32) -> f32 { return clamp((dot(n, LD) + wrap) / (1.0 + wrap), 0.0, 1.0) * LI; }
// Ground: s is the slope of the surface line on screen (dy/dx, y down), so
// land falling away to the right (s > 0) turns right; face tips it toward
// the viewer (0 level .. 1 a bank facing us).
@diagnostic(off, derivative_uniformity) fn groundN(s: f32, face: f32) -> vec3f { return normalize(vec3f(s, 1.0, face)); }
// Round forms and tubes: v is the offset from the centre (or from the axis
// of a trunk or stem) on screen, r the radius on each axis.
@diagnostic(off, derivative_uniformity) fn roundN(v: vec2f, r: vec2f) -> vec3f {
  let q = v / r;
  let z = sqrt(max(1.0 - dot(q, q), 0.0));
  return normalize(vec3f(q.x, -q.y, z + 0.2));
}
// Ground from a height field: hx, hy are its slopes across and toward the
// viewer (screen units), k how strongly they tip the surface.
@diagnostic(off, derivative_uniformity) fn heightN(hx: f32, hy: f32, k: f32) -> vec3f { return normalize(vec3f(-hx * k, 1.0, -hy * k)); }
// Moonlit faces take a cool silver cast.
@diagnostic(off, derivative_uniformity) fn moonCast(col: vec3f, lit: f32) -> vec3f {
  return mix(col, col * vec3f(0.85, 1.0, 1.3) + vec3f(0.05, 0.075, 0.13), clamp(LMOON * lit * 1.7, 0.0, 1.0));
}

// ---- Shadows. FORE squashes ground depth onto the screen.
const FORE = 0.45;
// Where a shadow lands on level ground per unit of height (x across, y
// toward the viewer): long when the light is low, capped to stay in frame.
@diagnostic(off, derivative_uniformity) fn castG() -> vec2f {
  let c = vec2f(-LD.x, -LD.z) / max(LD.y, 0.05);
  return c * min(1.0, 3.2 / max(length(c), 1e-4));
}
// Screen offset of the shadow of a point h above the ground.
@diagnostic(off, derivative_uniformity) fn castS(h: f32) -> vec2f { let c = castG(); return vec2f(c.x, c.y * FORE) * h; }
// Where the shadow of screen point q falls, with level ground at gy below it.
@diagnostic(off, derivative_uniformity) fn shadowAt(q: vec2f, gy: f32) -> vec2f { return vec2f(q.x, gy) + castS(max(gy - q.y, 0.0)); }
// A point on raised ground (z above the reference level, on screen) catches
// the shadow that would fall further from its caster on level ground; look
// the shadow up there and it bends over terraces, mounds and domes.
@diagnostic(off, derivative_uniformity) fn liftS(p: vec2f, z: f32) -> vec2f { return p + vec2f(0.0, z) + castS(z); }
// Shadow of a round mass (bush, canopy, boulder) of radius r centred at c,
// ground at gy beneath it: an ellipse thrown along the light, paler and
// softer toward its tip, plus the dark pool of contact where it sits on the
// ground. q is the lookup point already draped over the ground's small
// bumps (groundQ), p the pixel itself. Coverage 0..1.
@diagnostic(off, derivative_uniformity) fn groundQ(p: vec2f, scale: f32) -> vec2f { return p + drape(p, scale, 3.7); }
@diagnostic(off, derivative_uniformity) fn blobShadowQ(q: vec2f, p: vec2f, c: vec2f, r: f32, gy: f32, px: f32) -> f32 {
  let h = max(gy - c.y, 0.0);
  let cg = castG();
  let L = length(cg);
  let dir = select(vec2f(0.0, 1.0), cg / max(L, 1e-4), L > 1e-3);
  let g = vec2f(q.x - c.x, (q.y - gy) / FORE) - cg * h;
  let a = vec2f(dot(g, dir), dot(g, vec2f(-dir.y, dir.x)));
  let st = sqrt(1.0 + L * L);
  let d = (length(a / vec2f(r * st, r)) - 1.0) * r;
  let tipF = clamp(a.x / (r * st), -1.0, 1.0) * 0.5 + 0.5;
  let pen = max(px, r * (0.1 + 0.04 * L * h / r + 0.25 * tipF));
  let thrown = softA(d, pen) * (1.0 - 0.4 * tipF) * LI;
  let cq = vec2f(p.x - c.x, p.y - gy) / vec2f(r, r * 0.3);
  let contact = exp(-dot(cq, cq)) * (1.0 - smoothstep(r * 1.2, r * 3.0, h)) * (0.45 + 0.35 * LI);
  return clamp(max(thrown, contact), 0.0, 1.0);
}
@diagnostic(off, derivative_uniformity) fn blobShadow(p: vec2f, c: vec2f, r: f32, gy: f32, px: f32) -> f32 {
  return blobShadowQ(p + drape(p, r * 0.9, c.x * 17.0 + gy * 5.0), p, c, r, gy, px);
}
// The point up in a canopy whose shadow lands on ground point q, where the
// canopy stands on ground at gy: test that point against the canopy's shape
// to throw a whole grove's shadow along the light.
@diagnostic(off, derivative_uniformity) fn canopyAt(q: vec2f, gy: f32) -> vec2f {
  let cg = castG();
  let hh = max((q.y - gy) / max(cg.y * FORE, 0.03), 0.0);
  return vec2f(q.x - cg.x * hh, gy - hh);
}
// Shadow of an upright from its foot a (on the ground) to its top b: a
// strip thrown along the light, widening and blurring toward its tip.
@diagnostic(off, derivative_uniformity) fn stemShadow(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let e = shadowAt(b, a.y);
  let ba = e - a + vec2f(1e-5, 1e-5);
  let h0 = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35 + w, a.x * 11.0) * (0.2 + h0);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.2 * hq);
  return softA(d, max(px, w * (0.5 + 3.0 * hq))) * (1.0 - 0.5 * hq) * LI;
}

// Lay colour c at coverage a over a premultiplied layer (rgb * alpha, alpha),
// so a figure built from fills and dotted outlines composites cleanly.
@diagnostic(off, derivative_uniformity) fn over(acc: vec4f, c: vec3f, a: f32) -> vec4f { return vec4f(acc.rgb * (1.0 - a) + c * a, acc.a * (1.0 - a) + a); }
@diagnostic(off, derivative_uniformity) fn unpremul(acc: vec4f) -> vec4f { return vec4f(acc.rgb / max(acc.a, 1e-4), acc.a); }
// Signed distance to an ellipse of radii r (a close approximation).
@diagnostic(off, derivative_uniformity) fn ellD(v: vec2f, r: vec2f) -> f32 {
  let k0 = length(v / r);
  let k1 = length(v / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-6);
}
// Offset from segment a-b to q, and the distance to a tube of radius r
// round it: (distance, offset x, offset y).
@diagnostic(off, derivative_uniformity) fn tube(q: vec2f, a: vec2f, b: vec2f, r: f32) -> vec3f {
  let ba = b - a;
  let h = clamp(dot(q - a, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  let off = q - a - ba * h;
  return vec3f(length(off) - r, off);
}

// ---- Lines as the paintings make them: chains of small dots.
// d: signed distance across the line; g: position along it in dot spacings;
// sp: that spacing; w: dot radius; per: dots round a closed loop (0 if open).
// Dots sit a little over a diameter apart with slight scatter; in some
// stretches they swell and double up so the line gains punch, and now and
// then one strays just off it.
@diagnostic(off, derivative_uniformity) fn dotChain(d: f32, g: f32, sp: f32, w: f32, px: f32, seed: f32, per: f32) -> f32 {
  if (abs(d) > w * 5.0 + px * 2.0) { return 0.0; }
  let heavy = smoothstep(0.5, 0.8, vnoise(vec2f(g * 0.11 + seed * 3.7, seed * 1.3)));
  let i0 = floor(g);
  var a = 0.0;
  for (var j = -1; j <= 1; j++) {
    let fid = i0 + f32(j);
    var id = fid;
    if (per > 0.0) { id = fid - per * floor(fid / per); }
    let h1 = hash1(id * 1.731 + seed);
    let h2 = hash1(id * 2.917 + seed * 1.37 + 5.1);
    let r = w * (0.72 + 0.36 * h2 + 0.45 * heavy);
    let off = (h1 - 0.5) * w * (0.45 + 1.1 * heavy);
    let c = vec2f((fid + 0.5 + (h2 - 0.5) * 0.3 - g) * sp, off - d);
    a = max(a, fillA(length(c) - r, px));
    // The heavier stretches take a second dot beside the first.
    if (heavy > 0.2 && h1 > 0.3) {
      let c2 = vec2f((fid + (h1 - 0.5) * 0.5 - g) * sp, -off * 0.6 + select(-1.0, 1.0, h2 > 0.5) * w * 1.35 - d);
      a = max(a, fillA(length(c2) - r * 0.78, px) * smoothstep(0.2, 0.55, heavy));
    }
    if (hash1(id * 4.13 + seed) > 0.92) {
      let c3 = vec2f((fid + h2 - g) * sp, (h1 - 0.5) * w * 7.0 - d);
      a = max(a, fillA(length(c3) - w * 0.55, px));
    }
  }
  return a;
}
// An open line: d across it, s the distance along it.
@diagnostic(off, derivative_uniformity) fn dotLine(d: f32, s: f32, w0: f32, px: f32, seed: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let sp = w * 2.3;
  return dotChain(d, s / sp, sp, w, px, seed, 0.0);
}
// A closed outline round a centre: v is the offset from it, R its mean radius.
@diagnostic(off, derivative_uniformity) fn dotRing(d: f32, v: vec2f, R: f32, w0: f32, px: f32, seed: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let N = max(round(6.2832 * R / (w * 2.3)), 5.0);
  let g = (atan2(v.y, v.x) / 6.2832 + 0.5) * N;
  return dotChain(d, g, 6.2832 * R / N, w, px, seed, N);
}

// ---- Halos: stepped bands whose edges wander, differ band to band and
// drift, so the rings round a sun or moon breathe instead of sitting round.
@diagnostic(off, derivative_uniformity) fn haloR(v: vec2f, t: f32, seed: f32) -> f32 {
  let r = length(v);
  let dir = v / max(r, 1e-4);
  let n1 = vnoise(dir * 1.4 + vec2f(r * 7.0 + t * 0.05, seed));
  let n2 = vnoise(dir * 2.9 + vec2f(seed * 1.7 - t * 0.07, r * 15.0));
  return r * (1.0 + 0.3 * (n1 - 0.5) + 0.12 * (n2 - 0.5));
}

// ---- Painted clouds, three ways. Each composites over base and returns
// the new colour. sun: the light's place on screen; low: 1 when it's near
// the horizon; y0..y1 the band the clouds sit in; amt 0..1 how much cloud.
// Stipple: small dots of a lighter or darker note, clustered.
@diagnostic(off, derivative_uniformity) fn cloudDots(p: vec2f, cell: f32, px: f32, dens: f32, seed: f32) -> f32 {
  let g = p / cell;
  let id = floor(g);
  let f = fract(g) - 0.5 - (vec2f(hash21(id + seed), hash21(id + seed + 3.1)) - 0.5) * 0.6;
  let on = step(hash21(id + seed + 7.7), dens);
  return fillA((length(f) - 0.2 - 0.12 * hash21(id + 1.3)) * cell, px) * on;
}
// Dabbed streaks: long horizontal brush dabs laid in two to four rows,
// each shorter than the one below so the cloud domes; tapered ends, three
// flat tones lit toward the light and along each dab's top edge, warm
// undersides when it is low, and flecks of stipple through each dab.
// xr: half the visible width, so every cloud drifts through the frame.
@diagnostic(off, derivative_uniformity) fn streakClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.0032, px * 2.4);
  for (var k = 0; k < 10; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.25 + 0.5 * hash1(fk * 7.13 + seed)) / f32(n));
    let L = (0.16 + 0.22 * hash1(fk + seed * 1.7)) * (0.6 + 0.5 * amt);
    let span = 2.0 * (xr + L);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.004 * (1.0 + fk * 0.25) / span) * span - (xr + L);
    let rows = 2.0 + floor(hash1(fk * 2.3 + seed) * 2.99);
    let rowH = (0.01 + 0.008 * hash1(fk * 5.0 + seed)) * (0.7 + 0.5 * amt);
    if (abs(p.x - cx) > L * 1.2 || p.y > cy + rowH || p.y < cy - rowH * (rows + 1.0)) { continue; }
    let rf = (cy - p.y) / (rowH * 0.85) - 0.5;
    let r0 = floor(rf);
    for (var j = 0; j <= 1; j++) {
      let row = r0 + f32(j);
      if (row < 0.0 || row >= rows) { continue; }
      let rowW = L * sqrt(max(1.0 - pow((row + 0.3) / rows, 2.0), 0.0)) * (0.8 + 0.35 * hash1(row + fk * 9.0 + seed));
      let rowX = cx + (hash1(row * 4.7 + fk + seed) - 0.5) * L * 0.3;
      let dl = L * (0.3 + 0.15 * hash1(row * 3.0 + fk + seed));
      let sh = hash1(row * 1.9 + fk * 2.3 + seed) * dl;
      let gi = floor((p.x - rowX + sh) / dl);
      for (var m = -1; m <= 1; m++) {
        let di = gi + f32(m);
        let h = hash21(vec2f(di, row + fk * 17.0) + seed);
        let dcx = rowX - sh + (di + 0.5 + (h - 0.5) * 0.3) * dl;
        if (abs(dcx - rowX) > rowW) { continue; }
        let hl = dl * (0.85 + 0.5 * h) * (1.0 - 0.3 * row / rows);
        let hh = rowH * (0.55 + 0.3 * hash1(di * 1.3 + row + fk));
        let dcy = cy - (row + 0.5) * rowH * 0.85 + (hash1(di * 2.1 + row * 5.0 + fk) - 0.5) * rowH * 0.3;
        let q = vec2f(p.x - dcx, p.y - dcy);
        let tx = clamp(abs(q.x) / hl, 0.0, 1.0);
        // A brush dab: full in the middle, drawn out to a point at each end.
        let hy = hh * (1.0 - 0.85 * pow(tx, 1.5)) * select(1.0, 0.8, q.y > 0.0);
        let dd = (length(vec2f(q.x / hl, q.y / max(hy, 1e-5))) - 1.0) * hy;
        // Solid body; the edge breaks up into a fringe of dots.
        let solid = fillA(dd + hh * 0.2, px);
        let fringe = cloudDots(p + vec2f(0.21, 0.47) * cell, cell * 0.72, px, smoothstep(hh * 0.25, -hh * 0.2, dd) * 0.6, fk * 5.0 + row) * step(dd, hh * 0.3);
        let cov = max(solid, fringe);
        if (cov <= 0.0) { continue; }
        let toSun = sun - vec2f(dcx, dcy);
        let facing = clamp((dcx - cx) / L * sign(toSun.x) * 0.5 + 0.5, 0.0, 1.0);
        let up = (row + 0.5) / rows;
        let topEdge = smoothstep(0.1, -0.7, q.y / hh);
        var lit = mix(0.2 + 0.5 * up, 0.3 + 0.45 * (1.0 - up), low * 0.7) + 0.35 * (facing - 0.5) + 0.12 * topEdge * (1.0 - low * 0.5);
        lit = post(clamp(lit + (h - 0.5) * 0.06, 0.0, 1.0), 3.0);
        var cc = mix(cShade, cLit, lit);
        cc = mix(cc, cGlow, low * (1.0 - up) * 0.65 * exp(-length(toSun) * 1.4) * (1.0 - topEdge * 0.6));
        cc *= 0.985 + 0.03 * hash1(di * 7.7 + row);
        cc = mix(cc, mix(cc, cLit * 1.06, 0.8), cloudDots(p, cell * 1.3, px, smoothstep(0.3, 1.0, lit) * 0.22, fk + row));
        cc = mix(cc, mix(cc, cShade * 0.9, 0.6), cloudDots(p + 0.37 * cell, cell * 1.1, px, (1.0 - lit) * 0.12, fk * 3.0 + row));
        col = mix(col, cc, cov);
      }
    }
  }
  return col;
}
// Stippled soft masses: heaps of rounded puffs on a soft base, shaded as one
// continuous form (no facets) by the light's direction, the tone carried by
// the density of light and dark dots, and edges that dissolve into dots.
@diagnostic(off, derivative_uniformity) fn massD(q: vec2f, W: f32, fk: f32, seed: f32, t: f32) -> f32 {
  var d = 1e3;
  for (var i = 0; i < 6; i++) {
    let fi = f32(i);
    let x0 = (fi / 5.0 - 0.5) * W * 1.5 + (hash1(fi + fk * 5.0 + seed) - 0.5) * W * 0.22;
    let pr = W * (0.2 + 0.2 * (1.0 - abs(fi - 2.5) / 2.5)) * (0.8 + 0.4 * hash1(fi * 3.0 + fk + seed));
    let pc = vec2f(x0, -pr * (0.45 + 0.3 * hash1(fi * 7.0 + fk)));
    let di = length(q - pc) - pr;
    let hs = clamp(0.5 + 0.5 * (d - di) / (W * 0.12), 0.0, 1.0);
    d = mix(d, di, hs) - W * 0.12 * hs * (1.0 - hs);
  }
  d = max(d, q.y + W * 0.02 * sin(q.x / W * 9.0 + fk));
  return d + W * 0.06 * (vnoise(q / W * 6.0 + fk * 3.1 + vec2f(t * 0.02, 0.0)) - 0.5);
}
@diagnostic(off, derivative_uniformity) fn massClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.0028, px * 2.2);
  for (var k = 0; k < 8; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.3 + 0.4 * hash1(fk * 7.13 + seed)) / f32(n));
    let W = (0.08 + 0.1 * hash1(fk + seed * 1.7)) * (0.6 + 0.6 * amt);
    let span = 2.0 * (xr + W * 1.3);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.003 * (1.0 + fk * 0.2) / span) * span - (xr + W * 1.3);
    let q = p - vec2f(cx, cy);
    if (abs(q.x) > W * 1.35 || q.y > W * 0.12 || q.y < -W * 1.0) { continue; }
    let d = massD(q, W, fk, seed, t);
    let edge = W * 0.09;
    if (d > edge) { continue; }
    // One continuous rounded surface: lateral at the rim, facing us inside.
    let e = W * 0.04;
    let g2 = normalize(vec2f(massD(q + vec2f(e, 0.0), W, fk, seed, t) - d, massD(q + vec2f(0.0, e), W, fk, seed, t) - d) + vec2f(1e-6));
    let depth = clamp(-d / (W * 0.35), 0.0, 1.0);
    let nv = normalize(vec3f(g2.x * (1.0 - depth * 0.6), -g2.y * (1.0 - depth * 0.6), 0.35 + depth));
    let ts = normalize(sun - vec2f(cx, cy - W * 0.3));
    let Lc = normalize(vec3f(ts.x, -ts.y, 0.3));
    let lit = clamp(dot(nv, Lc) * 0.6 + 0.45 - smoothstep(-W * 0.3, 0.0, q.y) * 0.25, 0.0, 1.0);
    var cc = mix(cShade, cLit, post(lit, 5.0));
    cc = mix(cc, cGlow, low * smoothstep(-0.1, 0.7, -nv.y) * 0.55 * exp(-length(sun - vec2f(cx, cy)) * 1.3));
    cc = mix(cc, mix(cLit, vec3f(1.0), 0.3), cloudDots(p, cell, px, smoothstep(0.35, 0.95, lit) * 0.7, fk));
    cc = mix(cc, cShade * 0.86, cloudDots(p + 0.41 * cell, cell * 0.85, px, smoothstep(0.55, 0.1, lit) * 0.55, fk + 5.0));
    let solid = fillA(d + edge * 0.6, px);
    let rimDots = cloudDots(p + vec2f(0.13, 0.29) * cell, cell * 0.85, px, smoothstep(edge, -edge * 0.6, d) * 0.9, fk + 9.0);
    col = mix(col, cc, max(solid, rimDots));
  }
  return col;
}
// Mottled patches with drips: flat blotches of two or three tones in an
// irregular mottle, with runs of paint hanging from the undersides, each
// a dotted trickle ending in a bead.
@diagnostic(off, derivative_uniformity) fn dripClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.003, px * 2.3);
  for (var k = 0; k < 8; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.3 + 0.4 * hash1(fk * 7.13 + seed)) / f32(n));
    let W = (0.08 + 0.1 * hash1(fk + seed * 1.7)) * (0.6 + 0.6 * amt);
    let H = W * (0.22 + 0.1 * hash1(fk * 4.1 + seed));
    let span = 2.0 * (xr + W * 1.3);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.003 * (1.0 + fk * 0.2) / span) * span - (xr + W * 1.3);
    let q = p - vec2f(cx, cy);
    if (abs(q.x) > W * 1.2 || q.y < -H * 1.6 || q.y > H * 2.6) { continue; }
    // Blotch: a wide lens, rounded on top, nearly flat below, ragged edge.
    var d = (length(q / vec2f(W, select(H * 0.45, H, q.y < 0.0))) - 1.0) * H;
    d += H * 0.35 * (fbm(q / W * vec2f(3.0, 6.0) + fk * 2.7 + seed) - 0.5);
    let toSun = sun - vec2f(cx, cy);
    let side = clamp(q.x / W * sign(toSun.x) * 0.5 + 0.5, 0.0, 1.0);
    let up = clamp(-q.y / H * 0.5 + 0.5, 0.0, 1.0);
    let lit = clamp(mix(up, 1.0 - up, low * 0.6) * 0.6 + side * 0.4, 0.0, 1.0);
    // Mottle: the tone steps follow a slow noise, shifted toward the light.
    let m = vnoise(q / W * vec2f(5.0, 9.0) + fk * 1.9 + seed + vec2f(t * 0.01, 0.0));
    let tone = post(clamp(m * 0.55 + lit * 0.6 - 0.05, 0.0, 1.0), 3.0);
    var cc = mix(cShade, cLit, tone);
    cc = mix(cc, cGlow, low * (1.0 - up) * 0.5 * exp(-length(toSun) * 1.5));
    cc = mix(cc, mix(cc, cLit * 1.05, 0.7), cloudDots(p, cell, px, lit * 0.4, fk));
    cc = mix(cc, cShade * 0.88, cloudDots(p + 0.43 * cell, cell * 0.85, px, (1.0 - lit) * 0.35, fk + 4.0));
    col = mix(col, cc, fillA(d, px));
    // Drips: dotted trickles from the underside, each ending in a bead.
    let dw = W * 0.09;
    let di = floor(q.x / dw);
    let hd = hash1(di * 1.37 + fk * 11.0 + seed);
    if (hd > 0.45 && q.y > 0.0) {
      let dx = (di + 0.5 + (hash1(di * 2.9 + fk) - 0.5) * 0.4) * dw;
      let yb = H * 0.45 * sqrt(max(1.0 - pow(dx / W, 2.0), 0.0)) * 0.85;
      if (abs(dx) < W * 0.85) {
        let len = H * (0.5 + 1.8 * hash1(di * 5.3 + fk) * hash1(di * 1.1 + fk * 3.0)) * (0.7 + 0.3 * sin(t * 0.3 + di));
        let wdt = max(0.0011, px * 0.8) * (1.0 + hash1(di * 3.3) * 0.5);
        let along = q.y - yb;
        let trick = dotLine(q.x - dx, along, wdt, px, di + fk * 7.0) * step(0.0, along) * step(along, len);
        let bead = fillA(length(vec2f(q.x - dx, along - len)) - wdt * 1.9, px);
        let dc = mix(cShade, cc, 0.3);
        col = mix(col, dc, max(trick, bead));
      }
    }
  }
  return col;
}
`;
const PIXEL_BUDGET = 4500000;

const NAME = 'cove';
// skyTop, skyLow, sun, seaFar, seaNear, foam, cliffLight, cliffDark, cliffBand, rockLight, rockDark,
// algae, ink, iceplant, moss, grassLight, grassDark, flax
const PALETTES = {
  morning: ['#2d63b0', '#f2e2b8', '#fff8dc', '#7fb6c8', '#2f6f86', '#f4fbff', '#c97a3a', '#5a3a2a', '#e0a060', '#8a7a64', '#3a3228', '#4e6a2a', '#15120f', '#9ab04a', '#5f7a2a', '#c9b98a', '#6f7a3a', '#3f6a3a'],
  earle:   ['#154558', '#eab070', '#ffe7a8', '#e7b88e', '#1f4e70', '#fff0d6', '#b9674a', '#3c2440', '#d88a5a', '#7a5a6a', '#2a1e34', '#4a5a3a', '#120c18', '#d0a04a', '#5a6a3a', '#d8b27a', '#6a5a3a', '#355a4a'],
  mist:    ['#7a8a96', '#e6e4dc', '#fbfaf4', '#b8c4c8', '#6a808a', '#ffffff', '#8a8078', '#3a3634', '#b0a89a', '#76726c', '#2e2c2a', '#5a6450', '#141414', '#8a9a6a', '#5a6a4a', '#b8b49a', '#6a6e5a', '#4a5a4a'],
  dusk:    ['#221c44', '#f28a5a', '#ffd89a', '#e8906e', '#2a2a58', '#ffe2c8', '#a8503e', '#2e1c34', '#d8704a', '#6a4450', '#1e1224', '#3e3a3a', '#0e0a14', '#c87a4a', '#4a4a3a', '#d09a6a', '#5a4a3a', '#3a4a3e'],
};


function sunDrift(o) {
  const span = o.x1 - o.x0;
  const arcY = (f) => o.yLow + (o.yHigh - o.yLow) * Math.sin(Math.PI * Math.min(1, Math.max(0, f)));
  const f0 = Math.min(1, Math.max(0, (o.start[0] - o.x0) / span));
  const d = {
    ph: Math.asin(2 * f0 - 1), off: o.start[1] - arcY(f0), held: false,
    pos: [o.start[0], o.start[1]],
    step(dt, speed) {
      if (this.held) return;
      this.ph += dt * speed * 6.2832 / o.period;
      this.off *= Math.exp(-dt / 45);
      const f = 0.5 + 0.5 * Math.sin(this.ph);
      this.pos = [o.x0 + span * f, arcY(f) + this.off];
    },
    grab(q) { this.held = true; this.pos = [q[0], Math.min(q[1], o.yMax)]; },
    release() {
      if (!this.held) return;
      this.held = false;
      const f = Math.min(1, Math.max(0, (this.pos[0] - o.x0) / span));
      const a = Math.asin(2 * f - 1);
      // Carry on the way it was going.
      this.ph = Math.cos(this.ph) >= 0 ? a : Math.PI - a;
      this.off = this.pos[1] - arcY(f);
    },
  };
  return d;
}

const p = {};
function readControls() {
  p.pal = colsOf($('palette').value);
  p.swell = +$('swell').value / 100;
  p.foam = +$('foam').value / 100;
  p.glitter = +$('glitter').value / 100;
  p.rocks = 4 + Math.round(+$('rocks').value / 100 * 10);
  p.wind = +$('wind').value / 100;
  p.grain = +$('grain').value / 100 * 0.1;
  for (const id of ['swell', 'foam', 'glitter', 'rocks', 'wind', 'grain']) $(id + 'Val').textContent = $(id).value;
}
// The sun wanders slowly by itself along a low arc (x across the frame from
// -1 to 1); a drag takes it anywhere in the sky, and it wanders on from there.
const drift = sunDrift({ x0: -0.85, x1: 0.92, yLow: -0.16, yHigh: -0.36, period: 220, start: [0.3, -0.26], yMax: -0.13 });
// Half the frame's width in the scene's squeezed units.
const halfW = () => 0.31 * aspect / Math.min(aspect, 1);
let ft = 0, sun = [0.14, -0.26];
function generate() { ft = Math.random() * 100; }
function uniforms() {
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.swell, p.foam, p.glitter, p.rocks],
    c: [p.wind, 0, ft, p.grain],
    d: [tl.active ? tl.x : 0, tl.active ? tl.y - 0.5 : 0, sun[0], sun[1]],
    cols: p.pal,
  };
}
function step(dt) {
  ft += dt * (0.5 + p.swell * 1.5);
  drift.step(dt, 1);
  const k = 1 - Math.exp(-dt * (drift.held ? 8 : 4));
  sun[0] += (drift.pos[0] * halfW() - sun[0]) * k; sun[1] += (drift.pos[1] - sun[1]) * k;
}
// Pointer x is in screen units; the scene squeezes x on narrow screens.
function toScene(q) { return [q[0] / Math.min(aspect, 1) * 0.62, Math.min(q[1], -0.13)]; }
const toDrift = (q) => { const s = toScene(q); return [s[0] / halfW(), s[1]]; };
function onDown(q) { drift.grab(toDrift(q)); }
function onMove(q) { drift.grab(toDrift(q)); }
function onUp() { drift.release(); }

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

// Desktop renders above screen resolution within a pixel budget and lets the
// browser scale down, for crisper edges and finer marks; phones stay light.
const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 2e6 ? 1.25 : b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(PIXEL_BUDGET) });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
</body>
