<div class="vx-spin" id="vxSpin" role="img" aria-label="Loading"><span class="p"></span><span class="t"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><span></span></span></div>
<script>
// The loader, from the page's first bytes until its first frame is on screen
// (the same in every WebGPU piece; controls.js moves it on and takes it away).
// On the left, how far along the start is: it sits at a step and creeps
// toward the next, slowing but never stopping, and each file the page
// finishes loading is a small step, up to 9%. Beside it, "loading..." typed
// out like a terminal: each letter flickers through the hero's ASCII ramp
// before it lands, the dots count up behind a blinking cursor, and every so
// often letters flicker to capitals (loadING, Loading, loaDING), scrambling
// through random characters on the way, flip backwards or upside down, or
// glitch. Where the piece can't run there's no loader; controls.js says why
// instead.
window.vxLoader = (function () {
  var el = document.getElementById('vxSpin'), ua = navigator.userAgent;
  var ios = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var v = ua.match(/Version\/(\d+)/) || ua.match(/OS (\d+)_\d+/);
  if (!navigator.gpu || (ios && !(v && +v[1] >= 27))) { el.parentNode.removeChild(el); return null; }
  // In the theme picked on the home page (the same site, so its choice is to
  // hand): tumeric's amber, or cheshire's violet, the site's default.
  try { if (localStorage.getItem('heroVariant') === 'tumeric') el.classList.add('tumeric'); } catch (e) {}
  var WORD = 'loading', NOISE = '.,:;i1tfLCG08@#$%&*+=<>/\\|?';
  var pct = el.firstChild, cell = el.lastChild.children, tail = cell[WORD.length];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = Date.now(), typed = 160 + WORD.length * 70, gone = false, files = null;
  var base = 2, ceil = 9, tau = 1500, since = t0, shown = 0;
  var fx = null, fxAt = typed + 400 + Math.random() * 800, was = [], turned = [];
  function rnd(n) { return Math.floor(Math.random() * n); }
  // One flicker: capitals on a run of letters (DING or ING, one letter, two,
  // or the lot), or a letter or two flipped or glitched; on and off a few
  // times, then back. Capitals hold a little longer, to be read.
  function flicker(ms) {
    var n = WORD.length, r = Math.random(), kind = r < .55 ? 'caps' : r < .85 ? 'flip' : 'noise';
    var a = kind === 'flip' ? 2 + rnd(n - 2) : rnd(n), b = a + 1, on = [], t = 0;
    r = Math.random();
    if (kind === 'caps' && r < .4) { a = 3 + rnd(2); b = n; }
    else if (kind === 'caps' && r < .5) { a = 0; b = n; }
    else if (r > .8) b = Math.min(n, a + 2);
    for (var k = 1 + rnd(3); k > 0; k--) {
      var d = kind === 'caps' ? 110 + rnd(140) : 40 + rnd(90);
      on.push([t, t + d]);
      t += d + (kind === 'caps' ? 70 : 40) + rnd(60);
    }
    return { kind: kind, a: a, b: b, flip: rnd(2) ? 'x' : 'y', at: ms, on: on, end: ms + t };
  }
  function draw() {
    if (gone) return;
    var now = Date.now(), ms = now - t0, dt = now - since, lit = false;
    shown = Math.max(shown, base + (ceil - base) * dt / (dt + tau));
    pct.textContent = Math.min(99, Math.floor(shown)) + '%';
    if (!still && ms >= typed) {
      if (!fx && ms >= fxAt) fx = flicker(ms);
      if (fx && ms >= fx.end) { fx = null; fxAt = ms + 500 + Math.random() * 1300; }
      for (var j = 0; fx && j < fx.on.length; j++) if (ms - fx.at >= fx.on[j][0] && ms - fx.at < fx.on[j][1]) lit = true;
    }
    for (var k = 0; k < WORD.length; k++) {
      var c = WORD.charAt(k), how = '', hit = lit && k >= fx.a && k < fx.b;
      if (hit && fx.kind === 'caps') c = c.toUpperCase();
      if (hit && fx.kind === 'flip') how = fx.flip;
      // A letter changing case runs through a few random characters first.
      if (c !== was[k]) { if (was[k]) turned[k] = ms; was[k] = c; }
      if (!still && (ms < 160 + k * 70 || (hit && fx.kind === 'noise') || ms - turned[k] < 60)) c = NOISE.charAt(rnd(NOISE.length));
      if (cell[k].textContent !== c) cell[k].textContent = c;
      if (cell[k].className !== how) cell[k].className = how;
    }
    tail.textContent = still ? '..._' : (ms < typed ? '' : '...'.slice(0, Math.floor((ms - typed) / 380) % 4)) + (Math.floor(ms / 530) % 2 ? ' ' : '_');
    requestAnimationFrame(draw);
  }
  // (A beat before it shows, so a quick start never flashes it.)
  var show = setTimeout(function () { el.classList.add('in'); }, 120);
  // Away quickly, from wherever it's got to: the piece comes first.
  function stop() {
    if (gone) return;
    gone = true;
    clearTimeout(show);
    if (files) files.disconnect();
    el.classList.add('out');
    el.classList.remove('in');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  // At v and creeping toward c, half way there after t ms, until the next.
  function step(v, c, t) { if (v > base) { base = v; ceil = c; tau = t || 1200; since = Date.now(); } }
  try {
    files = new PerformanceObserver(function (list) {
      list.getEntries().forEach(function () { if (base < 9) step(Math.min(9, base + 2), 9, 1500); });
    });
    files.observe({ type: 'resource' });
  } catch (e) {}
  var api = {
    step: step,
    // The piece is on screen: out of its way at once, reading 100% as it goes,
    // however far the loader had got (typing, fading in, or not yet shown).
    done: function () { pct.textContent = '100%'; stop(); },
    stop: stop
  };
  // Where controls.js never came to move it on, it doesn't stay.
  document.addEventListener('DOMContentLoaded', function () { if (!api.steered) stop(); });
  draw();
  return api;
})();
</script>

<script type="module">
import { init, effect, surface, target, sampler, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

// ═══════════════════════════════════════
// SHADERS
// 1. Scene: ray-march a height field. A winding valley runs down the middle
//    (the road the camera follows); ridged noise mountains rise either side.
//    The terrain is drawn as a lit grid: line width is measured against the
//    pixel's footprint on the ground, so lines stay one crisp pixel wide up
//    close and fade to an even tone before they can shimmer in the distance.
// 2. Glow: downsample the bright parts, blur across, blur down.
// 3. Finish: chromatic aberration (red and blue sampled a little further in
//    and out from the centre), the glow, scanlines, vignette and grain.
// ═══════════════════════════════════════
const COMMON = /* wgsl */ `
fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract(q.x * q.y);
}
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), u.x),
             mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), u.x), u.y);
}
`;

const SCENE = COMMON + /* wgsl */ `
struct U {
  skyTop: vec3f, time: f32,
  skyLow: vec3f, height: f32,
  sunTop: vec3f, gridScale: f32,
  sunLow: vec3f, seed: f32,
  line: vec3f, aspect: f32,
  fill: vec3f, camZ: f32,
  camPos: vec3f, yaw: f32,
  pitch: f32, roll: f32, pixel: f32, stars: f32,
}
@group(0) @binding(0) var<uniform> u: U;

fn path(z: f32) -> f32 { return sin(z * 0.045) * 6.0 + sin(z * 0.013 + 1.3) * 10.0; }

fn terrain(p: vec2f) -> f32 {
  let d = abs(p.x - path(p.y));
  let valley = smoothstep(2.2, 10.0, d);
  var q = p * 0.07 + vec2f(u.seed, u.seed * 1.7);
  var a = 0.55;
  var s = 0.0;
  for (var k = 0; k < 4; k++) {
    let r = 1.0 - abs(vnoise(q) * 2.0 - 1.0);
    s += a * r * r;
    q = q * 2.1 + vec2f(3.1, 1.7);
    a *= 0.45;
  }
  // Mountains grow taller the further they are from the road.
  return s * u.height * valley * (0.6 + 0.4 * smoothstep(8.0, 30.0, d));
}

fn camBasis(q: vec2f) -> vec3f {
  let c = cos(u.roll); let s = sin(u.roll);
  let r = vec2f(c * q.x - s * q.y, s * q.x + c * q.y);
  var d = normalize(vec3f(r.x, r.y, 1.55));
  let cp = cos(u.pitch); let sp = sin(u.pitch);
  d = vec3f(d.x, cp * d.y + sp * d.z, -sp * d.y + cp * d.z);
  let cy = cos(u.yaw); let sy = sin(u.yaw);
  return vec3f(cy * d.x + sy * d.z, d.y, -sy * d.x + cy * d.z);
}

fn sky(rd: vec3f) -> vec3f {
  let h = rd.y;
  var col = mix(u.skyLow, u.skyTop, pow(smoothstep(-0.02, 0.4, h), 0.55));
  // Sun: sits ahead down the valley, sliced by bands that thicken toward
  // the horizon.
  // It rides straight ahead of the camera's heading, centred on the road.
  let sd = normalize(vec3f(sin(u.yaw), 0.1, cos(u.yaw)));
  let side = normalize(vec3f(cos(u.yaw), 0.0, -sin(u.yaw)));
  let dp = rd - sd;
  let r = length(vec2f(dot(dp, side), dp.y));
  // Narrow screens get a smaller sun so it doesn't fill the width.
  let R = 0.17 * clamp(u.aspect * 1.15, 0.6, 1.0);
  let sy = clamp((rd.y - (sd.y - R)) / (2.0 * R), 0.0, 1.0);
  var sun = mix(u.sunLow, u.sunTop, sy) * smoothstep(R, R - 0.004, r);
  let bandPos = (sd.y + 0.02 - rd.y) / R;
  let band = smoothstep(0.0, 0.02, bandPos) * step(0.5 - bandPos * 0.42, fract(bandPos * 7.0 - u.time * 0.15));
  sun *= 1.0 - band;
  col += sun * 1.6;
  col += mix(u.sunLow, u.sunTop, 0.5) * exp(-r * 9.0) * 0.3;
  // Stars above the glow.
  if (h > 0.08) {
    let g = rd.xy / max(rd.z, 0.2) * 120.0;
    let id = floor(g);
    let st = hash21(id + u.seed);
    let tw = 0.6 + 0.4 * sin(u.time * 2.0 + st * 40.0);
    let off = vec2f(hash21(id + 3.1), hash21(id + 7.7)) - 0.5;
    let dd = length(fract(g) - 0.5 - off * 0.6);
    col += vec3f(1.0) * step(0.985, st) * smoothstep(0.12, 0.0, dd) * tw * u.stars * smoothstep(0.08, 0.35, h);
  }
  return col;
}

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let q = vec2f((uv.x - 0.5) * u.aspect, 0.5 - uv.y);
  let ro = u.camPos;
  let rd = camBasis(q);
  let far = 140.0;
  let top = u.height * 1.1 + 0.2;
  var col = sky(rd);
  var t = 0.0;
  var hit = false;
  if (ro.y > top) {
    if (rd.y < 0.0) { t = (top - ro.y) / rd.y; } else { t = far; }
  }
  var prevT = t;
  for (var i = 0; i < 150; i++) {
    if (t >= far) { break; }
    let p = ro + rd * t;
    let dh = p.y - terrain(p.xz);
    if (dh < 0.002 * t) { hit = true; break; }
    prevT = t;
    t += max(dh * 0.42, 0.015 + t * 0.004);
  }
  if (hit) {
    // Tighten the crossing so the grid sits exactly on the surface.
    var lo = prevT;
    var hi = t;
    var dLo = (ro + rd * lo).y - terrain((ro + rd * lo).xz);
    var dHi = (ro + rd * hi).y - terrain((ro + rd * hi).xz);
    for (var k = 0; k < 7; k++) {
      // Secant step: aim where the height gap crosses zero, not just halfway.
      let m = mix(lo, hi, clamp(dLo / max(dLo - dHi, 1e-5), 0.1, 0.9));
      let pm = ro + rd * m;
      let dm = pm.y - terrain(pm.xz);
      if (dm < 0.0) { hi = m; dHi = dm; } else { lo = m; dLo = dm; }
    }
    t = mix(lo, hi, clamp(dLo / max(dLo - dHi, 1e-5), 0.0, 1.0));
    let p = ro + rd * t;
    let e = 0.05;
    let hC = terrain(p.xz);
    let n = normalize(vec3f(hC - terrain(p.xz + vec2f(e, 0.0)), e, hC - terrain(p.xz + vec2f(0.0, e))));
    // Pixel footprint on the ground, in grid cells.
    let foot = u.pixel * t / max(abs(dot(n, rd)), 0.12) / u.gridScale;
    let g = p.xz / u.gridScale;
    let dist = abs(fract(g - 0.5) - 0.5);
    let wpx = dist / max(foot, 1e-5);
    let lineW = 1.35;
    var lineA = 1.0 - smoothstep(lineW - 0.5, lineW + 0.5, min(wpx.x, wpx.y));
    // Past the point where cells shrink under a few pixels, trade lines for
    // their average brightness so nothing shimmers.
    let fade = smoothstep(0.25, 0.08, foot);
    lineA = mix(clamp(foot * 2.2, 0.0, 0.6), lineA, fade);
    let shade = 0.35 + 0.65 * clamp(dot(n, normalize(vec3f(0.3, 0.7, 0.6))), 0.0, 1.0);
    let heightTint = smoothstep(0.0, u.height, p.y);
    var surf = u.fill * shade * (0.6 + 0.8 * heightTint);
    surf += u.line * lineA * (1.3 + 0.9 * heightTint);
    // Haze toward the horizon, tinted like the sky low down.
    let fog = 1.0 - exp(-pow(t / far, 1.6) * 5.0);
    col = mix(surf, u.skyLow * 0.9 + mix(u.sunLow, u.sunTop, 0.5) * 0.08, fog);
  }
  return vec4f(col, 1.0);
}
`;

const DOWN = /* wgsl */ `
struct P { texel: vec2f, threshold: f32 }
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  var c = vec3f(0.0);
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      c += textureSampleLevel(src, samp, uv + vec2f(f32(x), f32(y)) * p.texel * 1.5, 0.0).rgb;
    }
  }
  c /= 9.0;
  let l = max(c.r, max(c.g, c.b));
  return vec4f(c * smoothstep(p.threshold, p.threshold + 0.4, l), 1.0);
}
`;

const BLUR = /* wgsl */ `
struct P { dir: vec2f }
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let w = array<f32, 5>(0.227, 0.194, 0.122, 0.054, 0.016);
  var c = textureSampleLevel(src, samp, uv, 0.0).rgb * w[0];
  for (var i = 1; i < 5; i++) {
    let o = p.dir * f32(i) * 1.8;
    c += (textureSampleLevel(src, samp, uv + o, 0.0).rgb + textureSampleLevel(src, samp, uv - o, 0.0).rgb) * w[i];
  }
  return vec4f(c, 1.0);
}
`;

const FINISH = /* wgsl */ `
struct F { aberration: f32, glow: f32, scan: f32, time: f32, aspect: f32, lines: f32 }
@group(0) @binding(0) var<uniform> f: F;
@group(0) @binding(1) var scene: texture_2d<f32>;
@group(0) @binding(2) var glow: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
fn h(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(12.9898, 78.233))) * 43758.5453); }
@fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let c = uv - 0.5;
  let r2 = dot(c * vec2f(f.aspect, 1.0), c * vec2f(f.aspect, 1.0));
  // Stronger toward the edges, like a real lens.
  let off = c * f.aberration * (0.4 + r2 * 1.6);
  var col = vec3f(
    textureSampleLevel(scene, samp, uv - off, 0.0).r,
    textureSampleLevel(scene, samp, uv, 0.0).g,
    textureSampleLevel(scene, samp, uv + off, 0.0).b);
  let gl = vec3f(
    textureSampleLevel(glow, samp, uv - off * 2.0, 0.0).r,
    textureSampleLevel(glow, samp, uv, 0.0).g,
    textureSampleLevel(glow, samp, uv + off * 2.0, 0.0).b);
  col += gl * f.glow;
  let sl = 0.5 + 0.5 * sin(pos.y * 3.14159 * f.lines);
  col *= 1.0 - f.scan * 0.35 * sl;
  col *= 1.0 - 0.5 * smoothstep(0.25, 0.95, r2);
  col = col / (1.0 + col * 0.18);
  // Palettes and lighting work in linear light; the canvas wants sRGB-ish.
  col = pow(max(col, vec3f(0.0)), vec3f(1.0 / 2.2));
  col += (h(pos.xy + f.time) - 0.5) * 0.025;
  return vec4f(col, 1.0);
}
`;

// ═══════════════════════════════════════
// PALETTES
// ═══════════════════════════════════════
const hex = (s) => [1, 3, 5].map((i) => Math.pow(parseInt(s.slice(i, i + 2), 16) / 255, 2.2));
const PALETTES = {
  outrun: { skyTop: '#07021a', skyLow: '#7a0f5a', sunTop: '#ffe36b', sunLow: '#ff2d7a', line: '#ff3cd4', fill: '#12031f', stars: 1 },
  vapor:  { skyTop: '#130a33', skyLow: '#e37ac2', sunTop: '#fff6b0', sunLow: '#ff79c6', line: '#7df9ff', fill: '#1c1040', stars: 0.8 },
  grid:   { skyTop: '#000207', skyLow: '#032a3a', sunTop: '#e8fdff', sunLow: '#35d9ff', line: '#2af4ff', fill: '#010912', stars: 1 },
  amber:  { skyTop: '#050200', skyLow: '#3b1600', sunTop: '#ffd27a', sunLow: '#ff7a00', line: '#ffb000', fill: '#0c0500', stars: 0.6 },
  mono:   { skyTop: '#040404', skyLow: '#2a2a2a', sunTop: '#ffffff', sunLow: '#9a9a9a', line: '#f2f2f2', fill: '#0a0a0a', stars: 1 },
};
const pal = (name) => {
  const p = PALETTES[name];
  return { skyTop: hex(p.skyTop), skyLow: hex(p.skyLow), sunTop: hex(p.sunTop), sunLow: hex(p.sunLow), line: hex(p.line), fill: hex(p.fill), stars: p.stars };
};

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const IDS = ['speed', 'height', 'grid', 'aberration', 'glow', 'scan'];

const p = {};
function readControls() {
  p.speed = +$('speed').value / 100;
  p.height = 1.5 + +$('height').value / 100 * 9;
  p.gridScale = 1.6 - +$('grid').value / 100 * 1.1;
  p.aberration = +$('aberration').value / 100 * 0.018;
  p.glow = +$('glow').value / 100 * 1.6;
  p.scan = +$('scan').value / 100;
  p.pal = pal($('palette').value);
  for (const id of IDS) $(id + 'Val').textContent = $(id).value;
}
readControls();

// Same winding road as the shader, so the camera can follow it.
const path = (z) => Math.sin(z * 0.045) * 6 + Math.sin(z * 0.013 + 1.3) * 10;

let seed = Math.random() * 50;
let t = 0, camZ = 0;
let steer = 0, climb = 1.3, steerGoal = 0, climbGoal = 1.3;
let yaw = 0, roll = 0;
const tl = tilt();

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

// Ray marching is the expensive part, so the scene renders at up to 1.5×
// pixel density and the glow at a quarter of that.
const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(2.5e6) });
const linear = sampler(gpu, { minFilter: 'linear', magFilter: 'linear' });
const size = () => [Math.max(1, surf.size[0]), Math.max(1, surf.size[1])];
const quarter = () => [Math.max(1, Math.round(surf.size[0] / 4)), Math.max(1, Math.round(surf.size[1] / 4))];
const sceneT = target(gpu, { size: size(), format: 'rgba16float' });
const glowA = target(gpu, { size: quarter(), format: 'rgba16float' });
const glowB = target(gpu, { size: quarter(), format: 'rgba16float' });

const sceneE = effect(gpu, SCENE, { set: { u: {
  skyTop: p.pal.skyTop, time: 0, skyLow: p.pal.skyLow, height: p.height,
  sunTop: p.pal.sunTop, gridScale: p.gridScale, sunLow: p.pal.sunLow, seed,
  line: p.pal.line, aspect: 1, fill: p.pal.fill, camZ: 0,
  camPos: [0, 1, 0], yaw: 0, pitch: 0, roll: 0, pixel: 0.001, stars: p.pal.stars,
} } });
const downE = effect(gpu, DOWN, { set: { p: { texel: [0.001, 0.001], threshold: 0.35 }, src: sceneT, samp: linear } });
const blurH = effect(gpu, BLUR, { set: { p: { dir: [0.01, 0] }, src: glowB, samp: linear } });
const blurV = effect(gpu, BLUR, { set: { p: { dir: [0, 0.01] }, src: glowA, samp: linear } });
const finE = effect(gpu, FINISH, { set: {
  f: { aberration: p.aberration, glow: p.glow, scan: p.scan, time: 0, aspect: 1, lines: 0.5 },
  scene: sceneT, glow: glowB, samp: linear,
} });

surf.onResize(({ width, height }) => {
  const aspect = width / height;
  sceneT.resize(size());
  glowA.resize(quarter()); glowB.resize(quarter());
  downE.set({ p: { texel: [1 / width, 1 / height] }, src: sceneT });
  blurH.set({ p: { dir: [1 / glowA.size[0], 0] }, src: glowB });
  blurV.set({ p: { dir: [0, 1 / glowA.size[1]] }, src: glowA });
  finE.set({ f: { aspect, lines: Math.max(0.33, 1 / (window.devicePixelRatio || 1)) * 0.66 }, scene: sceneT, glow: glowB });
  // Height of one pixel on a plane one unit in front of the camera.
  sceneE.set({ u: { aspect, pixel: 1 / (1.55 * height) } });
});

function applyControls() {
  readControls();
  const c = p.pal;
  sceneE.set({ u: { skyTop: c.skyTop, skyLow: c.skyLow, sunTop: c.sunTop, sunLow: c.sunLow, line: c.line, fill: c.fill,
    stars: c.stars, height: p.height, gridScale: p.gridScale, seed } });
  finE.set({ f: { aberration: p.aberration, glow: p.glow, scan: p.scan } });
}

// ═══════════════════════════════════════
// FLYING: drag steers across the valley and climbs; tilt banks
// ═══════════════════════════════════════
let dragging = false, dragFrom = null, dragStart = null;
canvas.addEventListener('pointerdown', (e) => { dragging = true; dragFrom = [e.clientX, e.clientY]; dragStart = [steerGoal, climbGoal]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = (e.clientX - dragFrom[0]) / canvas.clientWidth, dy = (e.clientY - dragFrom[1]) / canvas.clientHeight;
  steerGoal = Math.max(-1.6, Math.min(1.6, dragStart[0] + dx * 4));
  climbGoal = Math.max(0.35, Math.min(6, dragStart[1] - dy * 8));
});
const release = () => { dragging = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

const clk = clock(gpu);
let fpsCount = 0, fpsAt = performance.now();

function step(dt) {
  t += dt;
  camZ += dt * (1.5 + p.speed * 16);
  const ease = 1 - Math.exp(-dt * 2.5);
  const tiltSteer = tl.active ? tl.x * 1.4 : 0;
  steer += (Math.max(-1.6, Math.min(1.6, steerGoal + tiltSteer)) - steer) * ease;
  climb += (climbGoal - climb) * ease;
  const x = path(camZ) + steer;
  // Look a little way down the road so the camera leans into the bends.
  const ahead = 9;
  const yawGoal = Math.atan2(path(camZ + ahead) + steer - x, ahead);
  const bend = yawGoal - yaw;
  yaw += bend * (1 - Math.exp(-dt * 4));
  const rollGoal = -bend * 2.2 - (tl.active ? tl.x * 0.35 : 0);
  roll += (rollGoal - roll) * (1 - Math.exp(-dt * 3));
  // Keep the horizon a little above the middle, lower as the camera climbs.
  const pitch = 0.03 - climb * 0.035 + (tl.active ? (tl.y - 0.5) * 0.12 : 0);
  sceneE.set({ u: { time: t, camZ, camPos: [x, climb, camZ], yaw, pitch, roll } });
  finE.set({ f: { time: t % 50 } });
}

function render(f) {
  f.pass(sceneT, sceneE);
  f.pass(glowB, downE);    // scene → bright parts, quarter size
  f.pass(glowA, blurH);    // glowB → glowA, across
  f.pass(glowB, blurV);    // glowA → glowB, down
  f.pass(surf, finE);
}

let loop = null, playing = false;
function tick(f) {
  step(Math.min(clk.deltaTime, 0.1));
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const id of IDS) $(id).addEventListener('input', applyControls);
$('palette').addEventListener('change', applyControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => {
  seed = Math.random() * 50;
  camZ = Math.random() * 400;
  applyControls();
  if (!playing) frame(gpu, render);
});
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'wire-terrain-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

applyControls();
step(0);
togglePlay();
</script>
</body>
</html>
