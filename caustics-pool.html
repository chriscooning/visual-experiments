<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caustics Pool — WebGPU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .panel{
    position:fixed;bottom:20px;right:20px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(10,10,12,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:12px;
    padding:18px 16px;width:220px;max-height:calc(100vh - 40px);overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;transition:transform 0.3s ease;z-index:10;
  }
  .panel.hidden{transform:translateX(calc(100% + 40px))}
  .panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-track{background:transparent}.panel::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  .control-group{display:flex;flex-direction:column;gap:3px}
  .control-group label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555}
  .control-group .val{font-family:'Space Mono',monospace;font-size:9px;color:#777;float:right;letter-spacing:0}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#222;border-radius:2px;outline:none;touch-action:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  select{background:#151518;color:#ccc;border:1px solid #2a2a2f;padding:8px 10px;border-radius:6px;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;outline:none;width:100%}
  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
  .btn:hover{background:#fff;color:#000;border-color:#fff}.btn:active{transform:scale(.97)}
  .btn.primary{background:#fff;color:#000;border-color:#fff}.btn.primary:hover{background:transparent;color:#fff}
  .btn.playing{background:#2ecc40;color:#000;border-color:#2ecc40}.btn.playing:hover{background:#27ae60;border-color:#27ae60}
  .btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
  .hint-pill{position:fixed;bottom:20px;left:20px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#444;border:1px solid #2a2a2f;padding:6px 14px;border-radius:20px;background:rgba(10,10,12,0.6);z-index:10;pointer-events:none;animation:fadeHint 4s forwards}
  @keyframes fadeHint{0%,60%{opacity:1}100%{opacity:0}}
  .hint-pill.show{animation:fadeHint 4s forwards}
  .fps{position:fixed;top:8px;right:8px;font-family:'Space Mono',monospace;font-size:10px;color:#333;pointer-events:none;z-index:10}
  .nogpu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;line-height:1.8;color:#666}
  .nogpu.on{display:flex}
</style>
<script src="controls.js" defer></script>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="panel" id="panel">
  <div class="control-group"><label>Palette</label>
    <select id="palette">
      <option value="pool" selected>Pool</option>
      <option value="lagoon">Lagoon</option>
      <option value="night">Night Swim</option>
      <option value="mono">Monochrome</option>
    </select>
  </div>
  <div class="control-group"><label>Swell <span class="val" id="swellVal">45</span></label><input type="range" id="swell" min="0" max="100" value="45"></div>
  <div class="control-group"><label>Depth <span class="val" id="depthVal">55</span></label><input type="range" id="depth" min="10" max="100" value="55"></div>
  <div class="control-group"><label>Sunlight <span class="val" id="sunVal">60</span></label><input type="range" id="sun" min="10" max="100" value="60"></div>
  <div class="control-group"><label>Ripple Size <span class="val" id="rippleVal">40</span></label><input type="range" id="ripple" min="10" max="100" value="40"></div>
  <div class="control-group"><label>Ripple Fade <span class="val" id="fadeVal">30</span></label><input type="range" id="fade" min="0" max="100" value="30"></div>
  <div class="control-group"><label>Rain <span class="val" id="rainVal">15</span></label><input type="range" id="rain" min="0" max="100" value="15"></div>
  <div class="btn-row">
    <button class="btn" id="playPause"><svg id="playIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg><svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg><span id="playLabel">Play</span></button>
    <button class="btn primary" id="generate">Generate</button>
    <button class="btn" id="save">PNG</button>
  </div>
</div>
<div class="hint-pill" id="hintPill">Tap or drag to make ripples · Tilt to slosh · H controls</div>
<div class="fps" id="fps"></div>
<div class="nogpu" id="nogpu">This one runs on WebGPU, which this browser doesn't offer yet.<br>Try a recent Chrome, Edge or Safari.</div>

<script type="module">
import { init, effect, surface, target, sampler, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

// ═══════════════════════════════════════
// SHADERS
// A small height-field simulation carries the ripples you make. On top of it,
// a few analytic swells keep the water moving on its own. The render pass
// bends the floor through the surface and brightens it where the surface
// focuses light: caustics are where the refracted floor area shrinks, i.e.
// 1 / det(I - depth * Hessian(height)).
// ═══════════════════════════════════════
const DROP = /* wgsl */ `
struct Drop { pos: vec2f, radius: f32, strength: f32, aspect: f32 }
@group(0) @binding(0) var<uniform> drop: Drop;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  var c = textureSampleLevel(src, samp, uv, 0.0);
  let d = length((uv - drop.pos) * vec2f(drop.aspect, 1.0)) / drop.radius;
  if (d < 1.0) { c.r -= drop.strength * (cos(d * 3.14159) * 0.5 + 0.5); }
  return c;
}
`;

const STEP = /* wgsl */ `
struct Sim { texel: vec2f, damping: f32 }
@group(0) @binding(0) var<uniform> sim: Sim;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let c = textureSampleLevel(src, samp, uv, 0.0);
  let avg = (textureSampleLevel(src, samp, uv + vec2f(sim.texel.x, 0.0), 0.0).r
           + textureSampleLevel(src, samp, uv - vec2f(sim.texel.x, 0.0), 0.0).r
           + textureSampleLevel(src, samp, uv + vec2f(0.0, sim.texel.y), 0.0).r
           + textureSampleLevel(src, samp, uv - vec2f(0.0, sim.texel.y), 0.0).r) * 0.25;
  // r = height, g = vertical velocity
  let vel = (c.g + (avg - c.r) * 2.0) * sim.damping;
  return vec4f(c.r + vel, vel, 0.0, 1.0);
}
`;

const RENDER = /* wgsl */ `
struct Look {
  floorA: vec3f, swell: f32,
  floorB: vec3f, depth: f32,
  grout: vec3f, sun: f32,
  deep: vec3f, time: f32,
  tilt: vec2f, aspect: f32, seed: f32,
  texel: vec2f, rippleGain: f32, lane: f32,
}
@group(0) @binding(0) var<uniform> look: Look;
@group(0) @binding(1) var sim: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;

fn h1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }

// Height, gradient and Hessian (xx, yy, xy) of the water surface at p, in
// screen-height units. Analytic swells plus the simulated ripples.
struct Surf { h: f32, g: vec2f, hess: vec3f }

fn surf(uv: vec2f) -> Surf {
  var s: Surf;
  let p = vec2f(uv.x * look.aspect, uv.y);
  let tl = length(look.tilt);
  for (var i = 0; i < 8; i++) {
    let fi = f32(i);
    var ang = look.seed * 6.2831 + fi * 2.39996;
    var dir = vec2f(cos(ang), sin(ang));
    var amp = look.swell * 0.016;
    // Tilting sends the two broadest swells downhill and builds them up.
    if (i < 2 && tl > 0.05) { dir = normalize(mix(dir, look.tilt / tl, min(tl * 1.5, 1.0))); amp *= 1.0 + 2.5 * tl; }
    let k = 24.0 + fi * 8.0 + h1(fi + look.seed) * 8.0;
    // Shorter waves carry less height but more curvature, which is what
    // draws the thin, connected web of a real pool floor.
    amp *= sqrt(30.0 / k);
    let w = sqrt(9.8 * k) * 0.35;
    let ph = dot(dir, p) * k - w * look.time + h1(fi * 3.1 + look.seed) * 6.2831;
    let a = amp / k;
    s.h += a * cos(ph);
    s.g += -a * k * sin(ph) * dir;
    let hc = -a * k * k * cos(ph);
    s.hess += hc * vec3f(dir.x * dir.x, dir.y * dir.y, dir.x * dir.y);
  }
  // Simulated ripples: central differences on the sim texture.
  // Sample 2 texels out: the linear filter averages neighbours, which keeps
  // the curvature from amplifying the grid's checkerboard and 16-bit noise.
  let tx = vec2f(look.texel.x * 2.0, 0.0);
  let ty = vec2f(0.0, look.texel.y * 2.0);
  let ex = look.texel.x * 2.0 * look.aspect;   // step size in p units
  let ey = look.texel.y * 2.0;
  let g0 = look.rippleGain;
  let c  = textureSampleLevel(sim, samp, uv, 0.0).r * g0;
  let l  = textureSampleLevel(sim, samp, uv - tx, 0.0).r * g0;
  let r  = textureSampleLevel(sim, samp, uv + tx, 0.0).r * g0;
  let u  = textureSampleLevel(sim, samp, uv - ty, 0.0).r * g0;
  let d  = textureSampleLevel(sim, samp, uv + ty, 0.0).r * g0;
  let ur = textureSampleLevel(sim, samp, uv + tx - ty, 0.0).r * g0;
  let ul = textureSampleLevel(sim, samp, uv - tx - ty, 0.0).r * g0;
  let dr = textureSampleLevel(sim, samp, uv + tx + ty, 0.0).r * g0;
  let dl = textureSampleLevel(sim, samp, uv - tx + ty, 0.0).r * g0;
  s.h += c;
  s.g += vec2f((r - l) / (2.0 * ex), (d - u) / (2.0 * ey));
  s.hess += vec3f((r - 2.0 * c + l) / (ex * ex), (d - 2.0 * c + u) / (ey * ey), (dr - dl - ur + ul) / (4.0 * ex * ey));
  return s;
}

// Pool floor: square mosaic tiles with grout, plus a darker lane stripe.
fn poolFloor(q: vec2f) -> vec3f {
  let cell = q * 11.0;
  let f = abs(fract(cell) - 0.5);
  let grout = smoothstep(0.43, 0.47, max(f.x, f.y));
  let id = floor(cell);
  let tone = 0.94 + 0.06 * fract(sin(dot(id, vec2f(12.9898, 78.233))) * 43758.5453);
  var col = mix(look.floorA, look.floorB, look.lane * smoothstep(0.035, 0.03, abs(q.x - look.aspect * 0.5)));
  col = col * tone;
  return mix(col, look.grout, grout);
}

@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let s = surf(uv);
  let p = vec2f(uv.x * look.aspect, uv.y);
  let D = look.depth;
  // Where this pixel's view ray lands on the floor after bending.
  let q = p - s.g * D * 0.3 + look.tilt * 0.02;
  // Area change of the light hitting the floor: small area = focused = bright.
  let det = (1.0 - D * s.hess.x) * (1.0 - D * s.hess.y) - (D * s.hess.z) * (D * s.hess.z);
  let caustic = clamp(1.0 / max(abs(det), 0.12), 0.0, 6.0);
  // Soft-knee the focus so threads glow without blowing the floor out.
  let focus = caustic - 1.0;
  let light = 0.72 + look.sun * 0.45 * focus / (1.0 + 0.25 * max(focus, 0.0));
  var col = poolFloor(q) * light;
  // Water colour deepens with depth; a touch of sky glint on the slopes.
  col = mix(col, look.deep, 0.1 + 0.18 * D / 1.5);
  let n = normalize(vec3f(-s.g * 3.0, 1.0));
  let hv = normalize(vec3f(0.35, -0.5, 1.0) + vec3f(0.0, 0.0, 1.0));
  col += vec3f(1.0, 0.98, 0.9) * pow(max(dot(n, hv), 0.0), 350.0) * 0.8;
  // Soft vignette like looking into the water from above.
  let vig = 1.0 - 0.3 * smoothstep(0.4, 1.2, length((uv - 0.5) * vec2f(look.aspect, 1.0)));
  return vec4f(col * vig, 1.0);
}
`;

// ═══════════════════════════════════════
// PALETTES — floor tile, lane stripe, grout, water depth, lane on/off
// ═══════════════════════════════════════
const PALETTES = {
  pool:   { floorA: [0.72, 0.9, 0.93], floorB: [0.1, 0.25, 0.55], grout: [0.55, 0.72, 0.76], deep: [0.0, 0.42, 0.55], lane: 1 },
  lagoon: { floorA: [0.86, 0.78, 0.6], floorB: [0.76, 0.66, 0.48], grout: [0.8, 0.72, 0.55], deep: [0.0, 0.45, 0.42], lane: 0 },
  night:  { floorA: [0.22, 0.4, 0.62], floorB: [0.05, 0.1, 0.26], grout: [0.1, 0.2, 0.32], deep: [0.0, 0.08, 0.22], lane: 1 },
  mono:   { floorA: [0.82, 0.82, 0.82], floorB: [0.35, 0.35, 0.35], grout: [0.6, 0.6, 0.6], deep: [0.18, 0.18, 0.2], lane: 1 },
};

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const p = {};
function readControls() {
  p.swell = +$('swell').value / 100;
  p.depth = 0.3 + +$('depth').value / 100 * 1.2;
  p.sun = +$('sun').value / 100 * 1.2;
  p.ripple = 0.02 + +$('ripple').value / 100 * 0.08;
  p.damping = 0.997 - +$('fade').value / 100 * 0.03;
  p.rain = +$('rain').value / 100;
  p.palette = PALETTES[$('palette').value];
  for (const id of ['swell', 'depth', 'sun', 'ripple', 'fade', 'rain']) $(id + 'Val').textContent = $(id).value;
}
readControls();

let seed = Math.random() * 10;
let t = 0;
const tl = tilt();

// ═══════════════════════════════════════
// GPU
// ═══════════════════════════════════════
let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: [1, 2] });
const SIM_W = 320;
const simSize = () => [SIM_W, Math.max(64, Math.round(SIM_W * surf.size[1] / Math.max(1, surf.size[0])))];
let simA = target(gpu, { size: simSize(), format: 'rgba16float' });
let simB = target(gpu, { size: simSize(), format: 'rgba16float' });
let cur = simA, nxt = simB;
const swap = () => { const x = cur; cur = nxt; nxt = x; };
const linear = sampler(gpu, { minFilter: 'linear', magFilter: 'linear' });

const texel = () => [1 / cur.size[0], 1 / cur.size[1]];
const dropE = effect(gpu, DROP, { set: { drop: { pos: [0.5, 0.5], radius: p.ripple, strength: 0, aspect: 1 }, src: cur, samp: linear } });
const stepE = effect(gpu, STEP, { set: { sim: { texel: texel(), damping: p.damping }, src: cur, samp: linear } });
const renderE = effect(gpu, RENDER, { set: {
  look: {
    floorA: p.palette.floorA, swell: p.swell, floorB: p.palette.floorB, depth: p.depth,
    grout: p.palette.grout, sun: p.sun, deep: p.palette.deep, time: 0,
    tilt: [0, 0], aspect: 1, seed, texel: texel(), rippleGain: 0.012, lane: p.palette.lane,
  },
  sim: cur, samp: linear,
} });

let needClear = true;
function clearSim(f) {
  needClear = false;
  f.pass({ target: simA, clear: [0, 0, 0, 1] }, () => {});
  f.pass({ target: simB, clear: [0, 0, 0, 1] }, () => {});
}

surf.onResize(({ width, height }) => {
  const aspect = width / height;
  simA.resize(simSize());
  simB.resize(simSize());
  stepE.set({ sim: { texel: texel() } });
  dropE.set({ drop: { aspect } });
  renderE.set({ look: { aspect, texel: texel() } });
  // vgpu resizes the canvas at the start of a frame, so clear there rather
  // than opening a frame from inside this callback.
  needClear = true;
});

function applyControls() {
  readControls();
  const pal = p.palette;
  stepE.set({ sim: { damping: p.damping } });
  dropE.set({ drop: { radius: p.ripple } });
  renderE.set({ look: {
    floorA: pal.floorA, floorB: pal.floorB, grout: pal.grout, deep: pal.deep, lane: pal.lane,
    swell: p.swell, depth: p.depth, sun: p.sun, seed,
  } });
}

// ═══════════════════════════════════════
// RIPPLES: one queued drop per frame, from taps, drags and rain
// ═══════════════════════════════════════
let pending = null;
function toUV(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
let dragging = false;
canvas.addEventListener('pointerdown', (e) => { dragging = true; pending = { pos: toUV(e), strength: 0.9 }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (dragging) pending = { pos: toUV(e), strength: 0.35 }; });
const release = () => { dragging = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

// ═══════════════════════════════════════
// FRAME
// ═══════════════════════════════════════
const clk = clock(gpu);
let fpsCount = 0, fpsAt = performance.now();

function simulate(f) {
  if (needClear) clearSim(f);
  if (!pending && Math.random() < p.rain * 0.12) pending = { pos: [Math.random(), Math.random()], strength: 0.25 + Math.random() * 0.3 };
  if (pending) {
    dropE.set({ drop: { pos: pending.pos, strength: pending.strength }, src: cur });
    f.pass(nxt, dropE); swap();
    pending = null;
  }
  for (let i = 0; i < 2; i++) {
    stepE.set({ src: cur });
    f.pass(nxt, stepE); swap();
  }
}

function render(f) {
  renderE.set({ sim: cur });
  f.pass(surf, renderE);
}

let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  renderE.set({ look: { time: t, tilt: [tl.x, tl.y] } });
  simulate(f);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

// ═══════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════
for (const id of ['swell', 'depth', 'sun', 'ripple', 'fade', 'rain']) $(id).addEventListener('input', applyControls);
$('palette').addEventListener('change', applyControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => {
  seed = Math.random() * 10;
  applyControls();
  needClear = true;
  if (!playing) frame(gpu, (f) => { clearSim(f); render(f); });
});
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'caustics-pool-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

applyControls();
togglePlay();
</script>
</body>
</html>
