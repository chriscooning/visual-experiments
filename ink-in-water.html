<div class="vx-spin" id="vxSpin" role="img" aria-label="Loading"><span class="p"></span><span class="t"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><span></span></span></div>
<script>
// The loader, from the page's first bytes until its first frame is on screen
// (the same in every WebGPU piece; controls.js moves it on and takes it away).
// On the left, how far along the start is: it sits at a step and creeps
// toward the next, slowing but never stopping, and each file the page
// finishes loading is a small step, up to 9%. Beside it, "loading..." typed
// out like a terminal: each letter flickers through the hero's ASCII ramp
// before it lands, the dots count up behind a blinking cursor, and every so
// often letters flicker to capitals (loadING, Loading, loaDING), scrambling
// through random characters on the way, flip backwards or upside down, or
// glitch. Where the piece can't run there's no loader; controls.js says why
// instead.
window.vxLoader = (function () {
  var el = document.getElementById('vxSpin'), ua = navigator.userAgent;
  var ios = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var v = ua.match(/Version\/(\d+)/) || ua.match(/OS (\d+)_\d+/);
  if (!navigator.gpu || (ios && !(v && +v[1] >= 27))) { el.parentNode.removeChild(el); return null; }
  // In the theme picked on the home page (the same site, so its choice is to
  // hand): tumeric's amber, or cheshire's violet, the site's default.
  try { if (localStorage.getItem('heroVariant') === 'tumeric') el.classList.add('tumeric'); } catch (e) {}
  var WORD = 'loading', NOISE = '.,:;i1tfLCG08@#$%&*+=<>/\\|?';
  var pct = el.firstChild, cell = el.lastChild.children, tail = cell[WORD.length];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = Date.now(), typed = 160 + WORD.length * 70, gone = false, files = null;
  var base = 2, ceil = 9, tau = 1500, since = t0, shown = 0;
  var fx = null, fxAt = typed + 400 + Math.random() * 800, was = [], turned = [];
  function rnd(n) { return Math.floor(Math.random() * n); }
  // One flicker: capitals on a run of letters (DING or ING, one letter, two,
  // or the lot), or a letter or two flipped or glitched; on and off a few
  // times, then back. Capitals hold a little longer, to be read.
  function flicker(ms) {
    var n = WORD.length, r = Math.random(), kind = r < .55 ? 'caps' : r < .85 ? 'flip' : 'noise';
    var a = kind === 'flip' ? 2 + rnd(n - 2) : rnd(n), b = a + 1, on = [], t = 0;
    r = Math.random();
    if (kind === 'caps' && r < .4) { a = 3 + rnd(2); b = n; }
    else if (kind === 'caps' && r < .5) { a = 0; b = n; }
    else if (r > .8) b = Math.min(n, a + 2);
    for (var k = 1 + rnd(3); k > 0; k--) {
      var d = kind === 'caps' ? 110 + rnd(140) : 40 + rnd(90);
      on.push([t, t + d]);
      t += d + (kind === 'caps' ? 70 : 40) + rnd(60);
    }
    return { kind: kind, a: a, b: b, flip: rnd(2) ? 'x' : 'y', at: ms, on: on, end: ms + t };
  }
  function draw() {
    if (gone) return;
    var now = Date.now(), ms = now - t0, dt = now - since, lit = false;
    shown = Math.max(shown, base + (ceil - base) * dt / (dt + tau));
    pct.textContent = Math.min(99, Math.floor(shown)) + '%';
    if (!still && ms >= typed) {
      if (!fx && ms >= fxAt) fx = flicker(ms);
      if (fx && ms >= fx.end) { fx = null; fxAt = ms + 500 + Math.random() * 1300; }
      for (var j = 0; fx && j < fx.on.length; j++) if (ms - fx.at >= fx.on[j][0] && ms - fx.at < fx.on[j][1]) lit = true;
    }
    for (var k = 0; k < WORD.length; k++) {
      var c = WORD.charAt(k), how = '', hit = lit && k >= fx.a && k < fx.b;
      if (hit && fx.kind === 'caps') c = c.toUpperCase();
      if (hit && fx.kind === 'flip') how = fx.flip;
      // A letter changing case runs through a few random characters first.
      if (c !== was[k]) { if (was[k]) turned[k] = ms; was[k] = c; }
      if (!still && (ms < 160 + k * 70 || (hit && fx.kind === 'noise') || ms - turned[k] < 60)) c = NOISE.charAt(rnd(NOISE.length));
      if (cell[k].textContent !== c) cell[k].textContent = c;
      if (cell[k].className !== how) cell[k].className = how;
    }
    tail.textContent = still ? '..._' : (ms < typed ? '' : '...'.slice(0, Math.floor((ms - typed) / 380) % 4)) + (Math.floor(ms / 530) % 2 ? ' ' : '_');
    requestAnimationFrame(draw);
  }
  // (A beat before it shows, so a quick start never flashes it.)
  var show = setTimeout(function () { el.classList.add('in'); }, 120);
  // Away quickly, from wherever it's got to: the piece comes first.
  function stop() {
    if (gone) return;
    gone = true;
    clearTimeout(show);
    if (files) files.disconnect();
    el.classList.add('out');
    el.classList.remove('in');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  // At v and creeping toward c, half way there after t ms, until the next.
  function step(v, c, t) { if (v > base) { base = v; ceil = c; tau = t || 1200; since = Date.now(); } }
  try {
    files = new PerformanceObserver(function (list) {
      list.getEntries().forEach(function () { if (base < 9) step(Math.min(9, base + 2), 9, 1500); });
    });
    files.observe({ type: 'resource' });
  } catch (e) {}
  var api = {
    step: step,
    // The piece is on screen: out of its way at once, reading 100% as it goes,
    // however far the loader had got (typing, fading in, or not yet shown).
    done: function () { pct.textContent = '100%'; stop(); },
    stop: stop
  };
  // Where controls.js never came to move it on, it doesn't stay.
  document.addEventListener('DOMContentLoaded', function () { if (!api.steered) stop(); });
  draw();
  return api;
})();
</script>

<script type="module">
import { init, effect, surface, target, sampler, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

// ═══════════════════════════════════════
// SHADERS — a stable-fluids solver (Stam), one small effect per step.
// Velocity lives on a coarse grid of square cells, in screen-height units per
// second, with y pointing down the screen like uv. Ink lives on a finer grid
// as the amount of red, green and blue light it absorbs.
// ═══════════════════════════════════════
const ADVECT = /* wgsl */ `
struct A { dt: f32, keep: f32, aspect: f32 }
@group(0) @binding(0) var<uniform> a: A;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var vel: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let v = textureSampleLevel(vel, samp, uv, 0.0).xy;
  let back = uv - a.dt * vec2f(v.x / a.aspect, v.y);
  return textureSampleLevel(src, samp, back, 0.0) * a.keep;
}
`;

const SPLAT = /* wgsl */ `
struct S { pos: vec2f, radius: f32, aspect: f32, value: vec3f, on: f32 }
@group(0) @binding(0) var<uniform> s: S;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let d = (uv - s.pos) * vec2f(s.aspect, 1.0);
  let g = exp(-dot(d, d) / (s.radius * s.radius)) * s.on;
  let c = textureSampleLevel(src, samp, uv, 0.0);
  return vec4f(c.rgb + s.value * g, 1.0);
}
`;

// Ink is heavier than water: it sinks along gravity in proportion to how
// much of it there is. Tilting the phone turns gravity.
const BODY = /* wgsl */ `
struct B { gravity: vec2f, dt: f32 }
@group(0) @binding(0) var<uniform> b: B;
@group(0) @binding(1) var vel: texture_2d<f32>;
@group(0) @binding(2) var ink: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let v = textureSampleLevel(vel, samp, uv, 0.0);
  let i = textureSampleLevel(ink, samp, uv, 0.0).rgb;
  let density = min(i.r + i.g + i.b, 3.0);
  return vec4f(v.xy + b.gravity * density * b.dt, 0.0, 1.0);
}
`;

const GRID = /* wgsl */ `
struct G { texel: vec2f, h: f32, dt: f32, amount: f32 }
@group(0) @binding(0) var<uniform> g: G;
`;

const CURL = GRID + /* wgsl */ `
@group(0) @binding(1) var vel: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let l = textureSampleLevel(vel, samp, uv - vec2f(g.texel.x, 0.0), 0.0).y;
  let r = textureSampleLevel(vel, samp, uv + vec2f(g.texel.x, 0.0), 0.0).y;
  let u = textureSampleLevel(vel, samp, uv - vec2f(0.0, g.texel.y), 0.0).x;
  let d = textureSampleLevel(vel, samp, uv + vec2f(0.0, g.texel.y), 0.0).x;
  return vec4f(((r - l) - (d - u)) / (2.0 * g.h), 0.0, 0.0, 1.0);
}
`;

// Vorticity confinement: puts back the small eddies the coarse grid smears
// out, which is what makes ink curl instead of just blurring.
const VORT = GRID + /* wgsl */ `
@group(0) @binding(1) var vel: texture_2d<f32>;
@group(0) @binding(2) var curl: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let l = abs(textureSampleLevel(curl, samp, uv - vec2f(g.texel.x, 0.0), 0.0).x);
  let r = abs(textureSampleLevel(curl, samp, uv + vec2f(g.texel.x, 0.0), 0.0).x);
  let u = abs(textureSampleLevel(curl, samp, uv - vec2f(0.0, g.texel.y), 0.0).x);
  let d = abs(textureSampleLevel(curl, samp, uv + vec2f(0.0, g.texel.y), 0.0).x);
  let w = textureSampleLevel(curl, samp, uv, 0.0).x;
  var n = vec2f(r - l, d - u);
  n = n / (length(n) + 1e-5);
  // Scaled by the cell size so the push is proportional to the local flow.
  let f = g.amount * g.h * w * vec2f(n.y, -n.x);
  let v = textureSampleLevel(vel, samp, uv, 0.0).xy;
  return vec4f(v + f * g.dt, 0.0, 1.0);
}
`;

const DIVERGE = GRID + /* wgsl */ `
@group(0) @binding(1) var vel: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let l = textureSampleLevel(vel, samp, uv - vec2f(g.texel.x, 0.0), 0.0).x;
  let r = textureSampleLevel(vel, samp, uv + vec2f(g.texel.x, 0.0), 0.0).x;
  let u = textureSampleLevel(vel, samp, uv - vec2f(0.0, g.texel.y), 0.0).y;
  let d = textureSampleLevel(vel, samp, uv + vec2f(0.0, g.texel.y), 0.0).y;
  return vec4f(((r - l) + (d - u)) / (2.0 * g.h), 0.0, 0.0, 1.0);
}
`;

const PRESSURE = GRID + /* wgsl */ `
@group(0) @binding(1) var pres: texture_2d<f32>;
@group(0) @binding(2) var div: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let l = textureSampleLevel(pres, samp, uv - vec2f(g.texel.x, 0.0), 0.0).x;
  let r = textureSampleLevel(pres, samp, uv + vec2f(g.texel.x, 0.0), 0.0).x;
  let u = textureSampleLevel(pres, samp, uv - vec2f(0.0, g.texel.y), 0.0).x;
  let d = textureSampleLevel(pres, samp, uv + vec2f(0.0, g.texel.y), 0.0).x;
  let dv = textureSampleLevel(div, samp, uv, 0.0).x;
  return vec4f((l + r + u + d - dv * g.h * g.h) * 0.25, 0.0, 0.0, 1.0);
}
`;

const PROJECT = GRID + /* wgsl */ `
@group(0) @binding(1) var pres: texture_2d<f32>;
@group(0) @binding(2) var vel: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let l = textureSampleLevel(pres, samp, uv - vec2f(g.texel.x, 0.0), 0.0).x;
  let r = textureSampleLevel(pres, samp, uv + vec2f(g.texel.x, 0.0), 0.0).x;
  let u = textureSampleLevel(pres, samp, uv - vec2f(0.0, g.texel.y), 0.0).x;
  let d = textureSampleLevel(pres, samp, uv + vec2f(0.0, g.texel.y), 0.0).x;
  let v = textureSampleLevel(vel, samp, uv, 0.0).xy - vec2f(r - l, d - u) / (2.0 * g.h);
  // Walls: stop flow through the screen edges.
  let e = g.texel * 1.5;
  var w = v;
  if (uv.x < e.x || uv.x > 1.0 - e.x) { w.x = 0.0; }
  if (uv.y < e.y || uv.y > 1.0 - e.y) { w.y = 0.0; }
  return vec4f(w, 0.0, 1.0);
}
`;

// Ink absorbs light, so thicker ink is darker in its own colour; the glow
// palette flips that and lets ink emit instead. A little shading from the
// ink's slope gives the clouds some body.
const DISPLAY = /* wgsl */ `
struct D { paper: vec3f, emissive: f32, texel: vec2f, aspect: f32, time: f32 }
@group(0) @binding(0) var<uniform> d: D;
@group(0) @binding(1) var ink: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let i = max(textureSampleLevel(ink, samp, uv, 0.0).rgb, vec3f(0.0));
  let sx = textureSampleLevel(ink, samp, uv + vec2f(d.texel.x * 2.0, 0.0), 0.0).rgb - textureSampleLevel(ink, samp, uv - vec2f(d.texel.x * 2.0, 0.0), 0.0).rgb;
  let sy = textureSampleLevel(ink, samp, uv + vec2f(0.0, d.texel.y * 2.0), 0.0).rgb - textureSampleLevel(ink, samp, uv - vec2f(0.0, d.texel.y * 2.0), 0.0).rgb;
  let slope = dot(sx + sy, vec3f(0.333));
  let bg = d.paper * (1.0 - 0.18 * smoothstep(0.3, 1.1, length((uv - 0.5) * vec2f(d.aspect, 1.0))));
  var col: vec3f;
  if (d.emissive > 0.5) {
    col = bg + (1.0 - exp(-i * 1.4)) * 1.1 + max(slope, 0.0) * 0.4;
  } else {
    col = bg * exp(-i * 1.6) * (1.0 + clamp(slope * 0.8, -0.25, 0.25));
  }
  let n = fract(sin(dot(pos.xy, vec2f(12.9898, 78.233)) + d.time) * 43758.5453) - 0.5;
  return vec4f(col + n * 0.012, 1.0);
}
`;

// ═══════════════════════════════════════
// INKS — paper colour and the inks one stroke cycles through (as the
// colour you see; absorbing inks are converted to what they absorb).
// ═══════════════════════════════════════
const PALETTES = {
  indigo:   { paper: [0.93, 0.94, 0.92], inks: [[0.12, 0.2, 0.55], [0.2, 0.35, 0.7]], emissive: 0 },
  marbling: { paper: [0.95, 0.92, 0.86], inks: [[0.75, 0.12, 0.15], [0.1, 0.3, 0.65], [0.95, 0.7, 0.1], [0.1, 0.5, 0.45]], emissive: 0 },
  sumi:     { paper: [0.92, 0.9, 0.84], inks: [[0.05, 0.05, 0.06], [0.25, 0.24, 0.24]], emissive: 0 },
  glow:     { paper: [0.0, 0.015, 0.035], inks: [[0.1, 0.9, 0.8], [0.3, 0.4, 1.0], [0.8, 0.25, 0.9]], emissive: 1 },
};

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');

const p = {};
function readControls() {
  p.amount = 0.4 + +$('amount').value / 100 * 1.6;
  p.swirl = +$('swirl').value / 100 * 30;
  p.sink = +$('sink').value / 100 * 1.2;
  // Fraction of ink kept per frame: 0.99 fades in a second, 0.9998 lingers for a minute.
  p.linger = 0.99 + Math.sqrt(+$('linger').value / 100) * 0.0098;
  p.drips = +$('drips').value / 100;
  p.palette = PALETTES[$('palette').value];
  for (const id of ['amount', 'swirl', 'sink', 'linger', 'drips']) $(id + 'Val').textContent = $(id).value;
}
readControls();

const tl = tilt();
let inkIndex = 0;
function nextInk(scale) {
  const pal = p.palette;
  const c = pal.inks[inkIndex++ % pal.inks.length];
  // Absorbing ink: absorb what it doesn't reflect. Glowing ink: emit its colour.
  const v = pal.emissive ? c : c.map((x) => (1 - x) * 1.2);
  return v.map((x) => x * scale * p.amount);
}

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(4.5e6) });
const linear = sampler(gpu, { minFilter: 'linear', magFilter: 'linear' });
const F = 'rgba16float';

// Grids keep the screen's aspect so their cells stay square.
const VEL_H = 150, INK_H = 720;
let aspect = 1;
const velSize = () => [Math.max(8, Math.round(VEL_H * aspect)), VEL_H];
const inkSize = () => {
  const h = Math.min(INK_H, Math.max(64, surf.size[1]));
  return [Math.max(8, Math.round(h * aspect)), h];
};
const mk = (size) => target(gpu, { size, format: F });
let velA = mk(velSize()), velB = mk(velSize()), inkA = mk(inkSize()), inkB = mk(inkSize());
const presA = mk(velSize()), presB = mk(velSize()), curlT = mk(velSize()), divT = mk(velSize());

const gridU = () => ({ texel: [1 / velA.size[0], 1 / velA.size[1]], h: 1 / velA.size[1], dt: 1 / 60, amount: p.swirl });
const advV = effect(gpu, ADVECT, { set: { a: { dt: 1 / 60, keep: 0.999, aspect }, samp: linear } });
const advI = effect(gpu, ADVECT, { set: { a: { dt: 1 / 60, keep: p.linger, aspect }, samp: linear } });
const splatV = effect(gpu, SPLAT, { set: { s: { pos: [0.5, 0.5], radius: 0.05, aspect, value: [0, 0, 0], on: 0 }, samp: linear } });
const splatI = effect(gpu, SPLAT, { set: { s: { pos: [0.5, 0.5], radius: 0.05, aspect, value: [0, 0, 0], on: 0 }, samp: linear } });
const body = effect(gpu, BODY, { set: { b: { gravity: [0, 0], dt: 1 / 60 }, samp: linear } });
const curlE = effect(gpu, CURL, { set: { g: gridU(), samp: linear } });
const vortE = effect(gpu, VORT, { set: { g: gridU(), samp: linear } });
const divE = effect(gpu, DIVERGE, { set: { g: gridU(), samp: linear } });
const presE = effect(gpu, PRESSURE, { set: { g: gridU(), samp: linear } });
const projE = effect(gpu, PROJECT, { set: { g: gridU(), samp: linear } });
const show = effect(gpu, DISPLAY, { set: { d: { paper: p.palette.paper, emissive: p.palette.emissive, texel: [1 / inkA.size[0], 1 / inkA.size[1]], aspect, time: 0 }, samp: linear } });

let needClear = true;
surf.onResize(({ width, height }) => {
  aspect = width / height;
  for (const tgt of [velA, velB, presA, presB, curlT, divT]) tgt.resize(velSize());
  inkA.resize(inkSize()); inkB.resize(inkSize());
  const gu = gridU();
  for (const e of [curlE, vortE, divE, presE, projE]) e.set({ g: gu });
  advV.set({ a: { aspect } }); advI.set({ a: { aspect } });
  splatV.set({ s: { aspect } }); splatI.set({ s: { aspect } });
  show.set({ d: { aspect, texel: [1 / inkA.size[0], 1 / inkA.size[1]] } });
  needClear = true;   // vgpu resizes at the start of a frame; clear inside it
});

function applyControls() {
  readControls();
  advI.set({ a: { keep: p.linger } });
  const gu = gridU();
  for (const e of [curlE, vortE, divE, presE, projE]) e.set({ g: gu });
  show.set({ d: { paper: p.palette.paper, emissive: p.palette.emissive } });
}

// ═══════════════════════════════════════
// INPUT: drags stir and ink, drips fall on their own
// ═══════════════════════════════════════
const queue = [];
let last = null, dragging = false;
function toUV(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
canvas.addEventListener('pointerdown', (e) => {
  dragging = true; last = toUV(e); canvas.setPointerCapture(e.pointerId);
  queue.push({ pos: last, vel: [0, 0], ink: nextInk(1.4), radius: 0.035 });
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = toUV(e);
  const dv = [(now[0] - last[0]) * aspect * 60 * 1.6, (now[1] - last[1]) * 60 * 1.6];
  if (Math.hypot(dv[0], dv[1]) > 0.02) queue.push({ pos: now, vel: dv, ink: nextInk(0.5), radius: 0.028 });
  last = now;
});
const release = () => { dragging = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

function drip() {
  const x = 0.15 + Math.random() * 0.7;
  queue.push({ pos: [x, 0.08 + Math.random() * 0.25], vel: [(Math.random() - 0.5) * 0.4, 0.6 + Math.random() * 0.6], ink: nextInk(1.1), radius: 0.03 + Math.random() * 0.025 });
}

// ═══════════════════════════════════════
// FRAME
// ═══════════════════════════════════════
const clk = clock(gpu);
let fpsCount = 0, fpsAt = performance.now(), t = 0;

function pass(f, tgt, fx) { f.pass(tgt, fx); }

function clearAll(f) {
  needClear = false;
  for (const tgt of [velA, velB, inkA, inkB, presA, presB]) f.pass({ target: tgt, clear: [0, 0, 0, 1] }, () => {});
}

function simulate(f) {
  if (needClear) clearAll(f);
  let s;
  // splats: one per field per frame, the rest wait their turn
  if ((s = queue.shift())) {
    splatV.set({ s: { pos: s.pos, radius: s.radius, value: [s.vel[0], s.vel[1], 0], on: 1 }, src: velA });
    pass(f, velB, splatV); [velA, velB] = [velB, velA];
    splatI.set({ s: { pos: s.pos, radius: s.radius, value: s.ink, on: 1 }, src: inkA });
    pass(f, inkB, splatI); [inkA, inkB] = [inkB, inkA];
  }
  const down = tl.active && Math.hypot(tl.x, tl.y) > 0.15 ? [tl.x, tl.y] : [0, 1];
  body.set({ b: { gravity: [down[0] * p.sink, down[1] * p.sink] }, vel: velA, ink: inkA });
  pass(f, velB, body); [velA, velB] = [velB, velA];

  curlE.set({ vel: velA }); pass(f, curlT, curlE);
  vortE.set({ vel: velA, curl: curlT }); pass(f, velB, vortE); [velA, velB] = [velB, velA];

  divE.set({ vel: velA }); pass(f, divT, divE);
  f.pass({ target: presA, clear: [0, 0, 0, 1] }, () => {});
  let pa = presA, pb = presB;
  for (let i = 0; i < 20; i++) {
    presE.set({ pres: pa, div: divT }); pass(f, pb, presE); [pa, pb] = [pb, pa];
  }
  projE.set({ pres: pa, vel: velA }); pass(f, velB, projE); [velA, velB] = [velB, velA];

  advV.set({ src: velA, vel: velA }); pass(f, velB, advV); [velA, velB] = [velB, velA];
  advI.set({ src: inkA, vel: velA }); pass(f, inkB, advI); [inkA, inkB] = [inkB, inkA];
}

function render(f) {
  show.set({ ink: inkA, d: { time: t % 100 } });
  f.pass(surf, show);
}

let loop = null, playing = false, dripClock = 0;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  dripClock += dt * p.drips;
  if (dripClock > 0.9) { dripClock = 0; drip(); }
  simulate(f);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const id of ['amount', 'swirl', 'sink', 'linger', 'drips']) $(id).addEventListener('input', applyControls);
$('palette').addEventListener('change', () => {
  // Absorbing and glowing inks store different things, so start clean.
  needClear = true;
  queue.length = 0;
  applyControls();
  for (let i = 0; i < 3; i++) drip();
});
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => {
  needClear = true;
  queue.length = 0;
  for (let i = 0; i < 3; i++) drip();
  if (!playing) frame(gpu, (f) => { clearAll(f); render(f); });
});
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'ink-in-water-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

applyControls();
for (let i = 0; i < 3; i++) drip();
togglePlay();
</script>
</body>
</html>
