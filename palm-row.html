<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Palm Row — WebGPU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .panel{
    position:fixed;bottom:20px;right:20px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(10,10,12,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:12px;
    padding:18px 16px;width:220px;max-height:calc(100vh - 40px);overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;transition:transform 0.3s ease;z-index:10;
  }
  .panel.hidden{transform:translateX(calc(100% + 40px))}
  .panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-track{background:transparent}.panel::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  .control-group{display:flex;flex-direction:column;gap:3px}
  .control-group label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555}
  .control-group .val{font-family:'Space Mono',monospace;font-size:9px;color:#777;float:right;letter-spacing:0}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#222;border-radius:2px;outline:none;touch-action:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  select{background:#151518;color:#ccc;border:1px solid #2a2a2f;padding:8px 10px;border-radius:6px;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;outline:none;width:100%}
  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
  .btn:hover{background:#fff;color:#000;border-color:#fff}.btn:active{transform:scale(.97)}
  .btn.primary{background:#fff;color:#000;border-color:#fff}.btn.primary:hover{background:transparent;color:#fff}
  .btn.playing{background:#2ecc40;color:#000;border-color:#2ecc40}.btn.playing:hover{background:#27ae60;border-color:#27ae60}
  .btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
  .hint-pill{position:fixed;bottom:20px;left:20px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#444;border:1px solid #2a2a2f;padding:6px 14px;border-radius:20px;background:rgba(10,10,12,0.6);z-index:10;pointer-events:none;animation:fadeHint 4s forwards}
  @keyframes fadeHint{0%,60%{opacity:1}100%{opacity:0}}
  .hint-pill.show{animation:fadeHint 4s forwards}
  .fps{position:fixed;top:8px;right:8px;font-family:'Space Mono',monospace;font-size:10px;color:#333;pointer-events:none;z-index:10}
  .nogpu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;line-height:1.8;color:#666}
  .nogpu.on{display:flex}
</style>
<script src="controls.js" defer></script>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="panel" id="panel">
  <div class="control-group"><label>Palette</label>
    <select id="palette">
      <option value="original" selected>Original</option>
      <option value="noon">Noon</option>
      <option value="night">Night</option>
    </select>
  </div>
  <div class="control-group"><label>Wind <span class="val" id="windVal">40</span></label><input type="range" id="wind" min="0" max="100" value="40"></div>
  <div class="control-group"><label>Brush <span class="val" id="brushVal">45</span></label><input type="range" id="brush" min="0" max="100" value="45"></div>
  <div class="control-group"><label>Palms <span class="val" id="palmsVal">70</span></label><input type="range" id="palms" min="0" max="100" value="70"></div>
  <div class="control-group"><label>Grain <span class="val" id="grainVal">30</span></label><input type="range" id="grain" min="0" max="100" value="30"></div>
  <div class="btn-row">
    <button class="btn" id="playPause"><svg id="playIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg><svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg><span id="playLabel">Play</span></button>
    <button class="btn primary" id="generate">Generate</button>
    <button class="btn" id="save">PNG</button>
  </div>
</div>
<div class="hint-pill" id="hintPill">Swipe for a gust · Tilt for depth · H controls</div>
<div class="fps" id="fps"></div>
<div class="nogpu" id="nogpu">This one runs on WebGPU, which this browser doesn't offer yet.<br>Try a recent Chrome, Edge or Safari.</div>

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Palm Row: a line of tall palms against a coral sky that fades to mint
// mist, over a pointillist hillside. Trunks are strings of alternating
// dots, heads are shaggy teal and green bursts that toss in the wind, and
// the hill is built entirely of round dabs.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // wind, brush, grain, gust
  c: vec4f,   // tilt x, y, zoom, palm count
  cols: array<vec4f, 20>,
}
@group(0) @binding(0) var<uniform> u: U;

@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn pick(r: f32, a: i32, n: i32) -> vec3f { return C(a + min(i32(floor(r * f32(n))), n - 1)); }

@diagnostic(off, derivative_uniformity) fn hillTop(x: f32) -> f32 {
  return 0.2 - 0.26 * smoothstep(-0.05, -0.75, x) + 0.02 * sin(x * 9.0 + u.a.w) + 0.012 * sin(x * 23.0);
}
// Palm i: x of base, height, scale (0.6 far .. 1 near).
@diagnostic(off, derivative_uniformity) fn palmX(i: i32) -> f32 { return -0.72 + f32(i) * 0.145 + 0.04 * (hash1(f32(i) + u.a.w) - 0.5); }
@diagnostic(off, derivative_uniformity) fn palmScale(i: i32) -> f32 { return select(1.0, 0.72, (i + i32(u.a.w)) % 3 == 1); }
@diagnostic(off, derivative_uniformity) fn palmBase(i: i32) -> vec2f { let x = palmX(i); return vec2f(x, hillTop(x) + 0.03); }
@diagnostic(off, derivative_uniformity) fn palmHead(i: i32) -> vec2f {
  let b = palmBase(i);
  let s = palmScale(i);
  // Never taller than the frame allows.
  let h = min((0.5 + 0.18 * hash1(f32(i) * 3.3 + u.a.w)) * s, b.y + 0.36);
  let sw = u.b.x * 0.018 * sin(u.a.x * 1.1 + f32(i) * 0.8) + u.b.w * 0.03;
  return b + vec2f(0.03 * (hash1(f32(i) * 7.1) - 0.5) + sw, -h);
}
@diagnostic(off, derivative_uniformity) fn headD(i: i32, q: vec2f) -> f32 {
  let c = palmHead(i);
  let s = palmScale(i);
  let v = q - c;
  let a = atan2(v.y, v.x);
  // A shaggy, uneven clump: slow lumps plus ragged frond tips.
  let lump = 0.28 * (vnoise(vec2f(a * 1.6 + f32(i) * 5.0, u.a.x * 0.4)) - 0.5);
  let rag = 0.14 * (vnoise(vec2f(a * 9.0 + f32(i) * 3.0, u.a.x * 0.8)) - 0.5) * (0.6 + 0.6 * u.b.x);
  let R = 0.105 * s * (1.0 + lump + rag);
  // Fronds droop: the head hangs lower on its underside.
  return length(v / vec2f(1.15, select(0.85, 1.3, v.y > 0.0))) - R;
}

const SUN = vec2f(0.3, -0.43);
// A far ridge in the mist behind the hill.
@diagnostic(off, derivative_uniformity) fn farHill(x: f32) -> f32 { return 0.04 + 0.05 * sin(x * 2.6 + u.a.w * 1.7) + 0.02 * sin(x * 7.3 + 1.0) + 0.006 * sin(x * 31.0); }
// Stepped sky: coral bands at the top giving way to mint mist.
@diagnostic(off, derivative_uniformity) fn skyField(q: vec2f) -> f32 { return (q.y + 0.56) * 5.6 + 1.6 * vnoise(q * vec2f(2.2, 4.5) + u.a.w + vec2f(u.a.x * 0.01, 0.0)); }
@diagnostic(off, derivative_uniformity) fn ramp(v: f32, r: f32, a: i32, n: i32) -> vec3f {
  let b = clamp(i32(floor(v)) + select(0, 1, r > 0.94), 0, n - 1);
  return C(a + b);
}

@diagnostic(off, derivative_uniformity) fn scene(q: vec2f, r: f32) -> Paint {
  var P: Paint;
  let n = i32(u.c.w);
  // Nearest palms win: draw order far (small) first, so check near last.
  var hit = -1;
  for (var i = 0; i < 12; i++) {
    if (i >= n) { break; }
    if (headD(i, q) < 0.0 && (hit < 0 || palmScale(i) >= palmScale(hit))) { hit = i; }
  }
  if (hit >= 0) {
    let c = palmHead(hit);
    var col = select(pick(r * 1.05, 6, 4), C(10), r > 0.95);
    // Far palms sink into the mist.
    col = mix(col, C(4), (1.0 - palmScale(hit)) * 1.3);
    P.col = col;
    P.ang = atan2(q.y - c.y, q.x - c.x);
    P.fine = 1.0;
    return P;
  }
  if (q.y > hillTop(q.x)) {
    // Swirls of colour run through the dots.
    let n1 = vnoise(q * 7.0 + u.a.w);
    // Mostly yellow, teal and dark green, with the odd orange dot.
    var hc = select(select(C(13), C(14), r < 0.55), C(16), r < 0.25);
    if (r > 0.8) { hc = select(C(17), C(15), r > 0.92); }
    P.col = mix(hc, C(16), smoothstep(0.55, 0.8, n1) * 0.6);
    P.ang = r * 6.28;
    P.fine = 2.0;
    return P;
  }
  if (q.y > farHill(q.x)) {
    P.col = mix(mix(C(4), C(6), 0.28), C(3), select(0.0, 0.3, r > 0.6));
    P.ang = 0.05 + (r - 0.5) * 0.3;
    P.fine = 0.0;
    return P;
  }
  if (length(q - SUN) < 0.05) {
    P.col = mix(C(0), vec3f(1.0, 0.96, 0.86), select(0.45, 0.7, r > 0.5));
    P.ang = r * 6.28;
    P.fine = 0.0;
    return P;
  }
  P.col = ramp(skyField(q), r, 0, 6);
  P.ang = 1.1 + (r - 0.5) * 0.9;
  P.fine = 0.0;
  return P;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let asp = u.a.y; let px = u.a.z; let k = u.c.z;
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let s = p * k + u.c.xy * 0.01;
  let pxs = px * k;
  let br = u.b.y;
  var col = scene(s, 0.5).col;
  col = paintLayer(s, 0.02 * br, 0.95, 0.32, 1.0, pxs, col, false);
  // Trunks: strings of dots, yellow and brown, bending with the head.
  let n = i32(u.c.w);
  for (var i = 0; i < 12; i++) {
    if (i >= n) { break; }
    let b0 = palmBase(i);
    let h0 = palmHead(i);
    let sc = palmScale(i);
    let v = h0 - b0;
    let L = length(v);
    let dir = v / L;
    let nrm = vec2f(-dir.y, dir.x);
    let rel = s - b0;
    let along = dot(rel, dir);
    if (along > -0.01 && along < L - 0.03 * sc) {
      let tt = along / L;
      let bow = sin(tt * 3.14159) * 0.02 * sc;
      let across = dot(rel, nrm) - bow;
      let step = 0.011 * sc;
      let k0 = round(along / step);
      let dd = length(vec2f(along - k0 * step, across)) - 0.0048 * sc;
      var tc = select(C(12), C(11), (i32(k0) % 2) == 0);
      tc = mix(tc, C(4), (1.0 - sc) * 1.2);
      col = mix(col, mix(C(4), C(12), 0.5 + 0.5 * sc), fillA(abs(across) - 0.0042 * sc, pxs) * 0.5);
      col = mix(col, tc, fillA(dd, pxs));
    }
  }
  col = paintLayer(s, 0.0082 * br, 0.95, 0.3, 2.0, pxs, col, true);
  let t = u.a.x;
  // Flowers on the hill, larger toward the foreground, with inked centres.
  let hts = hillTop(s.x);
  if (s.y > hts + 0.02) {
    let depth = clamp((s.y - hts) / 0.3, 0.0, 1.0);
    let fcell = 0.034;
    let fid = floor(vec2f(s.x, s.y) / fcell);
    let fh = hash21(fid + u.a.w + 3.0);
    if (fh > 0.45) {
      let fc = (fid + 0.5 + (vec2f(hash21(fid + 1.3), hash21(fid + 2.9)) - 0.5) * 0.45) * fcell;
      let v = s - fc;
      let rad = fcell * (0.16 + 0.1 * fh) * (0.7 + 0.6 * depth);
      let pa = atan2(v.y, v.x) + fh * 9.0 + 0.3 * sin(t * 0.8 + fh * 20.0) * u.b.x;
      let petal = length(v) - rad * (0.72 + 0.32 * cos(pa * select(5.0, 6.0, fh > 0.75)));
      let pc = select(select(C(13), C(15), fh > 0.7), C(5), fh > 0.9);
      col = mix(col, pc, fillA(petal, pxs));
      col = mix(col, INK, strokeA(petal, pxs * 0.45, pxs) * 0.7);
      col = mix(col, select(C(16), C(12), fh > 0.7), fillA(length(v) - rad * 0.28, pxs));
    }
  }
  // Birds over the mist.
  for (var i = 0; i < 5; i++) {
    let fi = f32(i);
    let bx = fract(0.1 + fi * 0.23 + t * (0.006 + 0.003 * hash1(fi)) * (1.0 + u.b.x)) * 1.8 - 0.9;
    let by = -0.36 + 0.3 * hash1(fi * 3.0 + u.a.w) + 0.01 * sin(t * 0.6 + fi);
    col = mix(col, INK, bird(s, vec2f(bx, by), 0.016 + 0.007 * hash1(fi * 5.0), sin(t * 3.0 + fi * 2.0), pxs) * 0.85);
  }
  // Ink plate: sky hairlines, the hill line and the palm heads, off register.
  let so = s + MISREG;
  var ink = 0.0;
  let ht = hillTop(so.x);
  ink = max(ink, bandLines(skyField(so), pxs) * 0.4 * step(so.y, ht));
  ink = max(ink, strokeA(so.y - ht, pxs * 0.8, pxs));
  ink = max(ink, strokeA(so.y - farHill(so.x), pxs * 0.6, pxs) * step(so.y, ht) * 0.7);
  // Head outlines, hidden where a nearer head covers them.
  var hd: array<f32, 12>;
  for (var i = 0; i < 12; i++) { hd[i] = select(1e3, headD(i, so), i < n); }
  for (var i = 0; i < 12; i++) {
    if (i >= n) { break; }
    var shown = 1.0;
    for (var j = 0; j < 12; j++) {
      if (j >= n) { break; }
      let nearer = palmScale(j) > palmScale(i) || (palmScale(j) == palmScale(i) && j > i);
      if (nearer) { shown = min(shown, fillA(-hd[j], pxs)); }
    }
    ink = max(ink, strokeA(hd[i], pxs * 0.8, pxs) * (0.35 + 0.65 * palmScale(i)) * shown);
    // Frond ribs fanning from the crown.
    if (hd[i] < 0.0 && shown > 0.0) {
      let v = so - palmHead(i);
      let rr = length(v);
      let R = 0.105 * palmScale(i);
      let a = atan2(v.y, v.x) + f32(i) * 0.7 + rr / R * 0.5;
      let rib = abs(fract(a * 13.0 / 6.2832) - 0.5) * 6.2832 / 13.0 * rr;
      let ra = strokeA(rib, pxs * 0.45, pxs) * smoothstep(0.12 * R, 0.4 * R, rr) * fillA(hd[i] + 0.006, pxs) * shown;
      col = mix(col, C(10), ra * (0.3 + 0.5 * palmScale(i)));
    }
  }
  // Sun rings where the sky shows.
  var open = step(so.y, farHill(so.x));
  for (var i = 0; i < 12; i++) { open = min(open, fillA(-hd[i], pxs)); }
  ink = max(ink, (rings(so, SUN, 0.05, 0.011, 3.0, pxs) * 0.55 + strokeA(length(so - SUN) - 0.05, pxs * 0.7, pxs)) * open);
  col = mix(col, INK, ink);
  return vec4f(posterFrame(canvasize(col, pos.xy, u.b.z), uv, asp, px), 1.0);
}

// Brush painter. Each page defines scene(q, r) -> Paint: the colour a dab
// at q should carry (r picks among the region's colours), the direction the
// stroke runs, and whether the region gets a second, finer pass (1 strokes,
// 2 round dots). paintLayer lays one dab per grid cell, each sampling the
// scene at its own centre, so the image is rebuilt from marks.
struct Paint { col: vec3f, ang: f32, fine: f32 }

@diagnostic(off, derivative_uniformity) fn paintLayer(p: vec2f, cell: f32, len: f32, wid: f32, sl: f32, px: f32, base: vec3f, fineOnly: bool) -> vec3f {
  let g = p / cell;
  let id0 = floor(g);
  var col = base;
  var best = -1.0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let id = id0 + vec2f(f32(i), f32(j));
      let h = hash21(id + sl);
      let c = (id + 0.5 + (vec2f(h, hash21(id + sl + 3.7)) - 0.5) * 0.8) * cell;
      let s = scene(c, hash21(id + sl + 7.3));
      if (fineOnly && s.fine < 0.5) { continue; }
      var L = len * cell * (0.7 + 0.5 * hash21(id + sl + 5.3));
      var Wd = wid * cell * (0.75 + 0.5 * h);
      if (s.fine > 1.5) { L = select(0.55, 0.42, fineOnly) * cell * (0.8 + 0.4 * h); Wd = L * 0.85; }
      let a = s.ang + (hash21(id + sl + 9.1) - 0.5) * 0.6;
      let q = rot2(p - c, -a);
      // Tapered stroke: narrows toward both ends, and paint lies a little thin.
      let tx = clamp(abs(q.x) / L, 0.0, 1.0);
      let We = Wd * (1.0 - 0.55 * tx * tx);
      let d = (length(q / vec2f(L, We)) - 1.0) * We;
      let cov = fillA(d, px * 1.1);
      if (cov > 0.0 && h > best) {
        // Flat, silkscreen-like dabs: little tonal jitter, a faint darker rim.
        let dc = s.col * (0.96 + 0.08 * hash21(id + sl + 1.1));
        col = mix(col, dc, cov);
        col = mix(col, dc * 0.78, strokeA(d, px * 0.45, px) * cov * 0.5);
        best = h;
      }
    }
  }
  return col;
}
// Print finish, after Kiyoshi Awazu's silkscreens.
// Canvas: a faint weave on top of the paper grain.
@diagnostic(off, derivative_uniformity) fn canvasize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let w = 0.975 + 0.025 * sin(pos.x * 1.7) * sin(pos.y * 1.7);
  return paperize(col * w, pos, grain);
}
`;

const NAME = 'palm-row';
// sky coral x3, mist x3, heads (dark teal, teal, green, yellow-green), navy, trunk yellow, trunk brown, hill x5, _, _
const PALETTES = {
  original: ['#f28a78', '#f5a594', '#f7c4b0', '#dff0e6', '#bfe3dc', '#f4f0e0', '#1f5a6a', '#2f7a7a', '#4f8a4a', '#9ab84a', '#1a3a4a', '#e8c040', '#8a5a2a', '#e8c040', '#1f6a6a', '#d88a3a', '#2a4a3a', '#8aa04a', '#000000', '#000000'],
  noon:     ['#7fc0e8', '#a8d8f0', '#d8eef8', '#f4f8ec', '#e0f0f0', '#fbf6e4', '#1f5a4a', '#2f7a5a', '#5a9a3a', '#b8c84a', '#1a3a2a', '#f0d050', '#9a6a3a', '#f0d050', '#2a7a5a', '#e0983a', '#2a4a2a', '#a0b04a', '#000000', '#000000'],
  night:    ['#2a2a5a', '#3a3a7a', '#5a4a8a', '#6a7aa8', '#8a9ac0', '#b8c0d8', '#12283a', '#1f3a4a', '#2a4a3a', '#6a7a3a', '#0a1420', '#e8c860', '#5a3a2a', '#e8c860', '#1f3a5a', '#b87a3a', '#1a2a3a', '#5a6a4a', '#000000', '#000000'],
};

const p = {};
function readControls() {
  p.pal = colsOf($('palette').value);
  p.wind = +$('wind').value / 100 * 1.5;
  p.brush = 0.6 + +$('brush').value / 100 * 0.9;
  p.palms = 5 + Math.round(+$('palms').value / 100 * 6);
  p.grain = +$('grain').value / 100 * 0.1;
  for (const id of ['wind', 'brush', 'palms', 'grain']) $(id + 'Val').textContent = $(id).value;
}
let gust = 0, gustGoal = 0;
function generate() {}
function uniforms() {
  const zoom = Math.max(1, 0.9 / aspect);
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.wind, p.brush, p.grain, gust],
    c: [tl.active ? tl.x : 0, tl.active ? tl.y - 0.5 : 0, zoom, p.palms],
    cols: p.pal,
  };
}
function step(dt) {
  gustGoal *= Math.exp(-dt * 1.2);
  gust += (gustGoal - gust) * (1 - Math.exp(-dt * 5));
}
let lastX = 0;
function onDown(q) { lastX = q[0]; }
function onMove(q) { gustGoal = Math.max(-1.5, Math.min(1.5, gustGoal + (q[0] - lastX) * 6)); lastX = q[0]; }
function onUp() {}

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: [1, 2] });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
</body>
</html>
