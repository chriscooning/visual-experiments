<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Bushes after Chris's canvases: a near-black core with stippled highlights
// that thicken toward the lit edge. lit runs 0 (deep shadow) to 1 (sunlit
// rim); cell sets the stipple size. Two offset layers of jittered dots.
fn stippleBush(p: vec2f, lit: f32, cell: f32, px: f32, dark: vec3f, mid: vec3f, hiA: vec3f, hiB: vec3f, warm: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mix(dark, mid, 0.55), smoothstep(0.35, 0.9, l));
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / cell + vec2f(fl * 0.5, fl * 0.37);
    let id = floor(g);
    let h = hash21(id + seed + fl * 7.1);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.3 + fl), hash21(id + 2.7 + fl)) - 0.5) * 0.55;
    let dens = smoothstep(0.05, 0.85, l + (hash21(id + 5.9) - 0.5) * 0.45);
    if (h < 0.4 + 0.6 * dens) {
      let k = hash21(id + 9.1 + fl);
      var dc = select(select(hiA, hiB, k > 0.55), warm, k > 0.95);
      dc = mix(mix(dark, mid, 0.8), dc, smoothstep(0.15, 0.75, l + (h - 0.5) * 0.3));
      let r = (0.24 + 0.2 * hash21(id + 3.3)) * mix(0.8, 1.0, l);
      c = mix(c, dc, fillA((length(f) - r) * cell, px));
    }
  }
  return c;
}
// Shadow pooled on the ground under a clump: a flat ellipse pushed away
// from the sun, longer when the sun is low. Returns coverage.
fn groundShadow(p: vec2f, foot: vec2f, r: f32, side: f32, low: f32, px: f32) -> f32 {
  let len = r * (1.1 + 2.2 * low);
  let c = foot + vec2f(-side * len * 0.55, r * 0.12);
  return fillA((length((p - c) / vec2f(len, r * 0.32)) - 1.0) * r * 0.32, px);
}
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Vineyard Night: a deep blue sky of vertical drips and purple speckle with
// wandering trails of white dots, sage hills edged with dotted scrub, a
// vineyard of dotted rows running to a vanishing point, and a dark
// foreground of dotted brush with spirals of yellow dots.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // drift, brush, grain, trails
  c: vec4f,   // tilt x, y, zoom, _
  d: vec4f,   // touch x, y, strength, _
  cols: array<vec4f, 20>,
}
@group(0) @binding(0) var<uniform> u: U;

@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn pick(r: f32, a: i32, n: i32) -> vec3f { return C(a + min(i32(floor(r * f32(n))), n - 1)); }

@diagnostic(off, derivative_uniformity) fn hillBack(x: f32) -> f32 { return 0.08 - 0.08 * exp(-pow((x + 0.1) / 0.28, 2.0)) - 0.05 * exp(-pow((x - 0.62) / 0.22, 2.0)) + 0.008 * sin(x * 11.0 + u.a.w); }
@diagnostic(off, derivative_uniformity) fn hillFront(x: f32) -> f32 { return 0.15 - 0.035 * exp(-pow((x - 0.3) / 0.3, 2.0)) - 0.02 * exp(-pow((x + 0.55) / 0.2, 2.0)); }
const VP = vec2f(0.02, -0.12);
@diagnostic(off, derivative_uniformity) fn fieldBottom() -> f32 { return 0.3; }
@diagnostic(off, derivative_uniformity) fn fgTop(x: f32) -> f32 {
  let inField = 1.0 - smoothstep(0.25, 0.5, abs(x - 0.02));
  return mix(0.2 + 0.02 * sin(x * 8.0 + u.a.w), 0.31, inField) + 0.02 * (vnoise(vec2f(x * 14.0, u.a.w)) - 0.5);
}
// Scrub: dotted bands along ridge lines crossing the hills.
@diagnostic(off, derivative_uniformity) fn scrub(q: vec2f, top: f32) -> bool {
  let crest = abs(q.y - top - 0.008) < 0.009 * (0.4 + vnoise(vec2f(q.x * 12.0, 1.0)));
  let rid = abs(q.y - (top + 0.04 + 0.05 * sin(q.x * 4.0 + u.a.w * 2.0) - 0.06 * q.x)) < 0.007 * (0.3 + vnoise(vec2f(q.x * 9.0, 3.0)))
            && vnoise(vec2f(q.x * 3.0, u.a.w)) > 0.4;
  return crest || rid;
}

const MOON = vec2f(0.3, -0.36);
// Stepped night sky: whole numbers of this field are band edges.
@diagnostic(off, derivative_uniformity) fn skyField(q: vec2f) -> f32 { return (q.y + 0.6) * 9.0 + 1.6 * vnoise(q * vec2f(2.0, 4.0) + u.a.w + vec2f(u.a.x * u.b.x * 0.004, 0.0)); }
@diagnostic(off, derivative_uniformity) fn fieldEdge(q: vec2f) -> f32 { return abs(q.x - VP.x) - (0.1 + (q.y - hillFront(q.x) - 0.012) * 3.2); }

@diagnostic(off, derivative_uniformity) fn scene(q: vec2f, r: f32) -> Paint {
  var P: Paint;
  let ft = u.a.x * u.b.x;
  let fg = fgTop(q.x);
  if (q.y > fg) {
    var c = pick(r * 1.05, 14, 3);
    if (r > 0.975) { c = C(17); }
    // Bushes: darker lumps.
    c = mix(c, C(14), step(0.6, vnoise(q * 11.0 + u.a.w)) * 0.5);
    P.col = c; P.ang = r * 6.28; P.fine = 2.0;
    return P;
  }
  let hb = hillBack(q.x);
  let hf = hillFront(q.x);
  if (q.y > hf) {
    // Vineyard: rows to the vanishing point, otherwise pale field.
    let dy = q.y - VP.y;
    // The field's top edge runs along the hill's foot; rows converge on a
    // point far beyond it.
    let fieldTop = hf + 0.012;
    if (q.y > fieldTop && abs(q.x - VP.x) < 0.1 + (q.y - fieldTop) * 3.2 && q.y < fieldBottom()) {
      let rowv = (q.x - VP.x) / dy;
      let onRow = abs(fract(rowv * 7.0) - 0.5) < 0.2;
      P.col = select(pick(r, 11, 2), select(C(13), C(12), r > 0.55), onRow);
      P.ang = atan2(dy, q.x - VP.x);
      P.fine = 2.0;
      return P;
    }
    P.col = select(pick(r, 5, 3), pick(r, 8, 3), scrub(q, hf));
    P.ang = 0.1;
    P.fine = select(0.0, 2.0, scrub(q, hf));
    return P;
  }
  if (q.y > hb) {
    let s = scrub(q, hb);
    P.col = select(mix(pick(r, 5, 3), C(2), 0.15), pick(r, 8, 3), s);
    P.ang = -0.1;
    P.fine = select(0.0, 2.0, s);
    return P;
  }
  if (length(q - MOON) < 0.045) {
    P.col = mix(C(4), C(2), select(0.1, 0.35, r > 0.6));
    P.ang = r * 6.28;
    P.fine = 0.0;
    return P;
  }
  // Sky: streaks falling slowly, lavender and white toward the edges.
  let n = vnoise(vec2f(q.x * 9.0, q.y * 1.4 - ft * 0.05) + u.a.w);
  let edge = smoothstep(0.35, 0.8, abs(q.x) + 0.2 * (vnoise(q * 3.0) - 0.5)) + smoothstep(-0.05, 0.08, q.y) * 0.6;
  let band = i32(floor(skyField(q)));
  var c = select(C(0), C(1), (band % 2) == 0);
  if (n < 0.3 && r > 0.5) { c = C(select(1, 0, (band % 2) == 0)); }
  if (r > 0.8) { c = C(3); }
  c = mix(c, select(C(2), C(4), r > 0.6), clamp(edge * (0.4 + 0.6 * r), 0.0, 1.0));
  P.col = c;
  P.ang = 1.5708 + (r - 0.5) * 0.35;
  P.fine = 0.0;
  return P;
}

// Eddies for the foreground currents: centres drift and strengths breathe.
@diagnostic(off, derivative_uniformity) fn eddyC(i: i32, t: f32) -> vec3f {
  let fi = f32(i);
  let c = vec2f(-0.8 + fi * 0.32 + 0.18 * sin(t * 0.06 + fi * 2.1 + u.a.w) + 0.06 * sin(t * 0.17 + fi), 0.37 + 0.08 * sin(t * 0.05 + fi * 1.3));
  let str = sin(t * 0.11 + fi * 1.9 + u.a.w) * (0.7 + 0.3 * hash1(fi + u.a.w));
  return vec3f(c, str);
}
@diagnostic(off, derivative_uniformity) fn eddyAmt(q: vec2f, t: f32) -> f32 {
  var a = 0.0;
  for (var i = 0; i < 6; i++) {
    let e = eddyC(i, t);
    let r = 0.05 + 0.035 * hash1(f32(i) * 3.7 + u.a.w);
    a = max(a, abs(e.z) * exp(-dot(q - e.xy, q - e.xy) / (r * r * 2.0)));
  }
  return a;
}
@diagnostic(off, derivative_uniformity) fn flowField(q: vec2f, t: f32) -> f32 {
  var f = fbm(q * vec2f(2.0, 3.0) + vec2f(t * 0.02, -t * 0.013) + u.a.w) * 0.5;
  for (var i = 0; i < 6; i++) {
    let e = eddyC(i, t);
    let r = 0.05 + 0.035 * hash1(f32(i) * 3.7 + u.a.w);
    f += e.z * 0.5 * exp(-dot(q - e.xy, q - e.xy) / (r * r));
  }
  return f;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let asp = u.a.y; let px = u.a.z; let k = u.c.z; let t = u.a.x;
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let s = p * k + u.c.xy * 0.01;
  let pxs = px * k;
  let br = u.b.y;
  let ft = t * u.b.x;
  var col = scene(s, 0.5).col;
  col = paintLayer(s, 0.02 * br, 0.95, 0.3, 1.0, pxs, col, false);
  if (s.y < hillBack(s.x)) {
    // Purple speckle and drips running down.
    let g = vec2f(s.x / 0.018, (s.y + ft * 0.004) / 0.03);
    let id = floor(g);
    let h = hash21(id + u.a.w);
    if (h > 0.55) {
      let f = fract(g) - 0.5 - (vec2f(hash21(id + 2.3), hash21(id + 5.1)) - 0.5) * 0.5;
      let d = length(f * vec2f(0.018, 0.03) / vec2f(1.0, 1.0 + 2.5 * step(0.85, h))) - 0.003 * (0.6 + h);
      col = mix(col, select(C(19), C(3), h > 0.8), fillA(d, pxs) * 0.85);
    }
    // Trails of white dots wandering up the sky; the finger pulls them.
    let nt = i32(u.b.w);
    for (var i = 0; i < 12; i++) {
      if (i >= nt) { break; }
      let fi = f32(i);
      let x0 = -0.75 + (fi + hash1(fi + u.a.w)) / 12.0 * 1.5;
      var tx = x0 + 0.03 * sin(s.y * 11.0 + fi * 2.0 + t * 0.2) + 0.015 * sin(s.y * 29.0 + fi);
      let tb = vec2f(tx, s.y) - u.d.xy;
      tx += (u.d.x - tx) * u.d.z * 0.5 * exp(-dot(tb, tb) / 0.02);
      let top = -0.45 + 0.3 * hash1(fi * 3.7 + u.a.w);
      let bot = hillBack(tx) - 0.03 - 0.15 * hash1(fi * 5.3);
      if (s.y > top && s.y < bot) {
        let stepY = 0.011;
        let ky = round((s.y + t * 0.01 * (0.5 + hash1(fi))) / stepY);
        let dy = s.y + t * 0.01 * (0.5 + hash1(fi)) - ky * stepY;
        let d = length(vec2f(s.x - tx, dy)) - 0.0028;
        let tw = 0.55 + 0.45 * sin(t * 2.0 + ky * 1.3 + fi);
        col = mix(col, C(18), fillA(d, pxs) * tw);
      }
    }
  }
  col = paintLayer(s, 0.0082 * br, 0.95, 0.3, 2.0, pxs, col, true);
  // Moon rings and four-point stars.
  let skyM = step(s.y, hillBack(s.x));
  col = mix(col, C(18), rings(s, MOON, 0.045, 0.012, 3.0, pxs) * 0.55 * skyM);
  col = mix(col, INK, strokeA(length(s - MOON) - 0.045, pxs * 0.7, pxs) * skyM * 0.6);
  {
    let sc = 0.06;
    let sid = floor(s / sc);
    let sh = hash21(sid + u.a.w + 17.0);
    if (sh > 0.62) {
      let v = s - (sid + 0.5 + (vec2f(hash21(sid + 4.1), hash21(sid + 6.3)) - 0.5) * 0.6) * sc;
      let a = atan2(v.y, v.x);
      let tw = 0.6 + 0.4 * sin(t * 1.7 + sh * 50.0);
      let rs = 0.006 * (0.6 + sh) * tw;
      let d = length(v) - rs * (0.18 + 0.82 * pow(abs(cos(a * 2.0)), 10.0));
      col = mix(col, C(18), fillA(d, pxs) * skyM * step(0.09, length(s - MOON)));
    }
  }
  // Oaks along the crests of the hills.
  for (var h = 0; h < 2; h++) {
    let cw = select(0.05, 0.07, h == 1);
    let ci = floor(s.x / cw);
    for (var o = -1; o <= 1; o++) {
      let id = ci + f32(o);
      let th = hash1(id * 1.7 + f32(h) * 9.0 + u.a.w);
      if (th < 0.45) { continue; }
      let cx = (id + 0.5 + (hash1(id * 3.3) - 0.5) * 0.5) * cw;
      var gy = hillBack(cx);
      if (h == 1) { gy = hillFront(cx); }
      if (h == 1 && abs(cx - VP.x) < 0.16) { continue; }
      let rad = select(0.011, 0.014, h == 1) * (0.7 + 0.5 * th);
      let cc = vec2f(cx, gy - rad * 0.9);
      let v = s - cc;
      let cd = length(v / vec2f(1.25, 1.0)) - rad * (1.0 + 0.18 * (vnoise(v / rad * 2.5 + id) - 0.5));
      let trunk = sdSeg(s, vec2f(cx, gy + 0.004), cc) - 0.0012;
      col = mix(col, mix(C(10), INK, 0.5), groundShadow(s, vec2f(cx, gy + 0.002), rad * 1.1, 1.0, 0.35, pxs) * 0.6);
      col = mix(col, mix(C(10), INK, 0.3), fillA(trunk, pxs));
      let olit = clamp(0.5 - v.y / rad * 0.6 + v.x / rad * 0.3, 0.0, 1.0) * 0.9;
      let oc = stippleBush(s, olit, 0.0024 + rad * 0.08, pxs, mix(C(10), INK, 0.45), C(10), C(9), mix(C(8), C(9), 0.4), C(17), id * 3.7 + f32(h));
      col = mix(col, oc, fillA(cd, pxs));
      col = mix(col, INK, strokeA(min(cd, trunk), pxs * 0.5, pxs) * 0.6);
    }
  }
  // Vine posts along each row, closer together toward the vanishing point.
  {
    let hf = hillFront(s.x);
    let dy = s.y - VP.y;
    if (s.y > hf + 0.02 && fieldEdge(s) < 0.0 && s.y < fieldBottom()) {
      let rowv = (s.x - VP.x) / dy;
      let rf = (fract(rowv * 7.0) - 0.5) * dy / 7.0;
      let pz = fract(log(dy) * 14.0);
      let post = strokeA(rf, 0.0006 + 0.0012 * dy, pxs) * step(pz, 0.22);
      col = mix(col, INK, post * 0.75);
    }
  }
  // Currents through the foreground: thin luminous streaks flowing along the
  // contours of a shifting field, crowding and brightening where they curl
  // round the drifting eddies, thinning out where the field is slack.
  if (s.y > fgTop(s.x) + 0.006) {
    let e = 0.003;
    let f0 = flowField(s, t);
    let gx = (flowField(s + vec2f(e, 0.0), t) - f0) / e;
    let gy = (flowField(s + vec2f(0.0, e), t) - f0) / e;
    let gl = max(length(vec2f(gx, gy)), 1e-3);
    let speed = clamp(gl / 6.0, 0.0, 1.0);
    let N = 17.0;
    let lines = f0 * N;
    let lid = floor(lines + 0.5);
    let dist = abs(lines - lid) / (N * gl);
    let tng = vec2f(-gy, gx) / gl;
    let along = dot(s, tng);
    let L = 0.028 + 0.03 * hash1(lid * 1.3);
    let ph = along / L - t * (0.25 + 1.1 * speed) * (0.8 + 0.4 * hash1(lid));
    let seg = floor(ph);
    let fr = fract(ph);
    let on = step(0.12 + 0.3 * (1.0 - speed), hash1(lid * 3.7 + seg * 1.31));
    // A bright head trailing off into a faint tail.
    let head = smoothstep(0.1, 0.85, fr) * smoothstep(1.0, 0.9, fr);
    let w = 0.0011 + 0.002 * head * (0.6 + speed);
    let lum = on * head * (0.55 + 0.45 * max(speed, eddyAmt(s, t))) * smoothstep(4.0, 8.0, 1.0 / (N * gl * pxs));
    let a = fillA(dist - w, pxs) * lum;
    // Soft halo round each streak.
    col = mix(col, C(17), exp(-pow(dist / (w * 2.5), 2.0)) * lum * smoothstep(0.6, 0.9, fr) * 0.18);
    var sc = mix(C(17), C(18), smoothstep(0.55, 1.0, fr) * (0.4 + 0.6 * speed));
    sc = mix(mix(C(9), C(17), 0.4), sc, smoothstep(0.05, 0.4, speed + 0.2 * eddyAmt(s, t)));
    col = mix(col, sc, clamp(a, 0.0, 1.0));
    // A faint glow where the current runs fastest.
    col = mix(col, C(17), smoothstep(0.5, 1.0, speed) * 0.08);
  }
  // Ink plate: sky hairlines and the land's contours, off register.
  let so = s + MISREG;
  var ink = 0.0;
  let hb = hillBack(so.x);
  let hf = hillFront(so.x);
  let fg = fgTop(so.x);
  ink = max(ink, bandLines(skyField(so), pxs) * 0.35 * step(so.y, hb));
  ink = max(ink, strokeA(so.y - hb, pxs * 0.8, pxs));
  ink = max(ink, strokeA(so.y - hf, pxs * 0.8, pxs) * 0.8);
  ink = max(ink, strokeA(so.y - fg, pxs * 0.9, pxs));
  if (so.y > hf + 0.012 && so.y < fg) { ink = max(ink, strokeA(fieldEdge(so) / 3.3, pxs * 0.7, pxs) * 0.8); }
  col = mix(col, INK, ink);
  return vec4f(posterFrame(canvasize(col, pos.xy, u.b.z), uv, asp, px), 1.0);
}

// Brush painter. Each page defines scene(q, r) -> Paint: the colour a dab
// at q should carry (r picks among the region's colours), the direction the
// stroke runs, and whether the region gets a second, finer pass (1 strokes,
// 2 round dots). paintLayer lays one dab per grid cell, each sampling the
// scene at its own centre, so the image is rebuilt from marks.
struct Paint { col: vec3f, ang: f32, fine: f32 }

@diagnostic(off, derivative_uniformity) fn paintLayer(p: vec2f, cell: f32, len: f32, wid: f32, sl: f32, px: f32, base: vec3f, fineOnly: bool) -> vec3f {
  let g = p / cell;
  let id0 = floor(g);
  var col = base;
  var best = -1.0;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let id = id0 + vec2f(f32(i), f32(j));
      let h = hash21(id + sl);
      let c = (id + 0.5 + (vec2f(h, hash21(id + sl + 3.7)) - 0.5) * 0.8) * cell;
      let s = scene(c, hash21(id + sl + 7.3));
      if (fineOnly && s.fine < 0.5) { continue; }
      var L = len * cell * (0.7 + 0.5 * hash21(id + sl + 5.3));
      var Wd = wid * cell * (0.75 + 0.5 * h);
      if (s.fine > 1.5) { L = select(0.55, 0.42, fineOnly) * cell * (0.8 + 0.4 * h); Wd = L * 0.85; }
      let a = s.ang + (hash21(id + sl + 9.1) - 0.5) * 0.6;
      let q = rot2(p - c, -a);
      // Tapered stroke: narrows toward both ends, and paint lies a little thin.
      let tx = clamp(abs(q.x) / L, 0.0, 1.0);
      let We = Wd * (1.0 - 0.55 * tx * tx);
      let d = (length(q / vec2f(L, We)) - 1.0) * We;
      let cov = fillA(d, px * 1.1);
      if (cov > 0.0 && h > best) {
        // Flat, silkscreen-like dabs: little tonal jitter, a faint darker rim.
        let dc = s.col * (0.96 + 0.08 * hash21(id + sl + 1.1));
        col = mix(col, dc, cov);
        col = mix(col, dc * 0.78, strokeA(d, px * 0.45, px) * cov * 0.5);
        best = h;
      }
    }
  }
  return col;
}
// Print finish, after Kiyoshi Awazu's silkscreens.
// Canvas: a faint weave on top of the paper grain.
@diagnostic(off, derivative_uniformity) fn canvasize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let w = 0.975 + 0.025 * sin(pos.x * 1.7) * sin(pos.y * 1.7);
  return paperize(col * w, pos, grain);
}
`;

const NAME = 'vineyard-night';
// sky blue, deep blue, lavender, purple, white; hills sage x3; scrub yellow, teal, dark;
// field ochre, gold; row brown; foreground navy, teal-navy, blue-grey, yellow dot; trail white, speck purple
const PALETTES = {
  original: ['#3a7fd8', '#2f68c0', '#a898d8', '#6a5ab8', '#e8eef8', '#7a9a90', '#8aa8a0', '#6a8a88', '#e0c860', '#2a5a6a', '#1f3a48', '#c8a060', '#e8d090', '#6a4a2a', '#1f3a50', '#2a4a60', '#3a5a6a', '#e8d070', '#f4f6ff', '#5a4aa8'],
  dawn:     ['#e89a8a', '#d0788a', '#f0c8b0', '#b86a9a', '#fbeee0', '#9aa88a', '#b0bc98', '#8a9a80', '#f0c850', '#3a6a5a', '#2a4a3a', '#d8a860', '#f0d898', '#7a5a3a', '#2a3a3a', '#3a4a48', '#4a5a50', '#f0d060', '#fff8ec', '#9a5a8a'],
  harvest:  ['#2a3a78', '#1f2a5a', '#6a5a98', '#4a3a88', '#d8dcf0', '#8a8a6a', '#a09a70', '#7a7a5a', '#f0b040', '#4a5a3a', '#2a3020', '#d88a40', '#f0c070', '#7a3a1a', '#1a2030', '#2a2a3a', '#3a3a48', '#f0b050', '#fff4e0', '#4a3a8a'],
};

const p = {};
function readControls() {
  p.pal = colsOf($('palette').value);
  p.drift = +$('drift').value / 100 * 2;
  p.brush = 0.6 + +$('brush').value / 100 * 0.9;
  p.trails = Math.round(+$('trails').value / 100 * 12);
  p.grain = +$('grain').value / 100 * 0.1;
  for (const id of ['drift', 'brush', 'trails', 'grain']) $(id + 'Val').textContent = $(id).value;
}
let touch = [0, 0, 0];
function generate() {}
function uniforms() {
  const zoom = Math.max(1, 0.95 / aspect);
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.drift, p.brush, p.grain, p.trails],
    c: [tl.active ? tl.x : 0, tl.active ? tl.y - 0.5 : 0, zoom, 0],
    d: [touch[0] * zoom, touch[1] * zoom, touch[2], 0],
    cols: p.pal,
  };
}
function step(dt) { touch[2] += ((dragging ? 1 : 0) - touch[2]) * (1 - Math.exp(-dt * 4)); }
function onDown(q) { touch[0] = q[0]; touch[1] = q[1]; }
function onMove(q) { touch[0] = q[0]; touch[1] = q[1]; }
function onUp() {}

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: [1, 2] });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
