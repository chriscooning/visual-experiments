<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swell Sigil — WebGPU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .panel{
    position:fixed;bottom:20px;right:20px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(10,10,12,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:12px;
    padding:18px 16px;width:220px;max-height:calc(100vh - 40px);overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;transition:transform 0.3s ease;z-index:10;
  }
  .panel.hidden{transform:translateX(calc(100% + 40px))}
  .panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-track{background:transparent}.panel::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  .control-group{display:flex;flex-direction:column;gap:3px}
  .control-group label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555}
  .control-group .val{font-family:'Space Mono',monospace;font-size:9px;color:#777;float:right;letter-spacing:0}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#222;border-radius:2px;outline:none;touch-action:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;cursor:pointer;border:3px solid #0a0a0c}
  select{background:#151518;color:#ccc;border:1px solid #2a2a2f;padding:8px 10px;border-radius:6px;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;outline:none;width:100%}
  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
  .btn:hover{background:#fff;color:#000;border-color:#fff}.btn:active{transform:scale(.97)}
  .btn.primary{background:#fff;color:#000;border-color:#fff}.btn.primary:hover{background:transparent;color:#fff}
  .btn.playing{background:#2ecc40;color:#000;border-color:#2ecc40}.btn.playing:hover{background:#27ae60;border-color:#27ae60}
  .btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
  .hint-pill{position:fixed;bottom:20px;left:20px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#444;border:1px solid #2a2a2f;padding:6px 14px;border-radius:20px;background:rgba(10,10,12,0.6);z-index:10;pointer-events:none;animation:fadeHint 4s forwards}
  @keyframes fadeHint{0%,60%{opacity:1}100%{opacity:0}}
  .hint-pill.show{animation:fadeHint 4s forwards}
  .fps{position:fixed;top:8px;right:8px;font-family:'Space Mono',monospace;font-size:10px;color:#333;pointer-events:none;z-index:10}
  .nogpu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;line-height:1.8;color:#666}
  .nogpu.on{display:flex}
</style>
<script src="controls.js" defer></script>

<body>
<canvas id="canvas"></canvas>
<div class="panel" id="panel">
  <div class="control-group"><label>Palette</label>
    <select id="palette">
      <option value="swell" selected>Swell</option>
      <option value="poster">Poster</option>
      <option value="riso">Riso</option>
      <option value="acid">Acid</option>
      <option value="ink">Ink</option>

  </div>
  <div class="control-group"><label>Emblem</label>
    <select id="figure">
      <option value="eye" selected>Machine Eye</option>

    </select>
  </div>

  <div class="btn-row">
    <button class="btn" id="playPause"><svg id="playIcon" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg><svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg><span id="playLabel">Play</span></button>
    <button class="btn primary" id="generate">Generate</button>

</div>

<div class="nogpu" id="nogpu">This one runs on WebGPU, which this browser doesn't offer yet.<br>Try a recent Chrome, Edge or Safari.</div>

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}

// Swell Sigil: bands of colour that follow the contours of a slowly moving
// field, like an ocean swell, around an emblem: a machine eye, an eclipse or
// an invented sigil. Inside the big crests the
// bands trace the crest's own shape; the ground between is fine, straight,
// darker lines. Every band edge is a one-pixel ink hairline, and where bands
// crowd too tightly to draw they merge into their average tone.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // density, warp, mass, figure
  c: vec4f,   // touch x, y, strength, grain
  d: vec4f,   // tilt x, y, flow time, gaze
  cols: array<vec4f, 8>,
}
@group(0) @binding(0) var<uniform> u: U;

@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }

@diagnostic(off, derivative_uniformity) fn warmColor(k: i32) -> vec3f {
  var w = array<i32, 7>(2, 5, 3, 5, 2, 7, 5);
  return C(w[((k % 7) + 7) % 7]);
}
@diagnostic(off, derivative_uniformity) fn coolColor(k: i32) -> vec3f {
  var c = array<i32, 5>(4, 7, 4, 6, 2);
  return mix(C(1), C(c[((k % 5) + 5) % 5]), 0.62);
}

// Bands along coordinate s. Returns the band colour with its hairline.
@diagnostic(off, derivative_uniformity) fn bands(s: f32, warm: bool) -> vec3f {
  let k = i32(floor(s));
  let fr = fract(s);
  let fw = max(fwidth(s), 1e-4);
  var c: vec3f;
  if (warm) { c = warmColor(k); } else { c = coolColor(k); }
  c *= 0.9 + 0.2 * hash1(f32(k) * 1.37 + u.a.w);
  // Average of the band cycle, used where bands are thinner than ~3px.
  var avg: vec3f;
  if (warm) { avg = (C(2) * 2.0 + C(5) * 3.0 + C(3) + C(7)) / 7.0; } else { avg = mix(C(1), (C(4) * 2.0 + C(7) + C(6) + C(2)) / 5.0, 0.62); }
  let crowd = smoothstep(0.18, 0.45, fw);
  let line = (1.0 - smoothstep(0.35, 1.25, min(fr, 1.0 - fr) / fw)) * (1.0 - crowd);
  return mix(mix(c, C(1), line * 0.9), avg * 0.8, crowd);
}

@diagnostic(off, derivative_uniformity) fn massField(q: vec2f) -> f32 {
  let ft = u.d.z;
  let s = u.a.w;
  var m = fbm(q * vec2f(1.3, 2.1) + vec2f(s, s * 0.7) + vec2f(ft * 0.05, -ft * 0.035));
  m += u.b.y * 0.22 * sin(q.x * 3.1 + ft * 0.3 + s) * (0.6 + 0.4 * sin(q.y * 2.0 - ft * 0.2));
  let tb = q - u.c.xy;
  m += u.c.z * 0.28 * exp(-dot(tb, tb) / 0.01);
  return m;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let px = u.a.z; let ft = u.d.z;
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let paper = C(0); let ink = C(1);
  var col = paper;

  // Poster sheet on a paper margin.
  let m = 0.032;
  let hw = asp * 0.5 - m; let hh = 0.5 - m;
  let dSheet = sdBox(p, vec2f(hw, hh));
  let sw = min(0.05, hw * 0.13);      // rainbow side columns
  let iw = hw - sw;

  if (dSheet < px) {
    let q = p + u.d.xy * 0.03;
    var sheet: vec3f;
    if (abs(p.x) > iw) {
      // Side columns: tight vertical rainbow stripes, like the poster's edges.
      let s = (abs(p.x) - iw) / sw * 11.0;
      sheet = bands(s, true);
      if (i32(floor(s)) % 3 == 1) { sheet = bands(s + 0.5, false); }
    } else {
      // Ground: fine straight lines with a slight shimmer.
      let sg = (q.y + 0.004 * sin(q.x * 38.0 + ft * 0.6) + 0.02 * sin(q.x * 3.0 + ft * 0.1)) * u.b.x * 3.4;
      let ground = bands(sg, false);
      // Crests: bands follow the field's contours.
      let M = massField(q);
      let crest = bands(M * u.b.x * 2.4, true);
      let cov = clamp(0.5 + (M - u.b.z) / max(fwidth(M), 1e-4), 0.0, 1.0);
      sheet = mix(ground, crest, cov);
      sheet = mix(sheet, ink, strokeA((M - u.b.z) / max(fwidth(M), 1e-4) * px, px * 0.7, px));

      // Emblem at the centre of the swell.
      let R = min(0.23, iw * 0.62);
      let mc = vec2f(sin(t * 0.21) * 0.004, -0.04 + sin(t * 0.3) * 0.004);
      let fig = u.b.w;
      let e = q - mc;
      let er = length(e);
      let ea = atan2(e.y, e.x);
      if (fig > 0.5 && fig < 1.5) {
        // Machine eye: an almond lid around a camera lens whose aperture
        // blades open and close.
        let lid = max(length(e - vec2f(0.0, 0.62 * R)) - 1.18 * R, length(e + vec2f(0.0, 0.62 * R)) - 1.18 * R);
        var eye = mix(paper, vec3f(1.0), 0.35);
        // Lid engraving: fine arcs following the lid.
        eye = mix(eye, ink, strokeA((fract(lid / (R * 0.06)) - 0.5) * R * 0.06, px * 0.4, px) * 0.25);
        let lr = 0.52 * R;
        let dl = er - lr;
        // Lens barrel rings.
        let rings = bands((er / lr) * 7.0, true);
        var lens = rings;
        // Iris: radial fine lines.
        if (er < lr * 0.72) {
          lens = mix(C(4), C(7), er / lr);
          lens = mix(lens, ink, strokeA((fract(ea / 6.2831 * 72.0) - 0.5) / 72.0 * 6.2831 * er, px * 0.35, px) * 0.6);
        }
        // Aperture: a heptagon that breathes and turns; outside it, blades.
        let n = 7.0;
        let open = lr * (0.36 + 0.16 * sin(t * 0.7));
        let rotA = t * 0.2;
        let seg = 6.2831 / n;
        let an = ea - rotA;
        let fa = an - seg * floor(an / seg + 0.5);
        let dPoly = er * cos(fa) - open * cos(seg * 0.5);
        if (er < lr * 0.72) {
          var blade = mix(ink, C(4), 0.18);
          // Blade seams run from each corner out to the rim.
          let sd = abs(sin(fa - 0.5 * seg)) * er;
          blade = mix(blade, C(3), strokeA(sd, px * 0.45, px) * step(0.0, dPoly) * 0.7);
          lens = mix(lens, blade, clamp(0.5 + dPoly / px, 0.0, 1.0) * step(er, lr * 0.72));
          // Pupil depth and two lens glints.
          lens = mix(lens, ink * 0.7, fillA(dPoly, px));
          lens = mix(lens, vec3f(1.0), fillA(length(e - vec2f(-0.12, -0.14) * R) - 0.045 * R, px) * 0.9);
          lens = mix(lens, vec3f(1.0), fillA(sdBox(rot2(e - vec2f(0.1, 0.1) * R, 0.6), vec2f(0.03, 0.012) * R), px) * 0.8);
        }
        eye = mix(eye, lens, fillA(dl, px));
        eye = mix(eye, ink, strokeA(dl, px * 0.8, px));
        sheet = mix(sheet, eye, fillA(lid, px));
        sheet = mix(sheet, ink, strokeA(lid, px * 1.0, px));
        sheet = mix(sheet, C(2), strokeA(lid + R * 0.05, px * 0.9, px) * step(e.y, 0.0));
        sheet = mix(sheet, C(4), strokeA(lid + R * 0.05, px * 0.9, px) * step(0.0, e.y));
      } else if (fig > 1.5 && fig < 2.5) {
        // Eclipse: a dark disc, a corona of banded rays, a diamond-ring glint.
        let cr = er / R;
        // The corona's outer edge flares into points, inked like everything else.
        let ray = 0.22 * sin(ea * 11.0 + t * 0.3) + 0.14 * sin(ea * 23.0 - t * 0.5) + 0.12 * fbm(vec2f(ea * 3.0, t * 0.1));
        let dCor = (cr - (1.45 + ray)) * R;
        if (dCor < px) {
          let s = (cr - 1.0) * 16.0;
          sheet = mix(sheet, bands(s - ft * 0.5, true), fillA(dCor, px));
          sheet = mix(sheet, ink, strokeA(dCor, px * 0.8, px));
        }
        let dd = (cr - 1.0) * R;
        sheet = mix(sheet, ink * 0.9, fillA(dd, px));
        sheet = mix(sheet, C(3), strokeA(dd, px * 1.3, px));
        let ga = 0.7 + t * 0.05;
        let gp = e - vec2f(cos(ga), sin(ga)) * R;
        let glint = max(fillA(sdBox(rot2(gp, 0.785), vec2f(0.012, 0.012)), px), fillA(abs(gp.x) * 0.15 + abs(gp.y) - 0.012, px) * step(abs(gp.x), 0.09));
        sheet = mix(sheet, vec3f(1.0), max(glint, fillA(abs(gp.y) * 0.15 + abs(gp.x) - 0.01, px) * step(abs(gp.y), 0.07)));
      } else if (fig > 2.5) {
        // Sigil: an invented emblem, rebuilt from the seed. N-fold symmetric
        // strokes on a dark disc: arcs, spokes, dots and bars.
        let dd = er - R * 0.8;
        var sg = mix(ink, C(7), 0.12);
        let sN = 3.0 + floor(hash1(u.a.w) * 5.0);
        let sseg = 6.2831 / sN;
        let sa = ea + t * 0.05;
        let fa = sa - sseg * floor(sa / sseg + 0.5);
        let lp = vec2f(cos(fa), sin(fa)) * er / R;       // folded into one wedge
        var ink2 = 0.0;
        for (var j = 0; j < 6; j++) {
          let h = hash1(u.a.w * 3.1 + f32(j) * 7.7);
          let r0 = 0.15 + 0.6 * hash1(u.a.w + f32(j) * 1.3);
          var dj = 1e3;
          if (h < 0.3) {
            dj = abs(length(lp) - r0);                                    // ring
          } else if (h < 0.55) {
            dj = sdSeg(lp, vec2f(r0 * 0.4, 0.0), vec2f(min(r0 + 0.25, 0.75), 0.0));   // spoke
          } else if (h < 0.75) {
            dj = length(lp - vec2f(r0, 0.0)) - 0.035;                     // dot
          } else {
            let aw = 0.5 * hash1(f32(j) + u.a.w * 5.0);
            dj = sdSeg(lp, vec2f(r0, -aw * r0), vec2f(r0, aw * r0));        // bar
          }
          let c = warmColor(j * 2 + i32(u.a.w));
          let a = strokeA(dj * R, px * 1.6, px);
          sg = mix(sg, c, a);
        }
        sheet = mix(sheet, sg, fillA(dd, px));
        sheet = mix(sheet, ink, strokeA(dd, px * 0.9, px));
        sheet = mix(sheet, C(3), strokeA(dd - R * 0.06, px * 0.7, px));
        sheet = mix(sheet, ink, strokeA(dd - R * 0.1, px * 0.5, px));
      }

      // Swell rising in front of the emblem.
      let crestY = mc.y + R * 0.9 + 0.05 * sin(q.x * 5.0 + ft * 0.35 + u.a.w) + 0.07 * (fbm(vec2f(q.x * 2.2 + u.a.w, ft * 0.05)) - 0.5);
      let front = q.y - crestY;
      if (fig > 0.5) {
        let fb = bands(front * u.b.x * 3.2 + 0.4 * sin(q.x * 2.0 + ft * 0.2), true);
        sheet = mix(sheet, fb, fillA(-front, px));
        sheet = mix(sheet, ink, strokeA(front, px * 0.8, px));
      }
      // Node markers above and below: a ring, a centre dot and a dashed trace.
      if (fig > 0.5) {
        let top = q - mc - vec2f(0.0, -R * 1.18);
        let bot = q - vec2f(mc.x, min(hh - R * 0.2, mc.y + R * 1.32));
        for (var k = 0; k < 2; k++) {
          let v = select(top, bot, k == 1);
          let dn = length(v) - R * 0.07;
          sheet = mix(sheet, paper, fillA(dn, px));
          sheet = mix(sheet, ink, strokeA(dn, px * 0.8, px));
          sheet = mix(sheet, C(2 + k * 2), fillA(length(v) - R * 0.03, px));
          let dash = step(0.5, fract(v.x / (R * 0.06)));
          sheet = mix(sheet, ink, strokeA(v.y, px * 0.5, px) * dash * step(R * 0.1, abs(v.x)) * step(abs(v.x), R * 0.45));
        }
      }
      // Inner keyline, the digital half: a double hairline with corner ticks.
      let dIn = sdBox(p, vec2f(iw, hh));
      sheet = mix(sheet, ink, strokeA(dIn, px * 0.6, px));
      sheet = mix(sheet, paper, strokeA(dIn + px * 2.5, px * 0.45, px) * 0.8);
    }
    col = mix(col, sheet, fillA(dSheet, px));
    col = mix(col, ink, strokeA(dSheet, px * 0.7, px));
  }
  // Margin: dot grid and registration marks.
  if (dSheet > 0.0) {
    let g = fract(p / 0.012) - 0.5;
    col = mix(col, ink, (1.0 - smoothstep(0.5, 1.5, length(g * 0.012) / px)) * 0.18);
    let r = m * 0.28;
    var mk = 0.0;
    mk = max(mk, regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px));
    mk = max(mk, regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
    mk = max(mk, regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px));
    mk = max(mk, regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px));
    col = mix(col, ink, mk * 0.8);
  }
  return vec4f(paperize(col, pos.xy, u.c.w), 1.0);
}
`;

const NAME = 'swell-sigil';
// paper, ink, then red, yellow, blue, orange, green, purple
const PALETTES = {
  swell:  ['#e7dcc4', '#0c0a10', '#e2412f', '#f2c14e', '#3553a8', '#f07a3a', '#2f8a6e', '#c43a7a'],
  poster: ['#efe4cc', '#1b1416', '#d6336c', '#f4c21b', '#35a9cf', '#ee5d2a', '#3b9b4f', '#6a3d9a'],
  riso:   ['#f3eee4', '#1c2a52', '#ff48b0', '#ffe800', '#0078bf', '#ff6c2f', '#00a95c', '#765ba7'],
  acid:   ['#e9ecef', '#0e1116', '#ff2d6f', '#c6ff00', '#00b8ff', '#ff8a00', '#00d19a', '#7a5cff'],
  ink:    ['#ece6d8', '#121212', '#c8322a', '#d9d2c2', '#3a3a3a', '#8a8a8a', '#5a5a5a', '#b3aa98'],
};

const p = {};
function readControls() {
  p.pal = colsOf($('palette').value);
  p.figure = { eye: 1, eclipse: 2, sigil: 3, none: 0 }[$('figure').value];
  p.density = 8 + +$('density').value / 100 * 40;
  p.warp = +$('warp').value / 100 * 2;
  p.mass = 0.35 + +$('mass').value / 100 * 0.3;
  p.flow = +$('flow').value / 100;
  p.grain = +$('grain').value / 100 * 0.12;
  for (const id of ['density', 'warp', 'mass', 'flow', 'grain']) $(id + 'Val').textContent = $(id).value;
}
let ft = 0, touch = [0, 0, 0], gaze = 0;
function uniforms() {
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.density, p.warp, p.mass, p.figure],
    c: [touch[0], touch[1], touch[2], p.grain],
    d: [tl.active ? tl.x : 0, tl.active ? tl.y - 0.5 : 0, ft, gaze],
    cols: p.pal,
  };
}
function step(dt) {
  ft += dt * (0.1 + p.flow * 2.2);
  touch[2] += ((dragging ? 1 : 0) - touch[2]) * (1 - Math.exp(-dt * (dragging ? 5 : 1.2)));
  gaze = Math.sin(t * 0.37) * 0.8 + Math.sin(t * 0.11) * 0.4;
}
function onDown(q) { touch[0] = q[0]; touch[1] = q[1]; }
function onMove(q) { touch[0] += (q[0] - touch[0]) * 0.5; touch[1] += (q[1] - touch[1]) * 0.5; }
function onUp() {}
function generate() { ft = Math.random() * 50; }

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: [1, 2] });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
</body>
</html>
