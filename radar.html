<div class="vx-spin" id="vxSpin" role="img" aria-label="Loading"><span class="p"></span><span class="t"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><span></span></span></div>
<script>
// The loader, from the page's first bytes until its first frame is on screen
// (the same in every WebGPU piece; controls.js moves it on and takes it away).
// On the left, how far along the start is: it sits at a step and creeps
// toward the next, slowing but never stopping, and each file the page
// finishes loading is a small step, up to 9%. Beside it, "loading..." typed
// out like a terminal: each letter flickers through the hero's ASCII ramp
// before it lands, the dots count up behind a blinking cursor, and every so
// often letters flicker to capitals (loadING, Loading, loaDING), scrambling
// through random characters on the way, flip backwards or upside down, or
// glitch. Where the piece can't run there's no loader; controls.js says why
// instead.
window.vxLoader = (function () {
  var el = document.getElementById('vxSpin'), ua = navigator.userAgent;
  var ios = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var v = ua.match(/Version\/(\d+)/) || ua.match(/OS (\d+)_\d+/);
  if (!navigator.gpu || (ios && !(v && +v[1] >= 27))) { el.parentNode.removeChild(el); return null; }
  // In the theme picked on the home page (the same site, so its choice is to
  // hand): tumeric's amber, or cheshire's violet, the site's default.
  try { if (localStorage.getItem('heroVariant') === 'tumeric') el.classList.add('tumeric'); } catch (e) {}
  var WORD = 'loading', NOISE = '.,:;i1tfLCG08@#$%&*+=<>/\\|?';
  var pct = el.firstChild, cell = el.lastChild.children, tail = cell[WORD.length];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = Date.now(), typed = 160 + WORD.length * 70, gone = false, files = null;
  var base = 2, ceil = 9, tau = 1500, since = t0, shown = 0;
  var fx = null, fxAt = typed + 400 + Math.random() * 800, was = [], turned = [];
  function rnd(n) { return Math.floor(Math.random() * n); }
  // One flicker: capitals on a run of letters (DING or ING, one letter, two,
  // or the lot), or a letter or two flipped or glitched; on and off a few
  // times, then back. Capitals hold a little longer, to be read.
  function flicker(ms) {
    var n = WORD.length, r = Math.random(), kind = r < .55 ? 'caps' : r < .85 ? 'flip' : 'noise';
    var a = kind === 'flip' ? 2 + rnd(n - 2) : rnd(n), b = a + 1, on = [], t = 0;
    r = Math.random();
    if (kind === 'caps' && r < .4) { a = 3 + rnd(2); b = n; }
    else if (kind === 'caps' && r < .5) { a = 0; b = n; }
    else if (r > .8) b = Math.min(n, a + 2);
    for (var k = 1 + rnd(3); k > 0; k--) {
      var d = kind === 'caps' ? 110 + rnd(140) : 40 + rnd(90);
      on.push([t, t + d]);
      t += d + (kind === 'caps' ? 70 : 40) + rnd(60);
    }
    return { kind: kind, a: a, b: b, flip: rnd(2) ? 'x' : 'y', at: ms, on: on, end: ms + t };
  }
  function draw() {
    if (gone) return;
    var now = Date.now(), ms = now - t0, dt = now - since, lit = false;
    shown = Math.max(shown, base + (ceil - base) * dt / (dt + tau));
    pct.textContent = Math.min(99, Math.floor(shown)) + '%';
    if (!still && ms >= typed) {
      if (!fx && ms >= fxAt) fx = flicker(ms);
      if (fx && ms >= fx.end) { fx = null; fxAt = ms + 500 + Math.random() * 1300; }
      for (var j = 0; fx && j < fx.on.length; j++) if (ms - fx.at >= fx.on[j][0] && ms - fx.at < fx.on[j][1]) lit = true;
    }
    for (var k = 0; k < WORD.length; k++) {
      var c = WORD.charAt(k), how = '', hit = lit && k >= fx.a && k < fx.b;
      if (hit && fx.kind === 'caps') c = c.toUpperCase();
      if (hit && fx.kind === 'flip') how = fx.flip;
      // A letter changing case runs through a few random characters first.
      if (c !== was[k]) { if (was[k]) turned[k] = ms; was[k] = c; }
      if (!still && (ms < 160 + k * 70 || (hit && fx.kind === 'noise') || ms - turned[k] < 60)) c = NOISE.charAt(rnd(NOISE.length));
      if (cell[k].textContent !== c) cell[k].textContent = c;
      if (cell[k].className !== how) cell[k].className = how;
    }
    tail.textContent = still ? '..._' : (ms < typed ? '' : '...'.slice(0, Math.floor((ms - typed) / 380) % 4)) + (Math.floor(ms / 530) % 2 ? ' ' : '_');
    requestAnimationFrame(draw);
  }
  // (A beat before it shows, so a quick start never flashes it.)
  var show = setTimeout(function () { el.classList.add('in'); }, 120);
  // Away quickly, from wherever it's got to: the piece comes first.
  function stop() {
    if (gone) return;
    gone = true;
    clearTimeout(show);
    if (files) files.disconnect();
    el.classList.add('out');
    el.classList.remove('in');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  // At v and creeping toward c, half way there after t ms, until the next.
  function step(v, c, t) { if (v > base) { base = v; ceil = c; tau = t || 1200; since = Date.now(); } }
  try {
    files = new PerformanceObserver(function (list) {
      list.getEntries().forEach(function () { if (base < 9) step(Math.min(9, base + 2), 9, 1500); });
    });
    files.observe({ type: 'resource' });
  } catch (e) {}
  var api = {
    step: step,
    // The piece is on screen: out of its way at once, reading 100% as it goes,
    // however far the loader had got (typing, fading in, or not yet shown).
    done: function () { pct.textContent = '100%'; stop(); },
    stop: stop
  };
  // Where controls.js never came to move it on, it doesn't stay.
  document.addEventListener('DOMContentLoaded', function () { if (!api.steered) stop(); });
  draw();
  return api;
})();
</script>

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

// ═══════════════════════════════════════
// SHADER
// Everything is drawn from distance functions, so every edge is
// anti-aliased to exactly one pixel at any size: the web of rings and
// spokes, each series' filled polygon, its outline and vertex dots — or, in
// scope mode, the rings, ticks, sweep, afterglow and contacts. Contacts fade
// by how long ago the sweep passed their bearing, computed directly, so no
// persistence buffer is needed.
// ═══════════════════════════════════════
const RADAR = /* wgsl */ `
struct U {
  bg: vec3f, mode: f32,
  grid: vec3f, time: f32,
  c0: vec3f, n: f32,
  c1: vec3f, series: f32,
  c2: vec3f, px: f32,
  center: vec2f, sweep: f32, glow: f32,
  ping: f32, after: f32, contacts: f32, paper: f32,
  vals: array<vec4f, 12>,
  tg: array<vec4f, 16>,
}
@group(0) @binding(0) var<uniform> u: U;

const PI = 3.14159265;
const TAU = 6.28318531;
const R = 0.78;

fn segDist(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn axisDir(i: f32) -> vec2f {
  let a = -PI * 0.5 + TAU * i / u.n;
  return vec2f(cos(a), sin(a));
}
fn line(d: f32, w: f32) -> f32 { return 1.0 - smoothstep(w - u.px, w + u.px, d); }
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }

fn seriesColor(s: i32) -> vec3f {
  if (s == 0) { return u.c0; }
  if (s == 1) { return u.c1; }
  return u.c2;
}

fn chart(p: vec2f) -> vec3f {
  var col = u.bg;
  let r = length(p);
  let n = i32(u.n);
  // Which wedge p sits in, counting clockwise from straight up.
  var th = atan2(p.y, p.x) + PI * 0.5;
  th = th - floor(th / TAU) * TAU;
  let k = floor(th / (TAU / u.n));
  let k1 = k + 1.0;
  // Web: four rings, drawn as polygons like a real radar chart, plus spokes.
  var web = 0.0;
  for (var j = 1; j <= 4; j++) {
    let rr = R * f32(j) / 4.0;
    let d = min(segDist(p, axisDir(k) * rr, axisDir(k1) * rr),
            min(segDist(p, axisDir(k - 1.0) * rr, axisDir(k) * rr), segDist(p, axisDir(k1) * rr, axisDir(k1 + 1.0) * rr)));
    web = max(web, line(d, select(0.0015, 0.0028, j == 4)) * select(0.55, 1.0, j == 4));
  }
  for (var i = 0; i < n; i++) {
    web = max(web, line(segDist(p, vec2f(0.0), axisDir(f32(i)) * R), 0.0015) * 0.55);
  }
  col = mix(col, u.grid, web);
  // Series, back to front.
  for (var s = i32(u.series) - 1; s >= 0; s--) {
    let c = seriesColor(s);
    var stroke = 1e3;
    var dots = 1e3;
    for (var i = 0; i < n; i++) {
      let a = axisDir(f32(i)) * R * u.vals[i][s];
      let b = axisDir(f32((i + 1) % n)) * R * u.vals[(i + 1) % n][s];
      stroke = min(stroke, segDist(p, a, b));
      dots = min(dots, length(p - a));
    }
    // Inside test for the wedge p is in: which side of that wedge's edge.
    let ia = i32(k) % n;
    let ib = (ia + 1) % n;
    let A = axisDir(f32(ia)) * R * u.vals[ia][s];
    let B = axisDir(f32(ib)) * R * u.vals[ib][s];
    let e = B - A;
    var nrm = normalize(vec2f(e.y, -e.x));
    if (dot(nrm, A) < 0.0) { nrm = -nrm; }
    let sd = dot(p - A, nrm);
    let fill = 1.0 - smoothstep(-u.px, u.px, sd);
    let front = f32(s == 0);
    col = mix(col, c, fill * (0.14 + 0.08 * front));
    // Glow adds light, which only reads on a dark background.
    col += c * exp(-stroke * 60.0) * 0.35 * u.glow * (1.0 - u.paper);
    col = mix(col, c, line(stroke, 0.0026 + 0.0012 * front));
    col = mix(col, c, line(dots, 0.009 + 0.003 * front));
  }
  return col;
}

fn scope(p: vec2f) -> vec3f {
  let r = length(p) / R;
  var th = atan2(p.y, p.x) + PI * 0.5;
  th = th - floor(th / TAU) * TAU;
  var col = u.bg;
  let inside = 1.0 - smoothstep(1.0 - u.px / R, 1.0 + u.px / R, r);
  // Faint phosphor grain inside the glass.
  col += u.c0 * (hash21(floor(p * 700.0) + floor(u.time * 20.0)) * 0.02) * inside;
  // Afterglow: brightest right behind the sweep, fading around the dial.
  var age = u.sweep - th;
  age = age - floor(age / TAU) * TAU;
  let trail = exp(-age * (4.5 - u.after * 3.8)) * inside;
  col += u.c0 * trail * 0.28;
  // Ground clutter near the centre, lit by the sweep.
  let cq = p * 220.0;
  let cl = step(0.9, hash21(floor(cq))) * smoothstep(0.5, 0.2, length(fract(cq) - 0.5)) * smoothstep(0.3, 0.04, r) * trail;
  col += u.c0 * cl * 0.6;
  // Rings, crosshair, ticks.
  var g = 0.0;
  for (var j = 1; j <= 4; j++) { g = max(g, line(abs(r - f32(j) * 0.25) * R, select(0.0012, 0.0026, j == 4)) * select(0.5, 1.0, j == 4)); }
  g = max(g, line(abs(p.x), 0.0012) * 0.35 * inside);
  g = max(g, line(abs(p.y), 0.0012) * 0.35 * inside);
  let tickA = th / (TAU / 72.0);
  let tick = abs(tickA - round(tickA)) * (TAU / 72.0) * r * R;
  let major = abs(th / (TAU / 12.0) - round(th / (TAU / 12.0))) < 0.01;
  let tickLen = select(0.025, 0.05, major);
  g = max(g, line(tick, 0.0014) * step(1.0, r) * step(r, 1.0 + tickLen / R));
  col = mix(col, u.grid, g);
  // Sweep line.
  let sd = vec2f(sin(u.sweep), -cos(u.sweep));
  let beam = segDist(p, vec2f(0.0), sd * R);
  col += u.c0 * (line(beam, 0.002) * 0.9 + exp(-beam * 90.0) * 0.4 * u.glow) * inside;
  // Contacts light up as the sweep crosses them, then fade.
  for (var i = 0; i < 16; i++) {
    if (f32(i) >= u.contacts) { break; }
    let t = u.tg[i];
    let tp = vec2f(sin(t.x), -cos(t.x)) * t.y * R;
    var a = u.sweep - t.x;
    a = a - floor(a / TAU) * TAU;
    let lit = exp(-a * (1.4 - u.after * 1.1));
    let d = length(p - tp);
    col += u.c1 * lit * (smoothstep(0.011 + u.px, 0.011 - u.px, d) * 1.3 + exp(-d * 45.0) * 0.7 * u.glow);
  }
  // Sonar ping: a ring racing out from the centre.
  if (u.ping < 1.0) {
    col += u.c2 * line(abs(r - u.ping) * R, 0.003) * (1.0 - u.ping) * 1.2 * inside;
  }
  // Glass: darken the edge a touch.
  col *= 1.0 - 0.25 * smoothstep(0.7, 1.0, r) * inside;
  return col;
}

@fragment fn fs_main(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let p = (pos.xy - u.center) * u.px;
  var col: vec3f;
  if (u.mode < 0.5) { col = chart(p); } else { col = scope(p); }
  let v = length(p) * 0.55;
  col *= mix(1.0, 1.0 - 0.35 * v * v, 1.0 - u.paper);
  return vec4f(col, 1.0);
}
`;

// ═══════════════════════════════════════
// PALETTES — background, grid, three series (scope: sweep, contacts, ping)
// ═══════════════════════════════════════
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const PALETTES = {
  signal:   { bg: '#07070b', grid: '#2a2a38', c: ['#7c5cff', '#22d3ee', '#f472b6'], text: '#9a9ab0', paper: 0 },
  phosphor: { bg: '#010a04', grid: '#0f3b1d', c: ['#39ff88', '#b6ffcf', '#39ff88'], text: '#39c46e', paper: 0 },
  amber:    { bg: '#0a0600', grid: '#3a2400', c: ['#ffb000', '#ffe2a0', '#ff7a00'], text: '#c98a10', paper: 0 },
  ice:      { bg: '#02060c', grid: '#12304a', c: ['#7dd3fc', '#e0f2fe', '#38bdf8'], text: '#6aa9cc', paper: 0 },
  paper:    { bg: '#f3f1ea', grid: '#cfcac0', c: ['#1f3a93', '#d9480f', '#2b8a3e'], text: '#6b665c', paper: 1 },
};

const AXES = ['Accuracy', 'Latency', 'Cost', 'Recall', 'Grounding', 'Safety', 'Tone', 'Coverage', 'Precision', 'Recency', 'Reasoning', 'Speed'];
const SERIES = ['baseline', 'candidate', 'fine-tuned'];

const $ = (id) => document.getElementById(id);
const canvas = $('canvas'), labels = $('labels'), lctx = labels.getContext('2d');
const IDS = ['axes', 'series', 'morph', 'sweep', 'contacts', 'after', 'glow'];

const p = {};
function readControls() {
  p.mode = $('mode').value;
  p.axes = +$('axes').value;
  p.series = +$('series').value;
  p.morph = 1 + +$('morph').value / 100 * 7;
  p.sweep = 0.3 + +$('sweep').value / 100 * 3.2;
  p.contacts = +$('contacts').value;
  p.after = +$('after').value / 100;
  p.glow = +$('glow').value / 100 * 1.6;
  p.pal = PALETTES[$('palette').value];
  for (const id of IDS) $(id + 'Val').textContent = $(id).value;
  for (const el of document.querySelectorAll('.chart-only')) el.classList.toggle('off', p.mode !== 'chart');
  for (const el of document.querySelectorAll('.scope-only')) el.classList.toggle('off', p.mode !== 'scope');
}
readControls();

// ═══════════════════════════════════════
// DATA
// Chart: each series eases toward a target profile; a new target arrives
// every few seconds. Scope: contacts drift in straight lines and bounce off
// the edge of the dial.
// ═══════════════════════════════════════
const vals = [...Array(12)].map(() => [0.5, 0.5, 0.5]);
let goal = vals.map((v) => v.slice());
let base = [...Array(12)].map(() => 0.55 + Math.random() * 0.25);
function newGoal() {
  if (Math.random() < 0.35) base = base.map(() => 0.5 + Math.random() * 0.35);
  goal = base.map((b) => [
    Math.max(0.12, Math.min(0.98, b - 0.12 + (Math.random() - 0.5) * 0.3)),
    Math.max(0.12, Math.min(0.98, b + (Math.random() - 0.5) * 0.3)),
    Math.max(0.12, Math.min(0.98, b + 0.1 + (Math.random() - 0.5) * 0.3)),
  ]);
}
newGoal();
for (let i = 0; i < 12; i++) vals[i] = goal[i].map((g) => g * 0.3);

let contacts = [];
function newContacts() {
  contacts = [...Array(16)].map((_, i) => {
    const a = Math.random() * Math.PI * 2, r = 0.2 + Math.random() * 0.75;
    const h = Math.random() * Math.PI * 2, s = 0.004 + Math.random() * 0.02;
    return { x: Math.sin(a) * r, y: -Math.cos(a) * r, vx: Math.sin(h) * s, vy: -Math.cos(h) * s, id: 'TRK ' + String(10 + Math.floor(Math.random() * 89)) };
  });
}
newContacts();

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(4.5e6) });
const uniforms = () => {
  const c = p.pal;
  return {
    bg: hex(c.bg), grid: hex(c.grid), c0: hex(c.c[0]), c1: hex(c.c[1]), c2: hex(c.c[2]),
    mode: p.mode === 'chart' ? 0 : 1, n: p.axes, series: p.series, glow: p.glow, after: p.after,
    contacts: p.contacts, paper: c.paper,
  };
};
const fx = effect(gpu, RADAR, { set: { u: {
  ...uniforms(), time: 0, px: 0.002, center: [0, 0], sweep: 0, ping: 1,
  vals: vals.map((v) => [v[0], v[1], v[2], 0]),
  tg: contacts.map(() => [0, 0.5, 0, 0]),
} } });

let W = 1, H = 1, scale = 1;
surf.onResize(({ width, height }) => {
  W = width; H = height;
  // p is in chart units: the dial's radius (0.78) leaves room for labels.
  scale = Math.min(width, height) * 0.5 * 0.76;
  fx.set({ u: { px: 1 / scale, center: [width / 2, height / 2] } });
  const d = window.devicePixelRatio || 1;
  labels.width = Math.round(labels.clientWidth * d);
  labels.height = Math.round(labels.clientHeight * d);
});

function applyControls() {
  readControls();
  fx.set({ u: uniforms() });
  document.body.style.background = p.pal.bg;
}

// ═══════════════════════════════════════
// LABELS: crisp text on a 2D canvas above the GPU canvas
// ═══════════════════════════════════════
const FONT = "'Space Mono', ui-monospace, monospace";
function drawLabels(sweep, ping) {
  const d = window.devicePixelRatio || 1;
  const cw = labels.width, ch = labels.height;
  lctx.clearRect(0, 0, cw, ch);
  const sx = cw / W, sy = ch / H;
  const cx = cw / 2, cy = ch / 2, R = 0.78 * scale * sx;
  lctx.fillStyle = p.pal.text;
  lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
  if (p.mode === 'chart') {
    const fs = Math.max(9, Math.min(13, R * 0.075 / d)) * d;
    lctx.font = `${fs}px ${FONT}`;
    for (let i = 0; i < p.axes; i++) {
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / p.axes;
      const x = cx + Math.cos(a) * R * 1.13, y = cy + Math.sin(a) * R * 1.13;
      lctx.textAlign = Math.abs(Math.cos(a)) < 0.2 ? 'center' : Math.cos(a) > 0 ? 'left' : 'right';
      lctx.globalAlpha = 0.9;
      lctx.fillText(AXES[i].toUpperCase(), x, y);
      lctx.globalAlpha = 0.55;
      lctx.fillText(Math.round(vals[i][0] * 100), x, y + fs * 1.25);
    }
    // Legend, top centre.
    lctx.globalAlpha = 1; lctx.textAlign = 'left';
    const lf = Math.max(9, Math.min(12, cw / d / 34)) * d;
    lctx.font = `${lf}px ${FONT}`;
    const items = SERIES.slice(0, p.series);
    const widths = items.map((s) => lctx.measureText(s.toUpperCase()).width + lf * 2.2);
    let x = cx - widths.reduce((a, b) => a + b, 0) / 2;
    const y = Math.max(lf * 2.5, cy - R * 1.36);
    items.forEach((s, i) => {
      lctx.fillStyle = p.pal.c[i];
      lctx.beginPath(); lctx.arc(x + lf * 0.4, y, lf * 0.32, 0, Math.PI * 2); lctx.fill();
      lctx.fillStyle = p.pal.text;
      lctx.fillText(s.toUpperCase(), x + lf * 1.1, y);
      x += widths[i];
    });
  } else {
    const fs = Math.max(8, Math.min(12, R * 0.06 / d)) * d;
    lctx.font = `${fs}px ${FONT}`;
    for (let b = 0; b < 360; b += 30) {
      const a = (b * Math.PI) / 180;
      lctx.globalAlpha = 0.8;
      lctx.fillText(String(b).padStart(3, '0'), cx + Math.sin(a) * R * 1.12, cy - Math.cos(a) * R * 1.12);
    }
    lctx.globalAlpha = 0.45; lctx.textAlign = 'left';
    for (let j = 1; j <= 3; j++) lctx.fillText((j * 10) + 'NM', cx + fs * 0.4, cy - R * j / 4 - fs * 0.6);
    // Contacts get a callout while they're still glowing.
    lctx.textAlign = 'left';
    for (let i = 0; i < p.contacts; i++) {
      const c = contacts[i];
      const ang = Math.atan2(c.x, -c.y);
      let age = sweep - ((ang + Math.PI * 2) % (Math.PI * 2));
      age = ((age % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const lit = Math.exp(-age * (1.4 - p.after * 1.1));
      if (lit < 0.08) continue;
      lctx.globalAlpha = Math.min(1, lit * 1.2);
      lctx.fillStyle = p.pal.c[1];
      const x = cx + c.x * R, y = cy + c.y * R;
      lctx.fillText(`${c.id} ${(Math.hypot(c.x, c.y) * 40).toFixed(1)}`, x + fs * 1.2, y - fs * 0.9);
    }
    lctx.globalAlpha = 0.8; lctx.fillStyle = p.pal.text; lctx.textAlign = 'center';
    lctx.fillText(`SWEEP ${(p.sweep * 60 / (Math.PI * 2)).toFixed(0)} RPM · ${p.contacts} CONTACTS`, cx, Math.max(fs * 2.5, cy - R * 1.32));
  }
  lctx.globalAlpha = 1;
}

// ═══════════════════════════════════════
// FRAME
// ═══════════════════════════════════════
const clk = clock(gpu);
const tl = tilt();
let fpsCount = 0, fpsAt = performance.now();
let t = 0, sweep = 0, ping = 1, sinceGoal = 0;

function step(dt) {
  t += dt;
  if (p.mode === 'chart') {
    sinceGoal += dt;
    if (sinceGoal > p.morph) { sinceGoal = 0; newGoal(); }
    const k = 1 - Math.exp(-dt * 2.2);
    for (let i = 0; i < 12; i++) for (let s = 0; s < 3; s++) vals[i][s] += (goal[i][s] - vals[i][s]) * k;
  } else {
    sweep = (sweep + dt * p.sweep) % (Math.PI * 2);
    for (const c of contacts) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      const r = Math.hypot(c.x, c.y);
      if (r > 0.95) { const nx = c.x / r, ny = c.y / r, d = c.vx * nx + c.vy * ny; c.vx -= 2 * d * nx; c.vy -= 2 * d * ny; c.x = nx * 0.949; c.y = ny * 0.949; }
    }
  }
  ping = Math.min(1, ping + dt * 0.45);
  fx.set({ u: {
    time: t, sweep, ping,
    vals: vals.map((v) => [v[0], v[1], v[2], 0]),
    tg: contacts.map((c) => [(Math.atan2(c.x, -c.y) + Math.PI * 2) % (Math.PI * 2), Math.hypot(c.x, c.y), 0, 0]),
  } });
  // Lean the whole screen with the phone, like a tilted card.
  const rx = tl.active ? (tl.y - 0.55) * -10 : 0, ry = tl.active ? tl.x * 12 : 0;
  const tf = `perspective(1200px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
  canvas.style.transform = tf; labels.style.transform = tf;
  drawLabels(sweep, ping);
}

function render(f) { f.pass(surf, fx); }

let loop = null, playing = false;
function tick(f) {
  step(Math.min(clk.deltaTime, 0.1));
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

function refresh() {
  if (p.mode === 'chart') { newGoal(); sinceGoal = 0; } else { newContacts(); ping = 0; }
}
canvas.addEventListener('pointerup', refresh);

for (const id of IDS) $(id).addEventListener('input', applyControls);
$('palette').addEventListener('change', applyControls);
$('mode').addEventListener('change', () => { applyControls(); refresh(); });
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { refresh(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  // Flatten the GPU image and the labels into one picture.
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const o = out.getContext('2d');
  o.drawImage(canvas, 0, 0);
  o.drawImage(labels, 0, 0, out.width, out.height);
  const a = document.createElement('a');
  a.download = 'radar-' + Date.now() + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

applyControls();
togglePlay();
</script>
</body>
</html>
