<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cypress Grove — WebGPU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{overflow:hidden;margin:0;background:#0a0a0c;font-family:'Outfit',sans-serif;color:#e0e0e0}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  .panel{
    position:fixed;bottom:20px;right:20px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(10,10,12,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:12px;
    padding:18px 16px;width:220px;max-height:calc(100vh - 40px);overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;transition:transform 0.3s ease;z-index:10;
  }
  .panel.hidden{transform:translateX(calc(100% + 40px))}
  .panel::-webkit-scrollbar{width:4px}.panel::-webkit-scrollbar-track{background:transparent}.panel::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
  .control-group{display:flex;flex-direction:column;gap:3px}
  .control-group label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#555}
  .control-group .val{font-family:'Space Mono',monospace;font-size:9px;color:#777;float:right;letter-spacing:0}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#222;border-radius:2px;outline:none;touch-action:none}

  select{background:#151518;color:#ccc;border:1px solid #2a2a2f;padding:8px 10px;border-radius:6px;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;outline:none;width:100%}
  select:hover{border-color:#444}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05)}
  .btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:8px 12px;border:1px solid #333;background:transparent;color:#ccc;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
  .btn:hover{background:#fff;color:#000;border-color:#fff}.btn:active{transform:scale(.97)}
  .btn.primary{background:#fff;color:#000;border-color:#fff}.btn.primary:hover{background:transparent;color:#fff}
  .btn.playing{background:#2ecc40;color:#000;border-color:#2ecc40}.btn.playing:hover{background:#27ae60;border-color:#27ae60}
  .btn svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
  .hint-pill{position:fixed;bottom:20px;left:20px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#444;border:1px solid #2a2a2f;padding:6px 14px;border-radius:20px;background:rgba(10,10,12,0.6);z-index:10;pointer-events:none;animation:fadeHint 4s forwards}
  @keyframes fadeHint{0%,60%{opacity:1}100%{opacity:0}}
  .hint-pill.show{animation:fadeHint 4s forwards}
  .fps{position:fixed;top:8px;right:8px;font-family:'Space Mono',monospace;font-size:10px;color:#333;pointer-events:none;z-index:10}
  .nogpu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;line-height:1.8;color:#666}
  .nogpu.on{display:flex}

<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';
import { daySky, dayKey, dayCols } from './lib/sky.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Bushes after Chris's canvases: a near-black core with stippled highlights
// that thicken toward the lit edge. lit runs 0 (deep shadow) to 1 (sunlit
// rim); cell sets the stipple size. Two offset layers of jittered dots.
fn stippleBush(p: vec2f, lit: f32, cell: f32, px: f32, dark: vec3f, mid: vec3f, hiA: vec3f, hiB: vec3f, warm: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mix(dark, mid, 0.55), smoothstep(0.35, 0.9, l));
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / cell + vec2f(fl * 0.5, fl * 0.37);
    let id = floor(g);
    let h = hash21(id + seed + fl * 7.1);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.3 + fl), hash21(id + 2.7 + fl)) - 0.5) * 0.55;
    let dens = smoothstep(0.05, 0.85, l + (hash21(id + 5.9) - 0.5) * 0.45);
    if (h < 0.4 + 0.6 * dens) {
      let k = hash21(id + 9.1 + fl);
      var dc = select(select(hiA, hiB, k > 0.55), warm, k > 0.95);
      dc = mix(mix(dark, mid, 0.8), dc, smoothstep(0.15, 0.75, l + (h - 0.5) * 0.3));
      let r = (0.24 + 0.2 * hash21(id + 3.3)) * mix(0.8, 1.0, l);
      c = mix(c, dc, fillA((length(f) - r) * cell, px));
    }
  }
  // Fine grain: small clusters of tiny points scattered over the big dots,
  // light on the lit side, dark flecks breaking up the highlights.
  let fcell = max(cell * 0.38, px * 2.2);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / fcell + vec2f(fl * 0.31, fl * 0.57);
    let id = floor(g);
    let clump = vnoise(p / (cell * 2.3) + seed + fl * 4.0);
    let h = hash21(id + seed * 1.7 + fl * 3.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 4.1 + fl), hash21(id + 6.3 + fl)) - 0.5) * 0.6;
    let r = 0.16 + 0.14 * hash21(id + 8.8);
    let a = fillA((length(f) - r) * fcell, px);
    if (L == 0) {
      let on = step(h, smoothstep(0.1, 0.9, l) * smoothstep(0.3, 0.7, clump) * 0.9);
      let k = hash21(id + 2.2);
      let dc = select(select(hiB, hiA, k > 0.5), warm, k > 0.9);
      c = mix(c, mix(c, dc, 0.9), a * on);
    } else {
      let on = step(h, (0.25 + 0.35 * l) * smoothstep(0.45, 0.8, clump));
      c = mix(c, dark, a * on * 0.85);
    }
  }
  return c;
}
// Painted layers over any surface: three scales of points in drifting
// clusters, each a lighter or darker note of the colour beneath, so flat
// fills read as built up from many small marks. amt 0..1 sets how much.
fn layerTex(p: vec2f, col: vec3f, px: f32, amt: f32, scale: f32, seed: f32) -> vec3f {
  var c = col;
  let lum = dot(col, vec3f(0.3, 0.59, 0.11));
  // Contrast grows with amt: soft tonal flecks at low amounts, crisp marks at full.
  let ct = smoothstep(0.1, 0.9, amt);
  let lightC = mix(col, min(col * 1.2 + vec3f(0.035, 0.03, 0.01), vec3f(1.0)), 0.45 + 0.55 * ct);
  let darkC = mix(col, col * 0.7, 0.3 + 0.7 * ct);
  var sc = array<f32, 3>(1.0, 0.55, 0.3);
  for (var L = 0; L < 3; L++) {
    let fl = f32(L);
    let cell = max(scale * sc[L], px * 2.2);
    let g = p / cell + vec2f(fl * 0.37, fl * 0.61);
    let id = floor(g);
    let h = hash21(id + seed + fl * 5.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.7 + fl), hash21(id + 4.9 + fl)) - 0.5) * 0.6;
    let clump = vnoise(p / (cell * 3.1) + seed * 0.37 + fl * 7.0);
    let r = 0.17 + 0.15 * hash21(id + 8.3);
    let a = fillA((length(f) - r) * cell, px);
    let on = step(h, amt * (0.12 + 0.55 * smoothstep(0.3, 0.8, clump)));
    let k = hash21(id + 2.9 + fl);
    // Dark ground takes more light marks, light ground more dark ones.
    let dc = select(darkC, lightC, k < 0.35 + 0.35 * (1.0 - lum) + (1.0 - ct) * 0.3);
    c = mix(c, dc, a * on * (0.75 - fl * 0.12));
  }
  return c;
}
// Bark: stippled light and shade plus fine strokes along the trunk.
// u runs along the trunk, v across it (-1..1), lit is 0..1.
fn barkTex(u: f32, v: f32, w: f32, lit: f32, px: f32, dark: vec3f, mid: vec3f, hi: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mid, smoothstep(-0.6, 0.4, v * 0.0 + l * 2.0 - 1.0));
  let g = vec2f(u / (w * 0.55), v * 2.2);
  let id = floor(g);
  let f = fract(g) - 0.5;
  let h = hash21(id + seed);
  let stroke = strokeA(f.x * 0.4 + 0.15 * sin(u / w * 3.0 + id.y), 0.08, 0.1);
  c = mix(c, select(dark * 0.85, hi, h > 0.5 - 0.3 * l), stroke * step(0.35, h) * 0.8);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let cs = w * (0.42 - fl * 0.18);
    let g2 = vec2f(u, v * w) / max(cs, px * 2.2) + fl * 0.5;
    let id2 = floor(g2);
    let f2 = fract(g2) - 0.5 - (vec2f(hash21(id2 + 3.1), hash21(id2 + 5.7)) - 0.5) * 0.5;
    let h2 = hash21(id2 + seed + fl * 9.0);
    let dc = select(dark * 0.8, mix(mid, hi, 0.7), h2 < l * 0.8);
    c = mix(c, dc, fillA((length(f2) - 0.22) * max(cs, px * 2.2), px) * step(0.45, hash21(id2 + 7.7)));
  }
  return c;
}
// Drape: an offset that bends a shadow's outline over small bumps in the
// ground, so it reads as lying on uneven land rather than cut from paper.
fn drape(p: vec2f, scale: f32, seed: f32) -> vec2f {
  let q = p / max(scale, 1e-4);
  return (vec2f(vnoise(q + seed), vnoise(q + seed + 7.3)) - 0.5) * scale * 0.5
       + (vec2f(vnoise(q * 2.7 + seed * 1.3), vnoise(q * 2.7 + seed + 3.1)) - 0.5) * scale * 0.18;
}
// Soft coverage from a signed distance, with a penumbra of width w.
fn softA(d: f32, w: f32) -> f32 { return 1.0 - smoothstep(-w * 0.6, w, d); }
// Shadow pooled on the ground under a clump: a flat ellipse pushed away
// from the sun, longer when the sun is low. Returns coverage.
fn groundShadow(p: vec2f, foot: vec2f, r: f32, side: f32, low: f32, px: f32) -> f32 {
  let len = r * (1.1 + 2.2 * low);
  let q = p + drape(p, r * 0.9, foot.x * 17.0);
  let c = foot + vec2f(-side * len * 0.55, r * 0.12);
  let along = clamp((q.x - foot.x) * -side / (len * 1.1), 0.0, 1.0);
  let d = (length((q - c) / vec2f(len, r * 0.34)) - 1.0) * r * 0.34;
  let pen = max(px, r * (0.06 + 0.3 * along));
  // Deepest right at the foot, fading and blurring toward the tip.
  let cq = (p - foot) / vec2f(r * 0.9, r * 0.22);
  return clamp(softA(d, pen) * (1.0 - 0.5 * along) + exp(-dot(cq, cq)) * 0.5, 0.0, 1.0);
}
// A long cast shadow from a thin upright (a trunk or stem): widening and
// blurring away from its foot, and draped over the ground.
fn softShadowSeg(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let ba = b - a;
  let h = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35, a.x * 11.0) * (0.2 + h);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.5 * hq);
  return softA(d, max(px, w * (0.5 + 4.0 * hq))) * (1.0 - 0.55 * hq);
}
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Cypress Grove: the old Monterey cypresses of Point Lobos on white dunes,
// drawn crisp in the manner of Eyvind Earle. Slender, weathered trunks,
// each with bark of its own, rise with a gentle lean, often forking, with
// branches in tiers that dip and curl up at their tips, every one ending in
// a flat pad of foliage built from long, thin diamonds of many sizes
// pointing different ways. Underbrush, spiky, rounded or both, and mats of
// creeping cover grow in bands along the rolling swells of sand with open
// sand between, each bush tilted and curved to the slope under it; it
// frames the scene on both sides, over the dunes on the right and in a bank
// of big bushes in the near left corner. Everything stands at its true size
// on sand whose rows close up toward its edge, over a sea of short lavender
// and blue dashes, granite rocks ringed in surf and a headland with its own
// grove stepping into haze. The day turns slowly; after dark the surf
// glows. One light, the sun or the moon, shades every branch, pad and bush
// from its own form and throws every shadow the same way; lines are laid in
// dots.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // wind, gust, grain, zoom
  c: vec4f,   // sun x, sun y, sun height, dark
  d: vec4f,   // moon x, moon y, moon height, tilt x
  e: vec4f,   // tree count, glow, fog, dune count
  cols: array<vec4f, 33>,
  tr: array<vec4f, 10>,    // per tree: foot x, foot y, height, haze
  tk: array<vec4f, 10>,    // top of its trunk x, y, radius there, sway phase (tree units)
  tv: array<vec4f, 10>,    // its bark: tone (dark .. pale), warmth, algae, grain
  tb: array<vec4f, 10>,    // its bounds in tree units: min x, min y, max x, max y
  tsh: array<vec4f, 60>,   // six pads of its crown for shadows: centre x, y, radius
  seg: array<vec4f, 360>,  // trunk and branch pieces, SEG per tree: from x, y, to x, y
  sr: array<vec4f, 360>,   // their radius at each end, bare (0/1), distance along the limb
  pad: array<vec4f, 160>,  // pads of foliage, PAD per tree: centre x, y, reach, _
  padP: array<vec4f, 160>, // their seed, tilt, number of lobes, sway phase
  dune: array<vec4f, 6>,   // dunes far to near: x of the middle, depth of the foot, half width, height
  fg: array<vec4f, 12>,    // bushes in the foreground, far to near: foot x, y, size, seed
}
@group(0) @binding(0) var<uniform> u: U;

// 0-6 sky, 7 headland, 8 mist, 9 mist light, 10 sea far, 11 sea near,
// 12 dash lavender, 13 dash blue, 14 foam, 15 sand, 16 sand shade,
// 17 sand light, 18 algae orange, 19 needle tip, 20 needle dark,
// 21 needle mid, 22 bleached wood, 23 bark, 24 needle lit, 25 bush dark,
// 26 bush mid, 27 bush hi, 28 bush hi 2, 29 glow, 30 ink, 31 lamp, 32 pink
@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn post(v: f32, n: f32) -> f32 { return floor(clamp(v, 0.0, 1.0) * n + 0.5) / n; }
@diagnostic(off, derivative_uniformity) fn light() -> f32 { return smoothstep(-0.04, 0.2, u.c.z); }
@diagnostic(off, derivative_uniformity) fn lowSun() -> f32 { return 1.0 - smoothstep(0.1, 0.5, u.c.z); }

const HZ = -0.04;
const DOT = 0.0011;
const SEG = 36;
const PAD = 16;
// A loop bound read through the uniforms (always n), so the compiler keeps
// the loop rolled instead of copying its body once per pass.
@diagnostic(off, derivative_uniformity) fn loopN(n: i32) -> i32 { return select(n, 0, u.a.x < -1e30); }
@diagnostic(off, derivative_uniformity) fn groundTop(x: f32) -> f32 { return 0.07 + 0.035 * sin(x * 2.3 + u.a.w) - 0.03 * smoothstep(0.2, 0.9, x) + 0.006 * sin(x * 13.0); }
@diagnostic(off, derivative_uniformity) fn headTop(x: f32) -> f32 { return HZ + 0.004 - 0.09 * smoothstep(0.25, 0.75, x) + 0.01 * sin(x * 11.0 + u.a.w) - 0.02 * smoothstep(0.8, 1.2, x); }

// Rows across the dunes, k to each doubling of the distance below the
// horizon: spaced in proportion to that distance, as the rows of the sea
// are, so the land closes up toward its lip. 0 at the lip.
@diagnostic(off, derivative_uniformity) fn landRows(p: vec2f, k: f32) -> f32 {
  return log(max(p.y - HZ, 1e-3) / max(groundTop(p.x) - HZ, 1e-3)) * k;
}
// Height of the dunes: broad swells whose crests wander across the sand,
// over a gentle roll, both shrinking with distance.
@diagnostic(off, derivative_uniformity) fn groundZ(p: vec2f) -> f32 {
  let dz = max(p.y - HZ, 0.0);
  let rowV = landRows(p, 9.0);
  return dz * (0.11 * swell(p.x, rowV, dz) + 0.1 * (fbm(vec2f(p.x / (dz + 0.05) * 0.9, rowV * 0.35) + u.a.w) - 0.5));
}
// The phase of the dunes' swells at x, rowV rows back, dz below the
// horizon: its sine is the swell, and the scrub follows its lines.
@diagnostic(off, derivative_uniformity) fn swellPh(x: f32, rowV: f32, dz: f32) -> f32 {
  return rowV * 0.8 + 1.4 * sin(x / (dz + 0.05) * 0.8 + u.a.w);
}
@diagnostic(off, derivative_uniformity) fn swell(x: f32, rowV: f32, dz: f32) -> f32 {
  return sin(swellPh(x, rowV, dz));
}

// ---- Cypresses. Each is laid out in JS in its own units: foot at the
// origin, about 1 high (y up is negative), +x downwind. Their foliage grows
// in flat pads of long, thin triangles at the ends of the branches.
// Lobe m of n in a pad of foliage: a long, thin diamond made of two long
// triangles meeting along its axis. Most lie out along the pad one way or
// the other, rising or dipping; some stand up from it and a few hang. The
// pad is flat, so the ones along it are long and the upright ones short,
// and they run from large at the back of the pad (m 0) to small at its
// front. Ls is the pad's reach, sd a seed, fl a flutter from the wind.
struct Kite { c: vec2f, dir: vec2f, ld: f32, lw: f32, hw: f32, f: f32 }
// Where lobe m sits in its pad, and how far from there it can reach at most:
// enough to pass over the lobes a pixel can't touch before building them.
@diagnostic(off, derivative_uniformity) fn kiteNear(m: i32, n: i32, Ls: f32, sd: f32) -> vec3f {
  let fm = f32(m);
  let c0 = (vec2f(hash21(vec2f(fm * 9.1, sd + 6.7)), hash21(vec2f(fm * 4.7, sd + 7.9))) - 0.5) * vec2f(Ls * 0.8, Ls * 0.22);
  return vec3f(c0, Ls * mix(0.45, 1.0, hash21(vec2f(fm * 7.1, sd + 2.7))) * mix(1.0, 0.55, fm / f32(max(n - 1, 1))) * 1.12);
}
@diagnostic(off, derivative_uniformity) fn kite(m: i32, n: i32, Ls: f32, sd: f32, fl: f32) -> Kite {
  let fm = f32(m);
  let h1 = hash21(vec2f(fm * 3.7, sd));
  let h2 = hash21(vec2f(fm * 5.3, sd + 1.3));
  let h3 = hash21(vec2f(fm * 7.1, sd + 2.7));
  var K: Kite;
  K.f = fm / f32(max(n - 1, 1));
  var ang = mix(-2.0, -1.1, h2);
  if (h1 < 0.42) { ang = mix(-0.35, 0.5, h2); }
  else if (h1 < 0.78) { ang = 3.1416 + mix(-0.5, 0.35, h2); }
  else if (h1 < 0.94) { ang = mix(0.9, 2.25, h2); }
  // The first few lie level either way and make the body of the pad.
  if (m < 3) { ang = select(3.1416, 0.0, (m & 1) == 0) + (h2 - 0.5) * 0.4; }
  ang += fl * 0.06 * sin(fm * 2.1 + sd);
  K.dir = vec2f(cos(ang), -sin(ang));
  K.ld = Ls * mix(0.45, 1.0, h3) * mix(0.45, 1.0, abs(K.dir.x)) * mix(1.0, 0.55, K.f) * select(1.0, 0.8, K.dir.x < 0.0) * select(1.0, 0.75, m < 3) * select(1.0, 0.6, K.dir.y > 0.5);
  K.lw = K.ld * (0.2 + 0.14 * hash21(vec2f(fm * 2.9, sd + 4.1)));
  K.hw = K.ld * (0.19 + 0.09 * hash21(vec2f(fm * 2.2, sd + 5.3)));
  K.c = (vec2f(hash21(vec2f(fm * 9.1, sd + 6.7)), hash21(vec2f(fm * 4.7, sd + 7.9))) - 0.5) * vec2f(Ls * 0.8, Ls * 0.22) + K.dir * K.ld * 0.1;
  return K;
}
// Signed distance to a diamond's outline, from (along, across) its axis.
// Inside, the axis is no edge, so only the two outer sides count.
@diagnostic(off, derivative_uniformity) fn kiteD(lq: vec2f, K: Kite) -> f32 {
  let hq = vec2f(lq.x, abs(lq.y));
  let d = sdTri(hq, vec2f(-K.lw, 0.0), vec2f(0.0, K.hw), vec2f(K.ld, 0.0));
  if (d >= 0.0) { return d; }
  return max(dot(hq - vec2f(-K.lw, 0.0), normalize(vec2f(-K.hw, K.lw))), dot(hq - vec2f(K.ld, 0.0), normalize(vec2f(K.hw, K.ld))));
}
// How much light a diamond's facet at lq takes: four flat facets meet at
// its widest point, the two along each side of the axis turned away from
// it, the long ones leaning toward the tip and the short ones back.
@diagnostic(off, derivative_uniformity) fn kiteLit(lq: vec2f, K: Kite) -> f32 {
  let nrm = vec2f(-K.dir.y, K.dir.x);
  let fa = select(-0.45, 0.45, lq.x > 0.0);
  let fu = select(0.7, -0.7, lq.y > 0.0);
  return lambert(normalize(vec3f(fa * K.dir.x - fu * nrm.x, -fa * K.dir.y + fu * nrm.y, 0.6)), 0.25);
}
// The grain of the foliage: small, long triangles in staggered rows along
// a lobe's axis, all pointing toward its tip. Returns their coverage and a
// hash for each.
@diagnostic(off, derivative_uniformity) fn sprayGrain(q: vec2f, cell: f32, px: f32, seed: f32) -> vec2f {
  var best = vec2f(0.0);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let cw = cell * 2.4 * (1.0 - 0.25 * fl);
    let ch = cell * 0.8 * (1.0 - 0.25 * fl);
    let row = floor(q.y / ch + fl * 0.5);
    let g = vec2f(q.x / cw + row * 0.37 + fl * 0.5, q.y / ch + fl * 0.5);
    let id = floor(g);
    let h = hash21(id + seed + fl * 5.3);
    if (h < 0.25) { continue; }
    let f = (fract(g) - 0.5) * vec2f(cw, ch);
    let len = cw * (0.6 + 0.35 * hash21(id + 2.1));
    let hw = ch * (0.2 + 0.12 * hash21(id + 3.7));
    let d = sdTri(f, vec2f(-len * 0.5, hw), vec2f(-len * 0.5, -hw), vec2f(len * 0.5, 0.0));
    let a = fillA(d, px) * (0.9 - fl * 0.2);
    if (a > best.x) { best = vec2f(a, h); }
  }
  return best;
}
// Tree i over col at p: its trunk and branches, then its pads of foliage,
// washed toward the haze with distance and fog.
@diagnostic(off, derivative_uniformity) fn cypress(col: vec3f, p: vec2f, i: i32, px: f32, hazeC: vec3f) -> vec3f {
  let T = u.tr[i];
  let s = T.z;
  let B = u.tb[i];
  let pl = px / s;
  let dotW = DOT * (0.65 + 0.35 * (1.0 - T.w)) / s;
  let mg = pl * 2.0 + dotW * 3.0;
  var q = (p - T.xy) / s;
  if (q.x < B.x - mg || q.x > B.z + mg || q.y < B.y - mg || q.y > B.w + mg) { return col; }
  let t = u.a.x;
  let wind = u.b.x + u.b.y;
  let K = u.tk[i];
  // The crown rocks downwind from the foot, further in a gust.
  let rock = wind * (0.014 + 0.008 * sin(t * 0.9 + K.w)) + 0.005 * sin(t * 1.4 + K.w * 2.0);
  q.x -= rock * q.y * q.y;
  var acc = vec4f(0.0);
  // ---- Limbs: the nearest piece gives the surface and the bark.
  var bd = 1e3; var bo = vec2f(0.0); var bdir = vec2f(0.0, -1.0); var br = 0.01; var bu = 0.0; var bare = 0.0; var bk = 0;
  for (var k = 0; k < SEG; k++) {
    let R = u.sr[i * SEG + k];
    if (R.x <= 0.0) { break; }
    let S = u.seg[i * SEG + k];
    let ba = S.zw - S.xy;
    let bl2 = max(dot(ba, ba), 1e-8);
    let hh = clamp(dot(q - S.xy, ba) / bl2, 0.0, 1.0);
    let off = q - S.xy - ba * hh;
    var r = mix(R.x, R.y, hh);
    // The trunk flares where it meets the ground.
    if (k == 0) { r *= 1.0 + 0.7 * smoothstep(-0.1, 0.03, q.y); }
    let d = length(off) - r;
    if (d < bd) { bd = d; bo = off; bdir = ba / sqrt(bl2); br = r; bu = R.w + hh * sqrt(bl2); bare = R.z; bk = k; }
  }
  // Gnarled: the girth swells and pinches along the limb. And the trunk
  // stands on the ground: its foot ends in the curve of its base.
  let gn = 1.0 + 0.2 * (vnoise(vec2f(bu * 24.0, f32(bk) * 3.7 + K.w)) - 0.5);
  bd += br * (1.0 - gn);
  br *= gn;
  bd = max(bd, q.y - 0.35 * sqrt(max(br * br - q.x * q.x, 0.0)));
  if (bd < mg) {
    let across = clamp(dot(bo, vec2f(-bdir.y, bdir.x)) / max(br, 1e-4), -1.0, 1.0);
    let bl = lambert(roundN(bo, vec2f(br)), 0.35);
    var bc: vec3f;
    if (bare > 0.5) {
      // A dead limb, weathered silver and split along its grain.
      bc = mix(mix(C(22), C(23), 0.6), C(22), post(bl * 1.2, 3.0));
      let gv = across * 2.5 + 0.4 * sin(bu * 30.0 + f32(bk));
      bc = mix(bc, mix(C(23), C(30), 0.3), dotLine((fract(gv) - 0.5) * br * 0.4, bu, dotW * 0.6, pl, floor(gv) + f32(bk) * 7.0) * 0.6);
    } else {
      // Each tree's bark is its own: darker or paler, warmer or cooler,
      // coarser or finer, more or less rusted with algae, and grown in
      // fine fissures, long peeling strips or mottled plates.
      let V = u.tv[i];
      let bark = mix(mix(C(23) * 0.6, mix(C(23), C(22), 0.65), V.x), mix(C(23), C(18), 0.45), V.y * 0.7);
      let bDark = mix(bark, C(30), 0.45);
      bc = barkTex(bu, across, br * mix(0.9, 2.2, V.w), bl, pl, bDark, bark, mix(bark, C(22), 0.5), f32(bk) + K.w * 7.0);
      let pat = fract(K.w * 1.618);
      let sv = across * mix(2.0, 3.5, V.w) + 0.6 * sin(bu * 7.0 + K.w * 3.0);
      let strip = smoothstep(0.3, 0.45, abs(fract(sv) - 0.5));
      bc = mix(bc, mix(bDark, bark, 0.3), strip * 0.65 * smoothstep(0.3, 0.4, pat) * smoothstep(0.7, 0.6, pat));
      let pm = vnoise(vec2f(bu * mix(14.0, 26.0, V.w), across * 1.6 + f32(bk) * 2.3) + K.w);
      bc = mix(bc, select(mix(bark, C(22), 0.45) * mix(0.7, 1.1, bl), bDark, pm < 0.5), smoothstep(0.12, 0.3, abs(pm - 0.5)) * 0.6 * smoothstep(0.62, 0.72, pat));
      // Patches of rust-orange algae, as on the old trees at Point Lobos.
      let alg = smoothstep(0.6, 0.74, vnoise(vec2f(bu * mix(10.0, 22.0, V.w), across * 1.2 + f32(bk) * 3.1 + K.w)));
      bc = mix(bc, C(18) * mix(0.55, 1.1, bl), alg * V.z);
    }
    bc = moonCast(bc, bl);
    acc = over(acc, bc, fillA(bd, pl));
    acc = over(acc, C(30), dotLine(bd, bu, dotW, pl, f32(bk) * 3.0 + K.w * 5.0) * 0.7);
  }
  // ---- Foliage, from the top of the tree down, each pad laid over the
  // ones above it: long, thin diamonds of many sizes pointing different
  // ways, large ones at the back in the pad's own shade and smaller ones
  // over them in front. Each is lit as flat facets, so the light slides
  // from facet to facet as the sun moves.
  let cell = max(0.008, pl * 2.4);
  for (var k = 0; k < PAD; k++) {
    let P = u.pad[i * PAD + k];
    if (P.z <= 0.0) { break; }
    let Q = u.padP[i * PAD + k];
    let Ls = P.z;
    // Each pad bobs a little on its branch.
    let bob = vec2f(wind * 0.006 * sin(t * 1.1 + Q.w), wind * 0.003 * sin(t * 1.7 + Q.w * 1.3));
    let v = rot2(q - P.xy - bob, -Q.y);
    if (v.x < -Ls * 1.35 - mg || v.x > Ls * 1.55 + mg || v.y < -Ls * 0.85 - mg || v.y > Ls * 0.7 + mg) { continue; }
    let fl = wind * sin(t * 1.6 + Q.w);
    let nK = i32(Q.z);
    for (var j = 0; j < 12; j++) {
      if (j >= nK) { break; }
      let kn = kiteNear(j, nK, Ls, Q.x);
      if (length(v - kn.xy) > kn.z + mg) { continue; }
      let K = kite(j, nK, Ls, Q.x, fl);
      let lq = vec2f(dot(v - K.c, K.dir), dot(v - K.c, vec2f(-K.dir.y, K.dir.x)));
      if (lq.x < -K.lw - mg || lq.x > K.ld + mg || abs(lq.y) > K.hw + mg) { continue; }
      let d = kiteD(lq, K);
      if (d > mg) { continue; }
      // The heart of the pad sits in its own shade; lobes that stand up
      // catch more light than the ones that hang.
      let lit = kiteLit(lq, K) * mix(0.7, 1.0, K.f) * mix(0.85, 1.1, smoothstep(-0.7, 0.7, -K.dir.y));
      let fc = moonCast(foliage(lit, sprayGrain(lq, cell, pl, Q.x + f32(j) * 13.0), C(20), C(21), C(24), C(19)), lit);
      acc = over(acc, fc, fillA(d, pl));
      acc = over(acc, C(30), evenDots(d, lq.x, dotW * 0.8, pl) * 0.5);
    }
  }
  let res = unpremul(acc);
  return mix(col, mix(res.rgb, hazeC, T.w * (0.25 + 0.45 * u.e.z)), res.a);
}
// Everything tree i throws on the sand: its trunk, the pads of its
// crown, and the dark ring where it stands.
@diagnostic(off, derivative_uniformity) fn treeShade(ps: vec2f, pq: vec2f, i: i32, px: f32) -> f32 {
  let T = u.tr[i];
  let s = T.z;
  let foot = T.xy;
  let reach = castS(s * 1.1);
  let lo = min(foot, foot + reach) - vec2f(s * 1.1, s * 0.4);
  let hi = max(foot, foot + reach) + vec2f(s * 1.6, s * 0.4);
  if (ps.x < lo.x || ps.x > hi.x || ps.y < lo.y || ps.y > hi.y) { return 0.0; }
  let K = u.tk[i];
  var sh = stemShadow(ps, foot, foot + K.xy * s, K.z * s, px);
  for (var j = 0; j < 6; j++) {
    let M = u.tsh[i * 6 + j];
    if (M.z <= 0.0) { continue; }
    sh = max(sh, blobShadowQ(pq, ps, foot + M.xy * s, M.z * s, foot.y, px));
  }
  let cq = (ps - foot) / vec2f(s * 0.09, s * 0.022);
  return max(sh, exp(-dot(cq, cq)) * 0.8);
}

// A shrub on the dunes: where it stands, how big it is and what kind.
// kind 0 is a spiky pad of diamonds, 1 a rounded mound, 2 a rounded mound
// crowned with spiky sprays, 3 a low mat of creeping cover. r is its
// height, w its half width, ht how tall it stands for its shadow.
struct Bush { on: bool, foot: vec2f, r: f32, w: f32, ht: f32, kind: i32, seed: f32, tilt: f32, bend: f32 }
// The spacing of the shrubs along row rr of the dunes.
@diagnostic(off, derivative_uniformity) fn bushW(rr: f32, KM: f32) -> f32 { return 0.063 * exp((rr + 0.8) / KM); }
// Shrub n (0 or 1) in cell si of row rr: sizes run from low tufts to big
// bushes, most of them small, all scaled by their distance. The scrub is
// thickest toward both sides of the frame, grows in bands that follow the
// swells of the dunes with open sand between, and gathers in patches where
// a cell can hold a second shrub. Each sits along the slope under it,
// tilted and curved with the swell.
// q is the pixel and reach how far from a shrub's foot, in its depths below
// the horizon, it can still touch the pixel (its own size, or its shadow):
// shrubs out of reach are passed over before the costly part.
@diagnostic(off, derivative_uniformity) fn bushAt(si: f32, rr: f32, KM: f32, n: i32, q: vec2f, reach: vec2f, dz0: f32) -> Bush {
  var b: Bush;
  b.on = false;
  let id = vec2f(si, rr) + f32(n) * vec2f(31.7, 17.3);
  let cx = (si - rr * 0.37 + 0.5 + (hash21(id + 2.0) - 0.5) * select(0.5, 0.9, n == 1)) * bushW(rr, KM);
  if (abs(q.x - cx) > dz0 * reach.x) { return b; }
  let cy = HZ + (groundTop(cx) - HZ) * exp((rr + 0.8 + (hash21(id + 4.0) - 0.5) * 0.4) / KM);
  let dz = cy - HZ;
  if (q.y > cy + dz * reach.y || q.y < cy - dz * 0.5) { return b; }
  let h = hash21(id + u.a.w + 50.0);
  let xr = 0.5 * u.a.y * u.b.w;
  let ph = swellPh(cx, (rr + 0.8) * 9.0 / KM, dz);
  let sw = sin(ph);
  var thin = mix(0.52, 0.12, smoothstep(0.2, 0.85, abs(cx / xr)));
  thin -= 0.28 * smoothstep(0.1, -0.7, sw) - 0.18 * smoothstep(0.3, 0.9, sw);
  thin -= 0.3 * (vnoise(vec2f(cx * 4.0, rr * 0.8) + u.a.w) - 0.5);
  // Thicker still toward the viewer on the left, framing the scene.
  thin -= 0.18 * smoothstep(0.25, 0.5, cy) * smoothstep(0.0, -0.6, cx / xr);
  b.on = h > thin + select(0.0, 0.35, n == 1);
  if (!b.on) { return b; }
  // None where a dune stands: the dunes carry their own.
  for (var k = 0; k < 6; k++) {
    if (k >= i32(u.e.w)) { break; }
    let D = u.dune[k];
    if (abs(cx - D.x) < D.z && cy > duneTop(D, cx) - (cy - HZ) * 0.05 && cy < duneFoot(D, cx) + (cy - HZ) * 0.03) { b.on = false; return b; }
  }
  b.foot = vec2f(cx, cy);
  shape(&b, dz, hash21(id + 6.1) * mix(1.0, 1.25, smoothstep(0.1, -0.8, sw)), hash21(id + 8.3), hash21(id + 9.7), h * 13.0);
  // Lie along the swell's line: its slope on screen, and bowed over its
  // crests or cupped in its troughs.
  let lean = -0.156 * cos(cx / (dz + 0.05) * 0.8 + u.a.w) * dz / (dz + 0.05);
  b.tilt = clamp(lean * 1.5 + (hash21(id + 11.3) - 0.5) * 0.3, -0.4, 0.4);
  b.bend = clamp(0.22 * sw + (hash21(id + 12.7) - 0.5) * 0.2, -0.06, 0.3);
  return b;
}
// Size and kind for a shrub dz below the horizon, from three hashes.
@diagnostic(off, derivative_uniformity) fn shape(b: ptr<function, Bush>, dz: f32, hs: f32, hk: f32, hw: f32, seed: f32) {
  let r = dz * (0.035 + 0.12 * hs * hs);
  (*b).kind = select(select(select(3, 2, hk < 0.82), 1, hk < 0.62), 0, hk < 0.3);
  (*b).r = select(r * (0.8 + 0.4 * fract(hw * 7.3)), r * 0.55, (*b).kind == 3);
  (*b).w = r * select(select(1.0 + 1.4 * hw, 1.6, (*b).kind == 0), 1.4 + 0.8 * hw, (*b).kind == 3);
  (*b).ht = (*b).r * select(1.0, 1.3, (*b).kind == 2);
  (*b).seed = seed + hk * 7.0;
  (*b).tilt = 0.0; (*b).bend = 0.0;
}
// A rounded shrub: a low dome, dark in its core and stippled with light
// round its curve from the one light. foot is where it meets the ground,
// r its height and w its half width; it leans with the slope by tilt and
// bows over a crest (bend > 0) or cups in a hollow (bend < 0).
@diagnostic(off, derivative_uniformity) fn mound(col: vec3f, p: vec2f, foot: vec2f, r: f32, w: f32, tilt: f32, bend: f32, seed: f32, px: f32) -> vec3f {
  var v = rot2(p - foot, -tilt);
  v.y -= bend * v.x * v.x / max(w, 1e-4);
  v.y += r * 0.5;
  if (abs(v.x) > w * 1.25 + px * 3.0 || abs(v.y) > r * 0.75 + px * 3.0) { return col; }
  let sd = max(length(v / vec2f(w / (r * 0.62), 1.0)) - r * 0.62 * (1.0 + 0.1 * sin(atan2(v.y, v.x) * 6.0 + seed * 9.0)), v.y - r * 0.5);
  if (sd > DOT * 4.0 + px * 2.0) { return col; }
  let blit = smoothstep(0.0, 0.6, lambert(roundN(v, vec2f(w, r * 0.62)), 0.4)) * (1.0 - smoothstep(0.0, r * 0.5, v.y) * 0.6);
  var c = mix(col, moonCast(stippleBush(p, 0.05 + 0.95 * blit, max(0.0024 + r * 0.06, px * 2.2), px, C(25), C(26), C(27), C(28), C(18), seed), blit), fillA(sd, px));
  // Its rim in round dots, evenly spaced.
  let rN = max(round(6.2832 * r * 0.7 / (max(DOT * 0.8, px * 0.8) * 2.3)), 5.0);
  return mix(c, C(30), evenDots(sd, (atan2(v.y, v.x) / 6.2832 + 0.5) * 6.2832 * r * 0.7, 6.2832 * r * 0.7 / rN / 2.3, px) * 0.5);
}
// Draw shrub b over col.
@diagnostic(off, derivative_uniformity) fn bush(col: vec3f, p: vec2f, b: Bush, px: f32) -> vec3f {
  var c = col;
  // Mounds and mats: a mat is just a very low, wide mound.
  if (b.kind != 0) { c = mound(c, p, b.foot, b.r, b.w, b.tilt, b.bend, b.seed, px); }
  // Spiky ones, and the spiky crown on a mound.
  if (b.kind == 0 || b.kind == 2) {
    let crown = b.kind == 2;
    c = shrub(c, p, select(b.foot, b.foot + rot2(vec2f(0.0, -b.r * 0.55), b.tilt), crown), select(b.r, b.r * 0.75, crown), b.tilt, b.seed + select(0.0, 3.0, crown), px);
  }
  return c;
}
// Foliage in three flat tones, shade, mid and the lit tops, with the grain
// laid over it a tone lighter.
@diagnostic(off, derivative_uniformity) fn foliage(lit: f32, gr: vec2f, dark: vec3f, mid: vec3f, hi: vec3f, tip: vec3f) -> vec3f {
  var c = mix(dark, mid, smoothstep(0.08, 0.16, lit));
  c = mix(c, hi, smoothstep(0.3, 0.4, lit));
  let g = select(select(mix(dark, mid, 0.7), mix(mid, hi, 0.6), lit > 0.12), mix(hi, tip, 0.7), lit > 0.35);
  return mix(c, g, gr.x * smoothstep(0.02, 0.5, lit + (gr.y - 0.5) * 0.4));
}
// A low cypress shrub: a small pad of long, thin diamonds pointing different
// ways, sitting on the ground, now and then with a rusty one among them.
// c is its foot, r its size.
@diagnostic(off, derivative_uniformity) fn shrub(col: vec3f, p: vec2f, c: vec2f, r: f32, tilt: f32, seed: f32, px: f32) -> vec3f {
  let Ls = r * 1.4;
  let v = rot2(p - c, -tilt) + vec2f(0.0, r * 0.5);
  if (v.x < -Ls * 1.35 - px * 2.0 || v.x > Ls * 1.55 + px * 2.0 || v.y < -Ls * 0.85 - px * 2.0 || v.y > r * 0.5 + px * 2.0) { return col; }
  var acc = vec4f(0.0);
  let cell = max(r * 0.12, px * 2.4);
  for (var m = 0; m < 9; m++) {
    let kn = kiteNear(m, 9, Ls, seed);
    if (length(v - kn.xy) > kn.z + px * 2.0) { continue; }
    let K = kite(m, 9, Ls, seed, 0.0);
    let lq = vec2f(dot(v - K.c, K.dir), dot(v - K.c, vec2f(-K.dir.y, K.dir.x)));
    if (lq.x < -K.lw - px * 2.0 || lq.x > K.ld + px * 2.0 || abs(lq.y) > K.hw + px * 2.0) { continue; }
    // Cut off where it meets the ground.
    let d = max(kiteD(lq, K), v.y - r * 0.5);
    if (d > DOT * 3.0 + px * 2.0) { continue; }
    let lit = kiteLit(lq, K) * mix(0.7, 1.0, K.f);
    var fc = foliage(lit, sprayGrain(lq, cell, px, seed + f32(m) * 13.0), C(25), C(26), C(27), C(28));
    fc = mix(fc, C(18) * mix(0.6, 1.0, lit), step(0.92, hash21(vec2f(f32(m) * 3.3, seed + 8.1))));
    fc = moonCast(fc, lit);
    acc = over(acc, fc, fillA(d, px));
    acc = over(acc, C(30), evenDots(d, lq.x, DOT * 0.7, px) * 0.4);
  }
  let res = unpremul(acc);
  return mix(col, res.rgb, res.a);
}

// ---- Dunes, laid out in JS far to near: x of the middle, depth of the
// foot, half the width and the height. Each has a long, gentle windward
// slope and a steeper lee face, a crest lit by the one light, ripples that
// follow its curve, and shrubs of its own on its face.
@diagnostic(off, derivative_uniformity) fn duneTop(D: vec4f, x: f32) -> f32 {
  let q = (x - D.x) / D.z;
  let t = clamp(select((1.0 - q) / 0.75, (q + 1.0) / 1.25, q < 0.25), 0.0, 1.0);
  return D.y - D.w * t * t * (3.0 - 2.0 * t) * (1.0 + 0.05 * sin(q * 7.0 + D.x * 13.0));
}
// Where its face meets the flat sand in front, bulging toward the viewer.
@diagnostic(off, derivative_uniformity) fn duneFoot(D: vec4f, x: f32) -> f32 {
  let q = (x - D.x) / D.z;
  return D.y + D.w * 0.3 * max(1.0 - q * q, 0.0);
}
// Whether dune k, or its scrub, can reach pixel p.
@diagnostic(off, derivative_uniformity) fn duneNear(k: i32, p: vec2f) -> bool {
  let D = u.dune[k];
  let mgn = (D.y - HZ) * 0.32;
  return D.w > 0.0 && abs(p.x - D.x) <= D.z + mgn && p.y >= D.y - D.w * 1.1 - mgn && p.y <= D.y + D.w * 0.4;
}
// The face of dune k over col.
@diagnostic(off, derivative_uniformity) fn duneFace(col: vec3f, p: vec2f, k: i32, px: f32) -> vec3f {
  let D = u.dune[k];
  let dz = D.y - HZ;
  var c = col;
  let top = duneTop(D, p.x);
  let foot = duneFoot(D, p.x);
  if (p.y > top - px * 3.0 && abs(p.x - D.x) < D.z) {
    let e = D.z * 0.01;
    let sl = (duneTop(D, p.x + e) - duneTop(D, p.x - e)) / (2.0 * e);
    let f = clamp((p.y - top) / max(foot - top, 1e-4), 0.0, 1.0);
    // The face turns from the crest down toward the viewer.
    let gl = lambert(groundN(sl * 1.4, 0.2 + f * 1.4), 0.45);
    var dc = mix(C(16), C(15), 0.3 + 0.7 * post(gl * 1.1, 4.0));
    dc = mix(dc, C(17), (1.0 - smoothstep(0.0, 0.2, f)) * gl * 0.8);
    // Ripples following its curve.
    let nr = 4.0 + 6.0 * D.w / dz;
    let rv = f * nr;
    dc = mix(dc, C(16), dotLine((fract(rv + 0.5) - 0.5) * (foot - top) / nr, p.x, DOT * clamp(dz / 0.3, 0.55, 1.25) * 0.7, px, floor(rv + 0.5) + f32(k) * 11.0) * 0.3);
    dc = moonCast(dc, gl);
    // The face melts into the sand at its foot; the crest is drawn in dots.
    c = mix(c, dc, fillA(top - p.y, px) * (1.0 - smoothstep(0.7, 1.0, f)));
    c = mix(c, C(30), dotLine(p.y - top, p.x, DOT, px, f32(k) * 7.0 + 3.0) * 0.6 * smoothstep(1.0, 0.9, abs(p.x - D.x) / D.z));
  }
  return c;
}
// Shrub j of the scrub on dune k, in patches from the crest down: shrubs,
// and mats of creeping cover spread among them. Off if it can't reach p.
@diagnostic(off, derivative_uniformity) fn duneBush(k: i32, j: i32, p: vec2f, px: f32) -> Bush {
  let D = u.dune[k];
  let dz = D.y - HZ;
  var b: Bush;
  b.on = false;
  let fj = f32(j);
  let h = hash21(vec2f(fj * 1.7, f32(k) * 3.1 + u.a.w));
  let clump = (f32(j % 4) + 0.5) / 4.0 * 1.6 - 0.8 + (hash21(vec2f(f32(j % 4) * 4.3, f32(k) + u.a.w + 9.0)) - 0.5) * 0.3;
  let x = D.x + D.z * clamp(clump + (hash21(vec2f(fj * 2.3, f32(k) + u.a.w + 5.0)) - 0.5) * 0.55, -0.92, 0.92);
  // No shrub here is wider than about two-thirds of the dune's depth.
  if (abs(p.x - x) <= dz * 0.62 + px * 3.0) {
    b.on = true;
    b.foot = vec2f(x, mix(duneTop(D, x), duneFoot(D, x), 0.05 + 0.65 * (fj + h) / 25.0));
    let hk = select(hash21(vec2f(fj * 5.1, f32(k) + 4.0 + u.a.w)), 0.95, (j % 5) == 1);
    shape(&b, dz, 0.25 + 0.75 * hash21(vec2f(fj * 3.9, f32(k) + 2.0 + u.a.w)), hk, h, h * 13.0 + f32(k));
    let e = D.z * 0.02;
    b.tilt = clamp(atan((duneTop(D, x + e) - duneTop(D, x - e)) / (2.0 * e)) * 0.7, -0.45, 0.45);
    b.bend = clamp(0.25 - 0.35 * (b.foot.y - duneTop(D, x)) / max(duneFoot(D, x) - duneTop(D, x), 1e-4), -0.05, 0.3);
  }
  return b;
}
// Scrub along the lip, in cells of 0.05 across.
@diagnostic(off, derivative_uniformity) fn lipBush(id: f32) -> Bush {
  var b: Bush;
  let h = hash1(id * 1.9 + u.a.w);
  b.on = h >= 0.4;
  b.r = 0.008 + 0.012 * h * h;
  b.foot = vec2f((id + 0.5 + (hash1(id * 4.1) - 0.5) * 0.4) * 0.05, 0.0);
  b.foot.y = groundTop(b.foot.x) + b.r * 0.3;
  b.kind = i32(hash1(id * 7.3 + u.a.w) * 2.99);
  b.w = b.r * (1.3 + 0.5 * hash1(id * 2.2));
  b.ht = b.r;
  b.seed = h * 17.0;
  return b;
}
// Brush in the foreground, nearest of all, laid out in JS.
@diagnostic(off, derivative_uniformity) fn fgBush(k: i32) -> Bush {
  let F = u.fg[k];
  var b: Bush;
  b.on = F.z > 0.0;
  b.foot = F.xy;
  let hk = hash21(vec2f(F.w, 1.3));
  b.kind = select(select(2, 1, hk < 0.6), 0, hk < 0.2);
  b.r = F.z;
  b.w = F.z * (1.3 + 1.0 * hash21(vec2f(F.w, 2.9)));
  b.ht = F.z;
  b.seed = F.w;
  b.tilt = (hash21(vec2f(F.w, 4.1)) - 0.5) * 0.35;
  b.bend = hash21(vec2f(F.w, 5.3)) * 0.2;
  return b;
}

@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let k = u.b.w;
  let p0 = vec2f((uv.x - 0.5) * asp, uv.y - 0.5) * k;
  let px = u.a.z * k;
  let tilt = u.d.w;
  let dark = u.c.w;
  let lt = light();
  let sun = u.c.xy;
  let moon = u.d.xy;
  let wind = u.b.x + u.b.y;
  let glowAmt = u.e.y * dark;
  let fog = u.e.z;
  let pFar = p0 + vec2f(tilt * 0.006, 0.0);
  let pMid = p0 + vec2f(tilt * 0.012, 0.0);
  let p = p0 + vec2f(tilt * 0.02, 0.0);
  let hazeC = mix(C(2), C(8), 0.5);
  dayLight();

  var col = paintSky(p0, HZ, px, t, C(31), -0.12, 2);
  // Gulls by day.
  for (var i = 0; i < 4; i++) {
    let fi = f32(i);
    let bx = fract(0.3 + fi * 0.27 - t * (0.006 + 0.003 * hash1(fi)) * (1.0 + wind)) * 2.0 - 1.0;
    let by = -0.34 - 0.1 * hash1(fi * 3.0 + u.a.w) + 0.01 * sin(t * 0.7 + fi);
    col = mix(col, C(30), bird(p0, vec2f(bx, by), 0.014 + 0.006 * hash1(fi * 5.0), sin(t * 3.0 + fi * 2.0), px) * (1.0 - dark) * 0.85);
  }

  // ---- Sea: perspective rows of short lavender and blue dashes. After dark
  // the ones breaking toward the shore glow; the glow is gathered here and
  // laid on after the mist, which it shines through.
  var seaGlow = 0.0;
  if (p0.y > HZ) {
    let d = p0.y - HZ;
    var sc = mix(C(10), C(11), post(smoothstep(0.0, 0.18, d), 4.0));
    let rowF = log(d + 0.004) * 34.0;
    let row = floor(rowF);
    let rowH = (d + 0.004) / 34.0;
    let dashL = 0.008 + d * 0.22;
    let xx = pFar.x / dashL + hash1(row) * 17.0 + t * 0.05 * (0.5 + hash1(row * 3.0));
    let h = hash21(vec2f(floor(xx), row) + u.a.w);
    let inDash = smoothstep(0.1, 0.25, fract(xx)) * smoothstep(0.9, 0.75, fract(xx));
    let line = dotLine((fract(rowF) - 0.5) * rowH, pFar.x + t * 0.05 * dashL * (0.5 + hash1(row * 3.0)), max(px * 0.8, rowH * 0.16), px, row) * inDash;
    var dc = select(select(C(12), C(13), h > 0.5), C(14), h > 0.9) * mix(0.5, 1.0, lt);
    let shore = smoothstep(0.08, 0.0, groundTop(p.x) - p0.y);
    let bio = clamp(glowAmt * (0.15 + 0.85 * shore * shore) * (0.55 + 0.45 * sin(t * 1.3 + row * 2.1 + floor(xx) * 1.7)), 0.0, 1.0);
    sc = mix(sc, dc, line * step(0.3, h) * 0.85);
    seaGlow = line * step(0.3, h) * 0.85 * bio + glowAmt * shore * 0.06;
    // Glitter under the sun or moon.
    let src = select(sun, moon, u.c.z < 0.0);
    let srcUp = select(smoothstep(0.0, 0.1, u.c.z), smoothstep(0.0, 0.1, u.d.z) * 0.8, u.c.z < 0.0);
    let path = exp(-pow((p0.x - src.x) / (0.01 + d * 0.3), 2.0)) * srcUp;
    sc = mix(sc, select(C(3), C(31), u.c.z < 0.0), line * path);
    col = sc;
  }
  col = mix(col, C(14), dotLine(p0.y - HZ, p0.x, DOT * 0.8, px, 2.0) * 0.6);
  // ---- A headland stepping into haze on the right, with a grove of its own
  // along the crest.
  {
    let ht = headTop(pFar.x);
    if (pFar.y > ht - px * 2.0 && pFar.y < HZ + 0.014) {
      let s = (headTop(pFar.x + 0.01) - headTop(pFar.x - 0.01)) / 0.02;
      var hc = mix(C(7) * 0.8, C(7), slopeLight(s, pFar.x, (pFar.y - ht) * 2.0));
      hc = mix(hc, C(7) * 0.8, step(0.75, fract(pFar.x * 18.0 + (pFar.y - ht) * 12.0)) * 0.35);
      hc = hazeStep(hc, 0.55, hazeC);
      col = mix(col, hc, fillA(ht - pFar.y, px) * fillA(pFar.y - HZ - 0.01, px));
      col = mix(col, C(14), dotLine(pFar.y - HZ - 0.01, pFar.x, DOT, px, 9.0) * step(ht, pFar.y) * (0.5 + 0.5 * sin(pFar.x * 90.0 + t * 1.5)));
    }
    if (pFar.x > 0.28 && pFar.y > ht - 0.045 && pFar.y < ht + 0.004) {
      let gw = 0.03;
      let gi = floor(pFar.x / gw);
      for (var o = -2; o <= 1; o++) {
        let id = gi + f32(o);
        let hh = hash1(id * 2.37 + u.a.w);
        let bx = (id + 0.5 + (hash1(id * 5.1 + 1.0) - 0.5) * 0.7) * gw;
        if (hh < 0.4 || bx < 0.32) { continue; }
        let th = 0.018 + 0.016 * hh;
        let v = pFar - vec2f(bx, headTop(bx) + 0.002);
        // A slender trunk with flat, pointed pads in tiers.
        var dd = sdSeg(v, vec2f(0.0, 0.0), vec2f(th * 0.06, -th * 0.95)) - th * 0.03;
        for (var b = 0; b < 3; b++) {
          let fb = f32(b);
          let side = select(-1.0, 1.0, fract(fb * 0.5 + hh * 3.0) > 0.5);
          var K: Kite;
          K.c = vec2f(th * (0.03 * fb + side * 0.1), -th * (0.5 + 0.22 * fb));
          K.dir = normalize(vec2f(1.0, -0.2 * (hash1(id * 1.3 + fb) - 0.5)));
          K.ld = th * (0.42 - 0.07 * fb) * (0.8 + 0.4 * hash1(id * 2.9 + fb));
          K.lw = K.ld * 0.75; K.hw = K.ld * 0.34; K.f = 1.0;
          dd = min(dd, kiteD(vec2f(dot(v - K.c, K.dir), dot(v - K.c, vec2f(-K.dir.y, K.dir.x))), K));
        }
        let gc = hazeStep(mix(C(20), C(7) * 0.7, 0.45), 0.45 + 0.3 * fog, hazeC);
        col = mix(col, gc, fillA(dd, px));
      }
    }
  }
  // ---- Granite rocks off the point, ringed in surf that glows after dark.
  for (var r = 0; r < 4; r++) {
    let fr = f32(r);
    let rx = -0.55 + fr * 0.36 + (hash1(fr * 3.3 + u.a.w) - 0.5) * 0.22;
    let gy = groundTop(rx);
    let ry = mix(HZ + 0.012, gy - 0.008, 0.3 + 0.55 * hash1(fr * 7.7 + u.a.w));
    let rr = (ry - HZ) * (0.18 + 0.14 * hash1(fr * 5.1 + u.a.w));
    let v = pMid - vec2f(rx, ry);
    if (ry > gy - 0.006 || length(v) > rr * 4.0) { continue; }
    let sd = max(length(v / vec2f(1.3, 0.8)) - rr * (1.0 + 0.15 * sin(atan2(v.y, v.x) * 5.0 + fr * 2.0)), v.y);
    let rl = lambert(roundN(v + vec2f(0.0, rr * 0.3), vec2f(rr * 1.3, rr * 0.9)), 0.35);
    var rc = mix(mix(C(16), C(30), 0.35), mix(C(17), C(22), 0.35), post(rl, 3.0));
    rc = mix(rc, mix(C(16), C(30), 0.4), smoothstep(-rr * 0.3, 0.0, v.y) * 0.5);
    rc = moonCast(rc, rl);
    col = mix(col, rc, fillA(sd, px));
    col = mix(col, C(30), dotRing(sd, v, rr * 1.1, DOT * 0.8, px, fr * 7.0 + 1.0) * 0.55);
    let surge = 0.5 + 0.5 * sin(t * 1.2 + fr * 2.0);
    let R = rr * (1.15 + 0.3 * surge);
    let foam = dotLine(ellD(v, vec2f(R * 1.3, R * 0.3)), v.x, DOT * (0.8 + 0.4 * surge), px, fr * 3.0 + 11.0) * step(0.0, v.y);
    col = mix(col, C(14), foam * 0.85);
    seaGlow = max(seaGlow, foam * 0.85 * min(glowAmt, 1.0));
  }
  // ---- Mist over the water at dawn and dusk.
  {
    for (var m = 0; m < 3; m++) {
      let fm = f32(m);
      let base = HZ + 0.006 + fm * 0.02;
      let sx = pFar.x + t * 0.006 * (1.0 + fm * 0.4) + fm * 2.3;
      let top = base - (0.008 + 0.025 * fog) * (0.5 + 0.5 * abs(sin(sx * (7.0 + fm) + fm))) - 0.008 * sin(sx * 2.3);
      let a = fillA(top - pFar.y, px) * smoothstep(0.05, 0.5, fog) * (0.7 - fm * 0.15);
      col = mix(col, mix(C(8), C(9), select(0.0, 0.6, m == 0)), a);
    }
  }
  col = mix(col, C(29), clamp(seaGlow, 0.0, 1.0));
  col += C(29) * seaGlow * 0.3;

  // ---- Dunes: pale sand in raked light, fine ripples, rust-coloured dabs
  // of dry weed, shrubs and the shadows of the trees; the rows close up
  // toward the lip.
  let gt = groundTop(p.x);
  let nT = i32(u.e.x);
  let nD = i32(u.e.w);
  let KM = 4.0;
  if (p.y > gt - px * 2.0) {
    let dy = p.y - gt;
    let dz = max(p.y - HZ, 1e-3);
    let s = (groundTop(p.x + 0.01) - groundTop(p.x - 0.01)) / 0.02;
    let rowV = landRows(p, 9.0) + 0.3 * sin(p.x * 6.0 + u.a.w);
    let rowH = dz / 9.0;
    // The dunes' swells are real slopes, lit from their normals.
    let z0 = groundZ(p);
    let ez = 0.006;
    let gn = heightN((groundZ(p + vec2f(ez, 0.0)) - z0) / ez + s * 0.8, (groundZ(p + vec2f(0.0, ez)) - z0) / ez * 0.5, 1.2);
    let gl = lambert(normalize(gn + vec3f(0.0, 0.0, 0.25)), 0.45);
    var gc = mix(C(16), C(15), 0.3 + 0.7 * post(gl * 1.1, 4.0));
    gc = mix(gc, C(17), smoothstep(0.015, 0.0, dy) * gl * 0.8);
    // Wind ripples across the sand, finer with distance.
    let dw = DOT * clamp(dz / 0.3, 0.55, 1.25);
    gc = mix(gc, mix(gc, C(16), 0.12), step(0.5, fract(floor(rowV) * 0.5)));
    gc = mix(gc, C(16), dotLine((fract(rowV + 0.5) - 0.5) * rowH, p.x, dw * 0.7, px, floor(rowV + 0.5) + 4.0) * 0.3);
    gc = mix(gc, C(16) * 0.9, step(0.82, fract(p.x / (0.0015 + dz * 0.012) + fract(rowV) * 0.5)) * 0.1);
    // Dabs of dry weed, on a grid that shrinks with distance.
    let pc = dz * 0.085;
    let pg = vec2f(p.x / dz, log(dz)) / 0.085;
    let pid = floor(pg);
    let ph = hash21(pid + 7.0);
    if (ph > 0.94) {
      let pv = fract(pg) - 0.5 - (vec2f(hash21(pid + 1.0), hash21(pid + 2.0)) - 0.5) * 0.4;
      let pd = (length(pv / vec2f(1.0, 0.45)) - 0.16) * pc;
      let pbl = lambert(roundN(pv * pc, vec2f(0.16 * pc, 0.07 * pc)), 0.35);
      gc = mix(gc, mix(C(18), C(16), 0.25) * mix(0.55, 1.05, pbl), fillA(pd, px));
      gc = mix(gc, C(30), dotRing(pd, pv * pc, 0.15 * pc, dw * 0.6, px, ph * 50.0) * 0.5);
    }
    // Shadows fall on the terraces: look them up where they'd land.
    let ps = liftS(p, z0);
    let pq = groundQ(ps, 0.014);
    {
      var sh = 0.0;
      for (var i = 0; i < nT; i++) {
        sh = max(sh, treeShade(ps, pq, i, px));
      }
      // The dunes throw theirs too.
      for (var k = 0; k < nD; k++) {
        let D = u.dune[k];
        sh = max(sh, blobShadowQ(pq, ps, vec2f(D.x + D.z * 0.15, D.y - D.w * 0.45), D.z * 0.75, D.y, px) * 0.8);
      }
      gc = mix(gc, C(16) * 0.62, sh * 0.62);
    }
    // Shrubs stand in rows that close up with distance, each at its true
    // size and throwing a shadow from its own height; the shadows here fall
    // from the rows behind.
    {
      let mv = landRows(p, KM);
      var msh = 0.0;
      // Three rows, three cells in each, two shrubs to a cell: one loop,
      // so the compiler keeps a single copy of the shrub code.
      for (var c = 0; c < loopN(18); c++) {
        let rr = floor(mv) - f32(c / 6);
        if (rr < 0.0) { continue; }
        let b = bushAt(floor(p.x / bushW(rr, KM) + rr * 0.37) + f32((c % 6) / 2 - 1), rr, KM, c % 2, ps, vec2f(1.6, 0.5), (gt - HZ) * exp((rr + 0.8) / KM));
        if (b.on) { msh = max(msh, blobShadowQ(pq, ps, b.foot - vec2f(0.0, b.ht * 0.5), b.w * 0.9, b.foot.y, px)); }
      }
      gc = mix(gc, C(16) * 0.62, msh * 0.72);
    }
    gc = moonCast(gc, gl);
    col = mix(col, gc, fillA(gt - p.y, px));
    col = mix(col, C(30), dotLine(p.y - gt, p.x, DOT, px, 6.0) * 0.7);
  }

  // ---- Everything standing on the sand, far to near. First the scrub
  // along the lip; then the rows from this pixel's own toward the viewer (a
  // shrub reaches up from its foot, so those rows can cover it), with each
  // dune and tree going in among them at the depth of its foot; then the
  // brush in the foreground. Each kind is drawn from one place in the code,
  // in loops the compiler keeps rolled, so the shader stays small.
  if (p.y > HZ && abs(p.y - gt) < 0.05) {
    let lipI = floor(p.x / 0.05);
    for (var n = 0; n < loopN(3); n++) {
      let b = lipBush(lipI + f32(n - 1));
      if (b.on) { col = bush(col, p, b, px); }
    }
  }
  {
    let mv = landRows(p, KM);
    var dk = 0;
    var ti = 0;
    for (var o = 0; o < loopN(4); o++) {
      let rr = floor(mv) + f32(o);
      // The last pass takes whatever stands nearer than all three rows.
      let rowY = select(1e3, HZ + (gt - HZ) * exp((rr + 0.6) / KM), o < 3);
      for (var k = 0; k < loopN(6); k++) {
        if (dk >= nD || u.dune[min(dk, 5)].y > rowY) { break; }
        if (duneNear(dk, p)) {
          col = duneFace(col, p, dk, px);
          for (var j = 0; j < loopN(24); j++) {
            let b = duneBush(dk, j, p, px);
            if (b.on) { col = bush(col, p, b, px); }
          }
        }
        dk++;
      }
      for (var k = 0; k < loopN(10); k++) {
        if (ti >= nT || u.tr[min(ti, 9)].y > rowY) { break; }
        col = cypress(col, p, ti, px, hazeC);
        ti++;
      }
      if (o < 3 && rr >= 0.0 && p.y >= HZ) {
        for (var c = 0; c < loopN(6); c++) {
          let b = bushAt(floor(p.x / bushW(rr, KM) + rr * 0.37) + f32(c / 2 - 1), rr, KM, c % 2, p, vec2f(0.62, 0.35), (gt - HZ) * exp((rr + 0.8) / KM));
          if (b.on) { col = bush(col, p, b, px); }
        }
      }
    }
  }
  for (var k = 0; k < loopN(12); k++) {
    let b = fgBush(k);
    if (b.on) { col = bush(col, p, b, px); }
  }
  // Painted layers over everything, finer in the distance, faint in the sky.
  let land = smoothstep(HZ - 0.1, HZ + 0.02, p0.y);
  col = layerTex(p0, col, px, mix(0.12, 0.9, land), mix(0.006, 0.013, clamp((p0.y + 0.05) * 1.6, 0.0, 1.0)), 8.0);
  return vec4f(paperize(col, pos.xy, u.b.z), 1.0);
}

// ---- One light for the whole painting ----
// The sun by day or the moon by night, far off in the sky. setLight() fixes
// it once per pixel; after that every surface is shaded from its own 3D
// normal and every shadow is thrown the same way, so light slides over the
// whole scene together as the source moves. Axes: x right, y up, z toward
// the viewer (screen y runs down). A source ahead in the sky lights from
// behind, so crests and rims catch it and faces turned to us go into shade.
var<private> LD: vec3f;     // unit vector toward the light
var<private> LI: f32;       // strength: 1 full sun, about 0.5 moon, 0 in twilight
var<private> LMOON: f32;    // 0 sunlight .. 1 moonlight
var<private> LSRC: vec2f;   // where the source sits on screen

// bearing: heading of the source in radians, 0 dead ahead, + to the right;
// height: its angle above the horizon.
@diagnostic(off, derivative_uniformity) fn setLight(src: vec2f, bearing: f32, height: f32, strength: f32, moon: f32) {
  let az = clamp(bearing, -1.35, 1.35);
  let el = clamp(height, 0.2, 1.25);
  LD = normalize(vec3f(sin(az) * cos(el), sin(el), -cos(az) * cos(el) * 0.8));
  LI = strength; LMOON = moon; LSRC = src;
}
// Or give the direction straight, for a piece that sets its own.
@diagnostic(off, derivative_uniformity) fn setLightDir(src: vec2f, dir: vec3f, strength: f32, moon: f32) {
  LD = normalize(dir); LI = strength; LMOON = moon; LSRC = src;
}
// Wrapped Lambert: the share of light a surface with unit normal n gets,
// easing round the terminator, scaled by the light's strength.
@diagnostic(off, derivative_uniformity) fn lambert(n: vec3f, wrap: f32) -> f32 { return clamp((dot(n, LD) + wrap) / (1.0 + wrap), 0.0, 1.0) * LI; }
// Ground: s is the slope of the surface line on screen (dy/dx, y down), so
// land falling away to the right (s > 0) turns right; face tips it toward
// the viewer (0 level .. 1 a bank facing us).
@diagnostic(off, derivative_uniformity) fn groundN(s: f32, face: f32) -> vec3f { return normalize(vec3f(s, 1.0, face)); }
// Round forms and tubes: v is the offset from the centre (or from the axis
// of a trunk or stem) on screen, r the radius on each axis.
@diagnostic(off, derivative_uniformity) fn roundN(v: vec2f, r: vec2f) -> vec3f {
  let q = v / r;
  let z = sqrt(max(1.0 - dot(q, q), 0.0));
  return normalize(vec3f(q.x, -q.y, z + 0.2));
}
// Ground from a height field: hx, hy are its slopes across and toward the
// viewer (screen units), k how strongly they tip the surface.
@diagnostic(off, derivative_uniformity) fn heightN(hx: f32, hy: f32, k: f32) -> vec3f { return normalize(vec3f(-hx * k, 1.0, -hy * k)); }
// Moonlit faces take a cool silver cast.
@diagnostic(off, derivative_uniformity) fn moonCast(col: vec3f, lit: f32) -> vec3f {
  return mix(col, col * vec3f(0.88, 0.98, 1.18) + vec3f(0.03, 0.045, 0.08), clamp(LMOON * lit * 1.2, 0.0, 1.0));
}

// ---- Shadows. FORE squashes ground depth onto the screen.
const FORE = 0.45;
// Where a shadow lands on level ground per unit of height (x across, y
// toward the viewer): long when the light is low, capped to stay in frame.
@diagnostic(off, derivative_uniformity) fn castG() -> vec2f {
  let c = vec2f(-LD.x, -LD.z) / max(LD.y, 0.05);
  return c * min(1.0, 3.2 / max(length(c), 1e-4));
}
// Screen offset of the shadow of a point h above the ground.
@diagnostic(off, derivative_uniformity) fn castS(h: f32) -> vec2f { let c = castG(); return vec2f(c.x, c.y * FORE) * h; }
// Where the shadow of screen point q falls, with level ground at gy below it.
@diagnostic(off, derivative_uniformity) fn shadowAt(q: vec2f, gy: f32) -> vec2f { return vec2f(q.x, gy) + castS(max(gy - q.y, 0.0)); }
// A point on raised ground (z above the reference level, on screen) catches
// the shadow that would fall further from its caster on level ground; look
// the shadow up there and it bends over terraces, mounds and domes.
@diagnostic(off, derivative_uniformity) fn liftS(p: vec2f, z: f32) -> vec2f { return p + vec2f(0.0, z) + castS(z); }
// Shadow of a round mass (bush, canopy, boulder) of radius r centred at c,
// ground at gy beneath it: an ellipse thrown along the light, paler and
// softer toward its tip, plus the dark pool of contact where it sits on the
// ground. q is the lookup point already draped over the ground's small
// bumps (groundQ), p the pixel itself. Coverage 0..1.
@diagnostic(off, derivative_uniformity) fn groundQ(p: vec2f, scale: f32) -> vec2f { return p + drape(p, scale, 3.7); }
@diagnostic(off, derivative_uniformity) fn blobShadowQ(q: vec2f, p: vec2f, c: vec2f, r: f32, gy: f32, px: f32) -> f32 {
  let h = max(gy - c.y, 0.0);
  let cg = castG();
  let L = length(cg);
  let dir = select(vec2f(0.0, 1.0), cg / max(L, 1e-4), L > 1e-3);
  let g = vec2f(q.x - c.x, (q.y - gy) / FORE) - cg * h;
  let a = vec2f(dot(g, dir), dot(g, vec2f(-dir.y, dir.x)));
  let st = sqrt(1.0 + L * L);
  let d = (length(a / vec2f(r * st, r)) - 1.0) * r;
  let tipF = clamp(a.x / (r * st), -1.0, 1.0) * 0.5 + 0.5;
  let pen = max(px, r * (0.1 + 0.04 * L * h / r + 0.25 * tipF));
  let thrown = softA(d, pen) * (1.0 - 0.4 * tipF) * LI;
  let cq = vec2f(p.x - c.x, p.y - gy) / vec2f(r, r * 0.3);
  let contact = exp(-dot(cq, cq)) * (1.0 - smoothstep(r * 1.2, r * 3.0, h)) * (0.45 + 0.35 * LI);
  return clamp(max(thrown, contact), 0.0, 1.0);
}
@diagnostic(off, derivative_uniformity) fn blobShadow(p: vec2f, c: vec2f, r: f32, gy: f32, px: f32) -> f32 {
  return blobShadowQ(p + drape(p, r * 0.9, c.x * 17.0 + gy * 5.0), p, c, r, gy, px);
}
// The point up in a canopy whose shadow lands on ground point q, where the
// canopy stands on ground at gy: test that point against the canopy's shape
// to throw a whole grove's shadow along the light.
@diagnostic(off, derivative_uniformity) fn canopyAt(q: vec2f, gy: f32) -> vec2f {
  let cg = castG();
  let hh = max((q.y - gy) / max(cg.y * FORE, 0.03), 0.0);
  return vec2f(q.x - cg.x * hh, gy - hh);
}
// Shadow of an upright from its foot a (on the ground) to its top b: a
// strip thrown along the light, widening and blurring toward its tip.
@diagnostic(off, derivative_uniformity) fn stemShadow(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let e = shadowAt(b, a.y);
  let ba = e - a + vec2f(1e-5, 1e-5);
  let h0 = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35 + w, a.x * 11.0) * (0.2 + h0);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.2 * hq);
  return softA(d, max(px, w * (0.5 + 3.0 * hq))) * (1.0 - 0.5 * hq) * LI;
}

// Lay colour c at coverage a over a premultiplied layer (rgb * alpha, alpha),
// so a figure built from fills and dotted outlines composites cleanly.
@diagnostic(off, derivative_uniformity) fn over(acc: vec4f, c: vec3f, a: f32) -> vec4f { return vec4f(acc.rgb * (1.0 - a) + c * a, acc.a * (1.0 - a) + a); }
@diagnostic(off, derivative_uniformity) fn unpremul(acc: vec4f) -> vec4f { return vec4f(acc.rgb / max(acc.a, 1e-4), acc.a); }
// Signed distance to an ellipse of radii r (a close approximation).
@diagnostic(off, derivative_uniformity) fn ellD(v: vec2f, r: vec2f) -> f32 {
  let k0 = length(v / r);
  let k1 = length(v / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-6);
}
// Offset from segment a-b to q, and the distance to a tube of radius r
// round it: (distance, offset x, offset y).
@diagnostic(off, derivative_uniformity) fn tube(q: vec2f, a: vec2f, b: vec2f, r: f32) -> vec3f {
  let ba = b - a;
  let h = clamp(dot(q - a, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  let off = q - a - ba * h;
  return vec3f(length(off) - r, off);
}

// ---- Lines as the paintings make them: chains of small dots.
// d: signed distance across the line; g: position along it in dot spacings;
// sp: that spacing; w: dot radius; per: dots round a closed loop (0 if open).
// Dots sit a little over a diameter apart with slight scatter; in some
// stretches they swell and double up so the line gains punch, and now and
// then one strays just off it.
@diagnostic(off, derivative_uniformity) fn dotChain(d: f32, g: f32, sp: f32, w: f32, px: f32, seed: f32, per: f32) -> f32 {
  if (abs(d) > w * 5.0 + px * 2.0) { return 0.0; }
  let heavy = smoothstep(0.5, 0.8, vnoise(vec2f(g * 0.11 + seed * 3.7, seed * 1.3)));
  let i0 = floor(g);
  var a = 0.0;
  for (var j = -1; j <= 1; j++) {
    let fid = i0 + f32(j);
    var id = fid;
    if (per > 0.0) { id = fid - per * floor(fid / per); }
    let h1 = hash1(id * 1.731 + seed);
    let h2 = hash1(id * 2.917 + seed * 1.37 + 5.1);
    let r = w * (0.72 + 0.36 * h2 + 0.45 * heavy);
    let off = (h1 - 0.5) * w * (0.45 + 1.1 * heavy);
    let c = vec2f((fid + 0.5 + (h2 - 0.5) * 0.3 - g) * sp, off - d);
    a = max(a, fillA(length(c) - r, px));
    // The heavier stretches take a second dot beside the first.
    if (heavy > 0.2 && h1 > 0.3) {
      let c2 = vec2f((fid + (h1 - 0.5) * 0.5 - g) * sp, -off * 0.6 + select(-1.0, 1.0, h2 > 0.5) * w * 1.35 - d);
      a = max(a, fillA(length(c2) - r * 0.78, px) * smoothstep(0.2, 0.55, heavy));
    }
    if (hash1(id * 4.13 + seed) > 0.92) {
      let c3 = vec2f((fid + h2 - g) * sp, (h1 - 0.5) * w * 7.0 - d);
      a = max(a, fillA(length(c3) - w * 0.55, px));
    }
  }
  return a;
}
// A line of even round dots, lighter than dotLine where there are many to
// draw: d across it, s the distance along it, w0 the dots' radius.
@diagnostic(off, derivative_uniformity) fn evenDots(d: f32, s: f32, w0: f32, px: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let sp = w * 2.3;
  return fillA(length(vec2f(d, (fract(s / sp) - 0.5) * sp)) - w, px);
}
// An open line: d across it, s the distance along it.
@diagnostic(off, derivative_uniformity) fn dotLine(d: f32, s: f32, w0: f32, px: f32, seed: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let sp = w * 2.3;
  return dotChain(d, s / sp, sp, w, px, seed, 0.0);
}
// A closed outline round a centre: v is the offset from it, R its mean radius.
@diagnostic(off, derivative_uniformity) fn dotRing(d: f32, v: vec2f, R: f32, w0: f32, px: f32, seed: f32) -> f32 {
  let w = max(w0, px * 0.8);
  let N = max(round(6.2832 * R / (w * 2.3)), 5.0);
  let g = (atan2(v.y, v.x) / 6.2832 + 0.5) * N;
  return dotChain(d, g, 6.2832 * R / N, w, px, seed, N);
}

// ---- Halos: stepped bands whose edges wander, differ band to band and
// drift, so the rings round a sun or moon breathe instead of sitting round.
@diagnostic(off, derivative_uniformity) fn haloR(v: vec2f, t: f32, seed: f32) -> f32 {
  let r = length(v);
  let dir = v / max(r, 1e-4);
  let n1 = vnoise(dir * 1.4 + vec2f(r * 7.0 + t * 0.05, seed));
  let n2 = vnoise(dir * 2.9 + vec2f(seed * 1.7 - t * 0.07, r * 15.0));
  return r * (1.0 + 0.3 * (n1 - 0.5) + 0.12 * (n2 - 0.5));
}

// ---- Painted clouds, three ways. Each composites over base and returns
// the new colour. sun: the light's place on screen; low: 1 when it's near
// the horizon; y0..y1 the band the clouds sit in; amt 0..1 how much cloud.
// Stipple: small dots of a lighter or darker note, clustered.
@diagnostic(off, derivative_uniformity) fn cloudDots(p: vec2f, cell: f32, px: f32, dens: f32, seed: f32) -> f32 {
  let g = p / cell;
  let id = floor(g);
  let f = fract(g) - 0.5 - (vec2f(hash21(id + seed), hash21(id + seed + 3.1)) - 0.5) * 0.6;
  let on = step(hash21(id + seed + 7.7), dens);
  return fillA((length(f) - 0.2 - 0.12 * hash21(id + 1.3)) * cell, px) * on;
}
// Dabbed streaks: long horizontal brush dabs laid in two to four rows,
// each shorter than the one below so the cloud domes; tapered ends, three
// flat tones lit toward the light and along each dab's top edge, warm
// undersides when it is low, and flecks of stipple through each dab.
// xr: half the visible width, so every cloud drifts through the frame.
@diagnostic(off, derivative_uniformity) fn streakClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.0032, px * 2.4);
  for (var k = 0; k < 10; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.25 + 0.5 * hash1(fk * 7.13 + seed)) / f32(n));
    let L = (0.16 + 0.22 * hash1(fk + seed * 1.7)) * (0.6 + 0.5 * amt);
    let span = 2.0 * (xr + L);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.004 * (1.0 + fk * 0.25) / span) * span - (xr + L);
    let rows = 2.0 + floor(hash1(fk * 2.3 + seed) * 2.99);
    let rowH = (0.01 + 0.008 * hash1(fk * 5.0 + seed)) * (0.7 + 0.5 * amt);
    if (abs(p.x - cx) > L * 1.2 || p.y > cy + rowH || p.y < cy - rowH * (rows + 1.0)) { continue; }
    let rf = (cy - p.y) / (rowH * 0.85) - 0.5;
    let r0 = floor(rf);
    for (var j = 0; j <= 1; j++) {
      let row = r0 + f32(j);
      if (row < 0.0 || row >= rows) { continue; }
      let rowW = L * sqrt(max(1.0 - pow((row + 0.3) / rows, 2.0), 0.0)) * (0.8 + 0.35 * hash1(row + fk * 9.0 + seed));
      let rowX = cx + (hash1(row * 4.7 + fk + seed) - 0.5) * L * 0.3;
      let dl = L * (0.3 + 0.15 * hash1(row * 3.0 + fk + seed));
      let sh = hash1(row * 1.9 + fk * 2.3 + seed) * dl;
      let gi = floor((p.x - rowX + sh) / dl);
      for (var m = -1; m <= 1; m++) {
        let di = gi + f32(m);
        let h = hash21(vec2f(di, row + fk * 17.0) + seed);
        let dcx = rowX - sh + (di + 0.5 + (h - 0.5) * 0.3) * dl;
        if (abs(dcx - rowX) > rowW) { continue; }
        let hl = dl * (0.85 + 0.5 * h) * (1.0 - 0.3 * row / rows);
        let hh = rowH * (0.55 + 0.3 * hash1(di * 1.3 + row + fk));
        let dcy = cy - (row + 0.5) * rowH * 0.85 + (hash1(di * 2.1 + row * 5.0 + fk) - 0.5) * rowH * 0.3;
        let q = vec2f(p.x - dcx, p.y - dcy);
        let tx = clamp(abs(q.x) / hl, 0.0, 1.0);
        // Tapered stroke, a touch fuller along its top edge.
        let hy = hh * (1.0 - 0.85 * pow(tx, 1.5)) * select(1.0, 0.8, q.y > 0.0);
        let dd = (length(vec2f(q.x / hl, q.y / max(hy, 1e-5))) - 1.0) * hy;

        let solid = fillA(dd + hh * 0.2, px);

        let cov = max(solid, fringe);
        if (cov <= 0.0) { continue; }
        let toSun = sun - vec2f(dcx, dcy);
        let facing = clamp((dcx - cx) / L * sign(toSun.x) * 0.5 + 0.5, 0.0, 1.0);
        let up = (row + 0.5) / rows;
        let topEdge = smoothstep(0.1, -0.7, q.y / hh);

    }
  }

}
// Stippled soft masses: heaps of rounded puffs on a soft base, shaded as one
// continuous form (no facets) by the light's direction, the tone carried by
// the density of light and dark dots, and edges that dissolve into dots.
@diagnostic(off, derivative_uniformity) fn massD(q: vec2f, W: f32, fk: f32, seed: f32, t: f32) -> f32 {
  var d = 1e3;
  for (var i = 0; i < 6; i++) {
    let fi = f32(i);
    let x0 = (fi / 5.0 - 0.5) * W * 1.5 + (hash1(fi + fk * 5.0 + seed) - 0.5) * W * 0.22;
    let pr = W * (0.2 + 0.2 * (1.0 - abs(fi - 2.5) / 2.5)) * (0.8 + 0.4 * hash1(fi * 3.0 + fk + seed));
    let pc = vec2f(x0, -pr * (0.45 + 0.3 * hash1(fi * 7.0 + fk)));
    let di = length(q - pc) - pr;
    let hs = clamp(0.5 + 0.5 * (d - di) / (W * 0.12), 0.0, 1.0);
    d = mix(d, di, hs) - W * 0.12 * hs * (1.0 - hs);
  }
  d = max(d, q.y + W * 0.02 * sin(q.x / W * 9.0 + fk));
  return d + W * 0.06 * (vnoise(q / W * 6.0 + fk * 3.1 + vec2f(t * 0.02, 0.0)) - 0.5);
}
@diagnostic(off, derivative_uniformity) fn massClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.0028, px * 2.2);
  for (var k = 0; k < 8; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.3 + 0.4 * hash1(fk * 7.13 + seed)) / f32(n));
    let W = (0.08 + 0.1 * hash1(fk + seed * 1.7)) * (0.6 + 0.6 * amt);
    let span = 2.0 * (xr + W * 1.3);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.003 * (1.0 + fk * 0.2) / span) * span - (xr + W * 1.3);
    let q = p - vec2f(cx, cy);
    if (abs(q.x) > W * 1.35 || q.y > W * 0.12 || q.y < -W * 1.0) { continue; }
    let d = massD(q, W, fk, seed, t);
    let edge = W * 0.09;
    if (d > edge) { continue; }
    // One continuous rounded surface: lateral at the rim, facing us inside.
    let e = W * 0.04;
    let g2 = normalize(vec2f(massD(q + vec2f(e, 0.0), W, fk, seed, t) - d, massD(q + vec2f(0.0, e), W, fk, seed, t) - d) + vec2f(1e-6));
    let depth = clamp(-d / (W * 0.35), 0.0, 1.0);
    let nv = normalize(vec3f(g2.x * (1.0 - depth * 0.6), -g2.y * (1.0 - depth * 0.6), 0.35 + depth));
    let ts = normalize(sun - vec2f(cx, cy - W * 0.3));
    let Lc = normalize(vec3f(ts.x, -ts.y, 0.3));
    let lit = clamp(dot(nv, Lc) * 0.6 + 0.45 - smoothstep(-W * 0.3, 0.0, q.y) * 0.25, 0.0, 1.0);
    var cc = mix(cShade, cLit, post(lit, 5.0));
    cc = mix(cc, cGlow, low * smoothstep(-0.1, 0.7, -nv.y) * 0.55 * exp(-length(sun - vec2f(cx, cy)) * 1.3));
    cc = mix(cc, mix(cLit, vec3f(1.0), 0.3), cloudDots(p, cell, px, smoothstep(0.35, 0.95, lit) * 0.7, fk));
    cc = mix(cc, cShade * 0.86, cloudDots(p + 0.41 * cell, cell * 0.85, px, smoothstep(0.55, 0.1, lit) * 0.55, fk + 5.0));

    let rimDots = cloudDots(p + vec2f(0.13, 0.29) * cell, cell * 0.85, px, smoothstep(edge, -edge * 0.6, d) * 0.9, fk + 9.0);
    col = mix(col, cc, max(solid, rimDots));
  }
  return col;
}
// Mottled patches with drips: flat blotches of two or three tones in an
// irregular mottle, with runs of paint hanging from the undersides, each
// a dotted trickle ending in a bead.
@diagnostic(off, derivative_uniformity) fn dripClouds(base: vec3f, p: vec2f, sun: vec2f, low: f32, t: f32, px: f32, y0: f32, y1: f32, xr: f32, n: i32, amt: f32, cLit: vec3f, cShade: vec3f, cGlow: vec3f, seed: f32) -> vec3f {
  var col = base;
  let cell = max(0.003, px * 2.3);
  for (var k = 0; k < 8; k++) {
    if (k >= n) { break; }
    let fk = f32(k);
    let cy = mix(y0, y1, (fk + 0.3 + 0.4 * hash1(fk * 7.13 + seed)) / f32(n));
    let W = (0.08 + 0.1 * hash1(fk + seed * 1.7)) * (0.6 + 0.6 * amt);
    let H = W * (0.22 + 0.1 * hash1(fk * 4.1 + seed));
    let span = 2.0 * (xr + W * 1.3);
    let cx = fract(hash1(fk * 3.1 + seed) + t * 0.003 * (1.0 + fk * 0.2) / span) * span - (xr + W * 1.3);
    let q = p - vec2f(cx, cy);
    if (abs(q.x) > W * 1.2 || q.y < -H * 1.6 || q.y > H * 2.6) { continue; }
    // Blotch: a wide lens, rounded on top, nearly flat below, ragged edge.
    var d = (length(q / vec2f(W, select(H * 0.45, H, q.y < 0.0))) - 1.0) * H;
    d += H * 0.35 * (fbm(q / W * vec2f(3.0, 6.0) + fk * 2.7 + seed) - 0.5);
    let toSun = sun - vec2f(cx, cy);
    let side = clamp(q.x / W * sign(toSun.x) * 0.5 + 0.5, 0.0, 1.0);
    let up = clamp(-q.y / H * 0.5 + 0.5, 0.0, 1.0);
    let lit = clamp(mix(up, 1.0 - up, low * 0.6) * 0.6 + side * 0.4, 0.0, 1.0);
    // Mottle: the tone steps follow a slow noise, shifted toward the light.
    let m = vnoise(q / W * vec2f(5.0, 9.0) + fk * 1.9 + seed + vec2f(t * 0.01, 0.0));
    let tone = post(clamp(m * 0.55 + lit * 0.6 - 0.05, 0.0, 1.0), 3.0);
    var cc = mix(cShade, cLit, tone);
    cc = mix(cc, cGlow, low * (1.0 - up) * 0.5 * exp(-length(toSun) * 1.5));
    cc = mix(cc, mix(cc, cLit * 1.05, 0.7), cloudDots(p, cell, px, lit * 0.4, fk));
    cc = mix(cc, cShade * 0.88, cloudDots(p + 0.43 * cell, cell * 0.85, px, (1.0 - lit) * 0.35, fk + 4.0));
    col = mix(col, cc, fillA(d, px));
    // Drips: dotted trickles from the underside, each ending in a bead.
    let dw = W * 0.09;
    let di = floor(q.x / dw);
    let hd = hash1(di * 1.37 + fk * 11.0 + seed);
    if (hd > 0.45 && q.y > 0.0) {
      let dx = (di + 0.5 + (hash1(di * 2.9 + fk) - 0.5) * 0.4) * dw;
      let yb = H * 0.45 * sqrt(max(1.0 - pow(dx / W, 2.0), 0.0)) * 0.85;
      if (abs(dx) < W * 0.85) {
        let len = H * (0.5 + 1.8 * hash1(di * 5.3 + fk) * hash1(di * 1.1 + fk * 3.0)) * (0.7 + 0.3 * sin(t * 0.3 + di));
        let wdt = max(0.0011, px * 0.8) * (1.0 + hash1(di * 3.3) * 0.5);
        let along = q.y - yb;
        let trick = dotLine(q.x - dx, along, wdt, px, di + fk * 7.0) * step(0.0, along) * step(along, len);
        let bead = fillA(length(vec2f(q.x - dx, along - len)) - wdt * 1.9, px);
        let dc = mix(cShade, cc, 0.3);
        col = mix(col, dc, max(trick, bead));
      }
    }
  }
  return col;
}

// Light from the sun by day and the moon by night.
@diagnostic(off, derivative_uniformity) fn dayLight() {
  let sunA = smoothstep(-0.04, 0.2, u.c.z);
  let moonA = smoothstep(-0.02, 0.22, u.d.z) * 0.5;
  if (sunA >= moonA) { setLight(u.c.xy, u.c.x * 2.3, u.c.z * 1.15, sunA, 0.0); }
  else { setLight(u.d.xy, u.d.x * 2.3, u.d.z * 1.15, moonA, 1.0); }
}
// Stepped sky: a halo whose rings wander, stars, the sun and moon, and
// painted clouds in the scene's own style (0 dabbed streaks, 1 stippled
// masses, 2 mottled drips) above cloudMax. Colours: C(0) top, C(1) mid,
// C(2) horizon, C(3) sun, C(4) glow, C(5) cloud lit, C(6) cloud shade.
@diagnostic(off, derivative_uniformity) fn paintSky(p0: vec2f, hz: f32, px: f32, t: f32, lampC: vec3f, cloudMax: f32, style: i32) -> vec3f {
  let sun = u.c.xy; let moon = u.d.xy; let dark = u.c.w;
  let g = clamp((p0.y - hz) / -1.0, 0.0, 1.0);
  var col = mix(C(2), C(1), post(smoothstep(0.0, 0.3, g), 5.0));
  col = mix(col, C(0), post(smoothstep(0.28, 0.9, g), 5.0));
  let sv = p0 - sun;
  let hr = haloR(sv, t, 1.3);
  let sunUp = step(-0.2, u.c.z);
  let gb = post(exp(-hr * 10.0) * 0.9 * sunUp, 5.0);
  col = mix(col, C(4), gb * (0.35 + 0.65 * gb));
  let sg = p0 / 0.035;
  let sid = floor(sg);
  let sh = hash21(sid + 5.3);
  if (sh > 0.72) {
    let sw = p0 - (sid + 0.5 + (vec2f(hash21(sid + 1.7), hash21(sid + 8.1)) - 0.5) * 0.7) * 0.035;
    let tw = 0.55 + 0.45 * sin(t * 1.6 + sh * 60.0);
    let sa = atan2(sw.y, sw.x);
    let sdd = length(sw) - 0.0035 * (0.5 + sh) * tw * (0.2 + 0.8 * pow(abs(cos(sa * 2.0)), 12.0));

  let mv = p0 - moon;

    let q = mv / MR;
    let z = sqrt(max(1.0 - dot(q, q), 0.0));
    let mc = mix(lampC, vec3f(0.96, 0.95, 0.9), 0.65);

    let sea = smoothstep(0.48, 0.62, fbm(q * 1.7 + vec2f(3.1, 7.2)));
    var m = mix(mc, mc * vec3f(0.7, 0.71, 0.76), sea * 0.85);
    // Small bright craters with rays, a few dark pits.
    let cr = vnoise(q * 9.0 + 4.0);
    m = mix(m, mc * 1.06, smoothstep(0.78, 0.9, cr) * 0.6);
    m = mix(m, m * 0.85, smoothstep(0.25, 0.12, vnoise(q * 13.0 + 11.0)) * 0.5);
    // A sphere: dimmer toward the limb.
    m *= 0.72 + 0.28 * pow(z, 0.5);

    let mcell = max(0.0021, px * 1.8);
    m = mix(m, m * 0.8, cloudDots(p0, mcell, px, 0.25 + sea * 0.45, 5.0));
    m = mix(m, min(m * 1.12, vec3f(1.0)), cloudDots(p0 + 0.43 * mcell, mcell * 0.9, px, 0.3 * (1.0 - sea), 8.0));

// Cloud shadows sliding over the land: q is a ground position (x across,

@diagnostic(off, derivative_uniformity) fn cloudShade(q: vec2f, t: f32) -> f32 {

// A terrace step inside one contour band: a flat tread, then a drop.
// f is the position within the band 0..1; returns height about zero.
@diagnostic(off, derivative_uniformity) fn terrace(f: f32) -> f32 { return smoothstep(0.55, 0.97, f) - f + 0.5; }

@diagnostic(off, derivative_uniformity) fn terraceFace(f: f32) -> f32 { return smoothstep(0.5, 0.75, f) * smoothstep(1.0, 0.9, f); }

// Light over a slope in flat steps: s is the slope of the ground line

@diagnostic(off, derivative_uniformity) fn slopeLight(s: f32, x: f32, depth: f32) -> f32 {
