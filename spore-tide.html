// ---- The grove. Each tree is grown in its own units: foot at the origin,
// about 1 high (y up is negative), +x downwind. A slender trunk rises with
// a gentle lean and a few bends, often forking into a second leader.
// Branches leave the leaders in tiers on either side, a few more of them
// downwind, reaching out near level, then dipping and curling up at their
// tips. Foliage grows in flat pads at the end of every branch and the tops
// of the leaders.
const NT = 10, SEG = 36, PAD = 16;
function growTree(R, big) {
  const D = Math.PI / 180;
  const segs = [], pads = [];
  // A run of tapering pieces from p along headings as (0 up, + downwind),
  // lens long, from radius r0 to r1. Returns the points along it.
  const run = (p, as, lens, r0, r1, bare, path) => {
    const pts = [{ p, r: r0, path }];
    for (let k = 0; k < as.length && segs.length < SEG; k++) {
      const b = [p[0] + Math.sin(as[k]) * lens[k], p[1] - Math.cos(as[k]) * lens[k]];

  const at = (pts, f) => {
    const s0 = pts[0].path, s = s0 + f * (pts[pts.length - 1].path - s0);
    for (let k = 1; k < pts.length; k++) {

      const u = Math.min(1, Math.max(0, (s - A.path) / Math.max(B.path - A.path, 1e-6)));

  const H = 0.9;

      const len = (0.14 + 0.24 * Math.sin(Math.PI * Math.min(1, Math.max(0, (f - 0.2) / 0.85)))) * (down ? 1.1 : 0.85) * (0.75 + R() * 0.45) * (li === 0 ? 1 : 0.8);
      const a0 = side * (70 + R() * 18) * D;

      if (pts.length < 4) continue;
      const e = pts[3].p;
      tips.push({ x: e[0] + side * len * 0.04, y: e[1] - len * 0.04, w: len * (0.6 + R() * 0.2), pri: 1 });
      if (len > 0.16) tips.push({ x: pts[1].p[0] + side * len * 0.1, y: pts[1].p[1] - len * 0.05, w: len * (0.4 + R() * 0.1), pri: 2 });
    }

    const tp = L[L.length - 1].p;

  // Scale it to stand 1 high to the top of its crown.
  let top = trunk[trunk.length - 1].p[1];
  for (const P of pads) top = Math.min(top, P.y - P.w * 0.7);
  const k = 1 / -top;
  for (const S of segs) { S.a = [S.a[0] * k, S.a[1] * k]; S.b = [S.b[0] * k, S.b[1] * k]; S.r0 *= k; S.r1 *= k; S.path *= k; }
  for (const P of pads) { P.x *= k; P.y *= k; P.w *= k; }
  // Top of the tree first, so each pad lies over the ones above it.
  pads.sort((a, b) => a.y - b.y);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity;
  for (const S of segs) { x0 = Math.min(x0, S.a[0] - S.r0, S.b[0] - S.r0); x1 = Math.max(x1, S.a[0] + S.r0, S.b[0] + S.r0); y0 = Math.min(y0, S.b[1] - S.r0); }
  for (const P of pads) { x0 = Math.min(x0, P.x - P.w * 1.35); x1 = Math.max(x1, P.x + P.w * 1.55); y0 = Math.min(y0, P.y - P.w * 0.85); }
  // The biggest pads throw the crown's shadow.
  const shade = [...pads].sort((a, b) => b.w - a.w).slice(0, 6).map((P) => [P.x, P.y, P.w * 0.62, 0]);
  const tt = trunk[trunk.length - 1];
  return {
    segs, pads, shade,
    fork: [tt.p[0] * k, tt.p[1] * k], forkR: r0 * 0.5 * k, phase: R() * 6.28,
    bark: [R(), R(), 0.15 + 0.6 * R(), R()],
    bounds: [x0 - 0.06, y0 - 0.06, x1 + 0.06, 0.12],
  };
}

let grove = [], seedN = 1 + Math.floor(Math.random() * 1e6), laidAspect = 0;
let TR = [], TK = [], TV = [], TB = [], TSH = [], SEGS = [], SR = [], PADS = [], PADP = [];
const smooth = (a, b, x) => { const f = Math.min(1, Math.max(0, (x - a) / (b - a))); return f * f * (3 - 2 * f); };
// The edge of the dunes, as the shader draws it.
const lipAt = (x) => 0.07 + 0.035 * Math.sin(x * 2.3 + seed) - 0.03 * smooth(0.2, 0.9, x) + 0.006 * Math.sin(x * 13);
// A dune's crest and the foot of its face at x, as the shader draws them.
const duneTop = (D, x) => {
  const q = (x - D[0]) / D[2];
  const f = Math.min(1, Math.max(0, q < 0.25 ? (q + 1) / 1.25 : (1 - q) / 0.75));
  return D[1] - D[3] * f * f * (3 - 2 * f) * (1 + 0.05 * Math.sin(q * 7 + D[0] * 13));
};
const duneFoot = (D, x) => { const q = (x - D[0]) / D[2]; return D[1] + D[3] * 0.3 * Math.max(1 - q * q, 0); };
let dunes = [], fgs = [];
// Every tree is sized by how far its foot stands below the horizon, so the
// horizon crosses trees of one height at the same point on each of them.
function layout() {
  let s = seedN;
  const R = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  laidAspect = aspect;
  const zoom = Math.max(1, 1.2 / aspect);
  const xr = 0.5 * aspect * zoom;
  const spots = [];
  // An old giant in front, a third of the way in from the windward edge...
  // (on a tall screen, which shows more land below, it stands nearer and
  // fills the frame)...
  const tall = zoom - 1;
  spots.push({ x: -xr * (0.45 + R() * 0.2 + Math.min(tall, 1) * 0.15), y: 0.34 + R() * 0.07 + tall * 0.34, k: (1.36 + R() * 0.2) / (1 + tall * 0.2), big: true });
  // ...one or two in the middle distance...
  spots.push({ x: xr * (0.2 + R() * 0.35), y: 0.19 + R() * 0.07 + tall * 0.12, k: 0.98 + R() * 0.16 });
  if (p.count >= 6) spots.push({ x: -xr * (0.95 - R() * 0.15), y: 0.2 + R() * 0.06 + tall * 0.1, k: 0.94 + R() * 0.16 });
  // ...and the rest standing back along the lip.
  const nFar = p.count - spots.length;
  for (let j = 0; j < nFar; j++) {
    const x = -xr + (j + 0.2 + R() * 0.6) / nFar * 2 * xr;
    spots.push({ x, y: lipAt(x) + 0.014 + R() * 0.04, k: 0.82 + R() * 0.24 });
  }
  // Dunes on the right, far to near: a foredune along the edge, one in the
  // middle distance and a big one close in at the side of the frame, each
  // sized for its distance.
  dunes = [];
  const dune = (x, y, wk, hk) => dunes.push([x, y, (y - HZ) * wk, (y - HZ) * hk]);
  const fx = xr * (0.45 + R() * 0.35);
  dune(fx, lipAt(fx) + 0.02 + R() * 0.02, 1.8 + R() * 0.8, 0.28 + R() * 0.12);
  dune(xr * (0.35 + R() * 0.35), 0.22 + R() * 0.06 + tall * 0.1, 1.4 + R() * 0.6, 0.3 + R() * 0.12);
  dune(xr * (0.85 + R() * 0.25), 0.4 + R() * 0.06 + tall * 0.3, 1.2 + R() * 0.5, 0.32 + R() * 0.12);
  // Rolling swells of sand on the left too, behind the old giant.
  dune(-xr * (0.55 + R() * 0.3), 0.15 + R() * 0.05 + tall * 0.08, 1.5 + R() * 0.6, 0.26 + R() * 0.1);
  dune(-xr * (0.05 + R() * 0.25), lipAt(0) + 0.03 + R() * 0.02, 1.6 + R() * 0.6, 0.26 + R() * 0.1);
  dunes.sort((a, b) => a[1] - b[1]);
  // Brush in the foreground, nearest of all: a bank of big bushes in the
  // bottom-left corner, cut by the edge of the frame, and a few on the right.
  fgs = [];
  const yb = 0.5 * zoom;
  for (let j = 0; j < 8; j++) {
    const y = yb - 0.03 + R() * 0.08;
    fgs.push([-xr * (1.08 - 0.72 * (j + R() * 0.7) / 8), y, (y - HZ) * (0.09 + 0.09 * R()), R() * 100]);
  }
  for (let j = 0; j < 3; j++) {
    const y = yb + R() * 0.07;
    fgs.push([xr * (0.5 + 0.55 * (j + R()) / 3), y, (y - HZ) * (0.06 + 0.06 * R()), R() * 100]);
  }
  fgs.sort((a, b) => a[1] - b[1]);

  for (const o of spots) {
    for (const D of dunes) {
      if (Math.abs(o.x - D[0]) > D[2] * 0.9) continue;
      const top = duneTop(D, o.x), foot = duneFoot(D, o.x);
      if (o.y > top - 0.005 && o.y < foot + 0.005) { o.y = Math.max(o.y, top + (foot - top) * 0.25); o.depth = D[1]; }

    const g = grove[i], T = g && g.tree;

    TK.push(g ? [T.fork[0], T.fork[1], T.forkR, T.phase] : z4());
    TV.push(g ? T.bark : z4());
    TB.push(g ? T.bounds : z4());
    for (let j = 0; j < 6; j++) TSH.push(g && T.shade[j] ? T.shade[j] : z4());
    for (let j = 0; j < SEG; j++) {
      const S = g && T.segs[j];
      SEGS.push(S ? [S.a[0], S.a[1], S.b[0], S.b[1]] : z4());
      SR.push(S ? [S.r0, S.r1, S.bare, S.path] : z4());

      const P = g && T.pads[j];
      PADS.push(P ? [P.x, P.y, P.w, 0] : z4());

}
let gust = 0, gustGoal = 0, shown = -1, zoomNow = 1, lastX = 0;
const HZ = -0.04;
const sky = daySky({ hz: HZ, tau: 0.1 + Math.random() * 0.12 });
function generate() { seedN = 1 + Math.floor(Math.random() * 1e6); layout(); }
function fogAt(tau) {
  const bump = (x, a, b, c, d) => x < a || x > d ? 0 : x < b ? (x - a) / (b - a) : x < c ? 1 : 1 - (x - c) / (d - c);
  return 0.2 + 0.8 * bump(tau, 0.3, 0.42, 0.82, 0.96);
}
function uniforms() {
  if (!grove.length) layout();
  const zoom = Math.max(1, 1.2 / aspect);
  zoomNow = zoom;
  const s = sky.bodies();
  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.wind, gust, p.grain, zoom],
    c: [s.sx, s.sy, s.elev, s.dark],
    d: [s.mx, s.my, s.mElev, tl.active ? tl.x : 0],
    e: [grove.length, p.glow, Math.min(1, fogAt(sky.tau) * p.fog), dunes.length],
    cols: dayCols(sky.tau, SKIES, LAND, KEEP),
    tr: TR, tk: TK, tb: TB, tsh: TSH, seg: SEGS, sr: SR, pad: PADS, padP: PADP,
    dune: [0, 1, 2, 3, 4, 5].map((j) => dunes[j] || [0, 0, 0, 0]),

}
function step(dt) {
  sky.step(dt, p.speed * p.speed * 0.022);
  gustGoal *= Math.exp(-dt * 1.2);
  gust += (gustGoal - gust) * (1 - Math.exp(-dt * 5));
  const v = Math.round(sky.tau * 100);
  if (v !== shown) { shown = v; $('time').value = v; $('timeVal').textContent = dayKey(sky.tau).name; }
}
// Drag in the sky to put the sun (or the moon) anywhere in it, the time of
// day following; swipe across the land for a gust, downwind to push the trees over.
function onDown(q) {
  if (sky.down([q[0] * zoomNow, q[1] * zoomNow])) return;
  lastX = q[0];
}
function onMove(q) {
  if (sky.move([q[0] * zoomNow, q[1] * zoomNow])) return;

function onUp() { sky.up(); }

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

// Desktop renders at screen resolution, or below it where the screen has
// more pixels than the budget, and lets the browser scale up; phones stay

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 2e6 ? 1.25 : b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(0.7, Math.min(d, s)); return [v, v]; })(PIXEL_BUDGET) });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width - 0.5) * aspect, (e.clientY - r.top) / r.height - 0.5];
}
let dragging = false, pointer = [0, 0];
canvas.addEventListener('pointerdown', (e) => { dragging = true; pointer = toP(e); canvas.setPointerCapture(e.pointerId); onDown(pointer); });
canvas.addEventListener('pointermove', (e) => { if (dragging) { pointer = toP(e); onMove(pointer); } });
const release = () => { if (dragging) { dragging = false; onUp(); } };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

readControls();
generate();
const fx = effect(gpu, SHADER, { set: { u: uniforms() } });
// The grove is placed across the visible width, so a new shape lays it out again.
surf.onResize(({ width, height }) => { W = width; H = height; aspect = width / height; if (grove.length && Math.abs(aspect - laidAspect) > 0.02 * aspect) layout(); });

function render(f) { fx.set({ u: uniforms() }); f.pass(surf, fx); }

let fpsCount = 0, fpsAt = performance.now();
let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  t += dt;
  step(dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}
function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
</script>
