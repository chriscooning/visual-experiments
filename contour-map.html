<div class="vx-spin" id="vxSpin" role="img" aria-label="Loading"><span class="p"></span><span class="t"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><span></span></span></div>
<script>
// The loader, from the page's first bytes until its first frame is on screen
// (the same in every WebGPU piece; controls.js moves it on and takes it away).
// On the left, how far along the start is: it sits at a step and creeps
// toward the next, slowing but never stopping, and each file the page
// finishes loading is a small step, up to 9%. Beside it, "loading..." typed
// out like a terminal: each letter flickers through the hero's ASCII ramp
// before it lands, the dots count up behind a blinking cursor, and every so
// often letters flicker to capitals (loadING, Loading, loaDING), scrambling
// through random characters on the way, flip backwards or upside down, or
// glitch. Where the piece can't run there's no loader; controls.js says why
// instead.
window.vxLoader = (function () {
  var el = document.getElementById('vxSpin'), ua = navigator.userAgent;
  var ios = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var v = ua.match(/Version\/(\d+)/) || ua.match(/OS (\d+)_\d+/);
  if (!navigator.gpu || (ios && !(v && +v[1] >= 27))) { el.parentNode.removeChild(el); return null; }
  // In the theme picked on the home page (the same site, so its choice is to
  // hand): tumeric's amber, or cheshire's violet, the site's default.
  try { if (localStorage.getItem('heroVariant') === 'tumeric') el.classList.add('tumeric'); } catch (e) {}
  var WORD = 'loading', NOISE = '.,:;i1tfLCG08@#$%&*+=<>/\\|?';
  var pct = el.firstChild, cell = el.lastChild.children, tail = cell[WORD.length];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = Date.now(), typed = 160 + WORD.length * 70, gone = false, files = null;
  var base = 2, ceil = 9, tau = 1500, since = t0, shown = 0;
  var fx = null, fxAt = typed + 400 + Math.random() * 800, was = [], turned = [];
  function rnd(n) { return Math.floor(Math.random() * n); }
  // One flicker: capitals on a run of letters (DING or ING, one letter, two,
  // or the lot), or a letter or two flipped or glitched; on and off a few
  // times, then back. Capitals hold a little longer, to be read.
  function flicker(ms) {
    var n = WORD.length, r = Math.random(), kind = r < .55 ? 'caps' : r < .85 ? 'flip' : 'noise';
    var a = kind === 'flip' ? 2 + rnd(n - 2) : rnd(n), b = a + 1, on = [], t = 0;
    r = Math.random();
    if (kind === 'caps' && r < .4) { a = 3 + rnd(2); b = n; }
    else if (kind === 'caps' && r < .5) { a = 0; b = n; }
    else if (r > .8) b = Math.min(n, a + 2);
    for (var k = 1 + rnd(3); k > 0; k--) {
      var d = kind === 'caps' ? 110 + rnd(140) : 40 + rnd(90);
      on.push([t, t + d]);
      t += d + (kind === 'caps' ? 70 : 40) + rnd(60);
    }
    return { kind: kind, a: a, b: b, flip: rnd(2) ? 'x' : 'y', at: ms, on: on, end: ms + t };
  }
  function draw() {
    if (gone) return;
    var now = Date.now(), ms = now - t0, dt = now - since, lit = false;
    shown = Math.max(shown, base + (ceil - base) * dt / (dt + tau));
    pct.textContent = Math.min(99, Math.floor(shown)) + '%';
    if (!still && ms >= typed) {
      if (!fx && ms >= fxAt) fx = flicker(ms);
      if (fx && ms >= fx.end) { fx = null; fxAt = ms + 500 + Math.random() * 1300; }
      for (var j = 0; fx && j < fx.on.length; j++) if (ms - fx.at >= fx.on[j][0] && ms - fx.at < fx.on[j][1]) lit = true;
    }
    for (var k = 0; k < WORD.length; k++) {
      var c = WORD.charAt(k), how = '', hit = lit && k >= fx.a && k < fx.b;
      if (hit && fx.kind === 'caps') c = c.toUpperCase();
      if (hit && fx.kind === 'flip') how = fx.flip;
      // A letter changing case runs through a few random characters first.
      if (c !== was[k]) { if (was[k]) turned[k] = ms; was[k] = c; }
      if (!still && (ms < 160 + k * 70 || (hit && fx.kind === 'noise') || ms - turned[k] < 60)) c = NOISE.charAt(rnd(NOISE.length));
      if (cell[k].textContent !== c) cell[k].textContent = c;
      if (cell[k].className !== how) cell[k].className = how;
    }
    tail.textContent = still ? '..._' : (ms < typed ? '' : '...'.slice(0, Math.floor((ms - typed) / 380) % 4)) + (Math.floor(ms / 530) % 2 ? ' ' : '_');
    requestAnimationFrame(draw);
  }
  // (A beat before it shows, so a quick start never flashes it.)
  var show = setTimeout(function () { el.classList.add('in'); }, 120);
  // Away quickly, from wherever it's got to: the piece comes first.
  function stop() {
    if (gone) return;
    gone = true;
    clearTimeout(show);
    if (files) files.disconnect();
    el.classList.add('out');
    el.classList.remove('in');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  // At v and creeping toward c, half way there after t ms, until the next.
  function step(v, c, t) { if (v > base) { base = v; ceil = c; tau = t || 1200; since = Date.now(); } }
  try {
    files = new PerformanceObserver(function (list) {
      list.getEntries().forEach(function () { if (base < 9) step(Math.min(9, base + 2), 9, 1500); });
    });
    files.observe({ type: 'resource' });
  } catch (e) {}
  var api = {
    step: step,
    // The piece is on screen: out of its way at once, reading 100% as it goes,
    // however far the loader had got (typing, fading in, or not yet shown).
    done: function () { pct.textContent = '100%'; stop(); },
    stop: stop
  };
  // Where controls.js never came to move it on, it doesn't stay.
  document.addEventListener('DOMContentLoaded', function () { if (!api.steered) stop(); });
  draw();
  return api;
})();
</script>

<script type="module">
import { init, effect, surface, target, sampler, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

// ═══════════════════════════════════════
// SHADERS
// Height is slowly drifting, domain-warped noise plus whatever you've
// sculpted (kept in its own small texture). Contour lines are drawn where
// height crosses each interval; their width is measured against how fast
// height changes across the pixel, so every line is the same crisp width
// on gentle slopes and steep cliffs alike. Every fifth is a heavier index
// line. Hillshading, elevation tint and a shoreline finish the map.
// ═══════════════════════════════════════
const SCULPT = /* wgsl */ `
struct B { pos: vec2f, radius: f32, amount: f32, aspect: f32, keep: f32 }
@group(0) @binding(0) var<uniform> b: B;
@group(0) @binding(1) var src: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let h = textureSampleLevel(src, samp, uv, 0.0).r * b.keep;
  let d = (uv - b.pos) * vec2f(b.aspect, 1.0);
  let g = exp(-dot(d, d) / (b.radius * b.radius));
  // Capped so a long press builds a hill, not a spike.
  return vec4f(clamp(h + g * b.amount, -1.2, 1.2), 0.0, 0.0, 1.0);
}
`;

const MAP = /* wgsl */ `
struct U {
  paper: vec3f, time: f32,
  line: vec3f, relief: f32,
  low: vec3f, levels: f32,
  high: vec3f, scale: f32,
  water: vec3f, sea: f32,
  sun: vec2f, aspect: f32, seed: f32,
  hypso: f32, glow: f32, shade: f32, grid: f32,
}
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var sculpt: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;

fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
// Four octaves falling off fast: broad landforms with a little texture,
// which is what keeps contour lines flowing instead of wiggling.
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.42; }
  return s / 0.87;
}
fn height(uv: vec2f) -> f32 {
  let p = vec2f(uv.x * u.aspect, uv.y) * u.scale + vec2f(u.seed, u.seed * 0.61);
  let t = u.time;
  let w = vec2f(fbm(p + vec2f(0.0, t * 0.03)), fbm(p + vec2f(5.2, 1.3) - vec2f(t * 0.025, 0.0)));
  let n = fbm(p + 1.6 * w);
  return (n - 0.35) * 1.6 + textureSampleLevel(sculpt, samp, uv, 0.0).r;
}

@fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let h = height(uv);
  // Hillshade from the height's slope.
  let e = 1.5 / 900.0;
  let hx = height(uv + vec2f(e, 0.0)) - h;
  let hy = height(uv + vec2f(0.0, e)) - h;
  let n = normalize(vec3f(-hx / (e * u.aspect), -hy / e, 1.0 / max(u.relief, 0.02)));
  let light = normalize(vec3f(u.sun, 0.75));
  let shade = clamp(dot(n, light), 0.0, 1.0);

  let seaH = u.sea;
  let land = smoothstep(seaH - 0.004, seaH + 0.004, h);
  // Base colour: paper, or an elevation ramp for the hypsometric map.
  let tH = clamp((h - seaH) / 1.1, 0.0, 1.0);
  var col = mix(u.paper, mix(u.low, u.high, pow(tH, 0.8)), u.hypso);
  col = mix(u.water * (0.75 + 0.25 * smoothstep(seaH - 0.35, seaH, h)), col, land);
  col *= mix(1.0, 0.55 + 0.6 * shade, u.shade * land);

  // Contours: one crisp line per interval, a heavier index line every fifth.
  let f = h * u.levels;
  let fw = max(fwidth(f), 1e-4);
  let dl = abs(fract(f - 0.5) - 0.5) / fw;
  let fi = f / 5.0;
  let di = abs(fract(fi - 0.5) - 0.5) / max(fwidth(fi), 1e-4);
  let minor = 1.0 - smoothstep(0.35, 1.25, dl);
  let index = 1.0 - smoothstep(0.9, 1.8, di);
  // Where lines crowd together (cliffs), let them merge into tone instead of noise.
  let crowd = smoothstep(0.35, 0.7, fw);
  let lines = max(minor * 0.55 * (1.0 - crowd), index) * land + max(minor * 0.25, index * 0.45) * (1.0 - land) * 0.7;
  col = mix(col, u.line, clamp(lines, 0.0, 1.0));
  col += u.line * u.glow * exp(-dl * 0.9) * 0.25 * land;
  // Shoreline.
  let sf = (h - seaH) / max(fwidth(h), 1e-5);
  col = mix(col, u.line, (1.0 - smoothstep(0.6, 1.8, abs(sf))) * 0.9);
  // Faint survey grid.
  let gp = vec2f(uv.x * u.aspect, uv.y) * 8.0;
  let gd = abs(fract(gp - 0.5) - 0.5) / fwidth(gp);
  col = mix(col, u.line, (1.0 - smoothstep(0.3, 1.2, min(gd.x, gd.y))) * u.grid);
  // Paper fibre and vignette.
  let grain = hash21(floor(pos.xy)) - 0.5;
  col += grain * 0.03;
  let v = length((uv - 0.5) * vec2f(u.aspect, 1.0));
  col *= 1.0 - 0.28 * smoothstep(0.45, 1.2, v);
  return vec4f(col, 1.0);
}
`;

// ═══════════════════════════════════════
// MAPS
// ═══════════════════════════════════════
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const PALETTES = {
  survey:    { paper: '#f1ebdc', line: '#8a5a2b', low: '#f1ebdc', high: '#f1ebdc', water: '#bcd6dd', hypso: 0, glow: 0, shade: 0.55, grid: 0.12 },
  hypso:     { paper: '#e9e4d6', line: '#3b2f22', low: '#7fa36b', high: '#f0e2c0', water: '#6f9fc0', hypso: 1, glow: 0, shade: 0.85, grid: 0.06 },
  night:     { paper: '#020a04', line: '#52ff8f', low: '#020a04', high: '#020a04', water: '#01150a', hypso: 0, glow: 1, shade: 0.35, grid: 0.18 },
  blueprint: { paper: '#0f3b73', line: '#dce9ff', low: '#0f3b73', high: '#0f3b73', water: '#0b2e5a', hypso: 0, glow: 0.3, shade: 0.3, grid: 0.2 },
  ink:       { paper: '#f7f5f0', line: '#141414', low: '#f7f5f0', high: '#f7f5f0', water: '#e6e4de', hypso: 0, glow: 0, shade: 0.0, grid: 0.0 },
};

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const IDS = ['levels', 'relief', 'scale', 'drift', 'sea', 'heal'];

const p = {};
function readControls() {
  p.levels = 5 + +$('levels').value / 100 * 25;
  p.relief = 0.03 + +$('relief').value / 100 * 0.35;
  p.scale = 0.6 + +$('scale').value / 100 * 2.6;
  p.drift = +$('drift').value / 100;
  p.sea = -0.35 + +$('sea').value / 100 * 0.8;
  p.keep = 1 - +$('heal').value / 100 * 0.01;
  p.tool = $('tool').value;
  p.pal = PALETTES[$('palette').value];
  for (const id of IDS) $(id + 'Val').textContent = $(id).value;
  $('hintPill').textContent = (p.tool === 'raise' ? 'Drag to raise land' : 'Drag to dig') + ' · Tilt to move the sun · H controls';
}
readControls();

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(4.5e6) });
const linear = sampler(gpu, { minFilter: 'linear', magFilter: 'linear' });
const sculptSize = () => [Math.max(8, Math.round(256 * surf.size[0] / Math.max(1, surf.size[1]))), 256];
let sA = target(gpu, { size: sculptSize(), format: 'rgba16float' });
let sB = target(gpu, { size: sculptSize(), format: 'rgba16float' });
let seed = Math.random() * 100, t = 0, aspect = 1;

const uni = () => {
  const c = p.pal;
  return { paper: hex(c.paper), line: hex(c.line), low: hex(c.low), high: hex(c.high), water: hex(c.water),
    hypso: c.hypso, glow: c.glow, shade: c.shade, grid: c.grid, relief: p.relief, levels: p.levels, scale: p.scale, sea: p.sea, seed };
};
const brush = effect(gpu, SCULPT, { set: { b: { pos: [0.5, 0.5], radius: 0.08, amount: 0, aspect: 1, keep: 1 }, src: sA, samp: linear } });
const map = effect(gpu, MAP, { set: { u: { ...uni(), time: 0, sun: [-0.6, -0.6], aspect: 1 }, sculpt: sA, samp: linear } });

let needClear = true;
surf.onResize(({ width, height }) => {
  aspect = width / height;
  sA.resize(sculptSize()); sB.resize(sculptSize());
  brush.set({ b: { aspect } });
  map.set({ u: { aspect } });
  needClear = true;
});

function applyControls() {
  readControls();
  map.set({ u: uni() });
  document.body.style.background = p.pal.paper;
}

// ═══════════════════════════════════════
// SCULPTING
// ═══════════════════════════════════════
let dragging = false, at = [0.5, 0.5];
function toUV(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
canvas.addEventListener('pointerdown', (e) => { dragging = true; at = toUV(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (dragging) at = toUV(e); });
const release = () => { dragging = false; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

const clk = clock(gpu);
const tl = tilt();
let fpsCount = 0, fpsAt = performance.now();
let sunA = -2.4;

function simulate(f, dt) {
  if (needClear) {
    needClear = false;
    f.pass({ target: sA, clear: [0, 0, 0, 1] }, () => {});
    f.pass({ target: sB, clear: [0, 0, 0, 1] }, () => {});
  }
  // One brush pass a frame also applies the slow settling.
  const amount = dragging ? (p.tool === 'raise' ? 1 : -1) * dt * 0.45 : 0;
  brush.set({ b: { pos: at, radius: 0.11, amount, keep: p.keep }, src: sA });
  f.pass(sB, brush);
  [sA, sB] = [sB, sA];
  map.set({ sculpt: sA });
}

function step(dt) {
  t += dt * (0.1 + p.drift * 1.2);
  sunA += dt * 0.05;
  const sun = tl.active ? [tl.x * 1.2, tl.y * 1.2 - 0.6] : [Math.cos(sunA) * 0.85, Math.sin(sunA) * 0.85];
  map.set({ u: { time: t, sun } });
}

function render(f) { f.pass(surf, map); }

let loop = null, playing = false;
function tick(f) {
  const dt = Math.min(clk.deltaTime, 0.1);
  step(dt);
  simulate(f, dt);
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const id of IDS) $(id).addEventListener('input', applyControls);
$('palette').addEventListener('change', applyControls);
$('tool').addEventListener('change', applyControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => {
  seed = Math.random() * 100;
  needClear = true;
  applyControls();
  if (!playing) frame(gpu, (f) => { simulate(f, 0); render(f); });
});
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'contour-map-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

applyControls();
togglePlay();
</script>
</body>
</html>
