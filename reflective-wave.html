<div class="vx-spin" id="vxSpin" role="img" aria-label="Loading"><span class="p"></span><span class="t"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><span></span></span></div>
<script>
// The loader, from the page's first bytes until its first frame is on screen
// (the same in every WebGPU piece; controls.js moves it on and takes it away).
// On the left, how far along the start is: it sits at a step and creeps
// toward the next, slowing but never stopping, and each file the page
// finishes loading is a small step, up to 9%. Beside it, "loading..." typed
// out like a terminal: each letter flickers through the hero's ASCII ramp
// before it lands, the dots count up behind a blinking cursor, and every so
// often letters flicker to capitals (loadING, Loading, loaDING), scrambling
// through random characters on the way, flip backwards or upside down, or
// glitch. Where the piece can't run there's no loader; controls.js says why
// instead.
window.vxLoader = (function () {
  var el = document.getElementById('vxSpin'), ua = navigator.userAgent;
  var ios = /iP(hone|od|ad)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var v = ua.match(/Version\/(\d+)/) || ua.match(/OS (\d+)_\d+/);
  if (!navigator.gpu || (ios && !(v && +v[1] >= 27))) { el.parentNode.removeChild(el); return null; }
  // In the theme picked on the home page (the same site, so its choice is to
  // hand): tumeric's amber, or cheshire's violet, the site's default.
  try { if (localStorage.getItem('heroVariant') === 'tumeric') el.classList.add('tumeric'); } catch (e) {}
  var WORD = 'loading', NOISE = '.,:;i1tfLCG08@#$%&*+=<>/\\|?';
  var pct = el.firstChild, cell = el.lastChild.children, tail = cell[WORD.length];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = Date.now(), typed = 160 + WORD.length * 70, gone = false, files = null;
  var base = 2, ceil = 9, tau = 1500, since = t0, shown = 0;
  var fx = null, fxAt = typed + 400 + Math.random() * 800, was = [], turned = [];
  function rnd(n) { return Math.floor(Math.random() * n); }
  // One flicker: capitals on a run of letters (DING or ING, one letter, two,
  // or the lot), or a letter or two flipped or glitched; on and off a few
  // times, then back. Capitals hold a little longer, to be read.
  function flicker(ms) {
    var n = WORD.length, r = Math.random(), kind = r < .55 ? 'caps' : r < .85 ? 'flip' : 'noise';
    var a = kind === 'flip' ? 2 + rnd(n - 2) : rnd(n), b = a + 1, on = [], t = 0;
    r = Math.random();
    if (kind === 'caps' && r < .4) { a = 3 + rnd(2); b = n; }
    else if (kind === 'caps' && r < .5) { a = 0; b = n; }
    else if (r > .8) b = Math.min(n, a + 2);
    for (var k = 1 + rnd(3); k > 0; k--) {
      var d = kind === 'caps' ? 110 + rnd(140) : 40 + rnd(90);
      on.push([t, t + d]);
      t += d + (kind === 'caps' ? 70 : 40) + rnd(60);
    }
    return { kind: kind, a: a, b: b, flip: rnd(2) ? 'x' : 'y', at: ms, on: on, end: ms + t };
  }
  function draw() {
    if (gone) return;
    var now = Date.now(), ms = now - t0, dt = now - since, lit = false;
    shown = Math.max(shown, base + (ceil - base) * dt / (dt + tau));
    pct.textContent = Math.min(99, Math.floor(shown)) + '%';
    if (!still && ms >= typed) {
      if (!fx && ms >= fxAt) fx = flicker(ms);
      if (fx && ms >= fx.end) { fx = null; fxAt = ms + 500 + Math.random() * 1300; }
      for (var j = 0; fx && j < fx.on.length; j++) if (ms - fx.at >= fx.on[j][0] && ms - fx.at < fx.on[j][1]) lit = true;
    }
    for (var k = 0; k < WORD.length; k++) {
      var c = WORD.charAt(k), how = '', hit = lit && k >= fx.a && k < fx.b;
      if (hit && fx.kind === 'caps') c = c.toUpperCase();
      if (hit && fx.kind === 'flip') how = fx.flip;
      // A letter changing case runs through a few random characters first.
      if (c !== was[k]) { if (was[k]) turned[k] = ms; was[k] = c; }
      if (!still && (ms < 160 + k * 70 || (hit && fx.kind === 'noise') || ms - turned[k] < 60)) c = NOISE.charAt(rnd(NOISE.length));
      if (cell[k].textContent !== c) cell[k].textContent = c;
      if (cell[k].className !== how) cell[k].className = how;
    }
    tail.textContent = still ? '..._' : (ms < typed ? '' : '...'.slice(0, Math.floor((ms - typed) / 380) % 4)) + (Math.floor(ms / 530) % 2 ? ' ' : '_');
    requestAnimationFrame(draw);
  }
  // (A beat before it shows, so a quick start never flashes it.)
  var show = setTimeout(function () { el.classList.add('in'); }, 120);
  // Away quickly, from wherever it's got to: the piece comes first.
  function stop() {
    if (gone) return;
    gone = true;
    clearTimeout(show);
    if (files) files.disconnect();
    el.classList.add('out');
    el.classList.remove('in');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  // At v and creeping toward c, half way there after t ms, until the next.
  function step(v, c, t) { if (v > base) { base = v; ceil = c; tau = t || 1200; since = Date.now(); } }
  try {
    files = new PerformanceObserver(function (list) {
      list.getEntries().forEach(function () { if (base < 9) step(Math.min(9, base + 2), 9, 1500); });
    });
    files.observe({ type: 'resource' });
  } catch (e) {}
  var api = {
    step: step,
    // The piece is on screen: out of its way at once, reading 100% as it goes,
    // however far the loader had got (typing, fading in, or not yet shown).
    done: function () { pct.textContent = '100%'; stop(); },
    stop: stop
  };
  // Where controls.js never came to move it on, it doesn't stay.
  document.addEventListener('DOMContentLoaded', function () { if (!api.steered) stop(); });
  draw();
  return api;
})();
</script>

<script type="module">
import { init, effect, surface, target, sampler, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

// ═══════════════════════════════════════
// SHADERS
// The texture: noise warped through itself twice (each layer pushes the
// next around), read as smoke with the light behind it: thin smoke glows,
// thick smoke goes dark and billows like cloud tops in a side light, and
// its edges catch the light. It drifts and slowly boils, and the bright
// parts run past white, so they glow.
// The star: the same texture wrapped round a sphere and stored flat (an
// octahedral map), setting how hot each part burns. A chemical reaction
// (Gray-Scott: two substances feeding, diffusing and eating each other) runs
// across the surface, seeded by the texture, which also decides where it
// grows spots and where it grows mazes. On top: boiling convection cells,
// sunspots, limb darkening, a glowing rim, flames and corona streamers, all
// far brighter than a screen can show, then bloomed at six sizes and tone
// mapped (AgX) so it burns to white and glows.
// ═══════════════════════════════════════
const NOISE = /* wgsl */ `
// Gradient noise on an integer hash, the same on every GPU.
fn pcg3(i: vec3i) -> vec3f {
  var v = bitcast<vec3u>(i) * 1664525u + 1013904223u;
  v.x += v.y * v.z;
  v.y += v.z * v.x;
  v.z += v.x * v.y;
  v = v ^ (v >> vec3u(16u));
  v.x += v.y * v.z;
  v.y += v.z * v.x;
  v.z += v.x * v.y;
  return vec3f(v >> vec3u(8u)) * (2.0 / 16777216.0) - 1.0;
}
fn noise3(p: vec3f) -> f32 {
  let fl = floor(p);
  let i = vec3i(fl);
  let f = p - fl;
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(pcg3(i), f);
  let b = dot(pcg3(i + vec3i(1, 0, 0)), f - vec3f(1.0, 0.0, 0.0));
  let c = dot(pcg3(i + vec3i(0, 1, 0)), f - vec3f(0.0, 1.0, 0.0));
  let d = dot(pcg3(i + vec3i(1, 1, 0)), f - vec3f(1.0, 1.0, 0.0));
  let e = dot(pcg3(i + vec3i(0, 0, 1)), f - vec3f(0.0, 0.0, 1.0));
  let g = dot(pcg3(i + vec3i(1, 0, 1)), f - vec3f(1.0, 0.0, 1.0));
  let h = dot(pcg3(i + vec3i(0, 1, 1)), f - vec3f(0.0, 1.0, 1.0));
  let k = dot(pcg3(i + vec3i(1, 1, 1)), f - vec3f(1.0, 1.0, 1.0));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, g, u.x), mix(h, k, u.x), u.y), u.z);
}
// Each octave twice as fine and turned, so no grid shows through.
const M3 = mat3x3f(0.0, 0.8, 0.6, -0.8, 0.36, -0.48, -0.6, -0.48, 0.64);
fn fbm3(q: vec3f, oct: i32) -> f32 {
  var p = q;
  var a = 0.5;
  var s = 0.0;
  for (var k = 0; k < oct; k++) {
    s += a * noise3(p);
    p = M3 * p * 2.03 + vec3f(1.3, 4.7, 2.9);
    a *= 0.5;
  }
  return s;
}
// Rounded bumps with creases between, like the tops of clouds.
fn billow3(q: vec3f, oct: i32) -> f32 {
  var p = q;
  var a = 0.5;
  var s = 0.0;
  for (var k = 0; k < oct; k++) {
    s += a * abs(noise3(p));
    p = M3 * p * 2.03 + vec3f(1.3, 4.7, 2.9);
    a *= 0.5;
  }
  return s;
}
`;

// A sphere stored flat: the octahedral map folds it into one square.
const OCT = /* wgsl */ `
fn octUV(n: vec3f) -> vec2f {
  var p = n.xy / (abs(n.x) + abs(n.y) + abs(n.z));
  if (n.z < 0.0) {
    p = (1.0 - abs(p.yx)) * select(vec2f(-1.0), vec2f(1.0), p >= vec2f(0.0));
  }
  return p * 0.5 + 0.5;
}
fn octDir(uv: vec2f) -> vec3f {
  let f = uv * 2.0 - 1.0;
  var n = vec3f(f, 1.0 - abs(f.x) - abs(f.y));
  let t = clamp(-n.z, 0.0, 1.0);
  n.x += select(t, -t, n.x >= 0.0);
  n.y += select(t, -t, n.y >= 0.0);
  return normalize(n);
}
`;

const RAMP = /* wgsl */ `
fn ramp(x: f32) -> vec3f {
  let t = clamp(x, 0.0, 1.0);
  var c = mix(u.c0, u.c1, smoothstep(0.0, 0.38, t));
  c = mix(c, u.c2, smoothstep(0.32, 0.7, t));
  return mix(c, u.c3, smoothstep(0.62, 1.0, t));
}
`;

// ── The texture, flat: (smoke, swirl, billows) per pixel. Dragging leaves
// smudges that push it along and slowly let go.
const FIELD = NOISE + /* wgsl */ `
struct W { span: vec2f, center: vec2f, time: f32, seed: f32, smR: f32, pad: f32, smudge: array<vec4f, 16> }
@group(0) @binding(0) var<uniform> w: W;
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  var p = w.center + (uv - 0.5) * w.span;
  for (var i = 0; i < 16; i++) {
    let s = w.smudge[i];
    let d = p - s.xy;
    p -= s.zw * exp(-dot(d, d) / (w.smR * w.smR));
  }
  let z = w.seed + w.time;
  let q = vec2f(fbm3(vec3f(p, z), 3), fbm3(vec3f(p + vec2f(5.2, 1.3), z), 3));
  let r = vec2f(fbm3(vec3f(p + 2.2 * q + vec2f(1.7, 9.2), z * 1.1 + 3.0), 3),
                fbm3(vec3f(p + 2.2 * q + vec2f(8.3, 2.8), z * 1.1 + 7.0), 3));
  let P = vec3f(p + 2.2 * r, z * 0.9 + 11.0);
  // Billows on lightly warped ground, so they stay round like cloud tops.
  let B = billow3(vec3f((p + 0.6 * r) * 2.6, z * 1.3 + 5.0), 4);
  return vec4f(fbm3(P, 4), length(q), B, 0.0);
}
`;

const FLAT = /* wgsl */ `
struct U { texel: vec2f, relief: f32, sheen: f32, c0: vec3f, time: f32, c1: vec3f, aspect: f32, c2: vec3f, bright: f32, c3: vec3f, pad: f32 }
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var field: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
` + RAMP + /* wgsl */ `
// How thick the smoke is: its body, billowing at the edges.
fn thick(s: vec4f) -> f32 { return s.x + 0.25 * (s.z - 0.3); }
fn height(uv: vec2f) -> f32 { let s = textureSampleLevel(field, samp, uv, 0.0); return s.z + 0.3 * s.x; }
@fragment fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
  let s = textureSampleLevel(field, samp, uv, 0.0);
  let fx = height(uv + vec2f(u.texel.x, 0.0)) - height(uv - vec2f(u.texel.x, 0.0));
  let fy = height(uv + vec2f(0.0, u.texel.y)) - height(uv - vec2f(0.0, u.texel.y));
  let n = normalize(vec3f(-fx * u.relief, fy * u.relief, 1.0));
  let L = normalize(vec3f(-0.6, 0.5, 0.55));
  let dif = clamp(dot(n, L), 0.0, 1.0);
  // Light from behind, through the smoke: thin smoke glows, thick smoke
  // goes dark, and the thick masses show their billows in the side light.
  let dens = smoothstep(-0.2, 0.16, thick(s));
  // The masses: billows lit from the side, darker down in the creases.
  let creases = 0.55 + 0.45 * smoothstep(0.05, 0.35, s.z);
  var lum = exp(-3.0 * dens) * 0.95 + dens * (0.07 + 0.55 * dif * dif) * creases;
  // Their edges catch the light coming round them, like clouds against
  // the sun, and the warp's fastest swirls draw bright wisps in the gaps.
  lum += 0.18 * exp(-pow((dens - 0.3) / 0.1, 2.0)) * dif;
  lum += 0.12 * smoothstep(0.6, 1.2, s.y) * dens * (1.0 - dens) * 4.0;

struct F { bloom: f32, exposure: f32, time: f32, aspect: f32 }
@group(0) @binding(0) var<uniform> f: F;
@group(0) @binding(1) var scene: texture_2d<f32>;
@group(0) @binding(2) var glow: texture_2d<f32>;
@group(0) @binding(3) var samp: sampler;
fn hash(n: u32) -> f32 {
  var x = n * 747796405u + 2891336453u;
  x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u;
  x = (x >> 22u) ^ x;
  return f32(x >> 8u) / 16777216.0;
}
// AgX (Troy Sobotka's, in Benjamin Wrensch's fit), with a little more punch
// than its base look. Its output is already display-encoded.
fn agx(c: vec3f) -> vec3f {
  let inset = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                      0.0784335999999992, 0.878468636469772, 0.0784336,
                      0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let outset = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                       -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                       -0.0990297440797205, -0.0989611768448433, 1.15107367264116);
  let lo = -12.47393;
  let hi = 4.026069;
  var v = (clamp(log2(max(inset * c, vec3f(1e-10))), vec3f(lo), vec3f(hi)) - lo) / (hi - lo);
  let v2 = v * v;
  let v4 = v2 * v2;
  v = 15.5 * v4 * v2 - 40.14 * v4 * v + 31.96 * v4 - 6.868 * v2 * v + 0.4298 * v2 + 0.1191 * v - 0.00232;
  let luma = dot(v, vec3f(0.2126, 0.7152, 0.0722));
  v = pow(max(v, vec3f(0.0)), vec3f(1.25));
  v = luma + 1.35 * (v - luma);
  return outset * v;
}
@fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  var col = textureSampleLevel(scene, samp, uv, 0.0).rgb + textureSampleLevel(glow, samp, uv, 0.0).rgb * f.bloom;
  col *= f.exposure;
  let c = (uv - 0.5) * vec2f(f.aspect, 1.0);
  col *= 1.0 - 0.25 * smoothstep(0.5, 1.4, length(c));
  var o = clamp(agx(col), vec3f(0.0), vec3f(1.0));
  o += (hash(u32(pos.x) + u32(pos.y) * 8191u + u32(f.time * 60.0) * 131071u) - 0.5) * 0.015;
  return vec4f(o, 1.0);
}
`;

// ═══════════════════════════════════════
// PALETTES: shadow, low, high, white-hot
// ═══════════════════════════════════════
const hex = (s) => [1, 3, 5].map((i) => Math.pow(parseInt(s.slice(i, i + 2), 16) / 255, 2.2));
const PALETTES = {
  mono:   ['#050505', '#3c3b39', '#a9a6a0', '#f6f3ec'],
  sun:    ['#2a0400', '#e24a00', '#ffb340', '#fff3d6'],
  blue:   ['#01061a', '#1b3c9e', '#62a6ff', '#eaf5ff'],
  ember:  ['#0e0000', '#6e0c00', '#e5531a', '#ffd9a0'],
  violet: ['#070214', '#4a1a8a', '#b26cff', '#f6eaff'],
  nebula: ['#050a26', '#3d1f8f', '#ff5aa8', '#dffaff'],
  patina: ['#041a17', '#146b5e', '#e8834a', '#fff0e0'],
  rose:   ['#160409', '#6b1238', '#ff7aa8', '#fff1f6'],
  gold:   ['#0b0703', '#5a3d12', '#e3b25a', '#fff6dc'],
};

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const IDS = ['flow', 'relief', 'glow', 'chem', 'pattern', 'corona', 'dust'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Each view keeps its own palette: the smoke starts in Nebula, the star a sun.
const viewPalette = { texture: 'nebula', star: 'sun' };
const p = {};
function readControls() {
  p.view = $('view').value;
  viewPalette[p.view] = $('palette').value;
  p.flow = +$('flow').value / 100;
  p.relief = +$('relief').value / 100;
  p.glow = +$('glow').value / 100;
  p.chem = +$('chem').value / 100;
  p.pattern = +$('pattern').value / 100;
  p.dust = +$('dust').value / 100;
  p.corona = +$('corona').value / 100 * 1.5;
  p.pal = PALETTES[$('palette').value].map(hex);
  for (const id of IDS) $(id + 'Val').textContent = $(id).value;
}
readControls();

// The star's maps, each side: finer on big screens, where there's power to spare.
const TEX = matchMedia('(pointer: fine) and (min-width: 900px)').matches ? 1024 : 512;
const FOCAL = 1.9;
const newSeed = () => [Math.random() * 100, Math.random() * 100, Math.random() * 100];
let seed = newSeed();
let t = 0, flowT = 0, spin = 0;
let yaw = 0.4, pitch = 0.25, dist = 5.6, yawGoal = yaw, pitchGoal = pitch, distGoal = dist;
let zoom = 1, zoomGoal = 1, center = [0, 0];
let idleAt = -1e9, tapDir = null, tapping = false, warm = 0;
const tl = tilt();

let gpu, chemFormat = 'rgba16float';
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  // The chemistry's small steps need full floats where they can be
  // filtered; elsewhere half floats do.
  let feats = [];
  try {
    const a = await navigator.gpu.requestAdapter();
    if (a && a.features.has('float32-filterable')) { feats = ['float32-filterable']; chemFormat = 'rgba32float'; }
  } catch (e) {}
  gpu = await init({ requiredFeatures: feats });
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;
}

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(4e6) });
const linear = sampler(gpu, { minFilter: 'linear', magFilter: 'linear' });

let cssW = 1, cssH = 1, aspect = 1;
function layout() {
  cssW = Math.max(1, canvas.clientWidth || innerWidth);
  cssH = Math.max(1, canvas.clientHeight || innerHeight);
}
layout();
// The flat texture is soft, so it's worked out a little under one per CSS
// pixel; the light on it at full resolution.
const fieldSize = () => [Math.max(1, Math.round(cssW * 0.75)), Math.max(1, Math.round(cssH * 0.75))];
const full = () => [Math.max(1, surf.size[0]), Math.max(1, surf.size[1])];
const quarter = () => [Math.max(1, Math.round(cssW / 4)), Math.max(1, Math.round(cssH / 4))];
const fieldT = target(gpu, { size: fieldSize(), format: 'rgba16float' });
const sceneT = target(gpu, { size: full(), format: 'rgba16float' });
const glowA = target(gpu, { size: quarter(), format: 'rgba16float' });
const glowB = target(gpu, { size: quarter(), format: 'rgba16float' });
// The star's bloom: six levels, each half the size of the last.
const LEVELS = 6;
const bloomSize = (i) => [Math.max(1, Math.round(surf.size[0] / 2 ** (i + 1))), Math.max(1, Math.round(surf.size[1] / 2 ** (i + 1)))];
const bloomT = Array.from({ length: LEVELS }, (_, i) => target(gpu, { size: bloomSize(i), format: 'rgba16float' }));
const texS = target(gpu, { size: [TEX, TEX], format: 'rgba16float' });
const chemA = target(gpu, { size: [TEX, TEX], format: chemFormat });
const chemB = target(gpu, { size: [TEX, TEX], format: chemFormat });

const smudges = Array.from({ length: 16 }, () => [0, 0, 0, 0]);
let smI = 0;
const fieldE = effect(gpu, FIELD, { set: { w: { span: [1, 1], center, time: 0, seed: seed[0], smR: 0.2, pad: 0, smudge: smudges } } });
const flatE = effect(gpu, FLAT, { set: { u: {
  texel: [0.001, 0.001], relief: 1, sheen: 0.5, c0: p.pal[0], time: 0, c1: p.pal[1], aspect: 1, c2: p.pal[2], bright: 1.2, c3: p.pal[3], pad: 0,
}, field: fieldT, samp: linear } });
const texE = effect(gpu, TEXS, { set: { s: { seed, time: 0, scale: 1.6, p0: 0, p1: 0, p2: 0 } } });
const seedE = effect(gpu, SEED, { set: { d: { seed, pad: 0 }, tex: texS, samp: linear } });
// Spots at one end of the recipe, mazes at the other.
const RECIPE = { h: 0.0085 * 512 / TEX, fA: 0.0367, kA: 0.0649, fB: 0.0545, kB: 0.062 };
const chemSet = { c: { tap: [0, 0, 1, 1], ...RECIPE, bias: 0, tapOn: 0, pad: 0 }, tex: texS, samp: linear };
const chemAB = effect(gpu, CHEM, { set: { ...chemSet, src: chemA } });
const chemBA = effect(gpu, CHEM, { set: { ...chemSet, src: chemB } });
const starE = effect(gpu, STAR, { set: { u: {
  camPos: [0, 0, 3], aspect: 1, fw: [0, 0, -1], focal: FOCAL, rt: [1, 0, 0], relief: p.relief, up: [0, 1, 0], chem: p.chem,
  c0: p.pal[0], spin: 0, c1: p.pal[1], corona: p.corona, c2: p.pal[2], dust: p.dust, c3: p.pal[3], time: 0,
  rho0: 0.5, pxH: 600, seed: seed[0], dist: 5,
}, texS, chemT: chemA, samp: linear } });
// Down the chain: the first step from the scene keeps only what's past white.
const bloomDown = bloomT.map((tg, i) => effect(gpu, BLOOM_DOWN, { set: {
  p: { texel: [0.001, 0.001], threshold: i ? -1 : 1, knee: 0.5 }, src: i ? bloomT[i - 1] : sceneT, samp: linear,
} }));
// Back up: each level adds the one below onto itself.
const bloomUp = bloomT.slice(1).map((tg) => effect(gpu, BLOOM_UP, { blend: 'additive', set: {
  p: { texel: [0.01, 0.01], radius: 1, pad: 0 }, src: tg, samp: linear,
} }));
const starFinE = effect(gpu, STARFIN, { set: { f: { bloom: 0.3, exposure: 1, time: 0, aspect: 1 }, scene: sceneT, glow: bloomT[0], samp: linear } });
const downE = effect(gpu, DOWN, { set: { p: { texel: [0.01, 0.01], threshold: 0.6 }, src: sceneT, samp: linear } });
const blurH = effect(gpu, BLUR, { set: { p: { dir: [0.01, 0] }, src: glowB, samp: linear } });
const blurV = effect(gpu, BLUR, { set: { p: { dir: [0, 0.01] }, src: glowA, samp: linear } });
const finE = effect(gpu, FINISH, { set: { f: { glow: 1, time: 0, aspect: 1, grain: 0.02 }, scene: sceneT, glow: glowB, samp: linear } });

surf.onResize(({ width, height }) => {
  layout();
  aspect = width / height;
  fieldT.resize(fieldSize());
  sceneT.resize(full());
  glowA.resize(quarter()); glowB.resize(quarter());
  flatE.set({ u: { texel: [1 / fieldT.size[0], 1 / fieldT.size[1]], aspect }, field: fieldT });
  downE.set({ p: { texel: [1 / glowA.size[0], 1 / glowA.size[1]] }, src: sceneT });
  blurH.set({ p: { dir: [1 / glowA.size[0], 0] }, src: glowB });
  blurV.set({ p: { dir: [0, 1 / glowA.size[1]] }, src: glowA });
  finE.set({ f: { aspect }, scene: sceneT, glow: glowB });
  bloomT.forEach((tg, i) => tg.resize(bloomSize(i)));
  bloomDown.forEach((e, i) => {
    const from = i ? bloomT[i - 1] : sceneT;
    e.set({ p: { texel: [1 / from.size[0], 1 / from.size[1]] }, src: from });
  });
  bloomUp.forEach((e, i) => e.set({ p: { texel: [1 / bloomT[i + 1].size[0], 1 / bloomT[i + 1].size[1]] }, src: bloomT[i + 1] }));
  starFinE.set({ f: { aspect }, scene: sceneT, glow: bloomT[0] });
  starE.set({ u: { aspect, pxH: height } });
  applyControls();
});

let texDirty = true;
function applyControls() {
  const was = p.view;
  readControls();
  const c = p.pal;
  flatE.set({ u: { c0: c[0], c1: c[1], c2: c[2], c3: c[3], relief: 2 + 14 * p.relief, sheen: 0.12 * p.relief } });
  starE.set({ u: { c0: c[0], c1: c[1], c2: c[2], c3: c[3], relief: p.relief, chem: p.chem, dust: p.dust * 0.9, corona: p.corona } });
  starFinE.set({ f: { bloom: 0.05 + 0.5 * p.glow } });
  for (const e of [chemAB, chemBA]) e.set({ c: { bias: (p.pattern - 0.5) * 0.5 } });
  finE.set({ f: { glow: 0.3 + 1.6 * p.glow } });
  $('panel').classList.toggle('texture', p.view === 'texture');
  $('hintPill').textContent = p.view === 'star'
    ? 'Drag to turn · Pinch or scroll to zoom · Tap the star to feed it · H controls'
    : 'Drag to push the flow · Pinch or scroll to zoom · H controls';
  if (was !== p.view) texDirty = true;
}
$('view').addEventListener('change', () => {
  // Each view comes back in its own palette.
  $('palette').value = viewPalette[$('view').value];
  applyControls();
  if (!playing) frame(gpu, render);
});

// ═══════════════════════════════════════
// TOUCH: on the texture, drag to push it along (it slowly lets go); on
// the star, drag to turn it and tap it to feed the chemistry. Pinch or
// scroll to zoom either.
// ═══════════════════════════════════════
const pointers = new Map();
let downAt = 0, moved = 0, pinch = 0;
const spread = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
// Screen point to the flat texture's own coordinates.
// (Tall screens see more of it, so the smoke is the same size on a phone.)
const span = () => { const h = 2.2 * zoom * Math.pow(Math.max(1, 1 / aspect), 0.6); return [h * aspect, h]; };
const toField = (x, y) => { const s = span(); return [center[0] + (x / cssW - 0.5) * s[0], center[1] + (y / cssH - 0.5) * s[1]]; };
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) { downAt = performance.now(); moved = 0; }
  else { moved = 1e9; pinch = pointers.size === 2 ? spread() : 0; }
  idleAt = performance.now();
});
canvas.addEventListener('pointermove', (e) => {
  const q = pointers.get(e.pointerId);
  if (!q) return;
  const dx = e.clientX - q[0], dy = e.clientY - q[1];
  const from = [q[0], q[1]];
  q[0] = e.clientX; q[1] = e.clientY;
  if (pointers.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    if (p.view === 'star') {
      yawGoal -= dx / Math.max(1, cssW) * 4;
      pitchGoal = clamp(pitchGoal + dy / Math.max(1, cssH) * 3, -1.3, 1.3);
    } else if (Math.abs(dx) + Math.abs(dy) > 0) {
      const a = toField(from[0], from[1]), b = toField(e.clientX, e.clientY);
      smudges[smI] = [b[0], b[1], (b[0] - a[0]) * 2.5, (b[1] - a[1]) * 2.5];
      smI = (smI + 1) % smudges.length;
    }
  } else if (pointers.size === 2) {
    const s = spread();
    if (pinch > 0 && s > 0) { if (p.view === 'star') distGoal = clamp(distGoal * pinch / s, 1.6, 7); else zoomGoal = clamp(zoomGoal * pinch / s, 0.35, 3); }
    pinch = s;
  }
  idleAt = performance.now();
});
const release = (e) => {
  if (!pointers.delete(e.pointerId)) return;
  if (pointers.size < 2) pinch = 0;
  if (!pointers.size && e.type === 'pointerup' && moved < 8 && performance.now() - downAt < 400 && p.view === 'star') feed(e.clientX, e.clientY);
  idleAt = performance.now();
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const k = Math.exp(e.deltaY * 0.0012);
  if (p.view === 'star') distGoal = clamp(distGoal * k, 1.6, 7); else zoomGoal = clamp(zoomGoal * k, 0.35, 3);
  idleAt = performance.now();
}, { passive: false });

// Where a tap lands on the star (the plain sphere is near enough), in the
// star's own frame: the chemistry gets a splash there.
let cam = null;
function feed(x, y) {
  if (!cam) return;
  const qx = (x / cssW - 0.5) * aspect, qy = 0.5 - y / cssH;
  const d = cam.fw.map((v, i) => v * FOCAL + cam.rt[i] * qx + cam.up[i] * qy);
  const l = Math.hypot(...d); const rd = d.map((v) => v / l);
  const b = rd[0] * cam.pos[0] + rd[1] * cam.pos[1] + rd[2] * cam.pos[2];
  const c = cam.pos[0] ** 2 + cam.pos[1] ** 2 + cam.pos[2] ** 2 - 1;
  if (b * b - c < 0) return;
  const tt = -b - Math.sqrt(b * b - c);
  const w = cam.pos.map((v, i) => v + rd[i] * tt);
  const cs = Math.cos(spin), sn = Math.sin(spin);
  tapDir = [cs * w[0] - sn * w[2], w[1], sn * w[0] + cs * w[2]];
}

function newWorld() {
  seed = newSeed();
  smudges.forEach((s) => s.fill(0));
  fieldE.set({ w: { seed: seed[0] } });
  texE.set({ s: { seed } });
  seedE.set({ d: { seed } });
  starE.set({ u: { seed: seed[0] } });
  texDirty = true;
  reseed = true;
  if (!playing) frame(gpu, render);
}
let reseed = true;

const clk = clock(gpu);
let fpsCount = 0, fpsAt = performance.now();

function step(dt) {
  t += dt;
  flowT += dt * p.flow * 0.06;
  // The smoke drifts as well as changing, so it reads as flowing.
  center[0] += dt * p.flow * 0.04;
  spin += dt * 0.03;
  // Smudges let go over a second or two.
  for (const s of smudges) { s[2] *= Math.exp(-dt * 1.4); s[3] *= Math.exp(-dt * 1.4); }
  const ease = 1 - Math.exp(-dt * 8);
  zoom += (zoomGoal - zoom) * ease;
  // Left alone a few seconds, the star turns.
  if (performance.now() - idleAt > 3000) yawGoal += dt * 0.05;
  yaw += (yawGoal - yaw) * ease;
  pitch += (pitchGoal - pitch) * ease;
  dist += (distGoal - dist) * ease;
  const s = span();
  fieldE.set({ w: { span: s, center, time: flowT, smR: 0.18 * s[1], smudge: smudges } });
  texE.set({ s: { time: flowT * 0.8 } });
  camera();
  starE.set({ u: { spin, time: t % 1000 } });
  finE.set({ f: { time: t % 1000 } });
  starFinE.set({ f: { time: t % 1000 } });
}

function camera() {
  const y = yaw + (tl.active ? tl.x * 0.4 : 0);
  const pt = clamp(pitch + (tl.active ? (tl.y - 0.5) * 0.3 : 0), -1.4, 1.4);
  const cp = Math.cos(pt), sp = Math.sin(pt), cy = Math.cos(y), sy = Math.sin(y);
  // Narrow screens stand further back, so the star fits across.
  const d = dist * Math.max(1, 1.05 / aspect);
  const pos = [sy * cp * d, sp * d, cy * cp * d];
  const fw = [-sy * cp, -sp, -cy * cp], rt = [cy, 0, -sy], up = [-sy * sp, cp, -cy * sp];
  cam = { pos, fw, rt, up };
  const rho0 = FOCAL / Math.sqrt(d * d - 1);
  starE.set({ u: { camPos: pos, fw, rt, up, rho0, dist: d } });
  // The nearer the star, the more of the screen it fills: stop down a
  // little, as a camera would, so its face doesn't burn out.
  starFinE.set({ f: { exposure: 1 / (0.6 + 0.9 * rho0) } });
}

function render(f) {
  if (p.view === 'texture') {
    f.pass(fieldT, fieldE);
    f.pass(sceneT, flatE);
  } else {
    // The texture only needs redrawing while it flows.
    if (texDirty || p.flow > 0) { f.pass(texS, texE); texDirty = false; }
    if (reseed) { f.pass(chemA, seedE); reseed = false; warm = 1200; }
    // The chemistry: a few steps a frame, and a burst after each new start
    // so the patterns are already grown when it shows.
    let n = 8 + Math.min(warm, 56);
    warm = Math.max(0, warm - 56);
    if (p.chem <= 0) n = 0;
    // A tap splashes the chemistry for one frame's worth of steps. (Uniforms
    // written mid-frame all land before the frame runs, so it's on for the
    // whole frame and off again the next.)
    if (tapDir || tapping) {
      const l = tapDir ? Math.hypot(...tapDir) : 1;
      const c = tapDir ? { tap: [tapDir[0] / l, tapDir[1] / l, tapDir[2] / l, Math.cos(0.06)], tapOn: 1 } : { tapOn: 0 };
      chemAB.set({ c }); chemBA.set({ c });
      tapping = !!tapDir;
      tapDir = null;
    }
    for (let i = 0; i < n; i += 2) {
      f.pass(chemB, chemAB);
      f.pass(chemA, chemBA);
    }
    f.pass(sceneT, starE);
    // The bloom, down the chain and back up, then the tone mapping.
    for (let i = 0; i < LEVELS; i++) f.pass(bloomT[i], bloomDown[i]);
    for (let i = LEVELS - 2; i >= 0; i--) f.pass({ target: bloomT[i], clear: false }, bloomUp[i]);
    f.pass(surf, starFinE);
    return;
  }
  f.pass(glowB, downE);
  f.pass(glowA, blurH);
  f.pass(glowB, blurV);
  f.pass(surf, finE);
}

let loop = null, playing = false;
function tick(f) {
  step(Math.min(clk.deltaTime, 0.1));
  render(f);
  fpsCount++;
  const now = performance.now();
  if (now - fpsAt > 1000) { $('fps').textContent = fpsCount + ' fps'; fpsCount = 0; fpsAt = now; }
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    $('playPause').classList.add('playing'); $('playIcon').style.display = 'none';
    $('pauseIcon').style.display = 'block'; $('playLabel').textContent = 'Pause';
    loop = frameLoop(gpu, tick);
  } else {
    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';
    if (loop) loop.stop();
    loop = null;
    $('fps').textContent = '';
  }
}

for (const id of IDS) $(id).addEventListener('input', applyControls);
$('palette').addEventListener('change', applyControls);

$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = 'reflective-wave-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    panel.classList.toggle('hidden');
    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');
  }
});

applyControls();
step(0);
togglePlay();
</script>
</body>
</html>
