<script type="module">
import { init, effect, surface, frameLoop, clock, frame } from './lib/vgpu.js';
import { tilt } from './lib/tilt.js';

const SHADER = /* wgsl */ `
fn hash21(p: vec2f) -> f32 { var q = fract(p * vec2f(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
fn hash1(n: f32) -> f32 { return fract(sin(n * 127.1) * 43758.5453); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y);
}
fn fbm(p0: vec2f) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var k = 0; k < 4; k++) { s += a * vnoise(p); p = p * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
// Coverage of a shape from its signed distance (negative inside), one pixel wide.
fn fillA(d: f32, px: f32) -> f32 { return clamp(0.5 - d / px, 0.0, 1.0); }
// Coverage of an outline of half-width w along the shape's edge.
fn strokeA(d: f32, w: f32, px: f32) -> f32 { return clamp(0.5 - (abs(d) - w) / px, 0.0, 1.0); }
fn sdBox(p: vec2f, b: vec2f) -> f32 { let d = abs(p) - b; return length(max(d, vec2f(0.0))) + min(max(d.x, d.y), 0.0); }
fn sdSeg(p: vec2f, a: vec2f, b: vec2f) -> f32 {
  let pa = p - a; let ba = b - a;
  let h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-8), 0.0, 1.0);
  return length(pa - ba * h);
}
fn sdTri(p: vec2f, p0: vec2f, p1: vec2f, p2: vec2f) -> f32 {
  let e0 = p1 - p0; let e1 = p2 - p1; let e2 = p0 - p2;
  let v0 = p - p0; let v1 = p - p1; let v2 = p - p2;
  let pq0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  let pq1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  let pq2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  let s = sign(e0.x * e2.y - e0.y * e2.x);
  let d = min(min(vec2f(dot(pq0, pq0), s * (v0.x * e0.y - v0.y * e0.x)),
                  vec2f(dot(pq1, pq1), s * (v1.x * e1.y - v1.y * e1.x))),
                  vec2f(dot(pq2, pq2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
fn rot2(p: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c * p.x - s * p.y, s * p.x + c * p.y); }
// Paper: a little fibre and grain, and ink that prints slightly unevenly.
fn paperize(col: vec3f, pos: vec2f, grain: f32) -> vec3f {
  let fibre = 0.965 + 0.035 * vnoise(pos * vec2f(0.02, 0.09));
  let speck = hash21(floor(pos / 1.5)) - 0.5;
  return col * fibre * (1.0 + speck * grain * 0.6) + (hash21(pos) - 0.5) * grain * 0.25;
}
// Registration mark: a ring with a cross through it.
fn regMark(p: vec2f, c: vec2f, r: f32, px: f32) -> f32 {
  let q = p - c;
  let ring = strokeA(length(q) - r, px * 0.6, px);
  let cross = max(strokeA(sdSeg(q, vec2f(-r * 1.7, 0.0), vec2f(r * 1.7, 0.0)), px * 0.5, px),
                  strokeA(sdSeg(q, vec2f(0.0, -r * 1.7), vec2f(0.0, r * 1.7)), px * 0.5, px));
  return max(ring, cross);
}
const INK = vec3f(0.07, 0.06, 0.08);
const PAPER = vec3f(0.94, 0.91, 0.84);
// Hairlines where a banding field crosses each whole number.
fn bandLines(v: f32, px: f32) -> f32 {
  let fw = max(fwidth(v), 1e-5);
  let d = min(fract(v), 1.0 - fract(v)) / fw;
  return (1.0 - smoothstep(0.35, 1.25, d)) * (1.0 - smoothstep(0.25, 0.5, fw));
}
// Paper margin with a keyline and registration marks at the edge midpoints.
fn posterFrame(col: vec3f, uv: vec2f, asp: f32, px: f32) -> vec3f {
  let p = vec2f((uv.x - 0.5) * asp, uv.y - 0.5);
  let m = 0.024;
  let d = sdBox(p, vec2f(asp * 0.5 - m, 0.5 - m));
  var c = mix(PAPER, col, fillA(d, px));
  c = mix(c, INK, strokeA(d, px * 0.9, px));
  let r = m * 0.28;
  var mk = max(regMark(p, vec2f(0.0, -0.5 + m * 0.5), r, px), regMark(p, vec2f(0.0, 0.5 - m * 0.5), r, px));
  mk = max(mk, max(regMark(p, vec2f(-asp * 0.5 + m * 0.5, 0.0), r, px), regMark(p, vec2f(asp * 0.5 - m * 0.5, 0.0), r, px)));
  return mix(c, INK, mk * step(0.0, d) * 0.8);
}
// The ink plate prints a hair off register from the colour.
const MISREG = vec2f(0.0016, -0.0011);
// Bushes after Chris's canvases: a near-black core with stippled highlights
// that thicken toward the lit edge. lit runs 0 (deep shadow) to 1 (sunlit
// rim); cell sets the stipple size. Two offset layers of jittered dots.
fn stippleBush(p: vec2f, lit: f32, cell: f32, px: f32, dark: vec3f, mid: vec3f, hiA: vec3f, hiB: vec3f, warm: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mix(dark, mid, 0.55), smoothstep(0.35, 0.9, l));
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / cell + vec2f(fl * 0.5, fl * 0.37);
    let id = floor(g);
    let h = hash21(id + seed + fl * 7.1);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.3 + fl), hash21(id + 2.7 + fl)) - 0.5) * 0.55;
    let dens = smoothstep(0.05, 0.85, l + (hash21(id + 5.9) - 0.5) * 0.45);
    if (h < 0.4 + 0.6 * dens) {
      let k = hash21(id + 9.1 + fl);
      var dc = select(select(hiA, hiB, k > 0.55), warm, k > 0.95);
      dc = mix(mix(dark, mid, 0.8), dc, smoothstep(0.15, 0.75, l + (h - 0.5) * 0.3));
      let r = (0.24 + 0.2 * hash21(id + 3.3)) * mix(0.8, 1.0, l);
      c = mix(c, dc, fillA((length(f) - r) * cell, px));
    }
  }
  // Fine grain: small clusters of tiny points scattered over the big dots,
  // light on the lit side, dark flecks breaking up the highlights.
  let fcell = max(cell * 0.38, px * 2.2);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let g = p / fcell + vec2f(fl * 0.31, fl * 0.57);
    let id = floor(g);
    let clump = vnoise(p / (cell * 2.3) + seed + fl * 4.0);
    let h = hash21(id + seed * 1.7 + fl * 3.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 4.1 + fl), hash21(id + 6.3 + fl)) - 0.5) * 0.6;
    let r = 0.16 + 0.14 * hash21(id + 8.8);
    let a = fillA((length(f) - r) * fcell, px);
    if (L == 0) {
      let on = step(h, smoothstep(0.1, 0.9, l) * smoothstep(0.3, 0.7, clump) * 0.9);
      let k = hash21(id + 2.2);
      let dc = select(select(hiB, hiA, k > 0.5), warm, k > 0.9);
      c = mix(c, mix(c, dc, 0.9), a * on);
    } else {
      let on = step(h, (0.25 + 0.35 * l) * smoothstep(0.45, 0.8, clump));
      c = mix(c, dark, a * on * 0.85);
    }
  }
  return c;
}
// Painted layers over any surface: three scales of points in drifting
// clusters, each a lighter or darker note of the colour beneath, so flat
// fills read as built up from many small marks. amt 0..1 sets how much.
fn layerTex(p: vec2f, col: vec3f, px: f32, amt: f32, scale: f32, seed: f32) -> vec3f {
  var c = col;
  let lum = dot(col, vec3f(0.3, 0.59, 0.11));
  // Contrast grows with amt: soft tonal flecks at low amounts, crisp marks at full.
  let ct = smoothstep(0.1, 0.9, amt);
  let lightC = mix(col, min(col * 1.2 + vec3f(0.035, 0.03, 0.01), vec3f(1.0)), 0.45 + 0.55 * ct);
  let darkC = mix(col, col * 0.7, 0.3 + 0.7 * ct);
  var sc = array<f32, 3>(1.0, 0.55, 0.3);
  for (var L = 0; L < 3; L++) {
    let fl = f32(L);
    let cell = max(scale * sc[L], px * 2.2);
    let g = p / cell + vec2f(fl * 0.37, fl * 0.61);
    let id = floor(g);
    let h = hash21(id + seed + fl * 5.3);
    let f = fract(g) - 0.5 - (vec2f(hash21(id + 1.7 + fl), hash21(id + 4.9 + fl)) - 0.5) * 0.6;
    let clump = vnoise(p / (cell * 3.1) + seed * 0.37 + fl * 7.0);
    let r = 0.17 + 0.15 * hash21(id + 8.3);
    let a = fillA((length(f) - r) * cell, px);
    let on = step(h, amt * (0.12 + 0.55 * smoothstep(0.3, 0.8, clump)));
    let k = hash21(id + 2.9 + fl);
    // Dark ground takes more light marks, light ground more dark ones.
    let dc = select(darkC, lightC, k < 0.35 + 0.35 * (1.0 - lum) + (1.0 - ct) * 0.3);
    c = mix(c, dc, a * on * (0.75 - fl * 0.12));
  }
  return c;
}
// Bark: stippled light and shade plus fine strokes along the trunk.
// u runs along the trunk, v across it (-1..1), lit is 0..1.
fn barkTex(u: f32, v: f32, w: f32, lit: f32, px: f32, dark: vec3f, mid: vec3f, hi: vec3f, seed: f32) -> vec3f {
  let l = clamp(lit, 0.0, 1.0);
  var c = mix(dark, mid, smoothstep(-0.6, 0.4, v * 0.0 + l * 2.0 - 1.0));
  let g = vec2f(u / (w * 0.55), v * 2.2);
  let id = floor(g);
  let f = fract(g) - 0.5;
  let h = hash21(id + seed);
  let stroke = strokeA(f.x * 0.4 + 0.15 * sin(u / w * 3.0 + id.y), 0.08, 0.1);
  c = mix(c, select(dark * 0.85, hi, h > 0.5 - 0.3 * l), stroke * step(0.35, h) * 0.8);
  for (var L = 0; L < 2; L++) {
    let fl = f32(L);
    let cs = w * (0.42 - fl * 0.18);
    let g2 = vec2f(u, v * w) / max(cs, px * 2.2) + fl * 0.5;
    let id2 = floor(g2);
    let f2 = fract(g2) - 0.5 - (vec2f(hash21(id2 + 3.1), hash21(id2 + 5.7)) - 0.5) * 0.5;
    let h2 = hash21(id2 + seed + fl * 9.0);
    let dc = select(dark * 0.8, mix(mid, hi, 0.7), h2 < l * 0.8);
    c = mix(c, dc, fillA((length(f2) - 0.22) * max(cs, px * 2.2), px) * step(0.45, hash21(id2 + 7.7)));
  }
  return c;
}
// Drape: an offset that bends a shadow's outline over small bumps in the
// ground, so it reads as lying on uneven land rather than cut from paper.
fn drape(p: vec2f, scale: f32, seed: f32) -> vec2f {
  let q = p / max(scale, 1e-4);
  return (vec2f(vnoise(q + seed), vnoise(q + seed + 7.3)) - 0.5) * scale * 0.5
       + (vec2f(vnoise(q * 2.7 + seed * 1.3), vnoise(q * 2.7 + seed + 3.1)) - 0.5) * scale * 0.18;
}
// Soft coverage from a signed distance, with a penumbra of width w.
fn softA(d: f32, w: f32) -> f32 { return 1.0 - smoothstep(-w * 0.6, w, d); }
// Shadow pooled on the ground under a clump: a flat ellipse pushed away
// from the sun, longer when the sun is low. Returns coverage.
fn groundShadow(p: vec2f, foot: vec2f, r: f32, side: f32, low: f32, px: f32) -> f32 {
  let len = r * (1.1 + 2.2 * low);
  let q = p + drape(p, r * 0.9, foot.x * 17.0);
  let c = foot + vec2f(-side * len * 0.55, r * 0.12);
  let along = clamp((q.x - foot.x) * -side / (len * 1.1), 0.0, 1.0);
  let d = (length((q - c) / vec2f(len, r * 0.34)) - 1.0) * r * 0.34;
  let pen = max(px, r * (0.06 + 0.3 * along));
  // Deepest right at the foot, fading and blurring toward the tip.
  let cq = (p - foot) / vec2f(r * 0.9, r * 0.22);
  return clamp(softA(d, pen) * (1.0 - 0.5 * along) + exp(-dot(cq, cq)) * 0.5, 0.0, 1.0);
}
// A long cast shadow from a thin upright (a trunk or stem): widening and
// blurring away from its foot, and draped over the ground.
fn softShadowSeg(p: vec2f, a: vec2f, b: vec2f, w: f32, px: f32) -> f32 {
  let ba = b - a;
  let h = clamp(dot(p - a, ba) / dot(ba, ba), 0.0, 1.0);
  let q = p + drape(p, length(ba) * 0.35, a.x * 11.0) * (0.2 + h);
  let hq = clamp(dot(q - a, ba) / dot(ba, ba), 0.0, 1.0);
  let d = length(q - a - ba * hq) - w * (1.0 + 1.5 * hq);
  return softA(d, max(px, w * (0.5 + 4.0 * hq))) * (1.0 - 0.55 * hq);
}
// Halftone screen on a 45 degree grid; dots cover roughly 'amt' of the area.
fn halftone(p: vec2f, cell: f32, amt: f32, px: f32) -> f32 {
  let f = fract(rot2(p, 0.785) / cell) - 0.5;
  let r = sqrt(clamp(amt, 0.0, 1.0) / 3.14159) * cell;
  return fillA(length(f) * cell - r, px) * step(0.01, amt);
}
// Printed sun or moon: rings around a disc of radius r0.
fn rings(p: vec2f, c: vec2f, r0: f32, gap: f32, n: f32, px: f32) -> f32 {
  let d = length(p - c) - r0;
  let on = step(gap * 0.5, d) * step(d, gap * (n + 0.5));
  return strokeA((fract(d / gap + 0.5) - 0.5) * gap, px * 0.55, px) * on;
}
// Scalloped wave crests: a row of arcs along y = y0.
fn scallop(p: vec2f, y0: f32, w: f32, px: f32) -> f32 {
  let f = (fract(p.x / w) - 0.5) * w;
  let d = length(vec2f(f, p.y - y0 - w * 0.5)) - w * 0.5;
  return strokeA(d, px * 0.55, px) * step(p.y, y0 + w * 0.5);
}
// Small bird: two ink arcs.
fn bird(p: vec2f, c: vec2f, s: f32, flap: f32, px: f32) -> f32 {
  let q = (p - c) / s;
  let x = abs(q.x);
  let y = q.y + flap * 0.35 * x - 0.55 * x * (1.0 - x);
  return strokeA(y * s, px * 0.6, px) * step(x, 1.0);
}

// Fern Palms: after my palm canvas, drawn crisp in the manner of Eyvind
// Earle. Feather palms at several depths rise on scaly trunks out of banks
// of dark bushes traced with wandering lines of cream dots; herringbone
// fronds droop from green crownshafts. Far hills step back into haze, big
// ferns and bushes crowd the foreground, and the day turns slowly: palm
// shadows rake across the bushes, cloud shadows slide over the hills and
// mist gathers at dawn and dusk.
struct U {
  a: vec4f,   // time, aspect, px, seed
  b: vec4f,   // wind, gust, grain, zoom
  c: vec4f,   // sun x, sun y, sun height, dark
  d: vec4f,   // moon x, moon y, moon height, tilt x
  e: vec4f,   // palm count, fog, dots, _
  cols: array<vec4f, 29>,
}
@group(0) @binding(0) var<uniform> u: U;

// 0-6 sky, 7 mountains, 8 mist, 9 mist light, 10 hill lit, 11 hill shade,
// 12 bush dark, 13 bush mid, 14 bush hi, 15 bush hi 2, 16 dot cream,
// 17 frond dark, 18 frond mid, 19 frond lit, 20 frond pale, 21 trunk dark,
// 22 trunk mid, 23 trunk light, 24 crownshaft, 25 fern, 26 ink, 27 lamp, 28 parrot
@diagnostic(off, derivative_uniformity) fn C(i: i32) -> vec3f { return u.cols[i].rgb; }
@diagnostic(off, derivative_uniformity) fn post(v: f32, n: f32) -> f32 { return floor(clamp(v, 0.0, 1.0) * n + 0.5) / n; }
@diagnostic(off, derivative_uniformity) fn light() -> f32 { return smoothstep(-0.04, 0.2, u.c.z); }
@diagnostic(off, derivative_uniformity) fn lowSun() -> f32 { return 1.0 - smoothstep(0.1, 0.5, u.c.z); }

const HZ = 0.02;
@diagnostic(off, derivative_uniformity) fn hillFar(x: f32) -> f32 { return -0.04 - 0.06 * exp(-pow((x + 0.4) / 0.35, 2.0)) - 0.04 * exp(-pow((x - 0.5) / 0.3, 2.0)) + 0.006 * sin(x * 13.0 + u.a.w); }
@diagnostic(off, derivative_uniformity) fn hillNear(x: f32) -> f32 { return 0.02 - 0.04 * exp(-pow((x - 0.1) / 0.4, 2.0)) + 0.01 * sin(x * 5.0 + u.a.w * 2.0) + 0.004 * sin(x * 23.0); }
// Bushes in staggered rows down the slope: each row is a chain of lumps of
// different sizes. Returns (top of the row at x, lump centre x, radius).
@diagnostic(off, derivative_uniformity) fn rowBase(r: i32) -> f32 { return 0.075 + f32(r) * 0.09 + 0.02 * sin(f32(r) * 1.7); }
@diagnostic(off, derivative_uniformity) fn bushRow(r: i32, x: f32) -> vec4f {
  let fr = f32(r);
  let w = 0.055 + fr * 0.028;
  let ci = floor(x / w + fr * 0.37);
  var top = 1e3; var cx = 0.0; var R = 0.0; var cy = 0.0;
  for (var o = -1; o <= 1; o++) {
    let id = ci + f32(o);
    let h = hash1(id * 1.37 + fr * 17.0 + u.a.w);
    let c = (id - fr * 0.37 + 0.5 + (hash1(id * 2.1 + fr) - 0.5) * 0.5) * w;
    let rad = w * (0.55 + 0.45 * h);
    let y0 = rowBase(r) + 0.012 * sin(c * 5.0 + fr + u.a.w) + rad * 0.35;
    let dx = x - c;
    if (abs(dx) < rad) {
      let tp = y0 - sqrt(rad * rad - dx * dx);
      if (tp < top) { top = tp; cx = c; R = rad; cy = y0; }
    }
  }
  return vec4f(top, cx, R, cy);
}
// Palms: base x, height, scale (depth), in draw order far to near.
@diagnostic(off, derivative_uniformity) fn palmP(i: i32) -> vec3f {
  var a = array<vec3f, 9>(
    vec3f(-0.62, 0.34, 0.5), vec3f(0.55, 0.32, 0.5), vec3f(-0.05, 0.36, 0.55),
    vec3f(0.3, 0.46, 0.72), vec3f(-0.38, 0.5, 0.75), vec3f(0.72, 0.5, 0.78),
    vec3f(0.1, 0.62, 1.0), vec3f(-0.62, 0.62, 0.95), vec3f(0.45, 0.66, 1.0));
  return a[i];
}
@diagnostic(off, derivative_uniformity) fn palmBase(i: i32) -> vec2f {
  let pp = palmP(i);
  let r = select(select(0, 2, pp.z >= 0.6), 5, pp.z >= 0.9);
  return vec2f(pp.x, rowBase(r) + 0.03);
}
@diagnostic(off, derivative_uniformity) fn palmCrown(i: i32) -> vec2f {
  let pp = palmP(i);
  let b = palmBase(i);
  let sw = ((u.b.x * 0.012 * sin(u.a.x * 0.8 + f32(i) * 1.3)) + u.b.y * 0.025) * pp.z;
  return vec2f(b.x + 0.04 * sin(f32(i) * 2.3) * pp.z + sw, b.y - pp.y * (0.9 + 0.2 * pp.z));
}

// One feather frond: a drooping spine with leaflets angled back along it.
// Returns (coverage, side of spine, along 0..1, leaflet).
@diagnostic(off, derivative_uniformity) fn frond(q: vec2f, c: vec2f, ang: f32, len: f32, px: f32) -> vec4f {
  let dir = vec2f(cos(ang), sin(ang));
  let droop = len * (0.25 + 0.35 * abs(dir.x));
  var best = 1e3; var bs = 0.0; var bside = 0.0;
  var prev = c;
  for (var k = 1; k <= 5; k++) {
    let s = f32(k) / 5.0;
    let cur = c + dir * len * s + vec2f(0.0, droop * s * s);
    let ba = cur - prev;
    let h = clamp(dot(q - prev, ba) / dot(ba, ba), 0.0, 1.0);
    let off = q - prev - ba * h;
    let dd = length(off);
    if (dd < best) { best = dd; bs = (f32(k - 1) + h) / 5.0; bside = sign(ba.x * off.y - ba.y * off.x); }
    prev = cur;
  }
  let halfW = len * 0.2 * sin(3.14159 * min(bs * 1.1, 1.0)) * (0.7 + 0.3 * bs);
  if (best > halfW + px * 2.0 || bs >= 0.999) { return vec4f(0.0); }
  let spacing = len * 0.034;
  let lf = fract((bs * len - best * 0.85) / spacing);
  let lw = spacing * (0.28 + 0.1 * (1.0 - best / max(halfW, 1e-4)));
  let leaflet = fillA((abs(lf - 0.5) * spacing - lw * 0.5), px) * fillA(best - halfW, px);
  let spine = fillA(best - max(len * 0.006, px * 0.5), px);
  return vec4f(max(leaflet, spine), bside, bs, leaflet);
}

// Palm shadows at a ground point: long bands away from the sun.
@diagnostic(off, derivative_uniformity) fn palmShadeAt(q: vec2f, px: f32) -> f32 {
  let side = sign(u.c.x + 1e-4);
  let L = 0.06 + 0.3 * lowSun();
  var s = 0.0;
  for (var i = 0; i < 9; i++) {
    if (i >= i32(u.e.x)) { break; }
    let b = palmBase(i);
    let e2 = b + vec2f(-side * L * palmP(i).z, 0.02 + L * 0.06);
    s = max(s, softShadowSeg(q, b, e2, 0.005 * palmP(i).z, px));
    s = max(s, groundShadow(q, e2, 0.05 * palmP(i).z, -side, 0.0, px));
  }
  return s * light() * 0.55;
}
@diagnostic(off, derivative_uniformity) @fragment fn fs_main(@location(0) uv: vec2f, @builtin(position) pos: vec4f) -> @location(0) vec4f {
  let t = u.a.x; let asp = u.a.y; let k = u.b.w;
  let p0 = vec2f((uv.x - 0.5) * asp, uv.y - 0.5) * k;
  let px = u.a.z * k;
  let tilt = u.d.w;
  let dark = u.c.w;
  let lt = light();
  let sun = u.c.xy;
  let wind = u.b.x + u.b.y;
  let fog = u.e.y;
  let pFar = p0 + vec2f(tilt * 0.006, 0.0);
  let pMid = p0 + vec2f(tilt * 0.014, 0.0);
  let p = p0 + vec2f(tilt * 0.024, 0.0);
  let hazeC = mix(C(2), C(8), 0.5);

  var col = daySky(p0, HZ, px, t, C(27), -0.15);
  // Parrots crossing in a loose flock by day.
  for (var i = 0; i < 6; i++) {
    let fi = f32(i);
    let fl = fract(t * 0.011 + 0.6);
    let c = vec2f(-1.3 + fl * 2.8, -0.4 + 0.05 * sin(fl * 8.0)) + vec2f((hash1(fi) - 0.5) * 0.12, (hash1(fi * 2.3) - 0.5) * 0.06 + 0.01 * sin(t * 2.0 + fi));
    let bd = max(bird(p0, c, 0.011, sin(t * 9.0 + fi * 1.7), px), fillA(length((p0 - c) / vec2f(1.0, 0.6)) - 0.004, px));
    col = mix(col, C(28) * mix(0.6, 1.0, lt), bd * (1.0 - dark));
  }

  // ---- Far and near hills: raked light, gullies, cloud shadows, haze.
  {
    let ht = hillFar(pFar.x);
    let dy = pFar.y - ht;
    let s = (hillFar(pFar.x + 0.01) - hillFar(pFar.x - 0.01)) / 0.02;
    var hc = mix(C(11), C(10), slopeLight(s, pFar.x, dy));
    let gully = fract(pFar.x * 11.0 + 2.0 * (vnoise(vec2f(pFar.x * 6.0, u.a.w)) - 0.5) - dy * 4.0);
    hc = mix(hc, C(11), step(0.82, gully) * 0.4 * smoothstep(0.08, 0.0, dy));
    hc = mix(hc, C(11) * 0.9, cloudShade(vec2f(pFar.x, 4.0 + dy * 3.0), t) * 0.5);
    hc = hazeStep(hc, 0.72, hazeC);
    col = mix(col, hc, fillA(ht - pFar.y, px));
  }
  {
    let ht = hillNear(pMid.x);
    let dy = pMid.y - ht;
    let s = (hillNear(pMid.x + 0.01) - hillNear(pMid.x - 0.01)) / 0.02;
    var hc = mix(C(11), C(10), slopeLight(s, pMid.x, dy));
    hc = mix(hc, C(11), step(0.8, fract((dy + 0.004 * sin(pMid.x * 35.0)) / 0.006)) * 0.3);
    // Round trees dotted on the slope, stippled with dark cores.
    let ow = 0.05;
    let oi = floor(pMid.x / ow);
    let oh = hash1(oi * 1.9 + u.a.w);
    if (oh > 0.35) {
      let ox = (oi + 0.5 + (hash1(oi * 4.1) - 0.5) * 0.4) * ow;
      let oy = hillNear(ox) + 0.01 + 0.03 * hash1(oi * 7.7);
      let rr = 0.008 + 0.005 * oh;
      let v = pMid - vec2f(ox, oy);
      let side = sign(sun.x - ox + 1e-4);
      hc = mix(hc, mix(C(11), C(26), 0.5), groundShadow(pMid, vec2f(ox, oy + rr * 0.8), rr, side, lowSun(), px) * lt * 0.6);
      let olit = (0.12 + 0.88 * lt) * clamp(0.35 - v.y / rr * 0.9 + v.x / rr * 0.3 * side, 0.0, 1.0);
      hc = mix(hc, stippleBush(pMid, olit, 0.0022, px, C(12), C(13), C(14), C(15), C(16), oi), fillA(length(v / vec2f(1.15, 1.0)) - rr, px));
    }
    hc = mix(hc, C(11) * 0.9, cloudShade(vec2f(pMid.x, 2.0 + dy * 3.0), t) * 0.5);
    hc = hazeStep(hc, 0.4, hazeC);
    col = mix(col, hc, fillA(ht - pMid.y, px));
  }
  // ---- Mist lying in the valley.
  for (var m = 0; m < 3; m++) {
    let fm = f32(m);
    let base = 0.04 + fm * 0.02;
    let sx = pMid.x + t * 0.005 * (1.0 + fm * 0.4) + fm * 2.3;
    let top = base - (0.01 + 0.03 * fog) * (0.5 + 0.5 * abs(sin(sx * (7.0 + fm) + fm))) - 0.008 * sin(sx * 2.3);
    let a = fillA(top - pMid.y, px) * smoothstep(0.05, 0.5, fog) * (0.7 - fm * 0.12);
    col = mix(col, mix(C(8), C(9), select(0.0, 0.6, m == 0)), a);
    col = mix(col, C(9), strokeA(pMid.y - top, px * 0.5, px) * a * 0.6 * (1.0 - dark * 0.7));
  }

  let n = i32(u.e.x);

  // The canvas's wandering lines of cream dots: contours of a slow field
  // with dots spaced along them, worked out once for the nearer rows.
  var dotLid = vec2f(0.0);
  if (p.y > rowBase(3) - 0.08) {
    let fo = u.a.w + vec2f(0.0, t * 0.01);
    let e = 0.004;
    let f0 = fbm(p * 3.2 + fo);
    let gx = (fbm((p + vec2f(e, 0.0)) * 3.2 + fo) - f0) / e;
    let gy = (fbm((p + vec2f(0.0, e)) * 3.2 + fo) - f0) / e;
    let gl = max(length(vec2f(gx, gy)), 1e-3);
    let lines = f0 * 13.0;
    let dist = (abs(fract(lines) - 0.5) - 0.5) / (13.0 * gl);
    let tng = vec2f(-gy, gx) / gl;
    let sp = 0.011;
    let dd = length(vec2f((fract(dot(p, tng) / sp) - 0.5) * sp, dist)) - 0.0034;
    let lid = floor(lines);
    dotLid = vec2f(fillA(dd, px) * step(0.3, hash1(lid * 3.1 + u.a.w)), hash1(lid + u.a.w));
  }
  // Rows of bushes back to front, with each depth band of palms drawn after
  // the rows it stands among. Far palms after row 0, mid after row 2, near
  // after the last.
  for (var r = 0; r < 5; r++) {
    let fr = f32(r);
    let br = bushRow(r, p.x);
    if (br.x < 1e2 && p.y > br.x - px * 2.0) {
      let c = vec2f(br.y, br.w);
      let v = (p - c) / br.z;
      let side = sign(sun.x - br.y + 1e-4);
      let blit = (0.1 + 0.9 * lt) * clamp(-0.05 - v.y * 0.95 + v.x * 0.4 * side, 0.0, 1.0);
      var bc = stippleBush(p, blit, 0.0026 + fr * 0.0005, px, C(12), C(13), C(14), C(15), C(16), fr * 3.0 + 1.0);
      bc = mix(bc, C(12) * 0.75, smoothstep(-0.3, 0.4, v.y) * 0.8);
      bc = mix(bc, C(12) * 0.8, smoothstep(0.3, 0.0, blit) * 0.55);
      // The canvas's wandering lines of cream dots, on the nearer rows.
      if (r >= 3) {
        let dc = select(C(16), C(15), dotLid.y > 0.6);
        bc = mix(bc, mix(dc, dc * 0.55, 1.0 - lt * 0.8), dotLid.x * u.e.z);
      }
      // Shadows wrap over the dome of each bush: its surface stands higher
      // toward the crown, so the shadow shifts along the light as it climbs.
      let zb = clamp(br.w - p.y, 0.0, br.z) * 0.9;
      bc = mix(bc, bc * 0.6, palmShadeAt(liftShadow(p, zb), px));
      bc = mix(bc, bc * 0.8, cloudShade(vec2f(p.x, 0.8 + fr * 0.3), t) * 0.5);
      bc = hazeStep(bc, 0.25 - fr * 0.06, hazeC);
      col = mix(col, bc, fillA(br.x - p.y, px));
      col = mix(col, C(26), strokeA(p.y - br.x, px * 0.45, px) * 0.6);
    }
    let band = select(select(-1, 1, r == 2), 2, r == 4);
    let band0 = r == 0;
    if (band < 0 && !band0) { continue; }
    // ---- Palms in this band.
    for (var i = 0; i < 9; i++) {
      if (i >= n) { break; }
      let pp = palmP(i);
      let bandOf = select(select(2, 1, pp.z < 0.9), 0, pp.z < 0.6);
      if (bandOf != select(band, 0, band0)) { continue; }
      let sc = pp.z;
      let fade = (1.0 - sc) * 0.55;
      let b = palmBase(i);
      let c = palmCrown(i);
      // Trunk: tapering, ringed with leaf scars, lit on the sun side.
      let e = c - b;
      let L = length(e);
      let dirT = e / L;
      let nT = vec2f(-dirT.y, dirT.x);
      let rel = p - b;
      let along = dot(rel, dirT);
      if (along > -0.01 && along < L) {
        let tt = along / L;
        let across = dot(rel, nT) - sin(tt * 3.14159) * 0.012 * sc;
        let w = (0.011 - 0.004 * tt) * sc;
        let d = abs(across) - w;
        if (d < px * 2.0) {
          let side = sign(sun.x - p.x + 1e-4) * sign(nT.x + 1e-4);
          var tc = barkTex(along, across / w, w, smoothstep(-0.3, 0.8, across / w * side) * lt, px, C(21), C(22), C(23), f32(i) * 7.0);
          tc = mix(tc, C(21), step(0.7, fract(along / (0.008 * sc) + abs(across / w) * 0.4)) * 0.6);
          // Green crownshaft just under the fronds.
          tc = mix(tc, mix(C(24), C(19), 0.35 * lt), smoothstep(0.86, 0.9, tt));
          tc = hazeStep(tc, fade, hazeC);
          col = mix(col, tc, fillA(d, px));
          col = mix(col, C(26), strokeA(d, px * 0.4, px) * 0.6);
        }
      }
      // Crown: three layers of fronds, dark behind, lit in front.
      let rel2 = p - c;
      if (dot(rel2, rel2) < pow(0.25 * sc, 2.0)) {
        for (var L2 = 0; L2 < 3; L2++) {
          let fl = f32(L2);
          let nf = 10 - L2;
          for (var f = 0; f < 10; f++) {
            if (f >= nf) { break; }
            let ff = f32(f);
            let h = hash1(ff * 3.7 + f32(i) * 5.1 + fl * 11.0);
            let spread = (5.2 - fl * 1.1);
            let a = -1.5708 + (ff / f32(nf - 1) - 0.5) * spread + 0.2 * (h - 0.5) + 0.05 * sin(t * 1.1 + ff + f32(i) + fl) * u.b.x;
            let len = (0.13 + 0.06 * h - fl * 0.015) * sc;
            let fr = frond(p, c, a, len, px);
            if (fr.x > 0.0) {
              var fc = C(17);
              if (L2 == 1) { fc = mix(C(17), C(18), 0.7); }
              if (L2 == 2) { fc = mix(C(18), C(19), 0.2); }
              // Upper side of each leaflet catches the sun.
              let up = step(0.0, fr.y * sign(cos(a) + 1e-4) * -1.0);
              fc = mix(fc, C(19), up * lt * (0.2 + 0.25 * fl) * fr.w);
              fc = mix(fc, C(17) * 0.7, (1.0 - fr.w) * 0.35);
              fc = mix(fc, C(20), smoothstep(0.75, 1.0, fr.z) * step(0.8, h) * 0.6);
              fc = mix(fc, C(17) * 0.8, smoothstep(0.3, 0.9, sin(a)) * 0.4);
              fc = mix(fc, fc * mix(0.35, 1.0, lt), 1.0 - lt);
              fc = hazeStep(fc, fade, hazeC);
              col = mix(col, fc, fr.x);
            }
          }
        }
      }
    }
  }

  // ---- Ferns reaching in from the bottom corners.
  let bottom = 0.5 * k;
  for (var j = 0; j < 2; j++) {
    let fj = f32(j);
    let sidex = select(-1.0, 1.0, j == 1);
    let c = vec2f(sidex * (0.5 * asp * k - 0.06), bottom + 0.03);
    for (var f = 0; f < 6; f++) {
      let ff = f32(f);
      let a = -1.5708 - sidex * (0.25 + ff * 0.22) + 0.05 * sin(t * 1.2 + ff + fj * 3.0) * wind;
      let len = 0.2 + 0.06 * hash1(ff + fj * 7.0);
      let fr = frond(p0, c, a, len, px);
      if (fr.x > 0.0) {
        var fc = mix(C(25) * 0.55, C(25), 0.4 + 0.6 * lt * step(0.0, -fr.y * sidex));
        fc = mix(fc, C(19), fr.w * lt * 0.25);
        col = mix(col, fc, fr.x);
      }
    }
  }
  // Painted layers over everything, finer in the distance, faint in the sky.
  let land = smoothstep(HZ - 0.14, HZ - 0.04, p0.y);
  col = layerTex(p0, col, px, mix(0.12, 1.0, land), mix(0.006, 0.013, clamp((p0.y + 0.05) * 1.5, 0.0, 1.0)), 6.0);
  return vec4f(paperize(col, pos.xy, u.b.z), 1.0);
}

// Shared pieces for the day-cycle scenes. The page defines C(), post(),
// light(), lowSun() and a uniform u with c = (sun x, y, height, dark) and
// d = (moon x, y, height, _). Sky colours: C(0) top, C(1) mid, C(2)
// horizon, C(3) sun, C(4) glow, C(5) cloud lit, C(6) cloud shade.
@diagnostic(off, derivative_uniformity) fn skyCloud(p: vec2f, k: i32) -> vec2f {
  let fk = f32(k);
  let L = 0.16 + 0.18 * hash1(fk + u.a.w);
  let cy = -1.0 + fk * 0.13;
  let cx = fract(hash1(fk * 3.1 + u.a.w) + u.a.x * 0.0016 * (1.0 + fk * 0.2)) * 2.6 - 1.3;
  let dx = (p.x - cx) / L;
  if (abs(dx) > 1.0) { return vec2f(1e3, 0.0); }
  let th = (0.014 + 0.01 * hash1(fk * 5.0)) * sqrt(1.0 - dx * dx);
  let sc = abs(sin(dx * (6.0 + fk) + fk));
  let top = cy - th * (1.0 + 0.8 * sc);
  let bot = cy + th * 0.4;
  return vec2f(max(top - p.y, p.y - bot), clamp((p.y - top) / (bot - top), 0.0, 1.0));
}
// Stepped sky with glow, stars, sun, moon and banded clouds below cloudMax.
@diagnostic(off, derivative_uniformity) fn daySky(p0: vec2f, hz: f32, px: f32, t: f32, lampC: vec3f, cloudMax: f32) -> vec3f {
  let sun = u.c.xy; let moon = u.d.xy; let dark = u.c.w;
  let g = clamp((p0.y - hz) / -1.0, 0.0, 1.0);
  var col = mix(C(2), C(1), post(smoothstep(0.0, 0.3, g), 5.0));
  col = mix(col, C(0), post(smoothstep(0.28, 0.9, g), 5.0));
  let ds = length(p0 - sun);
  col = mix(col, C(4), post(exp(-ds * 9.0) * 0.9 * step(-0.2, u.c.z), 5.0));
  let sg = p0 / 0.035;
  let sid = floor(sg);
  let sh = hash21(sid + 5.3);
  if (sh > 0.72) {
    let sv = p0 - (sid + 0.5 + (vec2f(hash21(sid + 1.7), hash21(sid + 8.1)) - 0.5) * 0.7) * 0.035;
    let tw = 0.55 + 0.45 * sin(t * 1.6 + sh * 60.0);
    let sa = atan2(sv.y, sv.x);
    let sdd = length(sv) - 0.0035 * (0.5 + sh) * tw * (0.2 + 0.8 * pow(abs(cos(sa * 2.0)), 12.0));
    col = mix(col, lampC, fillA(sdd, px) * dark);
  }
  col = mix(col, C(3), fillA(ds - 0.045, px));
  col = mix(col, C(4), strokeA(ds - 0.058, px * 0.5, px) * 0.6 * step(-0.2, u.c.z));
  let dm = length(p0 - moon);

// Cloud shadows sliding over the land: q is a ground position (x across,

@diagnostic(off, derivative_uniformity) fn cloudShade(q: vec2f, t: f32) -> f32 {

@diagnostic(off, derivative_uniformity) fn liftShadow(p: vec2f, z: f32) -> vec2f {

@diagnostic(off, derivative_uniformity) fn hazeStep(col: vec3f, d: f32, hz: vec3f) -> vec3f { return mix(col, hz, post(clamp(d, 0.0, 1.0), 4.0) * 0.75); }

const PIXEL_BUDGET = 3000000;

const NAME = 'fern-palms';

// Time of day. tau runs 0..1 round the clock: afternoon at 0, sunset near
// 0.3, night through the middle, dawn at 0.8. Each piece gives sky colours
// per key and a land palette that is graded by the light of the moment.
const DAY_KEYS = [
  [0.00, 'afternoon', [1, 1, 1], 1.0],
  [0.18, 'golden hour', [1.08, 0.94, 0.76], 1.12],
  [0.28, 'sunset', [0.98, 0.7, 0.6], 1.05],
  [0.35, 'blue hour', [0.46, 0.5, 0.76], 0.72],
  [0.43, 'night', [0.2, 0.25, 0.42], 0.5],
  [0.73, 'night', [0.2, 0.25, 0.42], 0.5],
  [0.81, 'dawn', [0.86, 0.72, 0.8], 0.85],
  [0.9, 'morning', [1.02, 0.98, 0.94], 0.95],
  [1.0, 'afternoon', [1, 1, 1], 1.0],
];
const SKY_ORDER = ['afternoon', 'golden hour', 'sunset', 'blue hour', 'night', 'night', 'dawn', 'morning', 'afternoon'];
function dayKey(tau) {
  let i = 0;
  while (i < DAY_KEYS.length - 2 && tau >= DAY_KEYS[i + 1][0]) i++;
  const a = DAY_KEYS[i], b = DAY_KEYS[i + 1];
  let f = (tau - a[0]) / (b[0] - a[0]);
  f = f * f * (3 - 2 * f);
  return { i, f, name: f < 0.5 ? a[1] : b[1] };
}
const lerp3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
// SKIES: name -> list of hex; LAND: list of hex; KEEP: land indexes left ungraded.
function dayCols(tau, SKIES, LAND, KEEP) {
  const k = dayKey(tau);
  const A = DAY_KEYS[k.i], B = DAY_KEYS[k.i + 1];
  const sa = SKIES[SKY_ORDER[k.i]], sb = SKIES[SKY_ORDER[k.i + 1]];
  const out = sa.map((h, j) => [...lerp3(hex(h), hex(sb[j]), k.f), 1]);
  const m = lerp3(A[2], B[2], k.f), sat = A[3] + (B[3] - A[3]) * k.f;
  LAND.forEach((h, j) => {
    const c = hex(h);
    if (KEEP.includes(j)) { out.push([...c, 1]); return; }
    const l = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
    out.push([...c.map((v, q) => Math.max(0, Math.min(1, (l + (v - l) * sat) * m[q]))), 1]);
  });

}
// Sun and moon: position on screen, height above the horizon (-1..1).
function celestial(tau, hz) {
  const df = ((tau - 0.8) % 1 + 1) % 1;
  let elev, sx, sy, mx = 0, my = 2, mElev = -1;
  if (df < 0.51) { const f = df / 0.51; elev = Math.sin(Math.PI * f); sx = -0.55 + 0.9 * f; }
  else { const f = (df - 0.51) / 0.49; elev = -Math.sin(Math.PI * f); sx = 0.35; mElev = Math.sin(Math.PI * f); mx = 0.5 - 0.95 * f; my = hz - mElev * 0.46 + 0.04; }

  return { sx, sy, elev, mx, my, mElev };
}

// sky top, sky mid, horizon, sun, glow, cloud lit, cloud shade, mountains, mist, mist light
const SKIES = {
  'afternoon':   ['#2f6ab8', '#4a98b8', '#a8d0d0', '#fff6dc', '#f0f0d0', '#f4f8f4', '#9ab4c0', '#6a8aa0', '#b8d0d0', '#dcecec'],
  'golden hour': ['#3a6aa8', '#7a98b0', '#e8d0a0', '#fff0c0', '#ffd890', '#fff0dc', '#c8a8a0', '#8a8aa0', '#d8d0c0', '#f4ecdc'],
  'sunset':      ['#4a4a8a', '#b8709a', '#ffa87a', '#ffe0a0', '#ff9860', '#ffc4a4', '#8a5a80', '#7a6a90', '#d8b0b8', '#f8d0c8'],
  'blue hour':   ['#1a2658', '#3a4a86', '#8a80b0', '#f0c0a8', '#8a7aa8', '#8480b0', '#40426e', '#3e4674', '#7a82a8', '#9aa0c0'],
  'night':       ['#060a1c', '#0c1634', '#18284c', '#f4f0dc', '#2c3c66', '#2c385a', '#11182e', '#131c36', '#243056', '#34426a'],
  'dawn':        ['#5a70a8', '#b098c0', '#f0ccc0', '#fff0d0', '#ffc0a8', '#ffe6dc', '#9a8aac', '#8a8aac', '#dcd8e4', '#f4eef2'],
  'morning':     ['#3a7ac8', '#5aa8c8', '#b8dcd8', '#fff8e4', '#f4f4dc', '#f8fcf8', '#a4bcc8', '#7494aa', '#c4dcdc', '#e4f0f0'],
};
// hill lit, hill shade, bush dark, bush mid, bush hi, bush hi 2, dot cream, frond dark, frond mid,
// frond lit, frond pale, trunk dark, trunk mid, trunk light, crownshaft, fern, ink, lamp, parrot
const LAND = ['#8ab08a', '#4a7a70', '#0f2a24', '#1f4a3a', '#6a9a5a', '#a8c070', '#e8dcaa', '#1a4a3a', '#3a7a5a',
  '#9ac06a', '#d8d8a0', '#3a2a22', '#7a5a42', '#b8946a', '#5a8a4a', '#4a9a4a', '#0e1614', '#ffd98a', '#5ac04a'];
const KEEP = [6, 16];

const p = {};
let tau = 0.1 + Math.random() * 0.12;
let timeHooked = false;
function readControls() {
  p.wind = +$('wind').value / 100 * 1.5;
  p.speed = +$('speed').value / 100;
  p.palms = 5 + Math.round(+$('palms').value / 100 * 4);
  p.fog = +$('fog').value / 100 * 1.3;
  p.dots = +$('dots').value / 100;
  p.grain = +$('grain').value / 100 * 0.1;
  for (const id of ['wind', 'speed', 'palms', 'fog', 'dots', 'grain']) $(id + 'Val').textContent = $(id).value;
  if (!timeHooked) { timeHooked = true; $('time').addEventListener('input', () => { tau = +$('time').value / 100; }); }
}
let gust = 0, gustGoal = 0, shown = -1;
function generate() {}
function fogAt(tau) {
  const bump = (x, a, b, c, d) => x < a || x > d ? 0 : x < b ? (x - a) / (b - a) : x < c ? 1 : 1 - (x - c) / (d - c);

  return {
    a: [t, aspect, 1 / Math.max(1, H), seed],
    b: [p.wind, gust, p.grain, zoom],
    c: [s.sx, s.sy, s.elev, dark],
    d: [s.mx, s.my, s.mElev, tl.active ? tl.x : 0],

function step(dt) {

}

function onDown(q) { lastX = q[0]; }
function onMove(q) { gustGoal = Math.max(-1.5, Math.min(1.5, gustGoal + (q[0] - lastX) * 6)); lastX = q[0]; }
function onUp() {}

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16) / 255);
const colsOf = (name) => PALETTES[name].map((h) => [...hex(h), 1]);

let gpu;
try {
  if (!navigator.gpu) throw new Error('no webgpu');
  gpu = await init();
} catch (e) {
  $('nogpu').classList.add('on');
  $('panel').style.display = 'none';
  $('hintPill').style.display = 'none';
  document.querySelector('.vx-toggle')?.remove();
  throw e;

// Desktop renders above screen resolution within a pixel budget and lets the

const surf = surface(gpu, canvas, { dpr: ((b) => { const d = Math.min(2, devicePixelRatio || 1); if (!matchMedia('(pointer: fine) and (min-width: 900px)').matches) return [1, b < 3e6 ? 1.5 : 2]; const s = Math.min(2, Math.sqrt(b / (innerWidth * innerHeight))); const v = Math.max(d, s); return [v, v]; })(PIXEL_BUDGET) });
const clk = clock(gpu);
const tl = tilt();
let W = 1, H = 1, aspect = 1, t = Math.random() * 100;
let seed = Math.random() * 100;

function toP(e) {

const fx = effect(gpu, SHADER, { set: { u: uniforms() } });

let fpsCount = 0, fpsAt = performance.now();

    $('playPause').classList.remove('playing'); $('playIcon').style.display = 'block';
    $('pauseIcon').style.display = 'none'; $('playLabel').textContent = 'Play';

for (const el of document.querySelectorAll('#panel input[type=range]')) el.addEventListener('input', readControls);
for (const el of document.querySelectorAll('#panel select')) el.addEventListener('change', readControls);
$('playPause').addEventListener('click', togglePlay);
$('generate').addEventListener('click', () => { seed = Math.random() * 100; generate(); if (!playing) frame(gpu, render); });
$('save').addEventListener('click', () => {
  frame(gpu, render);
  const a = document.createElement('a');
  a.download = NAME + '-' + Date.now() + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();

const panel = $('panel'), hintPill = $('hintPill');
document.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {

    hintPill.classList.remove('show'); void hintPill.offsetWidth; hintPill.classList.add('show');

// The viewer may already have pressed Play while WebGPU was starting up.
if (!playing) togglePlay();
